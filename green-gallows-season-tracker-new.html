e out, Father.\" He holds up a satchel to her, almost pleading, and in his hands the glow is going out while they talk: \"This is for you. All of it. It was always for you.\" \"Then leave it.\" He looks at the crystals. He looks at her. He can't put them down; he never could. She walks out. Behind her the wolves come into the vault. Cut back to the hill, where a mother is being asked the same question.<\/p>"},{"oref":"Scene 15","id":250,"seq":15,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar. The girl doesn't move. \"I'm not Miriam, and I'm not the thing they kept in glass. I'm something new, and I choose to stay. I love you, Mother. I don't belong to you.\"","loc":"Tyburn hill","when":"Morgana: \"Then come home, little frost.\" The Lost One looks at Alice.","th":"white","also":["sisters"],"ch":["morgana","lostone","alice"],"turn":"","w":446,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar. The girl doesn't move. \"I'm not Miriam, and I'm not the thing they kept in glass. I'm something new, and I choose to stay. I love you, Mother. I don't belong to you.\"<\/p>"},{"oref":"Scene 16","id":231,"seq":16,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One tells her the last thing: \"I've spent everything else of hers. The birthdays, the songs, her name for you. I kept this. On the bridge she was still alive. She asked me something. 'Go back to Ali. Stand in front of her. I never did.' I said yes. Then I wanted to.\" Miriam's last thought was Alice, after all, and her last act was to find someone braver to keep the promise she broke. Alice laughs and cries at once: her sister did love her. She just couldn't do it herself. The Lost One stays. Morgana, who tore her own hooks rather than let her daughter pay, lets her stay, which is harder. She reaches to draw the White out of her, the way you'd draw a splinter, and her daughter steps back: \"Leave it. It's mine to spend.\" Then Morgana turns to Nathaniel and tells him how his house began. \"A man came to me in a storm and told me he loved me. I knew every language he spoke. I never knew he was lying in all of them. He built a room for me before he ever met me. She was born in it.\" She looks at her daughter. \"She is his. She is yours.\" The Lost One is a Harding. She steps forward to be the payment, and her mother says it for the second time that night: \"Not her.\" Then Morgana names the price: \"A Harding chained me. A Harding comes with me.\" She waits. It has to be given, and she won't take it. Nathaniel steps forward, and Alice steps in front of him, into the place nobody ever stood for her, her fist in his coat. Her first word to him all night: \"Don't.\"","loc":"Tyburn hill","when":"The Lost One tells her the last thing: \"I've spent everything else of hers.","th":"white","also":["sisters","harding"],"ch":["lostone","alice","morgana","nathaniel"],"turn":"","w":446,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>The Lost One tells her the last thing: \"I've spent everything else of hers. The birthdays, the songs, her name for you. I kept this. On the bridge she was still alive. She asked me something. 'Go back to Ali. Stand in front of her. I never did.' I said yes. Then I wanted to.\" Miriam's last thought was Alice, after all, and her last act was to find someone braver to keep the promise she broke. Alice laughs and cries at once: her sister did love her. She just couldn't do it herself. The Lost One stays. Morgana, who tore her own hooks rather than let her daughter pay, lets her stay, which is harder. She reaches to draw the White out of her, the way you'd draw a splinter, and her daughter steps back: \"Leave it. It's mine to spend.\" Then Morgana turns to Nathaniel and tells him how his house began. \"A man came to me in a storm and told me he loved me. I knew every language he spoke. I never knew he was lying in all of them. He built a room for me before he ever met me. She was born in it.\" She looks at her daughter. \"She is his. She is yours.\" The Lost One is a Harding. She steps forward to be the payment, and her mother says it for the second time that night: \"Not her.\" Then Morgana names the price: \"A Harding chained me. A Harding comes with me.\" She waits. It has to be given, and she won't take it. Nathaniel steps forward, and Alice steps in front of him, into the place nobody ever stood for her, her fist in his coat. Her first word to him all night: \"Don't.\"<\/p>"},{"oref":"Scene 17","id":245,"seq":17,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her. Then, to her son: \"I'm a Harding. I chose the name.\" He catches his mother's wrist. Alice is still in front of him, her fist still in his coat. Two women holding him, one from each side of his life, and both of them are right. The wolves shift their weight in the snow. Josephine, quietly, the only time all season she asks him for anything: \"They'll say I died of fever in Switzerland.\" Nathaniel: \"No. They'll say your name.\" A long beat. His hand opens. \"Go.\" She kisses his forehead. To Alice: \"Keep him out of the Works.\" It's the contract she paid for in Episode 2, now given as a blessing. Alice: \"You bought me for him. It's the only thing you ever bought that worked.\" Josephine almost laughs, and that's how she goes. She takes Morgana's hand and they walk into the white. The wolves follow, and the storm goes with them. Why this isn't Otty again: Otty went willingly too, and his grandfather let her. The difference between Nathaniel and every Harding before him isn't the choice. It's the lie. Otty got a brass plate that said DIED ABROAD. Josephine gets the record (scenes 22 and 23).","loc":"Tyburn hill","when":"Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her.","th":"harding","also":["white"],"ch":["josephine","nathaniel","alice","morgana"],"turn":"","w":446,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her. Then, to her son: \"I'm a Harding. I chose the name.\" He catches his mother's wrist. Alice is still in front of him, her fist still in his coat. Two women holding him, one from each side of his life, and both of them are right. The wolves shift their weight in the snow. Josephine, quietly, the only time all season she asks him for anything: \"They'll say I died of fever in Switzerland.\" Nathaniel: \"No. They'll say your name.\" A long beat. His hand opens. \"Go.\" She kisses his forehead. To Alice: \"Keep him out of the Works.\" It's the contract she paid for in Episode 2, now given as a blessing. Alice: \"You bought me for him. It's the only thing you ever bought that worked.\" Josephine almost laughs, and that's how she goes. She takes Morgana's hand and they walk into the white. The wolves follow, and the storm goes with them.<\/p>\n<p><em>Why this isn't Otty again:<\/em> Otty went willingly too, and his grandfather let her. The difference between Nathaniel and every Harding before him isn't the choice. It's the lie. Otty got a brass plate that said DIED ABROAD. Josephine gets the record (scenes 22 and 23).<\/p>"},{"oref":"Scene 18","id":213,"seq":18,"title":"Tyburn hill, dawn","added":true,"act":"Act Three","kind":"scene","sum":"The snow stops in the middle of falling. Nathaniel is on his knees where his mother was, and for a long time nothing happens. Alice doesn't touch him. She kneels in front of him in the snow and lets him have it, because nobody ever let her. When it comes it isn't crying. It's a sound with no word in it, hhh, hhh, a man trying to breathe around something too big for his chest. She stays where he can see her until it passes. Then she takes the handkerchief out of her glove, the one he gave her at his brother's grave, and tears it in two. Rrrip. Half goes round the palm he cut at the lock. He takes the other half out of her fingers without asking and binds the hand she burned for him. Neither of them is any good at it. She doesn't know what to say to a man who has just said \"Go\" to his mother, so she gives him the most private thing she owns. Under her breath, the way Miriam taught her under the bed, she counts for him. \"One post. Two post.\" He knows it. He heard it in a ballroom corridor five weeks ago and never asked. He counts with her. At eight she stops, because eight is where it has always ended. He keeps going. \"Nine.\" Nobody told him about nine. He got there on his own. And then, for the first time in ten episodes, he says her name. \"Alice.\" She hears it. He has never once said it, and she knows which bill he read it on. He's saying it now, when nobody has paid for it. He kisses her, or she kisses him; for the rest of their lives they will disagree about which.","loc":"Tyburn hill","when":"The snow stops in the middle of falling.","th":"sisters","also":["harding"],"ch":["nathaniel","alice"],"turn":"","w":1140,"ed":"","fl":[],"html":"<p>The snow stops in the middle of falling. Nathaniel is on his knees where his mother was, and for a long time nothing happens. Alice doesn't touch him. She kneels in front of him in the snow and lets him have it, because nobody ever let her. When it comes it isn't crying. It's a sound with no word in it, <em>hhh, hhh<\/em>, a man trying to breathe around something too big for his chest. She stays where he can see her until it passes. Then she takes the handkerchief out of her glove, the one he gave her at his brother's grave, and tears it in two. <em>Rrrip.<\/em> Half goes round the palm he cut at the lock. He takes the other half out of her fingers without asking and binds the hand she burned for him. Neither of them is any good at it. She doesn't know what to say to a man who has just said \"Go\" to his mother, so she gives him the most private thing she owns. Under her breath, the way Miriam taught her under the bed, she counts for him. \"One post. Two post.\" He knows it. He heard it in a ballroom corridor five weeks ago and never asked. He counts with her. At eight she stops, because eight is where it has always ended. He keeps going. \"Nine.\" Nobody told him about nine. He got there on his own. And then, for the first time in ten episodes, he says her name. \"Alice.\" She hears it. He has never once said it, and she knows which bill he read it on. He's saying it now, when nobody has paid for it. He kisses her, or she kisses him; for the rest of their lives they will disagree about which.<\/p>"},{"oref":"Scene 19","id":267,"seq":19,"title":"Tyburn hill, after","added":true,"act":"Act Three","kind":"scene","sum":"The kiss ends because someone is coming out of the treeline. TAMARA, straight from the vault where she left her father to the wolves, a pistol in her hand. Her eyes catch the strip of black silk Alice has knotted round her burned palm. \"That's from Edmund's room. I watched you go in. I watched you leave.\" \"I don't know what you're talking about.\" \"Then answer one thing. What did he say before you pulled the wire?\" Alice reaches for it and finds nothing. \"I don't remember.\" \"You don't remember killing my brother?\" \"I can't give you what I don't have.\" \"Then this is what I have.\" BANG. Red blooms on Alice's coat, over the cut Josephine gave her. Nixon takes Tamara down and holds the woman he loves face-down in the snow.","loc":"Tyburn hill","when":"The kiss ends because someone is coming out of the treeline.","th":"sisters","also":["lambrick","guard"],"ch":["alice","lostone","tamara","nixon","nathaniel"],"turn":"","w":706,"ed":"Revised Nov 10: the lost hour","fl":[],"html":"<p>The kiss ends because someone is coming out of the treeline. TAMARA, straight from the vault where she left her father to the wolves, a pistol in her hand. Her eyes catch the strip of black silk Alice has knotted round her burned palm. \"That's from Edmund's room. I watched you go in. I watched you leave.\" \"I don't know what you're talking about.\" \"Then answer one thing. What did he say before you pulled the wire?\" Alice reaches for it and finds nothing. \"I don't remember.\" \"You don't remember killing my brother?\" \"I can't give you what I don't have.\" \"Then this is what I have.\" <em>BANG.<\/em> Red blooms on Alice's coat, over the cut Josephine gave her. Nixon takes Tamara down and holds the woman he loves face-down in the snow.<\/p>"},{"oref":"Scene 20","id":269,"seq":20,"title":"Edmund's townhouse, the wedding night: the hour","added":true,"act":"Act Three","kind":"scene","sum":"It comes back now that the green is dead, and the dust in Alice's blood with it. The whole hour, in order, while she bleeds into the snow. The trellis, wet under her hands. The window, unlatched. EDMUND in shirtsleeves, finding a girl with wolf's eyes in his chair, and smiling, because nobody has ever come for him before. \"Do you know who Miriam Bounds is?\" \"The factory girl? That was months ago—\" \"Five weeks.\" \"Not long enough, then.\" He pours himself a glass to have something to do with his hands, and he talks, because talking has always worked. \"She was so happy. That's the thing I'll remember. I brought her punch and she was so happy she told a stranger. A Harding brat in a Vykra girl. My father's man had closed my house that morning, and I recognised her from his description, and she stood in the Hardings' garden telling me she was going to have a child.\" He turns the glass. \"I did her a kindness. I did it for both of them.\" Alice is out of the chair. He's faster than he looks: the decanter, swung full into her face, KSSH, Xyon-cut wine in her mouth and in the split of her lip, the room starting to swim at once. The fight is half-drugged and ugly. A chair goes over. She grabs the curtain to stay standing, and it tears from its tieback. He gets a hand in her hair and she gets the wire round his throat from behind, and they go down together on the wine-dark rug, nngh, nngh, his heels drumming, her arms shaking with a drug she can feel climbing the back of her skull. His last words aren't about Miriam. \"Please. My father—\" Then nothing. She lets go. She stands. And across the street, in a lit window of Lambrick House, a young woman in a wedding dress is looking straight at her: Tamara, a jewel case in her arms. Neither of them moves. Alice doesn't know who she is. Tamara knows exactly who Alice is. Then the hour starts closing. Alice goes down the trellis wrong, falls the last six feet, tears her palm on the railings, and wraps it in a strip of black silk she doesn't remember tearing from his sleeve. She walks three streets with the dust climbing, and lies down on the cobbles as if someone has asked her to. Back: Tyburn hill, the snow red under her. \"I killed him. I killed him.\" Tamara, face-down in the snow under Nixon's knee, says nothing. She doesn't have to.","loc":"Edmund's townhouse","when":"It comes back now that the green is dead, and the dust in Alice's blood with it.","th":"sisters","also":["lambrick"],"ch":["alice","edmund","tamara"],"turn":"","w":866,"ed":"Revised Nov 10: the lost hour","fl":[],"html":"<p>It comes back now that the green is dead, and the dust in Alice's blood with it. The whole hour, in order, while she bleeds into the snow. The trellis, wet under her hands. The window, unlatched. EDMUND in shirtsleeves, finding a girl with wolf's eyes in his chair, and smiling, because nobody has ever come for him before. \"Do you know who Miriam Bounds is?\" \"The factory girl? That was months ago—\" \"Five weeks.\" \"Not long enough, then.\" He pours himself a glass to have something to do with his hands, and he talks, because talking has always worked. \"She was so happy. That's the thing I'll remember. I brought her punch and she was so happy she told a stranger. A Harding brat in a Vykra girl. My father's man had closed my house that morning, and I recognised her from his description, and she stood in the Hardings' garden telling me she was going to have a child.\" He turns the glass. \"I did her a kindness. I did it for both of them.\" Alice is out of the chair. He's faster than he looks: the decanter, swung full into her face, <em>KSSH<\/em>, Xyon-cut wine in her mouth and in the split of her lip, the room starting to swim at once. The fight is half-drugged and ugly. A chair goes over. She grabs the curtain to stay standing, and it tears from its tieback. He gets a hand in her hair and she gets the wire round his throat from behind, and they go down together on the wine-dark rug, <em>nngh, nngh<\/em>, his heels drumming, her arms shaking with a drug she can feel climbing the back of her skull. His last words aren't about Miriam. \"Please. My father—\" Then nothing. She lets go. She stands. And across the street, in a lit window of Lambrick House, a young woman in a wedding dress is looking straight at her: Tamara, a jewel case in her arms. Neither of them moves. Alice doesn't know who she is. Tamara knows exactly who Alice is. Then the hour starts closing. Alice goes down the trellis wrong, falls the last six feet, tears her palm on the railings, and wraps it in a strip of black silk she doesn't remember tearing from his sleeve. She walks three streets with the dust climbing, and lies down on the cobbles as if someone has asked her to. <em>Back:<\/em> Tyburn hill, the snow red under her. \"I killed him. I killed him.\" Tamara, face-down in the snow under Nixon's knee, says nothing. She doesn't have to.<\/p>"},{"oref":"Scene 21","id":270,"seq":21,"title":"Tyburn hill, the last of the White","added":true,"act":"Act Three","kind":"scene","sum":"The girl kneels and presses her hands to the wound, and spends the last of the White she wouldn't let her mother take, freezing the blood still under her palms. The crystal goes out of her skin for good. She will never make snow again, and never again hear her mother singing in a lamp. She shivers for the first time. \"I've got you. Stay with me.\" The sister who couldn't protect has become the sister who does, in a different body. Alice, blood on her lips: \"You should have a name. A real one. Yours.\" A long pause. \"Mira. Not Miriam. Mine.\" She picks a birthday too: the night Miriam forgot it. Nixon kneels without asking. \"On three. Don't drop her.\" Nathaniel and Nixon carry her down Tyburn hill toward a cellar clinic under Gin Lane and a man used to factory amputations, not miracles, moving in step, and neither of them has said sorry. Mira walks beside them with her hands on the wound.","loc":"Tyburn hill","when":"The girl kneels and presses her hands to the wound, and spends the last of the White she wouldn't let her mother take, freezing the blood still under her palms.","th":"sisters","also":["white","guard"],"ch":["alice","lostone","nathaniel","nixon"],"turn":"","w":332,"ed":"Revised Nov 10: the lost hour","fl":[],"html":"<p>The girl kneels and presses her hands to the wound, and spends the last of the White she wouldn't let her mother take, freezing the blood still under her palms. The crystal goes out of her skin for good. She will never make snow again, and never again hear her mother singing in a lamp. She shivers for the first time. \"I've got you. Stay with me.\" The sister who couldn't protect has become the sister who does, in a different body. Alice, blood on her lips: \"You should have a name. A real one. Yours.\" A long pause. \"Mira. Not Miriam. Mine.\" She picks a birthday too: the night Miriam forgot it. Nixon kneels without asking. \"On three. Don't drop her.\" Nathaniel and Nixon carry her down Tyburn hill toward a cellar clinic under Gin Lane and a man used to factory amputations, not miracles, moving in step, and neither of them has said sorry. Mira walks beside them with her hands on the wound.<\/p>"},{"oref":"Scene 22","id":268,"seq":22,"title":"Westminster, noon","added":true,"act":"Act Three","kind":"scene","sum":"Grey light through the tall windows, coal smoke rising from Tamara's fires. Beyond them the walls stand grey on the horizon for the first time in four hundred years. Vane names Nathaniel \"the man who put out London\" and signs a warrant. Tamara, Lady Harding and heir to Lambrick, whom Nixon let up out of the snow four hours ago, and who hasn't mentioned it since, puts the Heartglass folio on his desk, with the Crown's seal on the binding order. Beside it she lays her father's ledger, open at the night of the Charter vote: A.F., Pimlico, 300 gns. The man the Crown put on the Works board blew in its windows, and his daughter says so with his name and hers. Last, a needle, Vykra issue, the one she picked up on the gallery stairs the day Felix Hawke died. Nixon lays Cole's diary beside it, taken from the dead boy's lap: the burned discharge-log page copied word for word, and under it, in a seventeen-year-old's careful hand, 2 Nov. Capt. hit him in the shoulder. Mr Harding sent the Capt. to the gate. The man on the floor was still talking. It puts Nixon's shot on the record, and the man who stayed behind with a living boy. Nixon could burn that page a second time. He sets it down open. Across the desk Nathaniel looks at him, the first time he has looked straight at him since the lock. \"I haven't forgiven you.\" \"I know.\" \"Stand where I can see you.\" Nixon steps up beside him, the way he did at the altar, and it means the opposite now. Vane slides a captain's lantern across the desk to Nixon, the price of his silence. Nixon leaves it there: \"The Guard will keep its own flame.\" Vane, cornered, offers Nathaniel the pardon on one condition: the Crown seals what happened under Tyburn, for the public good. Nathaniel: \"No. Write it down.\" Vane: \"The Crown doesn't keep that kind of record.\" Nathaniel: \"It has kept one since 1689. It's in your desk, under your signature.\" Vane doesn't blink; an annex in a drawer has never frightened a Lord Chancellor. Then Tamara, who hasn't sat down: \"Lambrick depots are feeding every grate in London this morning, my lord. They close at noon, unless that record is read into Hansard, all of it, where anyone with a penny can buy it.\" Outside the tall windows the coal smoke is the only warmth in the city, and every chimney of it is hers. Vane looks at the smoke for a long time. \"The House sits at two.\" Nathaniel turns to the clerk, and the clerk dips his pen. \"Edric Harding—\"","loc":"Westminster","when":"Grey light through the tall windows, coal smoke rising from Tamara's fires.","th":"city","also":["lambrick","guard"],"ch":["nathaniel","nixon","tamara","vane"],"turn":"","w":898,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Grey light through the tall windows, coal smoke rising from Tamara's fires. Beyond them the walls stand grey on the horizon for the first time in four hundred years. Vane names Nathaniel \"the man who put out London\" and signs a warrant. Tamara, Lady Harding and heir to Lambrick, whom Nixon let up out of the snow four hours ago, and who hasn't mentioned it since, puts the Heartglass folio on his desk, with the Crown's seal on the binding order. Beside it she lays her father's ledger, open at the night of the Charter vote: <em>A.F., Pimlico, 300 gns.<\/em> The man the Crown put on the Works board blew in its windows, and his daughter says so with his name and hers. Last, a needle, Vykra issue, the one she picked up on the gallery stairs the day Felix Hawke died. Nixon lays Cole's diary beside it, taken from the dead boy's lap: the burned discharge-log page copied word for word, and under it, in a seventeen-year-old's careful hand, <em>2 Nov. Capt. hit him in the shoulder. Mr Harding sent the Capt. to the gate. The man on the floor was still talking.<\/em> It puts Nixon's shot on the record, and the man who stayed behind with a living boy. Nixon could burn that page a second time. He sets it down open. Across the desk Nathaniel looks at him, the first time he has looked straight at him since the lock. \"I haven't forgiven you.\" \"I know.\" \"Stand where I can see you.\" Nixon steps up beside him, the way he did at the altar, and it means the opposite now. Vane slides a captain's lantern across the desk to Nixon, the price of his silence. Nixon leaves it there: \"The Guard will keep its own flame.\" Vane, cornered, offers Nathaniel the pardon on one condition: the Crown seals what happened under Tyburn, for the public good. Nathaniel: \"No. Write it down.\" Vane: \"The Crown doesn't keep that kind of record.\" Nathaniel: \"It has kept one since 1689. It's in your desk, under your signature.\" Vane doesn't blink; an annex in a drawer has never frightened a Lord Chancellor. Then Tamara, who hasn't sat down: \"Lambrick depots are feeding every grate in London this morning, my lord. They close at noon, unless that record is read into Hansard, all of it, where anyone with a penny can buy it.\" Outside the tall windows the coal smoke is the only warmth in the city, and every chimney of it is hers. Vane looks at the smoke for a long time. \"The House sits at two.\" Nathaniel turns to the clerk, and the clerk dips his pen. \"Edric Harding—\"<\/p>"},{"oref":"Scene 23","id":211,"seq":23,"title":"The Record, final montage","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel's dictation carries over everything that follows. Its first lines are the ones we heard over the 1489 cold opens in Episodes 1, 5 and 10, and only now do we know whose voice that was: the season has been his testimony. It starts as testimony, read flat and exact like a ledger, and somewhere in the middle it stops being for the clerk. No score until line 7, then the Lantern Hymn, the tune only, the way Morgana sang it. Every image is a climax from the season, seen in the days after: the dictation takes one morning, and the pictures run on across the weeks it sets moving.","loc":"The Record","when":"Nathaniel's dictation carries over everything that follows.","th":"city","also":["harding","sisters"],"ch":["nathaniel","alice","lostone","nixon","tamara","marsh","morgana","josephine","grise"],"turn":"","w":900,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Nathaniel's dictation carries over everything that follows. Its first lines are the ones we heard over the 1489 cold opens in Episodes 1, 5 and 10, and only now do we know whose voice that was: the season has been his testimony. It starts as testimony, read flat and exact like a ledger, and somewhere in the middle it stops being for the clerk. No score until line 7, then the Lantern Hymn, the tune only, the way Morgana sang it. Every image is a climax from the season, seen in the days after: the dictation takes one morning, and the pictures run on across the weeks it sets moving.<\/p>\n<table>\n<thead><tr><th>Nathaniel (V.O.)<\/th><th>On screen<\/th><\/tr><\/thead>\n<tbody><tr><td>\"Alistair Harding. He told a woman he loved her. That is where the light came from.\"<\/td><td><strong>The Works gate.<\/strong> Workmen with ropes bring the bronze of the Builder of the Light down off its plinth. Nobody cheers.<\/td><\/tr><tr><td>\"Edric Harding. Nine years old. The year of our Lord fourteen hundred and eighty-nine. He carried the lantern down the stair himself, because his father asked him to.\"<\/td><td><strong>The Works, dead.<\/strong> Snow falls through the broken roof onto empty iron hooks. The channels where her blood ran into London are dry and grey.<\/td><\/tr><tr><td>\"The Hargraves of the Orchard. Their names are scratched on a wall under Tyburn. I will read every one of them, if the clerk has ink.\"<\/td><td><strong>The Orchard.<\/strong> Old Marsh holds the candle and reads the names off the wall, perfectly lucid now. Nixon writes them into Cole's diary. His thumb stops on MARIAN.<\/td><\/tr><tr><td>\"Ottoline Harding. Nineteen. Eighteen thirty-nine. She did not die abroad.\"<\/td><td><strong>St Bride's.<\/strong> Walter Pell's chisel takes DIED ABROAD off a brass plate, one letter at a time. Hester holds the candle for him: the first time she has been inside the walls in fifty years. Byron's blue ribbon is tied through the bracket.<\/td><\/tr><tr><td>\"James Harding. My brother. He tried to end it so I would never have to, and we said he was ill. We buried a coffin of slag and called it him. There was no body. I don't know where he is.\"<\/td><td><strong>The long gallery.<\/strong> Jamie's portrait, laughing at something outside the frame.<\/td><\/tr><tr><td>\"Inspector Felix Hawke, of Scotland Yard. He stood up in front of the Crown to say that someone had made the Frost Killer, and he was poisoned on the stand for it. My mother did it, for me. London blamed a frightened girl.\"<\/td><td><strong>Scotland Yard.<\/strong> Felix's sling still hangs on his chair. A constable takes the FROST KILLER bills down off the wall, one by one.<\/td><\/tr><tr><td>\"Josephine Harding. My mother. She walked into the White on the night the snow came early, so the debt would end. She will have no brass that lies.\"<\/td><td><strong>The music room.<\/strong> The piano lid closed. On it, a Vykra knife and a pair of gloves with the knot stitched inside.<\/td><\/tr><tr><td>\"For four hundred years this city was warm because somebody was cold. We called it light. We wrote a hymn over her crying so we'd never have to hear it.\"<\/td><td><strong>Gin Lane.<\/strong> The mother from the night before lights a second tallow candle off her first and passes it through a broken pane to her neighbour. Window to window, the flame travels down the lane. Under it the Gin Lane children skip rope in the snow to the old rhyme, with a new last line: <em>nobody's in the cellar tonight.<\/em><\/td><\/tr><tr><td>\"Every one of us lived on it. Most of us never knew the price. Some of us knew, and kept the lamps lit anyway.\"<\/td><td><strong>The Works vault.<\/strong> A satchel half-buried in a drift, Lambrick's glove still on the strap. The crystals spilling out of it have gone dull as river stones.<\/td><\/tr><tr><td>\"I can't give you the light back. I won't. What I can give you is the bill, and the names of the people who paid it.\"<\/td><td><strong>A Lambrick depot, gates thrown open.<\/strong> Tamara, in her father's greatcoat over a ruined wedding dress, signs the ledger as heir while the coal goes out to the queue for nothing. Alice, a week out of the surgeon's cellar, a bandage under her coat, stands beside her: the woman who shot her. Under her hand, in the same pile, are the Gin Lane leases her father bought at a shilling the morning he chained its wall. She doesn't sign those away. Not yet. Alice stands beside her at the depot gate. Tamara holds out her hand, wrist up, the way the laundry closes a contract: his name on her paper, until the coal runs out. Alice takes it. Tamara looks up from the book, and she's the one deciding now.<\/td><\/tr><tr><td>\"So write them down. Keep them where your children can read them. And the next time somebody offers you a light that never goes out, ask who is paying for it.\"<\/td><td><strong>The Guard tower roof.<\/strong> Forty Lanterns with no lanterns. Nixon hangs Cole's battered Wick lamp on the rail and lights it with a match, a plain candle-flame, nothing else. Tamara steps out onto the roof. She doesn't take his hand. She stands beside him, close enough that it doesn't matter.<\/td><\/tr><tr><td>\"We will be cold for a while.\"<\/td><td><strong>St Thomas's Hospital, a ward by tallow.<\/strong> A surgeon works by six candles a nurse holds close. His hands are shaking with the cold. He breathes on them, <em>hhh<\/em>, and goes on.<\/td><\/tr><tr><td>\"We'll build something that doesn't need a girl in chains or a boy on the stair. It may be worse. It will be ours.\"<\/td><td><strong>The Shadwell laundry.<\/strong> Alice stitches a new knot inside her own glove, a pattern nobody taught her. Mother Grise, without being asked, pours her a cup of tea.<\/td><\/tr><tr><td>\"That is the record. Let it stand.\"<\/td><td><strong>Whitehall, the Lord Chancellor's office.<\/strong> The record is read into Hansard that afternoon, and by evening it's on every newsstand in London. When his door closes, Vane takes the 1689 annex out of his desk, reads one line of it, locks it back in the drawer, and puts the key in his waistcoat. The record stands. So does the Crown.<\/td><\/tr><tr><td><em>(The hymn plays on, without words.)<\/em><\/td><td><strong>Harding House, cold and dark.<\/strong> Nathaniel drops the wolf-crest ring into the dead grate. Alice sets Jamie's ring, the one from Miriam's cord, on the mantel beside it. His bound hand comes to rest over her bound hand: two halves of one handkerchief. There is no inch between them now.<\/td><\/tr><tr><td><em>(The hymn ends. Silence. Then, very faint, a heartbeat.)<\/em><\/td><td><strong>Gin Lane, morning.<\/strong> Mira, warm for the first time, sneezes, astonished. Then she's sick in a basin, exactly like Miriam in Episode 7's cold open. Alice laughs, and peels her an orange, badly, in one long ruined spiral, and hands it over. Then she stops, and puts her hand on her sister's belly. The heartbeat swells under everything. The cold that held Miriam frozen has gone out of her, and what it was holding has started again. Jamie's child. The Lost One: \"Is that me?\" Alice: \"No. That's someone else.\"<\/td><\/tr><\/tbody>\n<\/table>"},{"oref":"Scene 24","id":212,"seq":24,"title":"The White","added":false,"act":"Final scene","kind":"scene","sum":"Hard cut on the heartbeat. Wind, and nothing else. Endless snow. Josephine walks beside Morgana through the drifts, where the chain's dead went, and stops. A man is standing in the snow with frost in his hair: JAMIE HARDING, exactly as he went down, one hand still half-raised the way it was on the lock. His breath doesn't smoke. His eyes are open and don't move. Josephine touches his face, and it's cold all the way through. Morgana, beside her: \"The White keeps what it's given. It doesn't give it back.\" Josephine doesn't let go of him. Far behind him, small in the white, a boy of nine stands with a lantern raised, the flame still burning after four hundred years and the boy as still as the snow. Josephine sits down in the drift beside her son. Cut to black. The card that opened every episode comes up one last time. It doesn't count down. DAY ONE.","loc":"The White","when":"Hard cut on the heartbeat.","th":"white","also":["harding"],"ch":["josephine","morgana","jamie"],"turn":"","w":366,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Hard cut on the heartbeat. Wind, and nothing else. Endless snow. Josephine walks beside Morgana through the drifts, where the chain's dead went, and stops. A man is standing in the snow with frost in his hair: JAMIE HARDING, exactly as he went down, one hand still half-raised the way it was on the lock. His breath doesn't smoke. His eyes are open and don't move. Josephine touches his face, and it's cold all the way through. Morgana, beside her: \"The White keeps what it's given. It doesn't give it back.\" Josephine doesn't let go of him. Far behind him, small in the white, a boy of nine stands with a lantern raised, the flame still burning after four hundred years and the boy as still as the snow. Josephine sits down in the drift beside her son. Cut to black.<\/p><p>The card that opened every episode comes up one last time. It doesn't count down. <strong>DAY ONE.<\/strong><\/p>"}]}],"threads":[["harding","The Harding House","Eldgard, Josephine, Byron, Jamie and Nathaniel: the Works, the pact, the Tithe, and the family that keeps it."],["sisters","The Sisters","Alice and Miriam, then the Lost One: Gin Lane, the Vykra, the counting game, and the apology nobody ever gave."],["investigation","Nathaniel’s Investigation","Nathaniel digging into his brother’s death, the dimming walls, the chain under the Works, the Heartglass he builds to hold it, and the ledger with his own name in it."],["guard","The Lantern Guard","Nixon, the corps, the Orchard, the Hargrave blood, and the mutiny that tears the Guard in two."],["lambrick","House Lambrick","Lambrick, Ajax, coal and Tamara: the light war, the ciphers, and a wedding used as a weapon."],["vykra","The Vykra","Mother Grise, the Shadwell laundry, winter’s kiss, and the contracts that put a knife in every room."],["city","The City and the Crown","Vane, Parliament, the Charter, the heat walls and the cold streets, and a London that pays for its light by district."],["white","The White","Morgana, the chain, the wolves, the frost and 1489: the thing the city is built on."]],"chars":[["nathaniel","Nathaniel Harding"],["alice","Alice Bounds"],["lostone","The Lost One"],["nixon","Nixon Hargrave"],["tamara","Tamara Lambrick"],["cole","Cole Pruett"],["eldgard","Eldgard Harding"],["josephine","Josephine Harding"],["byron","Byron"],["lambrick","Lord Hector Lambrick"],["edmund","Edmund Lambrick"],["ajax","Ajax Fink"],["grise","Mother Grise"],["kit","Kit Marrow"],["felix","Inspector Felix Hawke"],["vane","Lord Chancellor Vane"],["morgana","Morgana"],["jamie","Jamie Harding"],["miriam","Miriam Bounds"],["wren","Old Wren"],["marsh","Tobias Marsh"],["alistair","Alistair Harding"],["otty","Ottoline “Otty” Harding"],["hester","Hester Pell"]],"arcs":{"nathaniel":{"1":{"line":"Demonstrates his leap-gauntlet, is told \"toys after supper\" at his own engagement and tells Nixon he's the son their father actually wanted, hears weeping in the walls during the blackout and finds the lamp-girl by her match (she hears nothing, and leaves with his schematic), then breaks down in the stables: his brother is dead.","state":"grieving, kept in the dark"},"2":{"line":"Refused the coffin, he forces the core level and finds a spent Guard cartridge, then hands the case to Nixon: the man who fired it.","state":"hunting, betrayed unknowingly"},"3":{"line":"Reads the east-wall gauges dropping and arms the Frost Killer hunt for his father, skates with Tamara and gets the wrong suspect (and a hint about her father's greased coal valves), walks the lamp-tunnels with a listening horn until he hears his own design whining in the dark, then finds Alice's secret at the tunnel mouth and, for the first time, chooses not to be the useful son: he hides the Frost Killer from his father.","state":"armed the hunt, knows"},"4":{"line":"Ambushes Ajax with Alice at the coal docks, hears that Jamie paid him double, drops him into the Thames, then catches his father coming up the servants' stair at three in the morning with frost on his cuffs, and takes the bait instead of asking. By the stove, the Lost One tells him Jamie called him the only one worth saving.","state":"deceived, still hunting"},"5":{"line":"Races Nixon across the Guard roofs on stolen boosters, descends into the core with Alice and Tamara, touches the chain, learns London's light is a chained mother's blood and his father has always known, hears Morgana say Jamie is cold, not dead, stays when Nixon seals the door, and agrees to build something that holds her without bleeding her.","state":"chooses his father"},"6":{"line":"Builds the Heartglass with his father, believing it's mercy, kisses Alice at the frozen canal when her glove gives up the handkerchief she kept, runs into the rigged tunnel, takes a needle out of Byron's dead fist, and bluffs his mother into confessing at the piano.","state":"bluffed the truth out"},"7":{"line":"Counts the rounds in Nixon's rifle log and meets him on the roof already knowing (\"I know. I counted.\"), fights him for real, sticks his first landing at the Pavilion and fights beside him anyway, opens Jamie's coffin at dawn and finds slag, finds his own name in the Keeper's ledger under Jamie's, hears from Alice what the Heartglass he built is for, and agrees to marry Tamara to keep her out of Bethlem.","state":"His name in the ledger"},"8":{"line":"Rehearses the vows with Alice, learns her name from his mother's receipt, and from Jamie's swinging watch remembers the girl at the foot of his bed and the cottage behind the fence. Says \"I will\" with Alice at the gallery rail. While they say it, the Vykra take the girl.","state":"Married, and the price"},"9":{"line":"Tells Alice her sister was a contract too, then hears the rest of her sentence, argues the wall map with her (\"Which London?\") and follows her plan, breaks Eldgard out of Newgate, watches Ajax, the man he let drop, break his father, and carries him down the Guard stair through the Snow Confession, where he learns the price of opening the lock.","state":"Fatherless, determined"},"10":{"line":"Opens the lock with Alice's burned hand on the blade, lets his mother go into the White and refuses to let anyone call it fever, says \"Alice\" at dawn, tells Nixon he hasn't forgiven him and keeps him close anyway, and dictates the Record.","state":"Most hated man, and hers"}},"alice":{"1":{"line":"Closes a Narrows house that sells girls with her sister, counting guards so Miriam doesn't have to; on her twentieth birthday Miriam forgets, then says lock the door. She doesn't. She follows her to a Harding, gets into the ball as a lamp-girl, lifts a schematic in the dark, and finds her sister hauled out of the river under Blackwood Bridge.","state":"alone, hunting"},"2":{"line":"Takes home the thing in her sister's body, notices it doesn't step between her and a slammed door, and hears from the street surgeon that Miriam was carrying and that the father was a nobleman from the party. She lets go of the child and keeps the nobleman.","state":"hunting a nobleman"},"3":{"line":"Is jumped in the laundry lines by Kit with Grise's ultimatum, uses Nathaniel's roster, moves the Lost One through the crystal market, watches four die, hides her under the Works, and tells Nathaniel a truth she believes.","state":"cornered, exposed"},"4":{"line":"Hides her sister in the orangery, refuses Grise and is cut from the Vykra, then learns the poison that killed Felix was winter's kiss.","state":"expelled, still guarding"},"5":{"line":"Goes into the Works beside her sister, holds her back from the burning chain, blows the core door, and is left behind when Nathaniel stays.","state":"sister slipping away"},"6":{"line":"Climbs the Works wall and doesn't knock on Nathaniel's happiness, begs Tamara for a route into the core without once looking at the girl pouring the tea, kisses Nathaniel at the canal, runs her gauntlet past the red against Nixon and burns her palm, and hears the Lost One call her 'miss'.","state":"sister forgotten"},"7":{"line":"Finds the letter, says nothing all evening, then hears the apology and \"You're not her\"; her \"Get out\" cracks Blackwood Bridge open. Runs into the wolves for her anyway, tells Nathaniel what his Heartglass is for, and tells him to marry Tamara.","state":"Chosen sister"},"8":{"line":"Nods Nathaniel through his vows while the Vykra take her sister, gets Edmund Lambrick's name from Kit's receipt, climbs his trellis on the wedding night, pulls the wire, and loses the hour.","state":"killed, and lost it"},"9":{"line":"Tells Nathaniel all of it, the lost hour included; argues the wall map with him (Gin Lane can hold one night; can Mayfair?), stops at Old Wren's door (\"I knew you couldn't hear it yet\"), beats Kit on the count of nine so Grise yields, then stays with Nathaniel down the Guard stair while his father dies.","state":"Commands the Vykra"},"10":{"line":"Is cut by Josephine in the core, hears her father died at Kellow Ridge (\"Good.\"), carries her sister up Tyburn hill, lets her go, stands in front of Nathaniel, hears her name at dawn, is shot by Tamara, gets the hour back, and is kept alive by the last of the White. A week later she takes Tamara's hand at the depot gate.","state":"Shot, alive, bound"}},"jamie":{"1":{"line":"Told he begins \"his preparation\", he leaves his drink untouched and his pocket watch wound on his father's desk, slips from the ball, cuts the core lock with a crystal blade, and is shot by Nixon.","state":"shot, bleeding out"},"2":{"line":"Lies in a closed coffin at Harding House; Felix's Newgate slip reveals he visited prisoner 1417 every Sunday for two years.","state":"dead, still asking"},"4":{"line":"Cold open, 2 November: pays Ajax double what Lambrick paid, to cut the outer grid at one exact minute and tell Lambrick nothing. London can freeze honestly.","state":"dead that night"},"9":{"line":"In the cold open, five years old on the Serpentine, he promises his father he'll be brave.","state":"Frozen memory"},"10":{"line":"In the White, standing in the snow exactly as he went down, eyes open, breath that doesn't smoke. His mother sits down beside him.","state":"Kept, not living"}},"miriam":{"1":{"line":"Closes a house that sells girls, forgets her sister's birthday, says lock the door, drinks Edmund Lambrick's punch in the Harding garden, and, poisoned, climbs the railing of Blackwood Bridge after something in the water. Everyone reads it as a jump.","state":"in the river"},"2":{"line":"Her body sits up in the morgue, screams, and runs barefoot into the night; her voice and habits are left inside the thing that wears her.","state":"body emptied, stolen"},"7":{"line":"In the cold open, she scores out \"Ali, about him\", sews the letter into her coat lining, and pulls on the red mittens.","state":"Already gone"}},"lostone":{"1":{"line":"In the cold open the tiny frost girl slips out of the pit while the wolves follow her; at midnight she stands beside Miriam on the bridge and nods.","state":"out, walking free"},"2":{"line":"Sits up in the morgue, lets Alice call her Mim, freezes a cat, fails the doorway test, and finds \"a nobleman, from the party\" in Miriam's memory.","state":"Yes, Ali"},"3":{"line":"Peels Alice an orange, shatters the market's crystals and kills four, cries ice, and survives by touching Nathaniel's bare hand without freezing him.","state":"hidden, unravelling"},"4":{"line":"Blackmails Josephine on the garden path: sixteen years on the mantel, she watched her buy Miriam for Jamie.","state":"Leverage"},"5":{"line":"Freezes the outfall into a glass road, grabs the burning chain and for one second has every song Miriam knew, then lets the cold go until every lamp in London bursts.","state":"resolute, unrepentant"},"6":{"line":"Promises Alice an hour beside the chain would give her Mim back (\"Yes, Ali\": the second lie), grabs Nixon's bare wrist without frosting him, smothers flames around four trapped children, then thanks Alice politely, not knowing her name.","state":"forgetting Alice"},"7":{"line":"Gives Alice the apology Miriam never could, is thrown out, and her grief cracks the bridge and lets the wolves through. Commands them at the Pavilion, walks them back, and closes the crack: the Frost Witch.","state":"Frost Witch"},"8":{"line":"Plays the priest at the rehearsal, sends Alice to the wedding (\"Yes, Ali\": the third lie), and holds out her wrists when the Vykra come: the only way into the Crown's cage is as a prisoner. Leaves DON'T FOLLOW ME in frost.","state":"Taken willingly"},"9":{"line":"Hangs in the Heartglass as cracks run through it, every one her mother pulling against her own hooks. She asks nothing; her mother answers nothing.","state":"Cracking the cage"},"10":{"line":"Is dragged out of the Heartglass, tells Alice about the man at Kellow Ridge, sings the hymn back to her mother, refuses to go home and refuses to give up the White, tries to be the Harding payment (\"Not her\"), and spends the last of the White saving Alice from Tamara's bullet. Names herself Mira, and picks the birthday Miriam forgot.","state":"Mira"}},"nixon":{"1":{"line":"Made Lantern-Captain at 23, he shoots the masked saboteur in the core, unmasks Jamie, and accepts Eldgard's lie at the gate.","state":"leashed, keeping the lie"},"2":{"line":"Files a false report, tells Cole \"flashes lie\", carries a coffin that weighs wrong, and accepts Nathaniel's cartridge case, becoming the investigator of his own shot.","state":"investigating himself"},"3":{"line":"Given Eldgard's private order to take the frost girl alive, he tells him she put her hand on their own gate, leads the market sweep, and carries Cole to the furnace room instead.","state":"disobeyed, compromised"},"4":{"line":"Puts Cole back on the roster, hears Marsh's Orchard rhyme in Newgate, finds his own rifle in the discharge log, and burns the page as Cole watches.","state":"guilty, watched"},"5":{"line":"Races Nathaniel across the roofs with Eldgard's order in his pocket all afternoon, gives him the boyhood whistle to turn back, then seals the core door and does not look away.","state":"obedient, ashamed"},"6":{"line":"Told to bring the girl back alive or bring Eldgard his lantern, tells Cole to wait until after the vote, ambushes the tunnel, lets the Lost One go when she names his mother, and carries Cole out of the fire.","state":"owes Cole everything"},"7":{"line":"Gets a medal for carrying Cole out of the gasworks, climbs to the roof to confess and finds Nathaniel already holding the rifle log, takes the fight of their lives, fights beside him at the Pavilion an hour later, and is kissed by Tamara, who hands him a folder with his name on it. He can't open it.","state":"Knows he's spare"},"8":{"line":"Opens the folder at dawn on the wedding day (Reserve. Blood suitable.), refuses Tamara in the vestry because he's on Eldgard's books, whistles danger when the attendants appear, blocks them in the aisle and hands her the ring properly, stands his Lanterns down at the gates, walks out with forty men, and finds the Orchard and his mother's name.","state":"Mutineer, orphan"},"9":{"line":"Takes his forty over the Newgate walls, frees Marsh, and carries the man who bred him down the Guard stair under fire, learning on the landing that his round didn't kill Jamie, and what he was raised for.","state":"Forgiven, unmoored"},"10":{"line":"Offers his life as Harding blood, knowing it's what he was grown for, and is beaten to the lock by Nathaniel; kills Ajax on the Guard stair and whistles it clear, holds the bridges all night, finds Cole dead at dawn, puts his own shot on the record, and is told he isn't forgiven: \"Stand where I can see you.\"","state":"Captain by choice"}},"cole":{"1":{"line":"The seventeen-year-old Wick smacks himself in the eye saluting his new captain, then, forgotten on the gantry, sees the man on the floor still talking.","state":"eager, bruised Wick"},"2":{"line":"He tells Nixon he saw the shot go through the man, is told flashes lie, decides to believe him, and writes it in his diary anyway.","state":"cheerful, diary kept"},"3":{"line":"Trained on Nathaniel's new boosters, he fires early and dangles in laundry, then freezes from the hand up and loses two fingers.","state":"maimed, still loyal"},"4":{"line":"Back on duty two fingers short, and secretly copying into his diary the discharge page Nixon burned.","state":"diary copied"},"5":{"line":"Holds a bridge barricade with flash-bursts while the Lantern Night crush kills people against the railings.","state":"holding the line"},"6":{"line":"Shows Nixon his diary and gives him until after the vote, then is carried out of the fire by the man he still believes in.","state":"burned, carried out"},"7":{"line":"Gets his dressings changed while Tamara kisses Nixon, and pretends very hard to be asleep.","state":"Discreet witness"},"8":{"line":"Walks out between the rifle lines at the gates with his hands up, and nobody fires.","state":"Peacemaker"},"9":{"line":"Asks Tamara whether married ladies are allowed to fight, and is handed a knife.","state":"Armed and grinning"},"10":{"line":"Teaches children flash-shadow rabbits, then holds the Tyburn Road barricade with his last cartridge; his line is the only reason Alice gets the Lost One to the hill. Dies at his post (\"Held the road. Nobody past who shouldn't be.\"), and his diary puts the truth of 2 November on the record.","state":"Dead at post"}},"eldgard":{"1":{"line":"He tells Jamie his preparation begins after tonight, pins Nixon's lantern, refuses Nathaniel's gauntlet in public, then buries his son at the gate.","state":"buried it, lying"},"2":{"line":"Alone with the chained light he says \"He was mine\", counts forty-seven, and drops his lamp when Morgana raises her head.","state":"face to face"},"3":{"line":"He hands Nathaniel the Guard contract, is told Nixon let the girl go, and answers: \"I know what you did at the core.\"","state":"holding the leash"},"4":{"line":"Calls Jamie melancholy and says he wanted to destroy the house, then baits Nathaniel with the whole work after the hearing.","state":"son baited"},"5":{"line":"Opens the Upper Gallery to Nathaniel (\"It comes back\"), waits in the core and tells him only part of it, answers \"cold\" with \"She told me my sister was still singing\", and pitches the Heartglass as mercy.","state":"son at his side"},"6":{"line":"Designs the Heartglass with Nathaniel, drives out past the north wall to ask his aunt Hester to come home and is refused (\"You brought the boy here once\"; \"Does the boy know yet?\"), tells Nixon to bring the girl back alive or bring him his lantern, and loses the Works to a Crown board.","state":"works lost"},"7":{"line":"Diminished without his Works and drunk among the dead vats, he wakes to his son holding the Keeper's ledger open at his own name. He says only \"I finished it\" and \"Then you know why I'm building it\", and that Nathaniel's mother knew what this house spends and married it anyway.","state":"Drunk confessor"},"8":{"line":"Gives Nathaniel Jamie's cufflinks, says \"I held his hand\", is held in his pew by a marshal while the attendants come for the bride, is arrested on the chapel steps for Jamie's murder on his wife's sworn word (they leave him the wolf-crest ring), and warns her in Newgate that the mother will break the glass before she lets her child hang in it.","state":"Arrested"},"9":{"line":"Leads the break-out, takes the blow of the man his son let live, owns the slag in Jamie's coffin, the wager he made on Nixon (a Hargrave raised to walk down willing) and the price he would never pay himself, and spends his last breath on the whole truth.","state":"Dead in the snow"},"10":{"line":"Only bones and a casket now; the confession he left behind is what lets Nathaniel choose light.","state":"Dead, vindicated"}},"josephine":{"1":{"line":"From the gallery she tells Byron the lamp-girl \"holds her wrist like a knife-girl\", then at grey dawn looks at her husband a beat too long.","state":"silent, keeping history"},"2":{"line":"Takes Nathaniel's face in her cold gloved hands over the coffin (\"You will stay out of that place\"), then, veiled, pays Grise in gold for the contract on her son and doubles it now Jamie is dead.","state":"buying her son's safety"},"4":{"line":"Poisons Felix Hawke on the witness stand, washes the frost off her fingers, and on the garden path is told by the girl from her mantel: \"You dusted my glass every morning. You knew I was a child.\"","state":"Exposed, waiting"},"6":{"line":"Spares Byron, who takes her needle, sends Eldgard the tip that sends Byron to his death, then weeps at the piano and confesses to a bluff: \"Then you know I love you.\"","state":"confessed"},"7":{"line":"Runs the table, tells Nathaniel she chose London long ago, takes his threat without stopping buttering, and sells Grise the Frost Witch: taken by hands her son can't trace to her.","state":"Chose London"},"8":{"line":"Watches Kit rehearse the taking from her window, gives Nathaniel Grise's receipt, smiles up at the lamp-girl in the gallery, swears her husband murdered Jamie, then in Newgate admits she was Lambrick's knife thirty years ago, and hears: \"You would.\"","state":"Husband sold"},"9":{"line":"Puts on Vykra knives she hasn't touched in thirty years, goes down alone, and bets that nobody in hooks refuses the door. Pulls the lever.","state":"Pulls lever"},"10":{"line":"Watches Morgana refuse the door, tells Nathaniel \"Go to her\", tells Morgana \"Not him\", hears from Alice that the girl she bought was the only purchase that ever worked, and walks into the White, where she finds Jamie kept in the cold and sits down beside him.","state":"Gone into White"}},"byron":{"1":{"line":"He picks soot from Nathaniel's hair with dry wit, shares one unreadable look with Josephine over the lamp-girl, and says nothing else.","state":"watching, unreadable"},"2":{"line":"He gently moves Nathaniel's hand off the coffin lid with shaking hands, then lets Alice out of the servants' door and only smiles.","state":"seeing everything"},"3":{"line":"\"You notice,\" he tells Nathaniel over the tea, and the ghostlight clue lands: his master is his mother's son.","state":"quiet, prompting"},"4":{"line":"Lies to Josephine about where Nathaniel goes at night, the first lie he has ever told her.","state":"first lie told"},"5":{"line":"Gives Nathaniel his old Guard key on a black ribbon, the one Jamie borrowed and copied (\"If I don't come up, give it to Nat\"), admits he heard her every night at the core, and goes back downstairs by tallow: no green lamp since.","state":"secret half-shared"},"6":{"line":"Confronts Josephine in the linen room (the flash: the night he caught her at the gate, sent by \"a coal man's son\"), takes the needle out of her sleeve and leaves alive, follows Nathaniel into the conduit with his old Lantern, and dies under the beam with breath for one sentence. He starts \"Your mother—\" and spends it instead on \"You were always enough.\" The needle is in his fist.","state":"dead, choosing love"}},"lambrick":{"1":{"line":"The coal baron arrives at the ball with Tamara and their engagement is announced to the room under the thousand green chandeliers.","state":"alliance sealed"},"2":{"line":"In the coach he tells Tamara the heir is dead so she must marry fast: \"You're a wedding, not a ledger.\"","state":"pushing marriage"},"3":{"line":"Named in his own ledger: Tamara copies six months of payments to A.F. and slips the page to Nathaniel on the ice.","state":"paid the killer"},"4":{"line":"Cold open: has already paid Ajax two hundred guineas to shame the Hardings with a blackout, and never learns Jamie paid double for the same minute. At the hearing he accuses the Hardings of hiding something under the Works and reads the falling wall-feed figures into the record.","state":"attack stalled"},"5":{"line":"Watches the Strand with Ajax's coal-mob, then rides a coal cart through the Westminster Bridge crush: 'Remember who kept you warm!'","state":"exploiting disaster"},"6":{"line":"Puts his own shoulder to the west-wall valve and is cheered for it, padlocks the east valve and buys Gin Lane leases at a shilling, leaves his half-signed lunacy order where his daughter finds it, then takes a seat on the Crown board that seizes the Works.","state":"on the board"},"7":{"line":"Tours the Crown's new core, remembers his wife's coal-heated room, and says the girl could be bled faster.","state":"Providing"},"8":{"line":"Calls his daughter unwell, the cue for two Bethlem attendants and a lunacy order under the Chancery seal; he doesn't need a Harding son-in-law any more, only a daughter who can't read his books aloud. In Newgate, Josephine reveals what she held over him: thirty years ago, he paid for Eldgard's death.","state":"Nearly won"},"9":{"line":"Tells Tamara to bring her husband by midnight, because a Harding has to walk down on his own feet, and promises to burn the Bethlem order if she does.","state":"Counting hours"},"10":{"line":"Tells the marshals to take the girl Nathaniel came for, so the boy will walk; fills satchels all night with gallowglass that is dimming in his hands, and chooses the dying crystals over his daughter's hand in the last hour before dawn while, across the city, Morgana lets hers go; at Westminster his own ledger convicts him.","state":"Died clutching"}},"tamara":{"1":{"line":"She carries a cipher wheel in her fan and agrees with Nathaniel to be very polite to each other for forty years.","state":"engaged, unsentimental"},"2":{"line":"Told to marry fast, she lifts her father's account book from his greatcoat in the coach and has it back before it stops: \"2 Nov, Works gate, 200 gns, A.F.\"","state":"suspicious, reading"},"3":{"line":"Copies her father's ledger and his cipher map of the old coal mains, takes Nathaniel skating, slips him the ledger copy naming Ajax Fink and warns him about the greased valves, then finds Ajax on her bed with a warning from her father.","state":"found out, warned"},"4":{"line":"Asks Nixon to protect her, spots a Vykra knot inside the veiled woman's glove, pockets the dropped needle, and offers it to Grise for a place.","state":"new Vykra girl"},"5":{"line":"Solves the Works cipher for Grise, then recodes the inner door by ear while Alice holds her belt over the shaft, becoming Alice's equal and rival.","state":"proven, rival"},"6":{"line":"Slips a dinner party to open her father's gun-room cabinet, finds the conduit charges and her own half-signed lunacy order, hides from Ajax behind the curtain with the wick pinched out, then warns Nathaniel in their childhood cipher, the warning that brings him into the blast.","state":"warning backfired"},"7":{"line":"Tours the core on her father's arm, reads Vessel: White-born, finds his lunacy order and asks Nathaniel to marry her before he can use it, gives Nixon his stolen file, and kisses him a week before the wedding.","state":"In love, engaged"},"8":{"line":"Marries Nathaniel to escape Bethlem, goes home for her mother's jewel case, watches from a lit window as Alice climbs her brother's trellis, takes the signet off his finger, and lies to her father's face.","state":"Holds a secret"},"9":{"line":"Lies to her father, takes the master key, the whole ledger and the coal-main maps from his safe, and faces Ajax down with the needle from the gallery stairs.","state":"Holds the key"},"10":{"line":"Offers her father her hand in the vault and walks out alone, opens the coal depots, keeps her father's Gin Lane leases, sets terms with Alice at the depot gate (his name on her paper, until the coal runs out), and at Westminster lays down the folio, her father's ledger and the needle, then names her price: the Record in Hansard, or the depots close at noon. Heir to Lambrick, and the one who forces the truth out.","state":"Heir of Lambrick"}},"grise":{"1":{"line":"In the steaming laundry she hands Alice her first contract from a client she won't name, the second Harding son, and closes her book on a page with a ribbon marking the one before.","state":"contract placed"},"2":{"line":"She takes Josephine's gold and doubles the contract, keeping the second son close and out of the Works.","state":"paid twice over"},"3":{"line":"Has Kit pin Alice in the laundry lines and demands a real report on the Harding son in three days, or the frost girl on Gin Lane becomes her business.","state":"waiting, threatening"},"4":{"line":"Demands the frost girl, snips the Vykra knot out of Alice's glove, tells her she is no one's, and takes Tamara as the new girl.","state":"new girl found"},"5":{"line":"Tests Tamara with a Works cipher solved in four minutes, lets slip that the inner codes change on Lantern Night, and welcomes her with tea and a knife.","state":"recruiter satisfied"},"7":{"line":"Agrees a price with Josephine for the Frost Witch, delivered to Josephine and not the Crown, and learns from her where her son hides the girl.","state":"Sold the girl"},"8":{"line":"Sends her girls through the glasshouse door Josephine sold her, and the Frost Witch holds out her wrists.","state":"Collects"},"9":{"line":"Tells Alice the sister was worth more, sends Kit to fight for her, and lays her own knife down when Kit loses on the count of nine.","state":"Yields"},"10":{"line":"Pours Alice a cup of tea in the Shadwell laundry without being asked.","state":"Tea and peace"}},"felix":{"1":{"line":"He pulls back the sheet for Alice to identify her sister, and when the corpse's eyes move his hand goes numb on his revolver.","state":"shaken, file open"},"2":{"line":"Two frozen attendants and a missing corpse, a Crown order to drop it, and a witness naming the Bounds girl of Gin Lane: he keeps the file.","state":"suspicious, unconvinced"},"3":{"line":"Frostbitten hand in a sling, he tells Nixon Miriam Bounds was dead, Jamie took a bullet, and slides over the Newgate visitor's slip.","state":"closing in"},"4":{"line":"Tracks Alice to the glasshouse, promises to tell the Crown that someone made the girl, and dies on the witness stand with frost on his lips.","state":"dead on stand"}},"vane":{"2":{"line":"Attends Jamie Harding's funeral at St Bride's among the great houses, the Crown's presence over a family's grief.","state":"watching the houses"},"4":{"line":"Presides over the Charter hearing, orders the Frost Killer hunted with every lamp in London, has the vote postponed, and that night feeds Felix Hawke's case file to his own grate.","state":"hunt ordered"},"6":{"line":"Bleeding from the temple, announces the Charter suspended and the Works handed to a Crown board.","state":"charter suspended"},"7":{"line":"Declares martial law at dawn and hears only that the lights stay on.","state":"Order restored"},"8":{"line":"Seals the lunacy order, then sees two hundred witnesses and a wife, and lets the attendants fold the strait-coat rather than face a Chancery hearing; arrests Eldgard for his son's murder and orders the crowd cleared by any means.","state":"Crown cornered"},"9":{"line":"Carries the Crown's sealed 1689 annex in his breast pocket, the Crown's own signature on the chain, and waits on the gallery for midnight.","state":"Waiting on girl or boy"},"10":{"line":"Names Nathaniel the man who put out London and offers a pardon for silence. Unmoved by the annex, he gives way to Tamara's coal: the Record goes into Hansard at two o'clock. Then he locks the annex back in his desk and pockets the key.","state":"Forced to write"}},"otty":{"2":{"line":"Her chancel brass at St Bride's reads OTTOLINE HARDING, 1820 TO 1839, DIED ABROAD; Nathaniel asks who she was and Byron says only \"your father's sister\".","state":"brass, unexplained"},"6":{"line":"Hester: \"I know how old she was.\"","state":"Remembered"}},"wren":{"2":{"line":"The bonesetter who set Alice's arm as a child hears a heart that is barely there, holds a mirror under a breath that barely fogs it, and calls it shock. Asked about the child, she tells Alice the cold took it: her second kind lie.","state":"knows, says little"},"9":{"line":"Admits she knew it wasn't Miriam the first night, and that the child is still there: the cold holds what it holds.","state":"Confesses both lies"}},"alistair":{"1":{"line":"In the 1489 cold open, wolf-crest ring on his hand, he opens the ice woman's wrist and her green blood lights the first gallowglass lantern.","state":"unmoved, first light"},"5":{"line":"Cold open, Tyburn 1489: cuts down the girl of nineteen at the lock, ending the first attempt on the chain.","state":"raid repelled"},"10":{"line":"At the chain in 1489 he chooses sons over light, and his firstborn Edric carries the lantern down the stair.","state":"Chose sons"}},"morgana":{"1":{"line":"Chained by hooks in the iron pit below Tyburn, a woman of ice whose opened wrist lights the first gallowglass lantern; a tiny frost girl slips out and runs.","state":"chained, drained"},"5":{"line":"Seen whole, nine feet of ice and green fire, hooked and chained and singing the Weeping, she tells Nathaniel his brother is not dead, only cold.","state":"chained, screaming"},"7":{"line":"Seen on the core wall as Lambrick does his arithmetic, while the Lost One names her as mother.","state":"Being bled"},"8":{"line":"In the cold open, the woman of ice who sings the lullaby; at the core, she understands her daughter's plan and her grief brings the snow.","state":"Grieving mother"},"9":{"line":"Strains at her hooks and asks the Lost One why she came back.","state":"Chain breaking"},"10":{"line":"Refuses the door at the lever, rises nine feet tall when a Harding opens the lock and says his name the way she sang it when he was five, lets her daughter stay and draws the White out of her, demands a Harding, accepts Josephine, and tells her the White keeps what it's given.","state":"Free at last"}},"ajax":{"3":{"line":"He sits on Tamara's bed, delivers her father's love, warns her off the safe and leaves the apple core on her pillow.","state":"warning delivered"},"4":{"line":"Cold open: takes Lambrick's two hundred guineas, then Jamie's double for the same blackout at one exact minute. At the coal docks he is hooked onto a crane and dropped into the Thames.","state":"in the Thames"},"5":{"line":"Cut out of a barge's anchor chain by river police Lambrick paid, scarred from brow to jaw, he brings a coal-mob to the Strand and cuts the outer grid during the fireworks, darkening the East End mid-heist.","state":"sabotage done"},"6":{"line":"Plans charges on the Tyburn conduit with Lambrick; in the tunnel he sees the Guard, lights the fuse early, and the gasworks goes up.","state":"fire lit early"},"9":{"line":"Drives Nathaniel into the ground with the Black Gauntlet and steps aside for Tamara's needle.","state":"Blocked"},"10":{"line":"Fights Nixon on the core stair and dies frozen mid-laugh, his apple rolling down.","state":"Frozen dead"}},"marsh":{"4":{"line":"Newgate's prisoner 1417, picking at a string he calls his harp, pinches Nixon's cheek, says 'Marian's chin', and recites the Orchard rhyme.","state":"rhyme delivered"},"9":{"line":"Walks out of opened cell 1417, looks up at the snow, and says perfectly lucidly that they always count from the first snow.","state":"Lucid, freed"}},"hester":{"6":{"line":"Eldgard's aunt, the one Harding who ran in 1839, refuses to leave her cottage outside the north wall, tells him he called his fear duty, asks whether the boy knows yet, and lights a candle as the last heater-post dies.","state":"Won't come home"},"9":{"line":"Named in the Snow Confession: she ran the week before the snow, and Otty walked in her place.","state":"Named"},"10":{"line":"Comes back inside the walls for the first time in fifty years to hold the candle while Walter's chisel takes DIED ABROAD off Otty's brass.","state":"Holds the candle"}},"kit":{"1":{"line":"Grise's best knife watches Alice get the envelope she wanted, and smiles anyway.","state":"Passed over"},"3":{"line":"Drops the laundry lines on Alice and delivers Grise's ultimatum with a knife under her jaw.","state":"Enforcer"},"4":{"line":"Hands Grise the scissors that cut Alice's knot.","state":"Inherits the work"},"6":{"line":"Pours tea for Alice and Tamara with her eyes down. Tamara knows her and says nothing, thinking Grise is watching her. Kit sells the note that sends Byron to his death.","state":"Unseen"},"7":{"line":"Folds a knife into a sheet while Josephine buys the Frost Witch.","state":"Assigned"},"8":{"line":"Rehearses the taking with a pocket watch at dawn, then takes the Lost One on the minute while the vows run.","state":"Took her"},"9":{"line":"Fights Alice for the Vykra and loses on nine, laughing: \"You never once looked at the girl with the pot.\" Picks her knife up last.","state":"Beaten"},"10":{"line":"Runs Alice's errand through the wolves to the Works, bleeding: \"She said not to tell you she asked.\"","state":"Alice's runner"}},"edmund":{"1":{"line":"Lambrick's bastard son, the money behind the Narrows house, puts Xyon in the punch of the girl Ajax described, then comes in from the garden with damp hands: \"Just the cold.\"","state":"Unsuspected"},"2":{"line":"Is \"a nobleman, from the party\" in a borrowed memory.","state":"A shadow"},"8":{"line":"Named by an apothecary's receipt; on the wedding night a girl with wolf's eyes is waiting in his chair. He smashes his Xyon decanter into her face and dies on the wire. His father calls him unwell.","state":"Dead, tidied"},"10":{"line":"Comes back whole in Alice's returning hour on Tyburn hill: \"I did her a kindness. I did it for both of them.\" His last words are for his father.","state":"Remembered"}}},"notes":{},"ledger":{"rows":[["The frost girl running from the pit in 1489","Ep 1, cold open","Ep 2 tag (\"My daughter is here\"), Ep 7 (\"You're not her\")"],["Miriam looks down at something in the water, and climbs the railing","Ep 1, scene 15","Ep 10, scene 16: \"She asked me to go back to Ali\""],["Nixon's shot in the core","Ep 1, scene 14","Ep 7 confession; Ep 9: the round went through the shoulder"],["Eldgard kneels by Jamie; we cut away","Ep 1, scene 16","Ep 9 Snow Confession: he held Jamie's hand over the lock"],["Nathaniel hears the Weeping","Ep 1, scenes 12 and 19; Ep 1, scene 13 (the lamp-girl, beside him, hears nothing)","Ep 5: it's Morgana; Ep 8, scene 3 (the flash): her daughter held his hand when he was five, and he has heard her mother ever since"],["Josephine: \"She holds her wrist like a knife-girl\"","Ep 1, scene 10","Ep 2 contract; Ep 4 orn in two: half for his cut palm, half for her burned hand); the Record (two halves on the mantel)"],["Alice counts under her breath in the ballroom","Ep 1, scene 9","Ep 10, scene 18: she counts for him, and he gets to nine on his own"],["The boosters and the coal bin, \"an audience of one\"","Ep 1, scene 3; Ep 3, scene 6","Ep 9, scene 2: \"After that I'd have done it for nothing\""],["Nathaniel lets Ajax drop into the Thames","Ep 4, scene 9 (Alice: \"Pull him up\")","Ep 9, scene 13: \"You should've pulled me up, Harding,\" and the blow that kills Eldgard"],["The gauntlet schematic lifted from his coat in the dark","Ep 1, scene 13","Ep 3, scene 15: her ghostlight is built to his design"],["The price of breaking the chain: one of the house goes with her","Ep 5, scene 16 (only a seed: \"it takes something from us\"); Ep 9, scene 15 (Eldgard names it in the snow)","Ep 10, scene 5 (he opens the lock knowing); Ep 10, scenes 16 and 17: Morgana names it, and Josephine gives herself"],["Felix Hawke poisoned on the stand","Ep 4, scene 14","Ep 4, scene 18 (the frost in her bowl); Ep 6, scene 15 (the needle in Byron's fist); Ep 6, scene 18 (Nathaniel bluffs, and she confesses); Ep 10, the Record: Nathaniel names his mother"],["The names under the Lantern Hymn","The world rule (what gallowglass does)","Ep 6, scene 13: the Lost One hears Nixon's mother in the song; Ep 10, the Record: the Orchard names read off the wall"],["Jamie paid Ajax to cut the outer grid","Ep 4, cold open","Ep 1, scene 12 (the city goes dark as his cover); Ep 4, scene 9 (\"I cut the outer grid. I never touched him.\")"],["Tamara's needle from the gallery stairs","Ep 4, scene 14 (\"I want to know who\")","Ep 8, scene 6 (the knot inside Josephine's glove at the chapel door); Ep 9, scene 4 (she faces Ajax with it); Ep 10, scene 22 (on Vane's desk)"],["Lambrick's ledger: payments to A.F.","Ep 2, scene 6 (lifted from his coat); Ep 3, cold open (copied)","Ep 9, scene 4 (she takes it whole); Ep 10, scene 22: the ry door"],["\"Hand it to me properly\"","Ep 8, scene 6 (the vestry)","Ep 8, scene 10: the strait-coat waits in the same room; Ep 8, scene 12: \"Congratulations, miss\"; Ep 8, scene 15: he walks out holding the empty box"],["Alistair's choice: \"Sons\"","Ep 10, cold open","Ep 10, scene 5: Nathaniel chooses light"],["The wolf-crest ring","Ep 1, cold open","Ep 9 (given to Nathaniel); Ep 10 (opens the lock, then dropped in the grate)"],["Jamie's Sunday visits to prisoner 1417","Ep 3, Scotland Yard (the slip)","Ep 4, Newgate cell 1417; Ep 9, Marsh walks out into the first snow"],["Marsh's rhyme: thirteen steps down, \"count the apples\"","Ep 4, Newgate cell 1417","Ep 8, scene 18: the Orchard, and the keepers' tallies headed APPLES"],["Nixon's mother Marian \"died of fever\"","Ep 4 (\"Marian's chin\")","Ep 8 (her name on the wall); Ep 9 Snow Confession; Ep 10 (\"the way they grew my mother\")"],["The skipping rhyme: \"Green light, green light, who's in the cellar tonight?\"","Ep 1, scene 2 (through a grating, and nobody listens)","Ep 8, scene 18: Nixon is standing in the cellar; Ep 10, the Record: nobody's in the cellar tonight"],["The Guard oath: \"Light the dark. Keep the flame.\"","Ep 1, scene 5 (sworn with pride)","Ep 5, scene 17 (said as obedience, behind the glass); Ep 8, scene 15 (\"Keep the flame, Captain.\" \"I am.\"); Ep 10, Westminster (\"The Guard will keep its own flame\") and the match on the roof"],["Byron's tallow candle: no green lamp since the core","Ep 5, scene 4","Ep 10, scene 6 (a mother on Gin Lane lights tallow); Ep 10, the Record (window to window, and a hospital by tallow)"],["A flame held until it burns","Ep 1, scene 13 (the match to her fingers)","Ep 8, scene 16 (his candle, to his fingers, watching her lamp); Ep 10, scene 5 (her palm on the overloaded gauntlet)"],["The orange","Ep 1, scene 2 (stolen and tossed, instead of a birthday)","Ep 3 (the Lost One's apology); Ep 4 (\"Eat that\"); Ep 8 (the rehearsal among the orange trees); Ep 10, the Re ower now, and Tamara owns the coal, and the leases on Gin Lane. The young woman who wanted to be her father's heir has become something more dangerous.<\/li>\n<li><strong>A Harding child carried by a Harding daughter of the White.<\/strong> Both worlds will want it.<\/li>\n<li><strong>Josephine, in the White<\/strong>, beside a son who can't answer her. She went in to end the debt and stayed for him.<\/li>\n<li><strong>Everyone the chain ever took<\/strong> is standing in the White exactly as they went: Edric with his lantern, Otty, the Orchard's apples, Jamie. Kept, not living. Morgana said \"cold, not dead\" and meant it to the letter. Nobody comes back. Season 2's question: what do you owe the dead when you know exactly where they are?<\/li>\n<li><strong>Whether the winter lifts.<\/strong> The long winter over the outerlands was hers, seeping round the chain. She's free now. The walls stand grey, the frost line hasn't moved yet, and nobody knows whether the thaw will come, or what will come with it.<\/li>\n<li><strong>Tamara and Alice.<\/strong> The woman who shot her, and the woman who killed her brother, holding hands at a depot gate on terms neither can afford to break.<\/li>\n<li><strong>Nixon and Tamara<\/strong>: married to his cousin, holding his hand, nothing decided. Nathaniel and Alice: a kiss on Tyburn hill and no promise, because he's still Tamara's husband, and Tamara's hold on the city's coal rests on being Lady Harding. The two women have already set the terms on a Westminster bench: the paper, until the coal runs out. Three people in love, and the only marriage among them is the one keeping London warm.<\/li>\n<\/ul>"},"world":{"html":"<p>Gallowglass is Morgana's frozen blood, and an iron chain under the Works holds her. Four rules run the season, and nothing else does. A viewer should be able to say each one in a sentence.<\/p>\n<ol>\n<li><strong>The Tithe.<\/strong> Every fifty years, on the night of the first snow, a Harding must walk down to t
