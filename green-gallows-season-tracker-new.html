<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Gallows Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#e6e9e6; --paper:#f6f7f5; --paper2:#eceeeb; --ink:#1d2422; --muted:#59645f; --faint:#8a948f; --line:#cbd2ce; --line2:#dde2df;
  --focus:#2c6b5c;
  --t-harding:#9a3434; --t-sisters:#1f7a6d; --t-investigation:#a8740c; --t-guard:#2d5c9c;
  --t-lambrick:#6c3f8e; --t-vykra:#a3427a; --t-city:#4a5a66; --t-white:#3f7f96;
  --tint:9%; --tint-open:5%;
  --display:'IM Fell English',Georgia,'Times New Roman',serif;
  --ui:'Public Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --paper:#1b2220; --paper2:#222a27; --ink:#e3e8e5; --muted:#a1aca7; --faint:#75807b; --line:#323d39; --line2:#28312e;
  --focus:#7cc7b3;
  --t-harding:#e2786d; --t-sisters:#5cc4b6; --t-investigation:#e2b04c; --t-guard:#7fa7e6;
  --t-lambrick:#b88ddc; --t-vykra:#e58cbb; --t-city:#a3b1bc; --t-white:#7fc7dd;
  --tint:14%; --tint-open:8%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --paper:#1b2220; --paper2:#222a27; --ink:#e3e8e5; --muted:#a1aca7; --faint:#75807b; --line:#323d39; --line2:#28312e;
  --focus:#7cc7b3;
  --t-harding:#e2786d; --t-sisters:#5cc4b6; --t-investigation:#e2b04c; --t-guard:#7fa7e6;
  --t-lambrick:#b88ddc; --t-vykra:#e58cbb; --t-city:#a3b1bc; --t-white:#7fc7dd;
  --tint:14%; --tint-open:8%; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:7.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.55rem;line-height:1;margin:0;white-space:nowrap;font-weight:400}
.brand small{font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-left:.5rem;letter-spacing:.01em}
nav.tabs{display:flex;gap:.15rem}
nav.tabs a{text-decoration:none;padding:.35rem .7rem;border-radius:3px;color:var(--muted);font-weight:600;font-size:.92rem}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper2);box-shadow:inset 0 -2px 0 var(--ink)}
.tools{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.search{width:15rem;max-width:44vw;padding:.35rem .6rem;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:.32rem .55rem;line-height:1;color:var(--muted)}
.legend{max-width:1480px;margin:0 auto;padding:0 1rem .55rem;display:flex;flex-wrap:wrap;gap:.35rem .4rem;align-items:center}
.legend[hidden]{display:none}
.legend .hint{font-size:.8rem;color:var(--faint);margin-right:.25rem}
.tchip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.16rem .6rem .16rem .4rem;font-size:.8rem;color:var(--ink)}
.tchip i{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.tchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--paper));font-weight:600}
.legend .clear{border:0;background:none;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:.1rem .3rem}

main{max-width:1480px;margin:0 auto;padding:1.25rem 1rem 4rem}
section[hidden]{display:none}
h2,h3{font-weight:400}

/* ---------- braid (scene-order strip) ---------- */
.braid{display:flex;gap:2px;height:22px;min-width:0}
.braid button{flex:var(--w) 1 0;min-width:4px;border:0;padding:0;background:var(--c);border-radius:1px;position:relative}
.braid button:hover{filter:brightness(1.15)}
.braid button.dim{opacity:.18}
.braid.big{height:44px;gap:3px}
.braid.big button{color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 3px 4px;overflow:hidden}
:root[data-theme="dark"] .braid.big button{color:#0f1412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .braid.big button{color:#0f1412}}

/* ---------- season view ---------- */
.season-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2rem;align-items:end;margin-bottom:1.5rem}
.season-head h2{font-family:var(--display);font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1;margin:0}
.season-head p{margin:.6rem 0 0;color:var(--muted);max-width:60ch}
.clock{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;font-size:.74rem}
.clock .acts{grid-column:1/-1;display:grid;grid-template-columns:6fr 1fr 3fr;gap:2px;margin-bottom:2px}
.clock .acts span{border-top:2px solid var(--ink);padding-top:.2rem;color:var(--muted);font-weight:600}
.clock .cell{background:var(--paper);border:1px solid var(--line2);padding:.35rem .4rem;min-height:3.6rem}
.clock .cell b{display:block;font-family:var(--display);font-size:1.15rem;font-weight:400;line-height:1}
.clock .cell span{color:var(--muted);line-height:1.2;display:block;margin-top:.2rem}
.clock .cell.snow{background:color-mix(in srgb,var(--t-nixon) 10%,var(--paper))}
.loom{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:3.4rem minmax(0,15rem) minmax(0,1fr) minmax(0,16rem);gap:1rem;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lrow:hover .lt{text-decoration:underline}
.ln{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--muted)}
.lt{font-family:var(--display);font-size:1.3rem;line-height:1.1}
.lrow .lg{font-size:.84rem;color:var(--muted);margin-top:.25rem}
.lrow .tn{font-size:.82rem;color:var(--muted);border-left:2px solid var(--line);padding-left:.7rem}
.lrow .bwrap{display:flex;flex-direction:column;gap:.35rem}
.lrow .bmeta{font-size:.74rem;color:var(--faint)}
.thread-key{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem 1.5rem;margin:2.2rem 0 0;padding-top:1.2rem;border-top:1px solid var(--line)}
.thread-key div{display:grid;grid-template-columns:.9rem 1fr;gap:.55rem;font-size:.86rem}
.thread-key i{width:.9rem;height:.9rem;border-radius:50%;background:var(--c);margin-top:.25rem}
.thread-key b{display:block}
.thread-key span{color:var(--muted)}
.thread-key em{font-style:normal;color:var(--faint);font-size:.78rem}

/* ---------- episode view ---------- */
.epnav{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin-bottom:1.1rem}
.epnav a{display:inline-grid;place-items:center;min-width:2.2rem;height:2.2rem;border:1px solid var(--line);border-radius:3px;text-decoration:none;font-family:var(--display);font-size:1.1rem;background:var(--paper)}
.epnav a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.epnav .sp{flex:1}
.epnav .step{min-width:auto;padding:0 .7rem;font-family:var(--ui);font-size:.85rem;font-weight:600}
.ephead{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.5rem 2.5rem;margin-bottom:1.2rem}
.ephead .num{font-size:.9rem;color:var(--muted)}
.ephead h2{font-family:var(--display);font-size:clamp(2rem,4vw,3.2rem);line-height:1.02;margin:.15rem 0 .5rem}
.ephead .log{font-size:1.08rem;margin:0 0 .8rem;max-width:62ch}
.ephead .story{color:var(--muted);margin:0;max-width:68ch}
.ephead aside{background:var(--paper);border:1px solid var(--line);padding:1rem 1.1rem;align-self:start}
.ephead aside h3{font-size:.85rem;font-weight:700;margin:0 0 .3rem}
.ephead aside p{margin:0 0 1rem}
.tcount{display:flex;flex-direction:column;gap:.3rem}
.tcount button{display:grid;grid-template-columns:.75rem 1fr auto;gap:.5rem;align-items:center;border:0;background:none;padding:.1rem 0;text-align:left;font-size:.86rem}
.tcount i{width:.75rem;height:.75rem;border-radius:50%;background:var(--c)}
.tcount span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.tcount button[aria-pressed="true"]{font-weight:700}
.stripwrap{margin:0 0 1.4rem}
.stripwrap .cap{display:flex;justify-content:space-between;font-size:.76rem;color:var(--faint);margin-top:.3rem}
.filters{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem;font-size:.86rem;color:var(--muted)}
.filters select{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:.25rem .4rem}
.filters label{display:flex;gap:.4rem;align-items:center}
.filters .count{margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:.8rem;align-items:start}
.actdiv{grid-column:1/-1;display:flex;align-items:baseline;gap:.8rem;margin:1rem 0 .1rem;padding-bottom:.3rem;border-bottom:1px solid var(--ink)}
.actdiv:first-child{margin-top:0}
.actdiv h3{font-family:var(--display);font-size:1.35rem;margin:0}
.actdiv span{font-size:.8rem;color:var(--muted)}
.marker{grid-column:1/-1;font-size:.84rem;color:var(--muted);padding:.35rem .7rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 6%,transparent)}
.marker b{color:var(--ink);font-weight:600}

.card{--c:var(--faint);position:relative;background:color-mix(in srgb,var(--c) var(--tint),var(--paper));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-left:5px solid var(--c);border-radius:3px;padding:.75rem .85rem .7rem;display:flex;flex-direction:column;gap:.45rem;transition:opacity .15s}
.card.dim{opacity:.22}
.card.hit{outline:2px solid var(--c);outline-offset:2px}
.card .top{display:grid;grid-template-columns:auto 1fr;gap:.55rem;align-items:start}
.card .seq{font-family:var(--display);font-size:1.6rem;line-height:.9;color:var(--c);min-width:1.3rem}
.card h4{margin:0;font-size:.95rem;font-weight:700;line-height:1.3}
.card .oref{font-size:.74rem;color:var(--faint);margin-top:.1rem}
.card .where{font-size:.8rem;color:var(--muted);display:flex;gap:.35rem;align-items:flex-start;line-height:1.3}
.card .where svg{flex:none;margin-top:.1rem;width:11px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6}
.card .when{font-style:italic}
.card .sum{margin:0;font-size:.92rem;line-height:1.5}
.card .turn{margin:0;font-size:.84rem;color:var(--muted);padding-left:.6rem;border-left:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.card .turn b{color:var(--ink);font-weight:600}
.card .foot{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:auto;padding-top:.3rem}
.cchip{font-size:.74rem;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:.02rem .45rem;color:var(--muted);cursor:pointer}
.cchip:hover{color:var(--ink);border-color:var(--muted)}
.also{display:inline-flex;gap:.2rem;margin-left:.15rem}
.also i{width:.6rem;height:.6rem;border-radius:50%;background:var(--c);display:inline-block}
.badges{display:flex;gap:.3rem;flex-wrap:wrap}
.badge{font-size:.72rem;font-weight:600;padding:.04rem .4rem;border-radius:2px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.badge.add{border-color:var(--focus);color:var(--focus)}
.badge.ed{border-style:dashed;color:var(--ink,inherit)}
.badge.flag{border-color:var(--t-investigation);color:var(--t-investigation)}
.readbtn{margin-left:auto;border:0;background:none;font-size:.8rem;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:.1rem 0}
.card.open{grid-column:1/-1;background:color-mix(in srgb,var(--c) var(--tint-open),var(--paper))}
.card.open .sum{font-size:1rem;max-width:80ch}
.full{display:none;border-top:1px solid var(--line);margin-top:.4rem;padding-top:.8rem;max-width:84ch;font-size:.95rem;line-height:1.62}
.card.open .full{display:block}
.full blockquote{margin:.5rem 0;padding:.05rem .9rem;border-left:3px solid var(--line);color:var(--ink)}
.full blockquote blockquote{border-left-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.full p{margin:.45rem 0}
.full h1,.full h2,.full h3,.full h4{font-size:1rem;font-weight:700;margin:1rem 0 .3rem}
.full table{border-collapse:collapse;font-size:.84rem;margin:.6rem 0;display:block;overflow-x:auto}
.full th,.full td{border:1px solid var(--line);padding:.3rem .5rem;vertical-align:top;text-align:left}
.full hr{border:0;border-top:1px solid var(--line)}
.full code{font-size:.85em;background:var(--paper2);padding:0 .2rem}
.refs{margin-top:2rem;display:flex;flex-direction:column;gap:.5rem}
details.ref{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:.55rem .8rem}
details.ref summary{cursor:pointer;font-weight:600;font-size:.9rem}
details.ref summary span{font-weight:400;color:var(--muted)}
details.ref .full{display:block}

/* ---------- characters ---------- */
.chars-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table.matrix{border-collapse:collapse;width:100%;min-width:760px;font-size:.84rem}
.matrix th,.matrix td{border-bottom:1px solid var(--line2);padding:.3rem .4rem;text-align:center}
.matrix thead th{font-family:var(--display);font-weight:400;font-size:1.05rem;position:sticky;top:0;background:var(--paper)}
.matrix tbody th{text-align:left;font-weight:600;white-space:nowrap;padding-left:.7rem}
.matrix tbody tr{cursor:pointer}
.matrix tbody tr:hover,.matrix tbody tr[aria-selected="true"]{background:var(--paper2)}
.matrix td .pip{display:inline-block;border-radius:2px;background:var(--ink);opacity:calc(.15 + var(--v) * .85);width:calc(.45rem + var(--v) * 1.25rem);height:.7rem;vertical-align:middle}
.matrix td.none{color:var(--faint)}
.matrix td small{display:block;color:var(--muted);font-size:.7rem;line-height:1.15;margin-top:.15rem;max-width:8.5rem;margin-inline:auto}
.journey h2{font-family:var(--display);font-size:2.2rem;margin:0}
.journey .sub{color:var(--muted);margin:.2rem 0 1rem}
.jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.jcard{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--ink);padding:.7rem .8rem;display:flex;flex-direction:column;gap:.35rem}
.jcard.off{opacity:.55;border-top-color:var(--line)}
.jcard .h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.jcard .h b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.jcard .h span{font-size:.75rem;color:var(--muted)}
.jcard .st{font-weight:600;font-size:.86rem}
.jcard p{margin:0;font-size:.88rem}
.jcard .sc{display:flex;flex-wrap:wrap;gap:3px;margin-top:.2rem}
.jcard .sc a{width:1.45rem;height:1.25rem;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-size:.68rem;font-weight:700;text-decoration:none;border-radius:2px}
:root[data-theme="dark"] .jcard .sc a{color:#0f1412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jcard .sc a{color:#0f1412}}

/* ---------- notes ---------- */
.notes h2{font-family:var(--display);font-size:2.2rem;margin:0 0 .3rem}
.notes .sub{color:var(--muted);margin:0 0 1.2rem;max-width:70ch}
.notes h3{font-family:var(--display);font-size:1.4rem;margin:1.4rem 0 .5rem}
.note{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.8rem;padding:.6rem 0;border-top:1px solid var(--line2)}
.note .id{font-weight:700;font-size:.85rem}
.note .id.open{color:var(--t-nixon)}
.note .id.flag{color:var(--t-investigation)}
.note p{margin:.15rem 0 0;font-size:.9rem;max-width:90ch}
.note a{font-size:.84rem;font-weight:600}

.empty{padding:2rem;text-align:center;color:var(--muted);grid-column:1/-1}

@media (max-width:1000px){
  .lrow{grid-template-columns:2.6rem minmax(0,1fr);}
  .lrow .bwrap{grid-column:1/-1}
  .lrow .tn{grid-column:1/-1}
  .season-head,.ephead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .bar{position:static}
  html{scroll-padding-top:1rem}
  .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:.6rem}
  .tchip{flex:none}
  .tools{margin-left:0;width:100%}
  .search{flex:1;width:auto;max-width:none}
  .clock{grid-template-columns:repeat(5,1fr)}
  .clock .acts{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.bar,.legend,.epnav,.filters{display:none}.card .full{display:block}}

/* ---------- document views (world, ledger) ---------- */
.doc{max-width:82ch}
.doc h2{font-family:var(--display);font-size:2.4rem;margin:0 0 .4rem}
.doc h3{font-family:var(--display);font-size:1.45rem;margin:1.5rem 0 .4rem}
.doc h4{font-size:.95rem;font-weight:700;margin:1.1rem 0 .3rem}
.doc p{margin:.5rem 0;line-height:1.62}
.doc ul{margin:.4rem 0 .8rem;padding-left:1.2rem}
.doc ol{margin:.4rem 0 .8rem;padding-left:1.4rem}
.doc li{margin:.2rem 0;line-height:1.55}
.doc li>strong:first-child{color:var(--ink)}
.doc table{border-collapse:collapse;font-size:.85rem;margin:.7rem 0;display:block;overflow-x:auto;max-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:.32rem .55rem;vertical-align:top;text-align:left}
.doc th{background:var(--paper2);font-weight:600}
.doc blockquote{margin:.7rem 0;padding:.1rem .9rem;border-left:3px solid var(--line);color:var(--muted)}
.doc code{font-size:.85em;background:var(--paper2);padding:0 .2rem}
.doc .lede{color:var(--muted);max-width:70ch;margin:.2rem 0 1.4rem}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1 class="brand">The Green Gallows<small>The showrunner’s season</small></h1>
    <nav class="tabs" aria-label="Views">
      <a href="#season" data-v="season">Season</a>
      <a href="#ep1" data-v="episode">Episodes</a>
      <a href="#characters" data-v="characters">Characters</a>
      <a href="#world" data-v="world">World</a>
      <a href="#ledger" data-v="ledger">Ledger</a>
    </nav>
    <div class="tools">
      <label class="vh" for="q">Search scenes</label>
      <input id="q" class="search" type="search" placeholder="Search every scene" title="Searches summaries and full scene text. On the Season page, matching scenes stay lit in the strips.">
      <button class="iconbtn" id="theme" type="button" title="Switch light or dark">Light/dark</button>
    </div>
  </div>
  <div class="legend" id="legend" aria-label="Storylines"></div>
</header>
<main>
  <section id="v-season" aria-label="Season overview"></section>
  <section id="v-episode" aria-label="Episode" hidden></section>
  <section id="v-characters" aria-label="Characters" hidden></section>
  <section id="v-notes" aria-label="Flags and open decisions" hidden></section>
  <section id="v-world" aria-label="The world" hidden></section>
  <section id="v-ledger" aria-label="Setup and payoff ledger" hidden></section>
</main>
<script type="application/json" id="data">{"title":"The Green Gallows","subtitle":"The showrunner’s season","seasonIntro":"London, November 1889, and the whole city glows green. Every lamp, tram and furnace burns gallowglass, a crystal that only House Harding knows how to grow, at the Harding Works on the old gallows field at Tyburn. The Hardings say it grows from iron in the ground. In fact it grows from a woman. Her winter has lain over the countryside for four hundred years, and a ring of green heat walls, burning her blood, keeps it off the city. Can Nathaniel Harding end the bargain that lights London without becoming the father who kept it? Under it runs the sisters' question: will Alice Bounds let the thing wearing her dead sister's face choose its own life? Protection as control. Every adult in this show hurts someone to keep them safe. The young ones have to learn whether love can let go. Five more themes run underneath it: bought or given, who pays for the light, what gets written down, the spare and the heir, and where you belong. The season argues every one of them from several sides and never says which side is right.","episodesNote":"A new ten-episode season, built from scratch on the strongest bones of the original: the Harding legacy, Miriam and the Lost One, and the sister reveal.","eps":[{"n":1,"title":"The Engagement","time":"49 DAYS TO FIRST SNOW","clock":"49 DAYS TO FIRST SNOW","act":"I","log":"On the night his engagement is announced, Nathaniel Harding's brother dies at the family Works, his best friend fires the shot nobody can ever know about, and across the river a girl freezes solid on a bridge, then opens her eyes in the morgue.","sum":"The frozen girl in the morgue opens her eyes","turn":"Nixon shoots a saboteur and finds out it's Jamie. Miriam freezes on a bridge","focus":"one night, two parties: the Harding ball above, the glim run below, until the light flickers","piece":"the Works blackout","threads":["city","sisters","harding","guard","vykra","white"],"frame":"<blockquote><p><strong>Focus:<\/strong> one night, two parties: the Harding ball above, the glim run below, until the light flickers<\/p><p><strong>Set piece:<\/strong> the Works blackout<\/p><p><strong>Sting:<\/strong> the man who shoots the saboteur is the hero's best friend, and the saboteur is the hero's brother<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":1,"seq":1,"title":"Tyburn, 1489. Night, no snow, but frost","added":false,"act":"Cold open","kind":"scene","sum":"Over black, a young man's voice, flat and exact, like a clerk reading a ledger: \"Edric Harding. Nine years old. The year of our Lord fourteen hundred and eighty-nine.\" We won't know whose voice it is for ten episodes. The Crown's gallows field, a hundred empty frames and one old thief turning on his rope. Creak. Creak. Below the ground, in a pit lined with iron, something vast breathes behind the lantern glare. We never see her face. We see a hand of blue ice the size of a cartwheel with an iron hook through it, and we hear her singing: a wordless lullaby, low and patient, a tune the audience will hear again without knowing where. ALISTAIR HARDING, wolf-crest ring on his hand, opens her wrist, and her blood runs green into a lantern. Fwhumph. The first gallowglass light. A boy of nine holds the lantern up for his father, solemn and proud to be useful. In the dark behind them a tiny girl made of frost slips out of the pit. Alistair sees her, and steps aside to let her pass. He has what he wanted. She runs into the white dark, and the wolves follow her. At the treeline a young woman in Harding colours, nineteen, a cousin, has seen all of it. She backs into the trees before anyone sees her face. Out of the pit a ring of frost starts across the field, slow as a tide, past the gallows frames and into the trees. The singing doesn't stop.","loc":"Tyburn","when":"The Crown's gallows field, a hundred empty frames and one old thief turning on his rope.","th":"city","also":["white"],"ch":["alistair"],"turn":"","w":679,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Over black, a young man's voice, flat and exact, like a clerk reading a ledger: \"Edric Harding. Nine years old. The year of our Lord fourteen hundred and eighty-nine.\" We won't know whose voice it is for ten episodes. The Crown's gallows field, a hundred empty frames and one old thief turning on his rope. <em>Creak. Creak.<\/em> Below the ground, in a pit lined with iron, something vast breathes behind the lantern glare. We never see her face. We see a hand of blue ice the size of a cartwheel with an iron hook through it, and we hear her singing: a wordless lullaby, low and patient, a tune the audience will hear again without knowing where. ALISTAIR HARDING, wolf-crest ring on his hand, opens her wrist, and her blood runs green into a lantern. <em>Fwhumph.<\/em> The first gallowglass light. A boy of nine holds the lantern up for his father, solemn and proud to be useful. In the dark behind them a tiny girl made of frost slips out of the pit. Alistair sees her, and steps aside to let her pass. He has what he wanted. She runs into the white dark, and the wolves follow her. At the treeline a young woman in Harding colours, nineteen, a cousin, has seen all of it. She backs into the trees before anyone sees her face. Out of the pit a ring of frost starts across the field, slow as a tide, past the gallows frames and into the trees. The singing doesn't stop.<\/p>"},{"oref":"Scene 2","id":262,"seq":2,"title":"The Narrows, a rain-slicked roofline, then a storeroom","added":true,"act":"Act One","kind":"scene","sum":"1889. Two figures cross the roofs without a sound, Vykra colours under their coats: ALICE and MIRIAM BOUNDS, on a job to close a house that sells girls. Alice: \"Twelve guards. Four on the door, two on the stair.\" Miriam: \"And?\" \"And nothing. I'm counting so you don't have to.\" \"You always count. You never wait. Fast. Quiet. Home before the bells.\" \"You have somewhere to be.\" Miriam doesn't answer; Alice notices, because Alice always notices. Below, in a lamplit storeroom, girls roped at the wrist. KESTREL is selling. AJAX FINK is buying, for a gentleman he doesn't name, counting heads like coin. Six seconds per man: Alice goes through the room like weather. A guard's belt buckle rings on the floor, and for one breath she isn't in the room at all. Miriam sees it, and looks away. Then Miriam puts her hand flat on Kestrel's table (\"I know exactly what they are. That's why I'm here.\"), and it's not a fight, it's punctuation. Ajax walks out the back with the first pages of the ledger, and turns at the door to look straight at Miriam. He files her face. \"Tell your patron the house is closed.\" Miriam wears a ring on a cord under her collar. Alice clocks it and says nothing.","loc":"The Narrows","when":"1889.","th":"sisters","also":["vykra","lambrick"],"ch":["alice","miriam","ajax"],"turn":"","w":428,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<ol>\n<li>Two figures cross the roofs without a sound, Vykra colours under their coats: ALICE and MIRIAM BOUNDS, on a job to close a house that sells girls. Alice: \"Twelve guards. Four on the door, two on the stair.\" Miriam: \"And?\" \"And nothing. I'm counting so you don't have to.\" \"You always count. You never wait. Fast. Quiet. Home before the bells.\" \"You have somewhere to be.\" Miriam doesn't answer; Alice notices, because Alice always notices. Below, in a lamplit storeroom, girls roped at the wrist. KESTREL is selling. AJAX FINK is buying, for a gentleman he doesn't name, counting heads like coin. Six seconds per man: Alice goes through the room like weather. A guard's belt buckle rings on the floor, and for one breath she isn't in the room at all. Miriam sees it, and looks away. Then Miriam puts her hand flat on Kestrel's table (\"I know exactly what they are. That's why I'm here.\"), and it's not a fight, it's punctuation. Ajax walks out the back with the first pages of the ledger, and turns at the door to look straight at Miriam. He files her face. \"Tell your patron the house is closed.\" Miriam wears a ring on a cord under her collar. Alice clocks it and says nothing.<\/li>\n<\/ol>"},{"oref":"Scene 3","id":3,"seq":3,"title":"Harding Works, the gauntlet shop","added":false,"act":"Act One","kind":"scene","sum":"NATHANIEL straps on his leap-gauntlet prototype and fires the booster. Kshhhh-THOOM. He crosses the foundry in one jump and lands in a coal bin. BYRON, the butler, picks soot from his hair: \"Very graceful, sir. The coal agrees.\" He has been the only audience for these for years. Nathaniel plans to show his father tonight.","loc":"Harding Works","when":"NATHANIEL straps on his leap-gauntlet prototype and fires the booster.","th":"harding","also":[],"ch":["nathaniel","byron"],"turn":"","w":197,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>NATHANIEL straps on his leap-gauntlet prototype and fires the booster. <em>Kshhhh-THOOM.<\/em> He crosses the foundry in one jump and lands in a coal bin. BYRON, the butler, picks soot from his hair: \"Very graceful, sir. The coal agrees.\" He has been the only audience for these for years. Nathaniel plans to show his father tonight.<\/p>"},{"oref":"Scene 4","id":4,"seq":4,"title":"Harding House, the study","added":false,"act":"Act One","kind":"scene","sum":"ELDGARD and JAMIE. Eldgard: after tonight Jamie begins \"his preparation.\" Jamie: \"I know what the Tithe is.\" Eldgard pours two drinks. Jamie leaves his untouched, and on his way out sets his pocket watch on his father's desk, wound, as if he won't need to know the time where he's going. Eldgard doesn't notice it until much later. But neither man says the word that matters.","loc":"Harding House","when":"ELDGARD and JAMIE.","th":"harding","also":[],"ch":["eldgard","jamie"],"turn":"","w":166,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>ELDGARD and JAMIE. Eldgard: after tonight Jamie begins \"his preparation.\" Jamie: \"I know what the Tithe is.\" Eldgard pours two drinks. Jamie leaves his untouched, and on his way out sets his pocket watch on his father's desk, wound, as if he won't need to know the time where he's going. Eldgard doesn't notice it until much later. <em>But<\/em> neither man says the word that matters.<\/p>"},{"oref":"Scene 5","id":5,"seq":5,"title":"Lantern Guard tower, Charing Cross","added":false,"act":"Act One","kind":"scene","sum":"NIXON HARGRAVE, 23, is made Lantern-Captain, the youngest in the corps, and swears the oath with his hand on the glass: \"Light the dark. Keep the flame.\" Eldgard, his patron since the charity school, pins the green-glass lantern to his collar: \"My family looks after its own.\" COLE PRUETT, 17, a Wick, tries to salute and smacks himself in the eye.","loc":"Lantern Guard tower","when":"NIXON HARGRAVE, 23, is made Lantern-Captain, the youngest in the corps, and swears the oath with his hand on the glass: \"Light the dark.","th":"guard","also":["harding"],"ch":["nixon","cole","eldgard"],"turn":"","w":197,"ed":"","fl":[],"html":"<p>NIXON HARGRAVE, 23, is made Lantern-Captain, the youngest in the corps, and swears the oath with his hand on the glass: \"Light the dark. Keep the flame.\" Eldgard, his patron since the charity school, pins the green-glass lantern to his collar: \"My family looks after its own.\" COLE PRUETT, 17, a Wick, tries to salute and smacks himself in the eye.<\/p>"},{"oref":"Scene 6","id":6,"seq":6,"title":"Vykra laundry, Shadwell","added":false,"act":"Act One","kind":"scene","sum":"Steam, lye, women folding knives into sheets. MOTHER GRISE counts a purse onto the table for the job, heavier than it should be (\"A man walked out with the first pages. Lambrick's man.\"), then gives Alice her first contract in a sealed envelope, from a client Grise won't name: the second Harding son. \"Get close. Report everything.\" Across the steam, KIT MARROW, twenty-one, Grise's best knife and the girl Alice learned the trade beside, watches the envelope change hands: long and rangy, a shaved nape under a copper plait, a laundress's sleeves rolled over forearms cross-hatched with old practice cuts, a man's waistcoat, and soft-soled boots that never make a sound on the wet boards. She wanted that envelope. She smiles at Alice anyway, because Vykra smile. Grise closes her contract book. Alice has wanted this for three years. Therefore she has to get into the ball tonight.","loc":"Vykra laundry","when":"Steam, lye, women folding knives into sheets.","th":"vykra","also":["harding"],"ch":["grise","alice","kit"],"turn":"","w":205,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Steam, lye, women folding knives into sheets. MOTHER GRISE counts a purse onto the table for the job, heavier than it should be (\"A man walked out with the first pages. Lambrick's man.\"), then gives Alice her first contract in a sealed envelope, from a client Grise won't name: the second Harding son. \"Get close. Report everything.\" Across the steam, KIT MARROW, twenty-one, Grise's best knife and the girl Alice learned the trade beside, watches the envelope change hands: long and rangy, a shaved nape under a copper plait, a laundress's sleeves rolled over forearms cross-hatched with old practice cuts, a man's waistcoat, and soft-soled boots that never make a sound on the wet boards. She wanted that envelope. She smiles at Alice anyway, because Vykra smile. Grise closes her contract book. Alice has wanted this for three years. <em>Therefore<\/em> she has to get into the ball tonight.<\/p>"},{"oref":"Scene 7","id":263,"seq":7,"title":"A rented room over a laundry, then the Blackwood Bridge stair, dusk","added":true,"act":"Act Two","kind":"scene","sum":"Warm, cheap, theirs. Miriam at a cracked mirror doing her hair; Alice sprawled on the cot with stolen bread. \"You've done your hair three times.\" \"Twice.\" \"Three.\" \"I'm going to follow you one night and ruin everything.\" \"You'd have to leave the house. You hate leaving the house.\" Alice laughs, the only time this episode. \"I don't need you to know. Not yet.\" \"Why not?\" \"Because it isn't real until it's mine.\" Then Alice: \"Do you know what today's date is?\" Miriam stops. \"…Oh.\" \"It's fine.\" \"I'm sorry. Happy birthday, dear sister.\" It's Alice's twentieth, and for one unguarded second we see it: not anger but yearning, for what Miriam has, someone to get ready for. \"Tomorrow.\" At the door Miriam decides not to say something. \"Lock the door.\" On the landing, alone, she puts a hand flat on her stomach. Alice sits with the latch in her hand for a full minute. Then she takes her coat. From the bridge stair she watches her sister climb into a coach and kiss JAMIE HARDING. A Harding! But the ball starts in an hour, and the Vykra don't give second tests. A Harding tram rattles past below the stair with an enamel bill along its flank: HARDING LIGHT. WARM AS A MOTHER'S ARMS. Past the rooftops the east wall glows green against the dusk, the way it always has. Nobody looks at it.","loc":"Gin Lane","when":"Warm, cheap, theirs.","th":"sisters","also":["harding"],"ch":["alice","miriam","jamie"],"turn":"","w":464,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Warm, cheap, theirs. Miriam at a cracked mirror doing her hair; Alice sprawled on the cot with stolen bread. \"You've done your hair three times.\" \"Twice.\" \"Three.\" \"I'm going to follow you one night and ruin everything.\" \"You'd have to leave the house. You hate leaving the house.\" Alice laughs, the only time this episode. \"I don't need you to know. Not yet.\" \"Why not?\" \"Because it isn't real until it's mine.\" Then Alice: \"Do you know what today's date is?\" Miriam stops. \"…Oh.\" \"It's fine.\" \"I'm sorry. Happy birthday, dear sister.\" It's Alice's twentieth, and for one unguarded second we see it: not anger but yearning, for what Miriam has, someone to get ready for. \"Tomorrow.\" At the door Miriam decides not to say something. \"Lock the door.\" On the landing, alone, she puts a hand flat on her stomach. Alice sits with the latch in her hand for a full minute. Then she takes her coat. From the bridge stair she watches her sister climb into a coach and kiss JAMIE HARDING. A Harding! <em>But<\/em> the ball starts in an hour, and the Vykra don't give second tests. A Harding tram rattles past below the stair with an enamel bill along its flank: HARDING LIGHT. WARM AS A MOTHER'S ARMS. Past the rooftops the east wall glows green against the dusk, the way it always has. Nobody looks at it.<\/p>"},{"oref":"Scene 8","id":8,"seq":8,"title":"Harding House, the ballroom","added":false,"act":"Act Two","kind":"scene","sum":"Arrivals under a thousand green chandeliers. LORD LAMBRICK, the coal baron, with his daughter TAMARA, who carries a cipher wheel inside her fan. Tamara and Nathaniel, engaged by their fathers, agree to be very polite to each other for forty years. Nixon, on duty at the door, watches Tamara and looks away when she looks back. On the drawing-room mantel, under a glass dome, sits the family's famous curio: a little green turtle of living frost, admired by every guest who passes. It has been there for sixteen years, and once or twice tonight it seems to turn its head. Among the guests is EDMUND LAMBRICK, Lambrick's bastard son, twenty: dark curls oiled flat, a dinner coat cut better than his father's, a signet with a silver L, a laugh that makes dinner guests laugh with him, and eyes that don't join in. He cleans his nails with a penknife while he talks. In the garden, by the gate where Jamie said to wait, he sees a girl in red mittens whose face Ajax described to him that afternoon. He brings her a glass of punch, very kind, and stays until she has drunk it.","loc":"Harding House","when":"Arrivals under a thousand green chandeliers.","th":"harding","also":["lambrick"],"ch":["nathaniel","lambrick","tamara","nixon","eldgard","edmund"],"turn":"","w":226,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Arrivals under a thousand green chandeliers. LORD LAMBRICK, the coal baron, with his daughter TAMARA, who carries a cipher wheel inside her fan. Tamara and Nathaniel, engaged by their fathers, agree to be very polite to each other for forty years. Nixon, on duty at the door, watches Tamara and looks away when she looks back. On the drawing-room mantel, under a glass dome, sits the family's famous curio: a little green turtle of living frost, admired by every guest who passes. It has been there for sixteen years, and once or twice tonight it seems to turn its head. Among the guests is EDMUND LAMBRICK, Lambrick's bastard son, twenty: dark curls oiled flat, a dinner coat cut better than his father's, a signet with a silver <em>L<\/em>, a laugh that makes dinner guests laugh with him, and eyes that don't join in. He cleans his nails with a penknife while he talks. In the garden, by the gate where Jamie said to wait, he sees a girl in red mittens whose face Ajax described to him that afternoon. He brings her a glass of punch, very kind, and stays until she has drunk it.<\/p>"},{"oref":"Scene 9","id":9,"seq":9,"title":"The ballroom, service corridor","added":false,"act":"Act Two","kind":"scene","sum":"Alice, in a lamp-girl's apron, lights wicks. Nathaniel's gauntlet shorts out and sprays sparks into a chandelier. Alice fixes it with a hairpin in four seconds, and under her breath, so low only he could hear it, she counts them: \"One post, two post, three, four.\" He stares: \"Who taught you that?\" \"Nobody teaches lamp-girls anything, sir.\" A spark between them, and a lie under it. He doesn't ask about the counting. He keeps it.","loc":"The ballroom","when":"Alice, in a lamp-girl's apron, lights wicks.","th":"harding","also":["vykra"],"ch":["alice","nathaniel"],"turn":"","w":309,"ed":"","fl":[],"html":"<p>Alice, in a lamp-girl's apron, lights wicks. Nathaniel's gauntlet shorts out and sprays sparks into a chandelier. Alice fixes it with a hairpin in four seconds, and under her breath, so low only he could hear it, she counts them: \"One post, two post, three, four.\" He stares: \"Who taught you that?\" \"Nobody teaches lamp-girls anything, sir.\" A spark between them, and a lie under it. He doesn't ask about the counting. He keeps it.<\/p>"},{"oref":"Scene 10","id":10,"seq":10,"title":"The ballroom, and the gallery above it","added":false,"act":"Act Two","kind":"scene","sum":"The engagement is announced. From the gallery, JOSEPHINE HARDING watches the room, and mostly the lamp-girl. To Byron: \"That girl holds her wrist like a knife-girl.\" Byron: \"You'd know, madam.\" One look between them says they share thirty years of history and agreed never to mention it. Below them, Nathaniel steps forward to show his father the gauntlet. Eldgard, smiling for the room: \"Not tonight. Toys after supper.\" Laughter. Nathaniel's face. On his way out of the light he passes Nixon at the door, who saw all of it. Nathaniel, with a smile that costs him: \"He pinned your lantern himself today. You're the son he actually wanted, Nix.\" Nixon laughs it off. It's the last time either of them will find that funny. Across the room, Jamie slips out early, and only Nathaniel sees him go.","loc":"The ballroom","when":"The engagement is announced.","th":"harding","also":["vykra"],"ch":["nathaniel","eldgard","jamie","josephine","byron"],"turn":"","w":377,"ed":"","fl":[],"html":"<p>The engagement is announced. From the gallery, JOSEPHINE HARDING watches the room, and mostly the lamp-girl. To Byron: \"That girl holds her wrist like a knife-girl.\" Byron: \"You'd know, madam.\" One look between them says they share thirty years of history and agreed never to mention it. Below them, Nathaniel steps forward to show his father the gauntlet. Eldgard, smiling for the room: \"Not tonight. Toys after supper.\" Laughter. Nathaniel's face. On his way out of the light he passes Nixon at the door, who saw all of it. Nathaniel, with a smile that costs him: \"He pinned your lantern himself today. You're the son he actually wanted, Nix.\" Nixon laughs it off. It's the last time either of them will find that funny. Across the room, Jamie slips out early, and only Nathaniel sees him go.<\/p>"},{"oref":"Scene 11","id":12,"seq":11,"title":"The Works core, deep below","added":false,"act":"Act Two","kind":"scene","sum":"Jamie descends with a key cut from Byron's old Guard key and the glass case from his mother's mantel under his arm. Inside it, the little green thing presses its hands flat to the glass. We glimpse the chained thing above only as moving green light, and hear a woman weeping. The case is locked with the same iron as the chain: to open one he has to open the other. Jamie cuts at the lock with a crystal blade until it sticks fast in the iron, then presses his bleeding palm to it. The chain shudders, and the case's hasp cracks.","loc":"The Works core","when":"Jamie descends with a key cut from Byron's old Guard key.","th":"white","also":["harding"],"ch":["jamie"],"turn":"","w":205,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Jamie descends with a key cut from Byron's old Guard key and the glass case from his mother's mantel under his arm. Inside it, the little green thing presses its hands flat to the glass. We glimpse the chained thing above only as moving green light, and hear a woman weeping. The case is locked with the same iron as the chain: to open one he has to open the other. Jamie cuts at the lock with a crystal blade until it sticks fast in the iron, then presses his bleeding palm to it. The chain shudders, and the case's hasp cracks.<\/p>"},{"oref":"Scene 12","id":13,"seq":12,"title":"The ballroom","added":false,"act":"Act Three","kind":"scene","sum":"Every chandelier gutters. Then London goes dark: street by street, the green dies across the city in a wave. Only the heat walls stay lit on the horizon, on their own mains: the one thing in London nobody is allowed to switch off. In the black ballroom Nathaniel hears a woman crying inside the walls. Nobody else does. Eldgard is already gone. Through the dark a late guest comes in from the garden: Edmund, collar askew, one button missing, hands damp and recently washed. He drinks a glass of champagne in one pull. Tamara, beside him in the black: \"You look terrible.\" \"I'm fine. Just the cold.\" Nobody notices.","loc":"The ballroom","when":"Every chandelier gutters.","th":"city","also":["white"],"ch":["nathaniel","eldgard","edmund"],"turn":"","w":179,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Every chandelier gutters. Then London goes dark: street by street, the green dies across the city in a wave. Only the heat walls stay lit on the horizon, on their own mains: the one thing in London nobody is allowed to switch off. In the black ballroom Nathaniel hears a woman crying inside the walls. Nobody else does. Eldgard is already gone. Through the dark a late guest comes in from the garden: Edmund, collar askew, one button missing, hands damp and recently washed. He drinks a glass of champagne in one pull. Tamara, beside him in the black: \"You look terrible.\" \"I'm fine. Just the cold.\" Nobody notices.<\/p>"},{"oref":"Scene 13","id":221,"seq":13,"title":"The ballroom, in the dark","added":true,"act":"Act Three","kind":"scene","sum":"Two hundred guests shouting for lamps. One match flares, fssst: the lamp-girl, cupping it, the only light in the room. Nathaniel finds her by it. \"Do you hear that?\" The crying in the walls. She listens, honestly, and hears nothing but rich people frightened of the dark. \"Hear what, sir?\" \"Someone crying.\" \"In this house? Half the room is, sir. They've lost their light.\" He nearly laughs, and that surprises him more than the dark. \"Who are you?\" \"The girl who lights your wicks.\" \"That isn't a name.\" \"It's the only one your house pays for.\" \"Then tell me one for free.\" She looks at him over the flame as if she's pricing him. The match burns down to her fingers and she doesn't flinch; he notices that too. \"Ask me again when the lights come back on.\" She blows it out. Fff. In the black, her voice is suddenly close to his ear: \"Congratulations on your engagement, sir.\" Her hand is in his coat, and then it isn't. When the next match flares across the room, she's gone, and so is the folded schematic of his leap-gauntlet. He won't miss it until morning.","loc":"The ballroom","when":"Two hundred guests shouting for lamps.","th":"harding","also":["sisters","vykra"],"ch":["nathaniel","alice"],"turn":"","w":556,"ed":"","fl":[],"html":"<p>Two hundred guests shouting for lamps. One match flares, <em>fssst<\/em>: the lamp-girl, cupping it, the only light in the room. Nathaniel finds her by it. \"Do you hear that?\" The crying in the walls. She listens, honestly, and hears nothing but rich people frightened of the dark. \"Hear what, sir?\" \"Someone crying.\" \"In this house? Half the room is, sir. They've lost their light.\" He nearly laughs, and that surprises him more than the dark. \"Who are you?\" \"The girl who lights your wicks.\" \"That isn't a name.\" \"It's the only one your house pays for.\" \"Then tell me one for free.\" She looks at him over the flame as if she's pricing him. The match burns down to her fingers and she doesn't flinch; he notices that too. \"Ask me again when the lights come back on.\" She blows it out. <em>Fff.<\/em> In the black, her voice is suddenly close to his ear: \"Congratulations on your engagement, sir.\" Her hand is in his coat, and then it isn't. When the next match flares across the room, she's gone, and so is the folded schematic of his leap-gauntlet. He won't miss it until morning.<\/p>"},{"oref":"Scene 14","id":14,"seq":14,"title":"The Works, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Alarm: saboteur in the core. Nixon leads his squad down the gantries; Cole is with them. Flash-bursts strobe, fzzt, fzzt, freezing the dark into snapshots: pipes, steam, a masked figure at the lock. \"Step away!\" The figure turns, something glinting in his hand. Nixon fires his lantern rifle. KRAK. The figure drops, and the glass case under his arm shatters on the iron. Something small and cold goes down the blood channels into the dark.","loc":"The Works","when":"Alarm: saboteur in the core.","th":"guard","also":["white"],"ch":["nixon","cole"],"turn":"","w":215,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Alarm: saboteur in the core. Nixon leads his squad down the gantries; Cole is with them. Flash-bursts strobe, <em>fzzt, fzzt<\/em>, freezing the dark into snapshots: pipes, steam, a masked figure at the lock. \"Step away!\" The figure turns, something glinting in his hand. Nixon fires his lantern rifle. <em>KRAK.<\/em> The figure drops, and the glass case under his arm shatters on the iron. Something small and cold goes down the blood channels into the dark.<\/p>"},{"oref":"Scene 15","id":15,"seq":15,"title":"Blackwood Bridge, midnight","added":false,"act":"Act Three","kind":"scene","sum":"Fog thick enough to chew. Miriam stands at the railing in her red wool mittens, dressed for an evening she never got to, poisoned hours ago and barely able to stand. She's waiting for a man who isn't coming, and only now understanding it. She came out tonight to tell one person good news. She takes a letter from her pocket and reads it one last time. \"I'm sorry, Ali.\" Under the arch, where the buried Tyburn spills into the Thames, the water is glowing green, and something in it is coming apart. We don't see what she sees. She climbs the railing. She doesn't hesitate.","loc":"Blackwood Bridge","when":"Miriam waits in her red wool mittens.","th":"white","also":["sisters" iel notices that Byron's own hands are shaking. Then Josephine takes his face in her gloved hands, the only time this season she touches him without a reason: \"You're what's left. You will stay out of that place.\" It isn't a request. The kid leather is cold.<\/p>"},{"oref":"Scene 4","id":25,"seq":4,"title":"Lantern Guard tower","added":false,"act":"Act One","kind":"scene","sum":"Nixon files his first report as captain: a saboteur fled. Cole, cheerful: \"I saw you hit him, sir. Flash went right through him.\" Nixon: \"You saw a flash, Wick. Flashes lie.\" Cole decides to believe him. But that night he writes all of it in his diary anyway: the flash, the shoulder, and the man on the floor still talking when the Captain was sent away.","loc":"Lantern Guard tower","when":"Nixon files his first report as captain: a saboteur fled.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":285,"ed":"","fl":[],"html":"<p>Nixon files his first report as captain: a saboteur fled. Cole, cheerful: \"I saw you hit him, sir. Flash went right through him.\" Nixon: \"You saw a flash, Wick. Flashes lie.\" Cole decides to believe him. <em>But<\/em> that night he writes all of it in his diary anyway: the flash, the shoulder, and the man on the floor still talking when the Captain was sent away.<\/p>"},{"oref":"Scene 5","id":26,"seq":5,"title":"Gin Lane tenement","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. The Lost One meets bread, a kettle (terror), and a cat (delight). She calls Alice \"Ali\" exactly the way Miriam did. Then she picks up the cat and it freezes stiff in her arms. Her face: she doesn't understand death. Alice does, and decides it's the cold still in her from the bridge, the way Wren said. Therefore rules: gloves, no touching, until it passes. Miriam's red mittens go on her hands. Alice: \"You'll be yourself again soon, Mim.\" The Lost One looks at her a long moment, a creature deciding whether to tell the truth to the only warm thing in the world. \"Yes, Ali.\" The first lie, and the first kindness. That night a neighbour's door slams on the landing. Alice flinches, as she always has. The girl on the cot doesn't move. All their lives, the real Miriam stepped between Alice and any sudden sound: every sound but the one that mattered. Alice notices the gap before she understands it.","loc":"Gin Lane tenement","when":"Whimsy.","th":"sisters","also":["white"],"ch":["lostone","alice"],"turn":"","w":376,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Whimsy. The Lost One meets bread, a kettle (terror), and a cat (delight). She calls Alice \"Ali\" exactly the way Miriam did. Then she picks up the cat and it freezes stiff in her arms. Her face: she doesn't understand death. Alice does, and decides it's the cold still in her from the bridge, the way Wren said. <em>Therefore<\/em> rules: gloves, no touching, until it passes. Miriam's red mittens go on her hands. Alice: \"You'll be yourself again soon, Mim.\" The Lost One looks at her a long moment, a creature deciding whether to tell the truth to the only warm thing in the world. \"Yes, Ali.\" The first lie, and the first kindness. That night a neighbour's door slams on the landing. Alice flinches, as she always has. The girl on the cot doesn't move. All their lives, the real Miriam stepped between Alice and any sudden sound: every sound but the one that mattered. Alice notices the gap before she understands it.<\/p>"},{"oref":"Scene 6","id":28,"seq":6,"title":"Lambrick coach","added":false,"act":"Act Two","kind":"scene","sum":"Lambrick to Tamara: \"The heir is dead. Your fiancé is the heir now. Marry him fast.\" Tamara: \"Let me run the books instead.\" \"You're a wedding, not a ledger.\" On the ride, while he talks, she slides his account book out of his greatcoat, reads it in her lap under her muff, and has it back in his pocket before the coach stops. One line: 2 Nov, Works gate, 200 gns, A.F.","loc":"Lambrick coach","when":" dle goes, down the back stair toward the Works. She doesn't take her hand away fast enough, and neither of them mentions it. Crouched among Jamie's shoes, they find what they came for: a letter hidden in the boot-tree, an escape plan for two, and a diagram of the chain, and beside it a second stair of thirteen steps going down from a hatch marked coal. At the window, going, there's a beat where neither of them knows what to say. Then she gives him one true thing: \"Bounds.\" He asks for the rest of it. \"Girls on Gin Lane don't give the rest of it to a Harding.\" So she's Bounds to him, and it's the only name he uses for her all season, first as a joke and then as something he's afraid to change. Below the window, Byron, passing with a candle, watches her drop into the garden, says nothing and smiles.","loc":"Harding House","when":"Alice breaks in Vykra-quiet and finds Nathaniel already there, searching.","th":"investigation","also":["sisters","harding"],"ch":["alice","nathaniel","eldgard","byron"],"turn":"","w":923,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Alice breaks in Vykra-quiet and finds Nathaniel already there, searching. A standoff in the dark ends with the truth, almost: \"My sister loved your brother. She nearly died the same night he did.\" Nathaniel didn't know Jamie loved anyone. Then the door handle turns. There's one place to go: Jamie's wardrobe, among his coats, chest to chest in the dark, his heart going against her shoulder. Through the slats, ELDGARD comes in alone with a candle, sits on his dead son's bed, and winds Jamie's pocket watch. <em>Tk-tk-tk-tk.<\/em> He doesn't say a word, which is worse than anything he could say. Nathaniel's breath catches; he is about to step out and go to his father. Alice puts her hand over his mouth. The candle goes, down the back stair toward the Works. She doesn't take her hand away fast enough, and neither of them mentions it. Crouched among Jamie's shoes, they find what they came for: a letter hidden in the boot-tree, an escape plan for two, and a diagram of the chain, and beside it a second stair of thirteen steps going down from a hatch marked coal. At the window, going, there's a beat where neither of them knows what to say. Then she gives him one true thing: \"Bounds.\" He asks for the rest of it. \"Girls on Gin Lane don't give the rest of it to a Harding.\" So she's Bounds to him, and it's the only name he uses for her all season, first as a joke and then as something he's afraid to change. Below the window, Byron, passing with a candle, watches her drop into the garden, says nothing and smiles.<\/p>"},{"oref":"Scene 14","id":36,"seq":14,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard alone with the chained light, which we still only see as green glow and a voice. \"He was mine.\" The chain has frayed links. He counts: \"Forty-seven.\"","loc":"The core","when":"Eldgard alone with the chained light, which we still only see as green glow and a voice.","th":"white","also":["harding"],"ch":["eldgard"],"turn":"","w":163,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Eldgard alone with the chained light, which we still only see as green glow and a voice. \"He was mine.\" The chain has frayed links. He counts: \"Forty-seven.\"<\/p>"},{"oref":"Scene 15","id":27,"seq":15,"title":"Scotland Yard, then Gin Lane","added":false,"act":"Act Three","kind":"scene","sum":"Felix has two frozen attendants, a missing corpse, papers that have already named the Frost Killer, and a Crown order on his desk telling him to drop the case, with Eldgard's influence all over it. He keeps the file and goes walking. On Gin Lane a witness saw a girl with frost hands on the Blackwood stair: \"Bounds girl. Lives on Gin Lane with her sister.\" Felix knocks. Alice is out. The Lost One opens the door, frightened, and frost blooms. Krrrk. Felix's hand freezes to the doorframe, and she bolts.","loc":"Scotland Yard","when":"Felix has two frozen attendants, a missing corpse, papers that have already named the Frost Killer, and a Crown order on his desk telling him to drop the case, with Eldgard's influence all over it.","th":"investigation","also":["city","sisters","white"],"ch":["felix","lostone"],"turn":"","w":435,"ed":"","fl":[],"html":"<p>Felix has two frozen attendants, a missing corpse, papers that have already named the Frost Killer, and a Crown order on his desk telling him to drop the case, with Eldgard's influence all over it. He keeps the file and goes walking. On Gin Lane a witness saw a girl with frost hands on the Blackwood stair: \"Bounds girl. Lives on Gin Lane with her sister.\" Felix knocks. Alice is out. The Lost One opens the door, frightened, and frost blooms. <em>Krrrk.<\/em> Felix's hand freezes to the doorframe, and she bolts.<\/p>"},{"oref":"Scene 16","id":40,"seq":16,"title":"Tenement","added":false,"act":"Act Three","kind":"scene","sum":"Alice comes home to a frozen door and Felix, his hand bandaged. \"Your sister was dead. The surgeon said she was with child. Then she got up. Explain that to me.\" Alice: \"Your surgeon was wrong. The cold fools them. They pull men out of the Thames in January who sit up on the slab.\" She believes every word, which is why Felix can't tell if she's lying. He doesn't arrest her. He files the word child away, and so does she. That night she takes her sister down to the street surgeon's cellar under Gin Lane, all dripping pipes and tables built for amputations. He checks pulse and eyes, then stops and looks at Alice over the girl's head. \"When did she lose it?\" \"Lose what?\" He wipes his hands and doesn't answer at once, which is the worst thing he does all season. \"She was carrying. Two months, perhaps three. I can't find a heartbeat. Whatever she took before the water, and the water, either would have done it.\" \"You're wrong.\" \"I'm sorry. I'm not wrong.\" Alice kneels and takes her sister's face in both hands. \"Who.\" The girl searches Miriam's memory and finds only this: \"A nobleman. From the party. At the Hardings'.\" Alice, barely audible: \"You said it wasn't real yet.\" On the way home Wren, who had her ear to that chest for an hour, says the kind thing: \"If there was a child, love, the cold took it. Let it go.\" Alice doesn't. She lets go of the child and keeps the nobleman.","loc":"Tenement","when":"Alice comes home to a frozen door and Felix, his hand bandaged.","th":"investigation","also":["sisters"],"ch":["alice","felix"],"turn":"","w":311,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Alice comes home to a frozen door and Felix, his hand bandaged. \"Your sister was dead. The surgeon said she was with child. Then she got up. Explain that to me.\" Alice: \"Your surgeon was wrong. The cold fools them. They pull men out of the Thames in January who sit up on the slab.\" She believes every word, which is why Felix can't tell if she's lying. He doesn't arrest her. He files the word <em>child<\/em> away, and so does she. That night she takes her sister down to the street surgeon's cellar under Gin Lane, all dripping pipes and tables built for amputations. He checks pulse and eyes, then stops and looks at Alice over the girl's head. \"When did she lose it?\" \"Lose what?\" He wipes his hands and doesn't answer at once, which is the worst thing he does all season. \"She was carrying. Two months, perhaps three. I can't find a heartbeat. Whatever she took before the water, and the water, either would have done it.\" \"You're wrong.\" \"I'm sorry. I'm not wrong.\" Alice kneels and takes her sister's face in both hands. \"Who.\" The girl searches Miriam's memory and finds only this: \"A nobleman. From the party. At the Hardings'.\" Alice, barely audible: \"You said it wasn't real yet.\" On the way home Wren, who had her ear to that chest for an hour, says the kind thing: \"If there was a child, love, the cold took it. Let it go.\" Alice doesn't. She lets go of the child and keeps the nobleman.<\/p>"},{"oref":"Scene 17","id":41,"seq":17,"title":"Tyburn Road","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One, drawn by the Weeping, walks to the Harding Works and lays a mittened palm on the gate. Every lamp on the street bends its flame toward her. Nixon, on night watch, sees it.","loc":"Tyburn Road","when":"The Lost One, drawn by the Weeping, walks to the Harding Works and lays a mittened palm on the gate.","th":"white","also":["guard"],"ch":["lostone","nixon"],"turn":"","w":174,"ed":"","fl":[],"html":"<p>The Lost One, drawn by the Weeping, walks to the Harding Works and lays a mittened palm on the gate. Every lamp on the street bends its flame toward her. Nixon, on night watch, sees it.<\/p>"},{"oref":"Scene 18","id":42,"seq":18,"title":"The core","added":false,"act":"Tag","kind":"scene","sum":"The chain jerks. For the first time in four hundred years the prisoner lifts her head, and we see her face: blue ice, green fire in the eyes. MORGANA: \"My daughter is here.\" Eldgard drops his lamp.","loc":"The core","when":"The chain jerks.","th":"white","also":["harding"],"ch":["morgana","eldgard"],"turn":"","w":176,"ed":"","fl":[],"html":"<p>The chain jerks. For the first time in four hundred years the prisoner lifts her head, and we see her face: blue ice, green fire in the eyes. MORGANA: \"My daughter is here.\" Eldgard drops his lamp.<\/p>"}]},{"n":3,"title":"Lanterns","time":"42 DAYS TO FIRST SNOW","clock":"42 DAYS TO FIRST SNOW","act":"I","log":"Eldgard sets his captain on the Frost Killer, and Nathaniel, finally given a real job, arms the hunt without knowing its target is the girl Alice is hiding. When Nixon gets the creature at the end of his rifle, he has to choose between his patron's order and a frozen boy.","sum":"\"You smell like the man who keeps my mother.\"","turn":"Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One","focus":"Nixon's hunt","piece":"a leaper chase across the Christmas crystal market","threads":["guard","sisters","harding","lambrick","vykra","investigation","white"],"frame":"<blockquote><p><strong>Focus:<\/strong> Nixon's hunt<\/p><p><strong>Set piece:<\/strong> a leaper chase across the Christmas crystal market<\/p><p><strong>Sting:<\/strong> the creature touches Nathaniel and he doesn't freeze, and she knows what he is<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":47,"seq":1,"title":"Lambrick House, night","added":false,"act":"Cold open","kind":"scene","sum":"Tamara opens her father's cipher safe in ninety seconds, holding a candle in her teeth. She copies the whole ledger page, not just the line: six months of payments to A.F., ending on the night Jamie died. Folded behind it is a map in her father's cipher: the old coal mains under the walls, with every valve he has kept greased for twenty years marked live. On the stairs, AJAX FINK is eating an apple in the dark. \"Evening, miss.\" He lets her pass.","loc":"Lambrick House","when":"Tamara opens her father's cipher safe in ninety seconds, holding a candle in her teeth.","th":"lambrick","also":[],"ch":["tamara","ajax"],"turn":"","w":226,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Tamara opens her father's cipher safe in ninety seconds, holding a candle in her teeth. She copies the whole ledger page, not just the line: six months of payments to A.F., ending on the night Jamie died. Folded behind it is a map in her father's cipher: the old coal mains under the walls, with every valve he has kept greased for twenty years marked live. On the stairs, AJAX FINK is eating an apple in the dark. \"Evening, miss.\" He lets her pass.<\/p>"},{"oref":"Scene 2","id":44,"seq":2,"title":"Harding Works, the shop","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel's bench sits under the gauges that read the feed to the walls, and the east-sector needle has crept back a hair every week since the engagement. Gallowglass isn't supposed to run down. He's about to say so when his father comes in. Eldgard gives Nathaniel his first real job: re-equip the Guard with leap-rigs and flash-gauntlets, and refit its lantern rifles, for the Frost Killer hunt. Nathaniel glows. Nixon is at the door for his own orders, and in the corridor, where his son can't hear, Eldgard gives them quietly: find the frost girl and bring her to the Works alive. Tell no one, not the Yard and not my son. Nixon: \"Yes, sir.\" Then, because it's the only thing he has to give: \"I've seen her, sir. At our own gate, five nights ago. She put her hand on it and every lamp on Tyburn Road leaned toward her.\" Eldgard goes very quiet. \"Then she'll come back to it.\" He owes, and now he's owned. Therefore the real son is arming the hunt, the spare is leading it, and neither of them knows the girl Alice is hiding is its target.","loc":"Harding Works","when":"Eldgard gives Nathaniel his first real job: re-equip the Guard with leap-rigs and flash-gauntlets, and refit its lantern rifles, for the Frost Killer hunt.","th":"guard","also":["white","harding"],"ch":["eldgard","nixon","nathaniel"],"turn":"","w":525,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Nathaniel's bench sits under the gauges that read the feed to the walls, and the east-sector needle has crept back a hair every week since the engagement. Gallowglass isn't supposed to run down. He's about to say so when his father comes in. Eldgard gives Nathaniel his first real job: re-equip the Guard with leap-rigs and flash-gauntlets, and refit its lantern rifles, for the Frost Killer hunt. Nathaniel glows. Nixon is at the door for his own orders, and in the corridor, where his son can't hear, Eldgard gives them quietly: find the frost girl and bring her to the Works alive. Tell no one, not the Yard and not my son. Nixon: \"Yes, sir.\" Then, because it's the only thing he has to give: \"I've seen her, sir. At our own gate, five nights ago. She put her hand on it and every lamp on Tyburn Road leaned toward her.\" Eldgard goes very quiet. \"Then she'll come back to it.\" He owes, and now he's owned. <em>Therefore<\/em> the real son is arming the hunt, the spare is leading it, and neither of them knows the girl Alice is hiding is its target.<\/p>"},{"oref":"Scene 3","id":45,"seq":3,"title":"Gin Lane, a pigeon loft","added":false,"act":"Act One","kind":"scene","sum":"Alice finds the Lost One on a rooftop having a serious conversation with pigeons. They write house rules in chalk: mittens on, no touching, cocoa allowed. Then the Lost One holds out an orange, peeled badly, in one long ruined spiral. \"It was your birthday. On the bridge day. I forgot.\" A piece of Miriam's regret, surfacing in a creature who doesn't know why her hands wanted to do this. Alice stares at it. \"You've never once remembered.\" \"I know.\" Alice eats the whole thing, pith and all. The Lost One: \"The light is crying. Can't you hear it?\" Alice can't. That afternoon: four minutes' warning of a Vykra welfare check. Alice: \"She'll ask what happened. You fell. You remember the water. You don't remember anything else.\" The agent is KIT, kind, which is worse. The girl describes the cold of the water like a scientist and calls Alice the sister. The room goes quiet. Then she reaches for something she doesn't understand and finds it: flat, bored, exactly Miriam, \"Ask me again in a fortnight and I'll be insufferable about it.\" Kit laughs. \"There she is. You had us worried, Bounds.\" When the footsteps have gone down two flights, Alice sits on the floor, which she never does. \"Was that right?\" \"That was perfect.\" The first time she is truly Miriam, she's impersonating her.","loc":"Gin Lane","when":"Alice finds the Lost One on a rooftop having a serious conversation with pigeons.","th":"sisters","also":["white"],"ch":["alice","lostone","kit"],"turn":"","w":343,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Alice finds the Lost One on a rooftop having a serious conversation with pigeons. They write house rules in chalk: mittens on, no touching, cocoa allowed. Then the Lost One holds out an orange, peeled badly, in one long ruined spiral. \"It was your birthday. On the bridge day. I forgot.\" A piece of Miriam's regret, surfacing in a creature who doesn't know why her hands wanted to do this. Alice stares at it. \"You've never once remembered.\" \"I know.\" Alice eats the whole thing, pith and all. The Lost One: \"The light is crying. Can't you hear it?\" Alice can't. That afternoon: four minutes' warning of a Vykra welfare check. Alice: \"She'll ask what happened. You fell. You remember the water. You don't remember anything else.\" The agent is KIT, kind, which is worse. The girl describes the cold of the water like a scientist and calls Alice <em>the<\/em> sister. The room goes quiet. Then she reaches for something she doesn't understand and finds it: flat, bored, exactly Miriam, \"Ask me again in a fortnight and I'll be insufferable about it.\" Kit laughs. \"There she is. You had us worried, Bounds.\" When the footsteps have gone down two flights, Alice sits on the floor, which she never does. \"Was that right?\" \"That was perfect.\" The first time she is truly Miriam, she's impersonating her.<\/p>"},{"oref":"Scene 4","id":48,"seq":4,"title":"Guard tower roof","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. Nixon trains Wicks on Nathaniel's new boosters. Cole fires his too early, sails off the roof into the laundry lines across the alley and dangles in someone's bloomers. Nixon laughs for the first time since the core, then remembers, and stops.","loc":"Guard tower roof","when":"Whimsy.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":189,"ed":"","fl":[],"html":"<p>Whimsy. Nixon trains Wicks on Nathaniel's new boosters. Cole fires his too early, sails off the roof into the laundry lines across the alley and dangles in someone's bloomers. hout returning the handkerchief.","loc":"Harding Works","when":"Alice visits Nathaniel \"to return the handkerchief\" and lets him show off the boosters, which he does with puppyish joy: one jump across the foundry, kshhh-THOOM, and into the coal bin again, for an audience of one.","th":"investigation","also":["sisters"],"ch":["alice","nathaniel"],"turn":"","w":405,"ed":"","fl":[],"html":"<p>Alice visits Nathaniel \"to return the handkerchief\" and lets him show off the boosters, which he does with puppyish joy: one jump across the foundry, <em>kshhh-THOOM<\/em>, and into the coal bin again, for an audience of one. Nobody has ever wanted so badly to be watched by her. She reads the sweep roster upside down while he's brushing off soot: Gin Lane, tonight. She feels sick at how easy it was, and sicker at how much she liked watching. She leaves without returning the handkerchief.<\/p>"},{"oref":"Scene 7","id":51,"seq":7,"title":"Scotland Yard","added":false,"act":"Act Two","kind":"scene","sum":"Felix, frostbitten hand in a sling, corners Nixon. The frost girl is Miriam Bounds, who was dead. Nixon thinks he's mad, until Felix adds that the Harding boy didn't die in a fall: \"There was a bullet hole in his coat, Captain. Somebody burned the coat.\" He slides a Newgate visitor's slip across the desk: Jamie Harding, every Sunday for two years, prisoner 1417. \"Someone ought to ask why.\" Both of Nixon's secrets are walking toward each other.","loc":"Scotland Yard","when":"Felix, frostbitten hand in a sling, corners Nixon.","th":"investigation","also":["guard"],"ch":["felix","nixon"],"turn":"","w":283,"ed":"","fl":[],"html":"<p>Felix, frostbitten hand in a sling, corners Nixon. The frost girl is Miriam Bounds, who was dead. Nixon thinks he's mad, until Felix adds that the Harding boy didn't die in a fall: \"There was a bullet hole in his coat, Captain. Somebody burned the coat.\" He slides a Newgate visitor's slip across the desk: Jamie Harding, every Sunday for two years,  him, <em>please<\/em>, and he freezes from the hand up. Nixon lands and fires a flash; she drops, stunned. Cole is turning blue. Nixon can take the girl to Eldgard, or carry Cole to the furnace room before his heart stops. He takes Cole. Alice drags the Lost One away.<\/p>"},{"oref":"Scene 12","id":57,"seq":12,"title":"Harding House, morning","added":false,"act":"Act Three","kind":"scene","sum":"The papers scream FOUR DEAD AT CRYSTAL MARKET. The servants say the Frost Killer was helped by a dark-haired girl with a ghostlight rig. Nathaniel remembers a hairpin and a gauntlet fixed in four seconds. Byron, pouring tea: \"You're your mother's son, sir. You notice.\"","loc":"Harding House","when":"The papers scream FOUR DEAD AT CRYSTAL MARKET.","th":"investigation","also":["city","harding"],"ch":["felix","nathaniel","byron"],"turn":"","w":381,"ed":"","fl":[],"html":"<p>The papers scream FOUR DEAD AT CRYSTAL MARKET. The servants say the Frost Killer was helped by a dark-haired girl with a ghostlight rig. Nathaniel remembers a hairpin and a gauntlet fixed in four seconds. Byron, pouring tea: \"You're your mother's son, sir. You notice.\"<\/p>"},{"oref":"Scene 13","id":59,"seq":13,"title":"Under the Works, an old lamp-tunnel","added":false,"act":"Act Three","kind":"scene","sum":"Alice hides the Lost One where nobody would look: right under the Hardings. Four people are dead in the market. Alice, holding her with gloves on, says the thing you say: \"You didn't mean it.\" It's the wrong sentence. It's what Miriam used to whisper under the bed about him, and it unlocks something in the body. Something runs down the Lost One's face and freezes. Tink. A bead of ice on the stone. Another. She catches one and stares at it. \"What is this?\" Alice, very quietly: \"You're crying, Mim. You always cried. Under the bed, you cried for both of us.\" And the Lost One is suddenly full of a memory she has never lived: a buckle, a small girl's back, her own body not moving. \"Ali. The belt. I should have—\" Alice goes hard as iron. \"We don't talk about him. That's behind the fence.\" The Lost One doesn't know what the fence is. She knows she has just been shut out of something that hurts, and that she wants in, to make it stop hurting. She remembers a woman in chains crying, too, and says nothing about that one. Alice holds her until the ice stops.","loc":"Under the Works","when":"Alice hides the Lost One where nobody would look: right under the Hardings.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":600,"ed":"","fl":[],"html":"<p>Alice hides the Lost One where nobody would look: right under the Hardings. Four people are dead in the market. Alice, holding her with gloves on, says the thing you say: \"You didn't mean it.\" It's the wrong sentence. It's what Miriam used to whisper under the bed about <em>him<\/em>, and it unlocks something in the body. Something runs down the Lost One's face and freezes. <em>Tink.<\/em> A bead of ice on the stone. Another. She catches one and stares at it. \"What is this?\" Alice, very quietly: \"You're crying, Mim. You always cried. Under the bed, you cried for both of us.\" And the Lost One is suddenly full of a memory she has never lived: a buckle, a small girl's back, her own body not moving. \"Ali. The belt. I should have—\" Alice goes hard as iron. \"We don't talk about him. That's behind the fence.\" The Lost One doesn't know what the fence is. She knows she has just been shut out of something that hurts, and that she wants in, to make it stop hurting. She remembers a woman in chains crying, too, and says nothing about that one. Alice holds her until the ice stops.<\/p>"},{"oref":"Scene 14","id":60,"seq":14,"title":"Guy's Hospital","added":false,"act":"Act Three","kind":"scene","sum":"Cole lives but loses two fingers. \"Did I do good, sir?\" \"You did good.\" Eldgard is in the doorway. In the corridor: \"You had her and you let her go.\" He takes Nixon's hand, turns it over, and looks at the scraped knuckle a beat too long. Flash: a charity school in Southwark, ten years ago. Boys in a line. Eldgard pricks each boy's finger and touches the blood to a sliver of gallowglass. Most slivers stay dark. Thirteen-year-old Nixon's glows faintly green. Eldgard smiles and pats his head: \"Still good.\" Back: he lets go of the hand. It played as kindness, and it was something else (paid off in Episodes 8 and 9). Then, softly: \"I know what you did at the core, Captain. So do you.\"","loc":"Guy's Hospital","when":"Cole lives but loses two fingers.","th":"guard","also":["harding"],"ch":["cole","nixon","eldgard"],"turn":"","w":194,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Cole lives but loses two fingers. \"Did I do good, sir?\" \"You did good.\" Eldgard is in the doorway. In the corridor: \"You had her and you let her go.\" He takes Nixon's hand, turns it over, and looks at the scraped knuckle a beat too long. <em>Flash:<\/em> a charity school in Southwark, ten years ago. Boys in a line. Eldgard pricks each boy's finger and touches the blood to a sliver of gallowglass. Most slivers stay dark. Thirteen-year-old Nixon's glows faintly green. Eldgard smiles and pats his head: \"Still good.\" <em>Back:<\/em> he lets go of the hand. It played as kindness, and it was something else (paid off in Episodes 8 and 9). Then, softly: \"I know what you did at the core, Captain. So do you.\"<\/p>"},{"oref":"Scene 15","id":61,"seq":15,"title":"The tunnel mouth","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel is waiting. He found it the way an engineer would: her ghostlight runs on his design and whines at his pitch, and he spent the night walking the lamp-tunnels under his own family's Works with a listening horn until he heard it. It's built from the schematic that left his coat in the dark at his engagement ball. Alice tells him the truth as she believes it: her sister nearly froze to death and came back wrong, and she's h
