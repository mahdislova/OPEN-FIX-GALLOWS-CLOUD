 own name on it, waiting for a second. She learns her price twice in one breath. Footsteps: AJAX, sent up for cigars. She's behind the curtain with the wick pinched out between two fingers, <em>tss<\/em>, and the plan still in her other hand. Ajax takes the cigars, smells hot wax, and stands very still. \"Your father says, if you're up here, you're to come down for the pudding.\" He leaves the door open. She goes down for the pudding, and puts the plan back before breakfast.<\/p>"},{"oref":"Scene 8","id":114,"seq":8,"title":"A Covent Garden tea shop","added":false,"act":"Act Two","kind":"scene","sum":"Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core. Tamara tells her about the charges. The only route in runs through Ajax's tunnels. Tamara: \"Then go another night.\" Alice: \"There isn't one. She's forgetting me.\" Two girls who dislike each other, starting to understand each other. The girl who pours their tea keeps her eyes down and her cap low, and has a knot stitched inside her glove. Alice, the lamp-girl nobody ever looked at, doesn't look at the help either. Tamara does, once, and knows her: Kit, Grise's best knife. She takes it for Grise keeping an eye on her new girl, and says nothing. It isn't Tamara that Grise is watching.","loc":"A Covent Garden tea shop","when":"Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core.","th":"sisters","also":["lambrick"],"ch":["alice","tamara","kit"],"turn":"","w":285,"ed":"Revised Nov 9: Byron's needle, Kit at the tea table, Hester's candle","fl":[],"html":"<p>Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core. Tamara tells her about the charges. The only route in runs through Ajax's tunnels. Tamara: \"Then go another night.\" Alice: \"There isn't one. She's forgetting me.\" Two girls who dislike each other, starting to understand each other. The girl who pours their tea keeps her eyes down and her cap low, and has a knot stitched inside her glove. Alice, the lamp-girl nobody ever looked at, doesn't look at the help either. Tamara does, once, and knows her: Kit, Grise's best knife. She takes it for Grise keeping an eye on her new girl, and says nothing. It isn't Tamara that Grise is watching.<\/p>"},{"oref":"Scene 9","id":115,"seq":9,"title":"The frozen canal at Little Venice","added":false,"act":"Act Two","kind":"scene","sum":"They meet in secret under a bridge, snowless cold, their breath smoking between them. He tells her about the Heartglass: \"We can save both of them.\" She tells him the Lost One is forgetting her. When she pulls off a glove to warm her hands, something falls out of it into the frost: his handkerchief, folded small, kept where a Vykra keeps the thing that says whose she is. He picks it up. \"You kept it.\" \"Bounds keeps things.\" For once in his life he doesn't wait to be reached for. He kisses her, and finds out she has been waiting since the ballroom. Tik. Tik. Ice ticking off the bridge above them. Then both of them use the kiss to hide the dangerous part: she's going in tonight, and he still doesn't know what the Heartglass is for.","loc":"The frozen canal at Little Venice","when":"They meet in secret under a bridge, snowless cold, their breath smoking between them.","th":"investigation","also":["sisters"],"ch":["nathaniel","alice"],"turn":"","w":538,"ed":"","fl":[],"html":"<p>They meet in secret under a bridge, snowless cold, their breath smoking between them. He tells her about the Heartglass: \"We can save both of them.\" She tells him the Lost One is forgetting her. When she pulls off a glove to warm her hands, something falls out of it into the frost: his handkerchief, folded small, kept where a Vykra keeps the thing that says whose she is. He picks it up. \"You kept it.\" \"Bounds keeps things.\" For once in his life he doesn't wait to be reached for. He kisses her, and finds out she has been waiting since the ballroom. <em>Tik. Tik.<\/em> Ice ticking off the bridge above them. Then both of them use the kiss to hide the dangerous part: she's going in tonight, and he still doesn't know what the Heartglass is for.<\/p>"},{"oref":"Scene 10","id":113,"seq":10,"title":"Harding House, the linen room, then the study","added":false,"act":"Act Two","kind":"scene","sum":"Byron confronts Josephine. \"I saw your hands.\" \"I did it for Nathaniel.\" \"You always say that.\" She has a needle in her sleeve. Flash: the core gate, thirty years ago. Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl with a knife sent to kill young Eldgard. It's JOSEPHINE, nineteen, and she's caught because she stopped: behind the gate a woman is weeping, and she listened a breath too long. \"Who sent you?\" \"A coal man's son.\" He lets her go. A year later she marries the man she was sent to kill, and Byron serves at the wedding with a faded blue ribbon in his tunic pocket, from a different night, fifty years gone. Back: she doesn't use the needle. He takes it out of her sleeve himself, the way you'd take scissors off a child, and pockets it. \"Thirty years, Josie. I let you go at the gate, and everything since came through it.\" He leaves. She sits on the linen and doesn't cry. Then a maid brings her a folded note in Grise's hand, bought an hour ago from Kit, the tea-girl in Covent Garden: Tyburn conduit. Vote night. The girl. Josephine takes it straight down to her husband's study. \"How do you know?\" \"I'm your wife.\" Eldgard sends for Nixon. \"You stood at my core door and let her walk out of it. Bring her back alive, or bring me your lantern.\" The Heartglass needs her. The woman who has just spared Byron's life has set the trap he will die in, and neither of them knows it.","loc":"Harding House","when":"Byron confronts Josephine.","th":"harding","also":["vykra"],"ch":["byron","josephine","eldgard","kit"],"turn":"","w":536,"ed":"Revised Nov 9: Byron's needle, Kit at the tea table, Hester's candle","fl":[],"html":"<p>Byron confronts Josephine. \"I saw your hands.\" \"I did it for Nathaniel.\" \"You always say that.\" She has a needle in her sleeve. <em>Flash:<\/em> the core gate, thirty years ago. Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl with a knife sent to kill young Eldgard. It's JOSEPHINE, nineteen, and she's caught because she stopped: behind the gate a woman is weeping, and she listened a breath too long. \"Who sent you?\" \"A coal man's son.\" He lets her go. A year later she marries the man she was sent to kill, and Byron serves at the wedding with a faded blue ribbon in his tunic pocket, from a different night, fifty years gone. <em>Back:<\/em> she doesn't use the needle. He takes it out of her sleeve himself, the way you'd take scissors off a child, and pockets it. \"Thirty years, Josie. I let you go at the gate, and everything since came through it.\" He leaves. She sits on the linen and doesn't cry. Then a maid brings her a folded note in Grise's hand, bought an hour ago from Kit, the tea-girl in Covent Garden: <em>Tyburn conduit. Vote night. The girl.<\/em> Josephine takes it straight down to her husband's study. \"How do you know?\" \"I'm your wife.\" Eldgard sends for Nixon. \"You stood at my core door and let her walk out of it. Bring her back alive, or bring me your lantern.\" The Heartglass needs her. The woman who has just spared Byron's life has set the trap he will die in, and neither of them knows it.<\/p>"},{"oref":"Scene 11","id":118,"seq":11,"title":"Harding Works, then the Harding House hall","added":false,"act":"Act Two","kind":"scene","sum":"A cipher note from Tamara in their childhood code reaches Nathaniel: The conduit. Charges. She's going in. He runs, grabbing the leap-gauntlet as he goes. In the hall, Byron sees him tear out of the yard. He hasn't carried a green lamp since the core. He takes his old Lantern down from its glass case on the wall, still charged after thirty years, and when it lights he hears her again, as clearly as he did on night watch. He follows anyway.","loc":"Harding Works","when":"A cipher note from Tamara in their childhood code reaches Nathaniel: The conduit.","th":"lambrick","also":["harding","guard"],"ch":["nathaniel","byron"],"turn":"","w":289,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>A cipher note from Tamara in their childhood code reaches Nathaniel: <em>The conduit. Charges. She's going in.<\/em> He runs, grabbing the leap-gauntlet as he goes. In the hall, Byron sees him tear out of the yard. He hasn't carried a green lamp since the core. He takes his old Lantern down from its glass case on the wall, still charged after thirty years, and when it lights he hears her again, as clearly as he did on night watch. He follows anyway.<\/p>"},{"oref":"Scene 12","id":120,"seq":12,"title":"The Tyburn conduit, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Alice and the Lost One go down. Ajax's men are lighting fuses in a side drain. Four tunnel children are sleeping in the warm pipe-nook beyond it. Nixon's squad waits in the dark ahead, Cole among them. In the dark, Cole holds up his diary: \"Tell Mr. Harding, sir, or I will.\" Nixon: \"After the vote.\" Cole agrees, because he still believes in him.","loc":"The Tyburn conduit","when":"Alice and the Lost One go down.","th":"lambrick","also":["guard"],"ch":["alice","lostone","nixon","cole"],"turn":"","w":304,"ed":"","fl":[],"html":"<p>Alice and the Lost One go down. Ajax's men are lighting fuses in a side drain. Four tunnel children are sleeping in the warm pipe-nook beyond it. Nixon's squad waits in the dark ahead, Cole among them. In the dark, Cole holds up his diary: \"Tell Mr. Harding, sir, or I will.\" Nixon: \"After the vote.\" Cole agrees, because he still believes in him.<\/p>"},{"oref":"Scene 13","id":121,"seq":13,"title":"The ambush","added":false,"act":"Act Three","kind":"scene","sum":"Flash-bursts. Nixon corners the Lost One, and she grabs his bare wrist. No frost. He doesn't freeze, the way Nathaniel didn't, and in the strobe and the shouting nobody sees it but the camera. She goes white anyway. She can smell Harding on him the way she smelled it on Nathaniel, and under it the cellar beneath her mother; and one of the names in the song she has heard in every lamp since the bridge belongs to the same blood: \"They told you your mother had a fever. She didn't.\" He lets go as if burned. Alice fights Nixon, gauntlet to gauntlet, in a tunnel too narrow to swing in: the two leads' first real clash. Neither of them wants to win. He's better, and she's losing, so she does the one thing Nathaniel told her never to do with the gauntlet he built her: she runs it past the red. It throws Nixon down the tunnel, KRAANG, then dies in her hand, and the backwash scorches her palm through the glove. Now she knows exactly what pushing it costs. Then Nathaniel arrives screaming \"Gas!\" Ajax, seeing the Guard, lights early. The Lost One's cold meets a flash-burst in the main.","loc":"The ambush","when":"Flash-bursts.","th":"guard","also":["white","lambrick"],"ch":["nixon","lostone","alice","nathaniel","ajax"],"turn":"","w":408,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Flash-bursts. Nixon corners the Lost One, and she grabs his bare wrist. No frost. He doesn't freeze, the way Nathaniel didn't, and in the strobe and the shouting nobody sees it but the camera. She goes white anyway. She can smell Harding on him the way she smelled it on Nathaniel, and under it the cellar beneath her mother; and one of the names in the song she has heard in every lamp since the bridge belongs to the same blood: \"They told you your mother had a fever. She didn't.\" He lets go as if burned. Alice fights Nixon, gauntlet to gauntlet, in a tunnel too narrow to swing in: the two leads' first real clash. Neither of them wants to win. He's better, and she's losing, so she does the one thing Nathaniel told her never to do with the gauntlet he built her: she runs it past the red. It throws Nixon down the tunnel, <em>KRAANG<\/em>, then dies in her hand, and the backwash scorches her palm through the glove. Now she knows exactly what pushing it costs. Then Nathaniel arrives screaming \"Gas!\" Ajax, seeing the Guard, lights early. The Lost One's cold meets a flash-burst in the main.<\/p>"},{"oref":"Scene 14","id":123,"seq":14,"title":"Pimlico, then Parliament","added":false,"act":"Act Three","kind":"scene","sum":"The gasworks erupts. WHOOOM. Fire rolls along the river. A mile downriver the Charter vote is three names from done: Eldgard, Lambrick and Vane in their places, Nathaniel's chair empty, and Josephine looking at it when the windows blow in on the voting lords.","loc":"Pimlico","when":"The gasworks erupts.","th":"lambrick","also":["city","harding"],"ch":["eldgard","lambrick","vane","josephine"],"turn":"","w":265,"ed":"","fl":[],"html":"<p>The gasworks erupts. <em>WHOOOM.<\/em> Fire rolls along the river. A mile downriver the Charter vote is three names from done: Eldgard, Lambrick and Vane in their places, Nathaniel's chair empty, and Josephine looking at it when the windows blow in on the voting lords.<\/p>"},{"oref":"Scene 15","id":124,"seq":15,"title":"The rubble","added":false,"act":"Act Three","kind":"scene","sum":"In the smoke, a green flash, then another: Byron's Lantern, finding the boy under the rubble. Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him. Dying, he has breath for one sentence, and starts the wrong one: \"Your mother—\" He stops. He looks at the boy he has watched land in coal bins for twenty years, and spends the breath on the other thing instead: \"You were always enough.\" He dies with his hand on Nathaniel's face. When Nathaniel prises his fists open, one holds the blue ribbon. The other holds a Vykra needle with a knot on the cap and frost still on the point.","loc":"The rubble","when":"In the smoke, a green flash, then another: Byron's Lantern, finding the boy under the rubble.","th":"harding","also":["investigation"],"ch":["byron","nathaniel"],"turn":"","w":218,"ed":"Revised Nov 9: Byron's needle, Kit at the tea table, Hester's candle","fl":[],"html":"<p>In the smoke, a green flash, then another: Byron's Lantern, finding the boy under the rubble. Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him. Dying, he has breath for one sentence, and starts the wrong one: \"Your mother—\" He stops. He looks at the boy he has watched land in coal bins for twenty years, and spends the breath on the other thing instead: \"You were always enough.\" He dies with his hand on Nathaniel's face. When Nathaniel prises his fists open, one holds the blue ribbon. The other holds a Vykra needle with a knot on the cap and frost still on the point.<\/p>"},{"oref":"Scene 16","id":125,"seq":16,"title":"The river stair","added":false,"act":"Act Three","kind":"scene","sum":"Nixon carries Cole out of the fire. Alice comes up with the Lost One, who uses the last of her cold to smother the flames around four trapped children. As the cold goes out of her we get half a second of what it takes with it: two small girls under a bed, one whispering Ali, the memory frosting over and cracking like a pane. Then she looks at Alice politely, like a stranger. \"Thank you, miss.\" She doesn't know her name. Alice tells herself it's the shock again, worse this time. It's the last time she'll manage to.","loc":"The river stair","when":"Nixon carries Cole out of the fire.","th":"sisters","also":["guard"],"ch":["nixon","cole","alice","lostone"],"turn":"","w":244,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Nixon carries Cole out of the fire. Alice comes up with the Lost One, who uses the last of her cold to smother the flames around four trapped children. As the cold goes out of her we get half a second of what it takes with it: two small girls under a bed, one whispering <em>Ali<\/em>, the memory frosting over and cracking like a pane. Then she looks at Alice politely, like a stranger. \"Thank you, miss.\" She doesn't know her name. Alice tells herself it's the shock again, worse this time. It's the last time she'll manage to.<\/p>"},{"oref":"Scene 17","id":126,"seq":17,"title":"Parliament, broken glass","added":false,"act":"Act Three","kind":"scene","sum":"Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board. Lambrick takes a seat on it: the man who relit the west wall. Eldgard has lost the Works.","loc":"Parliament","when":"Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board.","th":"city","also":["lambrick"],"ch":["vane","lambrick","eldgard"],"turn":"","w":158,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board. Lambrick takes a seat on it: the man who relit the west wall. Eldgard has lost the Works.<\/p>"},{"oref":"Scene 18","id":127,"seq":18,"title":"Harding House, the music room","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel walks in covered in ash. Josephine is at the piano. \"Byron's dead.\" She weeps, really. He sets the needle on the music stand in front of her. \"He told me about Inspector Hawke.\" He's bluffing: Byron got out one word. The music stops. A long beat. \"Then you know I love you.\" It's a confession, and she knows she has just made it.","loc":"Harding House","when":"Nathaniel walks in covered in ash.","th":"harding","also":["investigation"],"ch":["nathaniel","josephine"],"turn":"","w":168,"ed":"Revised Nov 9: Byron's needle, Kit at the tea table, Hester's candle","fl":[],"html":"<p>Nathaniel walks in covered in ash. Josephine is at the piano. \"Byron's dead.\" She weeps, really. He sets the needle on the music stand in front of her. \"He told me about Inspector Hawke.\" He's bluffing: Byron got out one word. The music stops. A long beat. \"Then you know I love you.\" It's a confession, and she knows she has just made it.<\/p>"}]},{"n":7,"title":"The Girl Who Isn't","time":"21 DAYS TO FIRST SNOW","clock":"21 DAYS TO FIRST SNOW","act":"II","log":"Alice finds the letter Miriam never left her and learns that the thing she has been protecting is not her sister. Nixon finally tells Nathaniel who fired the shot, and Nathaniel opens his brother's coffin and finds his own name in his father's ledger. Then the chain thins enough for the White to come through, and the only way through the night is together.","sum":"Tamara kisses Nixon and gives him a folder with his name on it. He can't open it","turn":"\"You're not her.\" Then Alice chooses her anyway. Nixon confesses. Nathaniel finds his own name in his father's ledger","focus":"two reveals on one day, the sister and the best friend, and a third that Nathaniel digs up himself","piece":"wolves of the White run through Whitechapel, and Nathaniel and Nixon fight side by side an hour after the friendship breaks","threads":["sisters","harding","lambrick","guard","white","investigation","city","vykra"],"frame":"<blockquote><p><strong>Focus:<\/strong> two reveals on one day, the sister and the best friend, and a third that Nathaniel digs up himself<\/p><p><strong>Set piece:<\/strong> wolves of the White run through Whitechapel, and Nathaniel and Nixon fight side by side an hour after the friendship breaks<\/p><p><strong>Sting:<\/strong> Alice chooses the creature anyway, and Tamara hands Nixon a folder with his name on it that he cannot make himself open<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":215,"seq":1,"title":"Gin Lane, 2 November, morning","added":false,"act":"Cold open","kind":"scene","sum":"Miriam's last day, from Miriam's side. She is radiant, sick in a basin, and hand on her belly. Alice is asleep on the other side of the bed. Miriam starts a letter: Ali, about him, when we were small— She stares at it a long time. She scores it out until the paper tears. She starts again, and this time writes it fast: three short lines we don't get to read. She means to leave it on Alice's pillow, loses her nerve, and sews it into her coat lining. Then she pulls on the red mittens.","loc":"Gin Lane","when":"Miriam's last day, from Miriam's side.","th":"sisters","also":[],"ch":["miriam"],"turn":"","w":319,"ed":"","fl":[],"html":"<p>Miriam's last day, from Miriam's side. She is radiant, sick in a basin, and hand on her belly. Alice is asleep on the other side of the bed. Miriam starts a letter: <em>Ali, about him, when we were small—<\/em> She stares at it a long time. She scores it out until the paper tears. She starts again, and this time writes it fast: three short lines we don't get to read. She means to leave it on Alice's pillow, loses her nerve, and sews it into her coat lining. Then she pulls on the red mittens.<\/p>"},{"oref":"Scene 2","id":129,"seq":2,"title":"Gin Lane, a borrowed room","added":false,"act":"Act One","kind":"scene","sum":"Afternoon, and frost on the inside of the window: the east wall has been grey for twelve days. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. I'm leaving with him. I'm sorry, Ali. Don't follow me. Miriam was leaving her and never meant to say goodbye. Then the door bangs. The Lost One, home from the market with an armful of oranges she is enormously proud of, chattering about a man who sells hot chestnuts out of a drum. She doesn't use Alice's name; she hasn't since the gasworks. Alice puts the letter in her apron pocket, smiles, and peels her an orange. She says nothing. She says nothing all evening, and we watch her not say it.","loc":"Gin Lane","when":"Afternoon.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":161,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Afternoon, and frost on the inside of the window: the east wall has been grey for twelve days. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. <em>I'm leaving with him. I'm sorry, Ali. Don't follow me.<\/em> Miriam was leaving her and never meant to say goodbye. Then the door bangs. The Lost One, home from the market with an armful of oranges she is enormously proud of, chattering about a man who sells hot chestnuts out of a drum. She doesn't use Alice's name; she hasn't since the gasworks. Alice puts the letter in her apron pocket, smiles, and peels her an orange. She says nothing. She says nothing all evening, and we watch her not say it.<\/p>"},{"oref":"Scene 3","id":130,"seq":3,"title":"The same room. The peak of the sisters' story","added":false,"act":"Act One","kind":"scene","sum":"Late, one candle. Alice holds out the letter. \"You were leaving.\" The Lost One, who lost Alice's name in the gasworks, still knows this face and still knows this hurt. \"Yes.\" And the fence comes down, because Alice is too angry to hold it up: \"You always left. You left me under that bed. Every time. You promised nothing would touch me, and then you counted fence posts while he—\" She can't finish. Fifteen years, and she has finally said it out loud, to the only person who was there. The Lost One has been waiting four weeks to be let in. She has the guilt, and it's the last thing of Miriam's left in her, because the cold took the birthdays and the songs and the name and couldn't get its teeth into this. She kneels on the floor so she's lower than Alice, the way you'd kneel to a child under a bed. \"I should have stood in front of you. Every time. I'm sorry. I was so frightened of him that I let you be frightened alone, and I've hated myself every day since.\" Then the thing Miriam never could have said: \"If he came through that door now, I'd stand in front of you. I'd let him freeze.\" It is the apology Alice has wanted her whole life, word for word, and it's perfect. That's how she knows. Miriam couldn't have said it. Miriam flinched. Alice, barely a breath: \"Say my name.\" The Lost One opens her mouth, and there's nothing there. A long silence. \"You're not her.\" \"No.\" Plainly: Morgana's daughter, who came through on the bridge, wearing Miriam's body and Miriam's memories like a coat. Alice has known since the core that something else came back in her sister. What she built her whole theory to avoid knowing is whether Miriam is still under it. \"Is she in there? Under you?\" \"No. She was gone before I opened her eyes. I'm sorry. She was going to leave you, Ali. She told me on the bridge. She was frightened, and it wasn't of you.\" Then the real horror, said gently, as a gift: \"I'm not sorry for her. I'm sorry for me. I love you. I don't know whose that is anymore. I think it's mine.\" Alice looks at the thing that has been her sister for four weeks, the one that remembered her birthday, peeled her an orange and just gave her the only apology she has ever been given, and understands that her real sister never loved her this well. \"Get out.\" The door closes on her.","loc":"The same room","when":"Late, one candle.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":900,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Late, one candle. Alice holds out the letter. \"You were leaving.\" The Lost One, who lost Alice's name in the gasworks, still knows this face and still knows this hurt. \"Yes.\" And the fence comes down, because Alice is too angry to hold it up: \"You always left. You left me under that bed. Every time. You promised nothing would touch me, and then you counted fence posts while he—\" She can't finish. Fifteen years, and she has finally said it out loud, to the only person who was there.<\/p><p>The Lost One has been waiting four weeks to be let in. She has the guilt, and it's the last thing of Miriam's left in her, because the cold took the birthdays and the songs and the name and couldn't get its teeth into this. She kneels on the floor so she's lower than Alice, the way you'd kneel to a child under a bed. \"I should have stood in front of you. Every time. I'm sorry. I was so frightened of him that I let you be frightened alone, and I've hated myself every day since.\" Then the thing Miriam never could have said: \"If he came through that door now, I'd stand in front of you. I'd let him freeze.\"<\/p><p>It is the apology Alice has wanted her whole life, word for word, and it's perfect. That's how she knows. Miriam couldn't have said it. Miriam <em>flinched<\/em>. Alice, barely a breath: \"Say my name.\" The Lost One opens her mouth, and there's nothing there. A long silence. \"You're not her.\"<\/p><p>\"No.\" Plainly: Morgana's daughter, who came through on the bridge, wearing Miriam's body and Miriam's memories like a coat. Alice has known since the core that something else came back in her sister. What she built her whole theory to avoid knowing is whether Miriam is still under it. \"Is she in there? Under you?\" \"No. She was gone before I opened her eyes. I'm sorry. She was going to leave you, Ali. She told me on the bridge. She was frightened, and it wasn't of you.\" Then the real horror, said gently, as a gift: \"I'm not sorry for her. I'm sorry for me. I love you. I don't know whose that is anymore. I think it's mine.\"<\/p><p>Alice looks at the thing that has been her sister for four weeks, the one that remembered her birthday, peeled her an orange and just gave her the only apology she has ever been given, and understands that her real sister never loved her this well. \"Get out.\" The door closes on her.<\/p>"},{"oref":"Scene 4","id":131,"seq":4,"title":"Harding House, breakfast","added":false,"act":"Act One","kind":"scene","sum":"Eldgard sits silent and diminished without his Works. Josephine runs the table now: the wedding is in seven days, and the Lambrick money will buy the Works back. Nathaniel: \"Or what, Mother? You'll poison me?\" Josephine, buttering toast: \"If I had to choose between you and London, I chose a long time ago.\" Nathaniel stands. \"If anything happens to the frost girl, I'll stand up in Parliament and say who poisoned Felix Hawke.\" She doesn't stop buttering. \"Then it had better not happen from my hands.\"","loc":"Harding House","when":"Eldgard sits silent and diminished without his Works.","th":"harding","also":[],"ch":["eldgard","josephine","nathaniel"],"turn":"","w":218,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Eldgard sits silent and diminished without his Works. Josephine runs the table now: the wedding is in seven days, and the Lambrick money will buy the Works back. Nathaniel: \"Or what, Mother? You'll poison me?\" Josephine, buttering toast: \"If I had to choose between you and London, I chose a long time ago.\" Nathaniel stands. \"If anything happens to the frost girl, I'll stand up in Parliament and say who poisoned Felix Hawke.\" She doesn't stop buttering. \"Then it had better not happen from my hands.\"<\/p>"},{"oref":"Scene 5","id":132,"seq":5,"title":"The core, under Crown control","added":false,"act":"Act One","kind":"scene","sum":"Vane and Lambrick tour it with Tamara on her father's arm. On the stair down, Lambrick, quietly, the only time he talks to her as if she were a person: \"Your mother hated the green. Said it made everyone at dinner look drowned. I kept her room on coal till the end.\" Then he looks up at Morgana. There's no horror in his face, only arithmetic: \"She could be bled faster.\" The man who kept one room warm out of love would freeze a city for the same reason, and calls both of them providing. Lambrick picks up the folio after her, reads the same line, and smiles: put the daughter in the chain, and the Crown never needs a Harding again. On the clerk's desk sits Eldgard's seized Heartglass folio. Tamara reads one line: Vessel: White-born.","loc":"The core","when":"Vane and Lambrick tour it with Tamara on her father's arm.","th":"lambrick","also":["city"],"ch":["lambrick","vane","tamara","morgana"],"turn":"","w":366,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Vane and Lambrick tour it with Tamara on her father's arm. On the stair down, Lambrick, quietly, the only time he talks to her as if she were a person: \"Your mother hated the green. Said it made everyone at dinner look drowned. I kept her room on coal till the end.\" Then he looks up at Morgana. There's no horror in his face, only arithmetic: \"She could be bled faster.\" The man who kept one room warm out of love would freeze a city for the same reason, and calls both of them providing. Lambrick picks up the folio after her, reads the same line, and smiles: put the daughter in the chain, and the Crown never needs a Harding again. On the clerk's desk sits Eldgard's seized Heartglass folio. Tamara reads one line: <em>Vessel: White-born.<\/em><\/p>"},{"oref":"Scene 6","id":134,"seq":6,"title":"Blackwood Bridge, fog","added":false,"act":"Act Two","kind":"scene","sum":"The Lost One, thrown out, walks to the place she first came through, and does the only thing her body knows how to do with being sent away: she cries. This time the tears don't freeze on her face. They freeze the air. Tink. Tink. Krrrk. The thin place on the bridge cracks like a pane of glass, and Alice's \"Get out\" has opened a door. Howls in the fog. Wolves of the White, white-furred and blue-eyed, pad out of nothing and bow to her. That's the most dangerous thing that could happen.","loc":"Blackwood Bridge","when":"The Lost One, thrown out, walks to the place she first came through, and does the only thing her body knows how to do with being sent away: she cries.","th":"white","also":[],"ch":["lostone"],"turn":"","w":184,"ed":"","fl":[],"html":"<p>The Lost One, thrown out, walks to the place she first came through, and does the only thing her body knows how to do with being sent away: she cries. This time the tears don't freeze on her face. They freeze the air. <em>Tink. Tink. Krrrk.<\/em> The thin place on the bridge cracks like a pane of glass, and Alice's \"Get out\" has opened a door. Howls in the fog. Wolves of the White, white-furred and blue-eyed, pad out of nothing and bow to her. That's the most dangerous thing that could happen.<\/p>"},{"oref":"Scene 7","id":258,"seq":7,"title":"The Guard tower armoury before dawn, then the roof, their boyhood spot","added":true,"act":"Act Two","kind":"scene","sum":"The rifles are back in Nathaniel's shop for the cold-weather refit, and he's checking the bound logs against the Works' ammunition audit, because that's what an engineer does at four in the morning when he can't sleep. Captain's rifle: thirty rounds issued, twenty-nine accounted for. The binding has a stub where a page was cut out close to the thread. He sits with it until the light comes up. This morning Nixon got a medal for carrying Cole out of the gasworks, and the ceremony was pure irony. Afterwards Cole, two fingers short, held out the diary: \"Today, sir.\" So this afternoon Nixon climbs to the spot they've had since they were nine, to tell him, and Nathaniel is already there with the rifle log open on his knee. Nixon: \"I fired the shot.\" Nathaniel: \"I know. I counted.\" Then it's a fight, a real one, the first of their lives, across a slate roof sixty feet up with no boosters: fists, a shoulder into the chimney stack, both of them half over the gutter, and not one whistle between them. Nixon stops defending first. \"I didn't know it was him. Your father told me to lie. He came down after.\" \"Was Jamie alive when you left?\" \"Yes.\" Nathaniel walks away without a word. A friendship of fifteen years ends on a roof.","loc":"Guard tower","when":"The rifles are back in Nathaniel's shop for the cold-weather refit, and he's checking the bound logs against the Works' ammunition audit, because that's what an engineer does at four in the morning when he can't sleep.","th":"guard","also":["investigation","harding"],"ch":["nathaniel","nixon","cole"],"turn":"","w":446,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>The rifles are back in Nathaniel's shop for the cold-weather refit, and he's checking the bound logs against the Works' ammunition audit, because that's what an engineer does at four in the morning when he can't sleep. Captain's rifle: thirty rounds issued, twenty-nine accounted for. The binding has a stub where a page was cut out close to the thread. He sits with it until the light comes up. This morning Nixon got a medal for carrying Cole out of the gasworks, and the ceremony was pure irony. Afterwards Cole, two fingers short, held out the diary: \"Today, sir.\" So this afternoon Nixon climbs to the spot they've had since they were nine, to tell him, and Nathaniel is already there with the rifle log open on his knee. Nixon: \"I fired the shot.\" Nathaniel: \"I know. I counted.\" Then it's a fight, a real one, the first of their lives, across a slate roof sixty feet up with no boosters: fists, a shoulder into the chimney stack, both of them half over the gutter, and not one whistle between them. Nixon stops defending first. \"I didn't know it was him. Your father told me to lie. He came down after.\" \"Was Jamie alive when you left?\" \"Yes.\" Nathaniel walks away without a word. A friendship of fifteen years ends on a roof.<\/p>"},{"oref":"Scene 8","id":136,"seq":8,"title":"A Gin Lane gin shop","added":false,"act":"Act Two","kind":"scene","sum":"Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: \"Why would I care? She's not my sister.\" Tamara: \"She put out a fire around four children with the last of her cold and forgot your name doing it. Did Miriam ever do that?\" Alice, after a long time: \"No. Miriam never stood in front of anybody.\" She stops drinking.","loc":"A Gin Lane gin shop","when":"Tamara finds Alice drunk.","th":"sisters","also":["lambrick"],"ch":["tamara","alice"],"turn":"","w":254,"ed":"","fl":[],"html":"<p>Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: \"Why would I care? She's not my sister.\" Tamara: \"She put out a fire around four children with the last of her cold and forgot your name doing it. Did Miriam ever do that?\" Alice, after a long time: \"No. Miriam never stood in front of anybody.\" She stops drinking.<\/p>"},{"oref":"Scene 9","id":137,"seq":9,"title":"Whitechapel, set piece","added":false,"act":"Act Two","kind":"scene","sum":"The wolves that came through on Blackwood Bridge don't stay there. Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits. Wolves pour into the gaslit streets. Gas lamps freeze and burst, tink, tink, tink. Bodies in the snowless street.","loc":"Whitechapel","when":"The wolves that came through on Blackwood Bridge don't stay there.","th":"white","also":["city"],"ch":[],"turn":"","w":179,"ed":"","fl":[],"html":"<p>The wolves that came through on Blackwood Bridge don't stay there. Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits. Wolves pour into the gaslit streets. Gas lamps freeze and burst, <em>tink, tink, tink<\/em>. Bodies in the snowless street.<\/p>"},{"oref":"Scene 10","id":138,"seq":10,"title":"Commercial Road, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades. Shot the way the pilot's core raid was: black, then a strobe frame, then black. Every flash shows us a wolf somewhere new and closer. We see them only in the frames the Lanterns light, which is scarier than a wide shot and costs a tenth as much. Nixon fights like a man trying to get himself killed. Cole fights beside him with his two-finger grip.","loc":"Commercial Road","when":"Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":291,"ed":"","fl":[],"html":"<p>Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades. Shot the way the pilot's core raid was: black, then a strobe frame, then black. Every flash shows us a wolf somewhere new and closer. We see them only in the frames the Lanterns light, which is scarier than a wide shot and costs a tenth as much. Nixon fights like a man trying to get himself killed. Cole fights beside him with his two-finger grip.<\/p>"},{"oref":"Scene 11","id":139,"seq":11,"title":"The Pavilion music hall, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Whimsy into grim. We stay inside. A comic singer keeps a hundred people singing \"Daisy Bell\" to drown out the scratching at the doors, and the song gets louder every time the scratching does. A door panel bows inward. A child stops singing, and her mother starts her again. Nathaniel comes in through the skylight on leap-boosters with a bag of flash-cartridges, and for the first time in his life he sticks the landing: one knee on the stage boards, THOOM, a hundred faces turned up at him, the boy from the coal bin flying when it counts, and Nixon arrives from the other roof. No words. They fight back to back the way they did at nine years old, perfectly in sync, an hour after the friendship ended.","loc":"The Pavilion music hall","when":"Whimsy into grim.","th":"guard","also":["harding"],"ch":["nathaniel","nixon"],"turn":"","w":311,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Whimsy into grim. We stay inside. A comic singer keeps a hundred people singing \"Daisy Bell\" to drown out the scratching at the doors, and the song gets louder every time the scratching does. A door panel bows inward. A child stops singing, and her mother starts her again. Nathaniel comes in through the skylight on leap-boosters with a bag of flash-cartridges, and for the first time in his life he sticks the landing: one knee on the stage boards, <em>THOOM<\/em>, a hundred faces turned up at him, the boy from the coal bin flying when it counts, and Nixon arrives from the other roof. No words. They fight back to back the way they did at nine years old, perfectly in sync, an hour after the friendship ended.<\/p>"},{"oref":"Scene 12","id":140,"seq":12,"title":"The Pavilion stage door, and the street","added":false,"act":"Act Two","kind":"scene","sum":"The Lost One walks into the street of wolves and says one word in a language of wind. They stop, every one of them, except the biggest. She kills it with cold, and we see the memory go: a market stall the winter Alice was twelve, Miriam pulling a pair of red mittens off a hook and running, the whole picture frosting over and cracking. Then she turns the rest, every one, and walks them back through the fog to the bridge, and the crack in the air closes behind the last of them. Tik. A hundred people watch a girl command wolves. By morning she'll be the Frost Witch, the one creature in London who can open the White and shut it again. In the fog at the end of the street, a big man in a scarred coat is watching too, eating an apple, the Black Gauntlet ticking on his arm: Ajax, taking a good look at what his master means to buy. He's gone before anyone thinks to fire. Then Alice, sober now, reaches her through the street of wolves. The Lost One doesn't know her face anymore. The last wolf breaks from the fog straight at Alice, and before any cold, before any green, the girl does the old thing: she steps in front of her and takes it on the arm. It's Miriam's exact movement, the one the real Miriam made for every slammed door and never once for the belt. Her sister comes back for one second, and then she doesn't. Then the cold. Alice: \"I'm Alice. I'm your sister.\" The sisters' scene: chosen, not inherited.","loc":"The Pavilion stage door","when":"The Lost One walks into the street of wolves and says one word in a language of wind.","th":"white","also":["sisters"],"ch":["lostone","alice"],"turn":"","w":363,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>The Lost One walks into the street of wolves and says one word in a language of wind. They stop, every one of them, except the biggest. She kills it with cold, and we see the memory go: a market stall the winter Alice was twelve, Miriam pulling a pair of red mittens off a hook and running, the whole picture frosting over and cracking. Then she turns the rest, every one, and walks them back through the fog to the bridge, and the crack in the air closes behind the last of them. <em>Tik.<\/em> A hundred people watch a girl command wolves. By morning she'll be the Frost Witch, the one creature in London who can open the White and shut it again. In the fog at the end of the street, a big man in a scarred coat is watching too, eating an apple, the Black Gauntlet ticking on his arm: Ajax, taking a good look at what his master means to buy. He's gone before anyone thinks to fire. Then Alice, sober now, reaches her through the street of wolves. The Lost One doesn't know her face anymore. The last wolf breaks from the fog straight at Alice, and before any cold, before any green, the girl does the old thing: she steps in front of her and takes it on the arm. It's Miriam's exact movement, the one the real Miriam made for every slammed door and never once for the belt. Her sister comes back for one second, and then she doesn't. Then the cold. Alice: \"I'm Alice. I'm your sister.\" The sisters' scene: chosen, not inherited.<\/p>"},{"oref":"Scene 13","id":259,"seq":13,"title":"Shadwell, dawn","added":true,"act":"Act Three","kind":"scene","sum":"By morning Vane's martial-law notice is pasted over every FROST KILLER bill in London: the Frost Witch is to be taken alive. In the steam of the Shadwell laundry, Josephine lays one glove on Grise's counting table, knot side up, and they agree a price for the Frost Witch, delivered to Josephine, not the Crown. Grise: \"Where is she?\" Josephine: \"Wherever my son puts her when the city gets too hot for her. Before Lantern Night that was my glasshouse, and after last night it will be again. I want her taken by hands he can't trace to me.\" Grise looks across the steam at Kit, who is already folding a sheet over a knife. Josephine: \"She's not a girl, Grise.\" Grise: \"None of us were, by the time we came here.\"","loc":"Shadwell laundry","when":"By morning Vane's martial-law notice is pasted over every FROST KILLER bill in London: the Frost Witch is to be taken alive.","th":"vykra","also":["city","harding"],"ch":["josephine","grise","kit"],"turn":"","w":264,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>By morning Vane's martial-law notice is pasted over every FROST KILLER bill in London: the Frost Witch is to be taken alive. In the steam of the Shadwell laundry, Josephine lays one glove on Grise's counting table, knot side up, and they agree a price for the Frost Witch, delivered to Josephine, not the Crown. Grise: \"Where is she?\" Josephine: \"Wherever my son puts her when the city gets too hot for her. Before Lantern Night that was my glasshouse, and after last night it will be again. I want her taken by hands he can't trace to me.\" Grise looks across the steam at Kit, who is already folding a sheet over a knife. Josephine: \"She's not a girl, Grise.\" Grise: \"None of us were, by the time we came here.\"<\/p>"},{"oref":"Scene 14","id":214,"seq":14,"title":"St Bride's, the Harding vault, dawn","added":true,"act":"Act Three","kind":"scene","sum":"All night Nathaniel fought beside the man who shot his brother, and one word from the roof has gone round his head the whole time: Yes. Jamie was alive when Nixon left. At dawn he goes to see his brother. Crowbar, lantern, the Harding vault under St Bride's. He breaks the seal on the coffin his best friend carried down these steps. Krrk-CRACK. Inside, laid out in Jamie's burial coat, are three sacks of grey slag from the Works vats and a family Bible for weight. No body. Nathaniel stands in the candle-dark with a fistful of slag, and Morgana's voice from Lantern Night comes back to him: He is cold. Above him, on the chancel wall, the brass plate still says DIED ABROAD.","loc":"St Bride's","when":"All night Nathaniel fought beside the man who shot his brother, and one word from the roof has gone round his head the whole time: Yes.","th":"investigation","also":["harding"],"ch":["nathaniel"],"turn":"","w":576,"ed":"","fl":[],"html":"<p>All night Nathaniel fought beside the man who shot his brother, and one word from the roof has gone round his head the whole time: <em>Yes.<\/em> Jamie was alive when Nixon left. At dawn he goes to see his brother. Crowbar, lantern, the Harding vault under St Bride's. He breaks the seal on the coffin his best friend carried down these steps. <em>Krrk-CRACK.<\/em> Inside, laid out in Jamie's burial coat, are three sacks of grey slag from the Works vats and a family Bible for weight. No body. Nathaniel stands in the candle-dark with a fistful of slag, and Morgana's voice from Lantern Night comes back to him: <em>He is cold.<\/em> Above him, on the chancel wall, the brass plate still says DIED ABROAD.<\/p>"},{"oref":"Scene 15","id":143,"seq":15,"title":"Harding Works, Eldgard's old gallery, empty","added":false,"act":"Act Three","kind":"scene","sum":"The Crown has the core, and nobody has bothered with the gallery. Eldgard is asleep drunk among the dead vats. Nathaniel doesn't wake him. He opens the lock of the Keeper's desk with a hairpin in four seconds, the way a lamp-girl once showed him, and finds the book Hardings never name upstairs: the Keeper's ledger. One line every fifty years, each in a different hand. 1489. Edric Harding, nine. Then a column of first names with no surnames, 1539 to 1789, as if whoever they were didn't rate one. 1839. Ottoline Harding, nineteen: the girl on the brass. 1889. James Harding, scored through. Under it, in his father's hand, dated 3 November, the morning after Jamie \"fell\": Nathaniel. In the margins a Keeper's notes on the wall-feed run month by month, every cycle back to 1539, each one sagging toward a first snow and climbing again the week after. The dips he has been charting since the engagement are a countdown. He drops a fistful of slag on the open page, the same grey as the dead vats all around them. Eldgard wakes. \"What did you do after Nixon left?\" \"I finished it.\" \"Why not you?\" Eldgard looks at the page a long time. \"Ask me at the solstice.\" \"It's my name, Father.\" \"Then you know why I'm building it.\" The mercy was never for her. The Heartglass was always meant to keep his son off the stair; Nathaniel doesn't know yet what it's meant to hold instead. Then, almost to himself: \"Your mother knew what this house spends. She found it out at my gate with a knife in her hand, and she married it anyway.\" In the same drawer, under the ledger, are Alistair's architectural drawings: bridges that fell, a cathedral roof that came in, and one small iron room, drawn and dated 1488, a year before the Works existed. He built the cage first. Nathaniel can't explain it yet.","loc":"Harding Works","when":"Eldgard is drunk among the dead vats.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":394,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>The Crown has the core, and nobody has bothered with the gallery. Eldgard is asleep drunk among the dead vats. Nathaniel doesn't wake him. He opens the lock of the Keeper's desk with a hairpin in four seconds, the way a lamp-girl once showed him, and finds the book Hardings never name upstairs: the Keeper's ledger. One line every fifty years, each in a different hand. <em>1489. Edric Harding, nine.<\/em> Then a column of first names with no surnames, 1539 to 1789, as if whoever they were didn't rate one. <em>1839. Ottoline Harding, nineteen<\/em>: the girl on the brass. <em>1889. James Harding<\/em>, scored through. Under it, in his father's hand, dated 3 November, the morning after Jamie \"fell\": <em>Nathaniel.<\/em> In the margins a Keeper's notes on the wall-feed run month by month, every cycle back to 1539, each one sagging toward a first snow and climbing again the week after. The dips he has been charting since the engagement are a countdown. He drops a fistful of slag on the open page, the same grey as the dead vats all around them. Eldgard wakes. \"What did you do after Nixon left?\" \"I finished it.\" \"Why not you?\" Eldgard looks at the page a long time. \"Ask me at the solstice.\" \"It's my name, Father.\" \"Then you know why I'm building it.\" The mercy was never for her. The Heartglass was always meant to keep his son off the stair; Nathaniel doesn't know yet what it's meant to hold instead. Then, almost to himself: \"Your mother knew what this house spends. She found it out at my gate with a knife in her hand, and she married it anyway.\" In the same drawer, under the ledger, are Alistair's architectural drawings: bridges that fell, a cathedral roof that came in, and one small iron room, drawn and dated 1488, a year before the Works existed. He built the cage first. Nathaniel can't explain it yet.<\/p>"},{"oref":"Scene 16","id":146,"seq":16,"title":"Harding House, the long gallery, then the glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark. The Lost One stops at Jamie's: twenty-five, laughing at something outside the frame, a skate-blade over his shoulder. Her hand goes to her belly without her knowing it. Her breath catches on a feeling that isn't hers, the whole of Miriam's love for him arriving in her body at once. Alice: \"What's wrong?\" \"Nothing.\" Alice looks at the portrait, then at her, and decides not to ask. In the glasshouse, Nathaniel is waiting, slag still grey in the creases of his hands. Alice doesn't let him start. Tamara read her the line in the folio: Vessel: White-born. \"You built a cage for my sister.\" He didn't know. She watches him not know, and hits him anyway, harder than Nathaniel hit Nixon. Then: \"So you know how to break it.\" Before he can answer, TAMARA comes in out of the rain with the rest of what she read on her father's desk: a lunacy order, two doctors' signatures, waiting for the day she opens her mouth about his books. \"A spinster's nearest relative is her father,\" she says. \"A wife's is her husband. The wedding is in seven days. I'd rather it were you than Bethlem.\" Nathaniel looks at Alice. Alice: \"Marry her.\" \"Bounds—\" \"Marry her.\" Both of them mean it, and both of them hate that they do. Later, at the stove, Nathaniel tells Alice about the coffin full of slag and the ledger with his name under his brother's. She hears that part and doesn't say anything for a long time. Then he tells her what Morgana said on Lantern Night: Jamie isn't dead, he's cold. Alice, hours after losing her sister for good: \"Don't live in it. I lived in it four weeks. It's warm, and then it isn't.\" From the dark under the orange trees, the Lost One, who isn't supposed to be listening: \"My mother doesn't lie.\" Two answers, and Nathaniel can only believe one of them. Twenty-one days, and everyone wants somebody in the chain.","loc":"Harding House","when":"Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark.","th":"harding","also":["sisters"],"ch":["alice","lostone","nathaniel","jamie","morgana"],"turn":"","w":1583,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark. The Lost One stops at Jamie's: twenty-five, laughing at something outside the frame, a skate-blade over his shoulder. Her hand goes to her belly without her knowing it. Her breath catches on a feeling that isn't hers, the whole of Miriam's love for him arriving in her body at once. Alice: \"What's wrong?\" \"Nothing.\" Alice looks at the portrait, then at her, and decides not to ask. In the glasshouse, Nathaniel is waiting, slag still grey in the creases of his hands. Alice doesn't let him start. Tamara read her the line in the folio: <em>Vessel: White-born.<\/em> \"You built a cage for my sister.\" He didn't know. She watches him not know, and hits him anyway, harder than Nathaniel hit Nixon. Then: \"So you know how to break it.\" Before he can answer, TAMARA comes in out of the rain with the rest of what she read on her father's desk: a lunacy order, two doctors' signatures, waiting for the day she opens her mouth about his books. \"A spinster's nearest relative is her father,\" she says. \"A wife's is her husband. The wedding is in seven days. I'd rather it were you than Bethlem.\" Nathaniel looks at Alice. Alice: \"Marry her.\" \"Bounds—\" \"Marry her.\" Both of them mean it, and both of them hate that they do. Later, at the stove, Nathaniel tells Alice about the coffin full of slag and the ledger with his name under his brother's. She hears that part and doesn't say anything for a long time. Then he tells her what Morgana said on Lantern Night: Jamie isn't dead, he's cold. Alice, hours after losing her sister for good: \"Don't live in it. I lived in it four weeks. It's warm, and then it isn't.\" From the dark under the orange trees, the Lost One, who isn't supposed to be listening: \"My mother doesn't lie.\" Two answers, and Nathaniel can only believe one of them. Twenty-one days, and everyone wants somebody in the chain.<\/p>"},{"oref":"Scene 17","id":148,"seq":17,"title":"Gin Lane rooftop","added":false,"act":"Act Three","kind":"scene","sum":"Whimsy and grief. The Lost One asks Alice to teach her the counting game again, since she lost it. For the first time Alice tells her where it came from: the fence outside the window, eight posts, and he's done. The Lost One listens, then counts them with her, and at eight she keeps going. \"Nine.\" Alice: \"There's no nine.\" \"There is now. Nine is the one where we get up.\" She gets it wrong on purpose, nine, ten, eleven, to make Alice laugh. It works. The game born under a bed has a new ending.","loc":"Gin Lane rooftop","when":"Whimsy and grief.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":330,"ed":"","fl":[],"html":"<p>Whimsy and grief. The Lost One asks Alice to teach her the counting game again, since she lost it. For the first time Alice tells her where it came from: the fence outside the window, eight posts, and he's done. The Lost One listens, then counts them with her, and at eight she keeps going. \"Nine.\" Alice: \"There's no nine.\" \"There is now. Nine is the one where we get up.\" She gets it wrong on purpose, nine, ten, eleven, to make Alice laugh. It works. The game born under a bed has a new ending.<\/p>"},{"oref":"Scene 18","id":145,"seq":18,"title":"Guard barracks, the infirmary","added":false,"act":"Tag","kind":"scene","sum":"Tamara comes in while Nixon is changing Cole's dressings. She gives Nixon a folder copied from her father's seized Harding papers: \"It has your name on it.\" Then, a week before her wedding, she kisses him. Cole pretends very hard to be asleep. Nixon doesn't open the folder. He puts it inside his coat, against his chest, and he doesn't sleep.","loc":"Guard barracks","when":"Tamara comes in while Nixon is changing Cole's dressings.","th":"guard","also":["lambrick"],"ch":["tamara","nixon","cole"],"turn":"","w":192,"ed":"","fl":[],"html":"<p>Tamara comes in while Nixon is changing Cole's dressings. She gives Nixon a folder copied from her father's seized Harding papers: \"It has your name on it.\" Then, a week before her wedding, she kisses him. Cole pretends very hard to be asleep. Nixon doesn't open the folder. He puts it inside his coat, against his chest, and he doesn't sleep.<\/p>"}]},{"n":8,"title":"The Wedding","time":"14 DAYS TO FIRST SNOW","clock":"14 DAYS TO FIRST SNOW","act":"II","log":"Nathaniel marries Tamara to keep her out of Bethlem, with Alice watching from the gallery. While the vows run, the Vykra come for the girl in the glasshouse, Nixon refuses an order to fire on a crowd and finds the cellar he was grown in, and the snow comes tonight.","sum":"Morgana makes it snow, two weeks early, and it settles inside the walls","turn":"Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard","focus":"one morning, one chapel, and the girl left alone across the lawn","piece":"the wedding, the taking and the mutiny at the gates","threads":["harding","guard","sisters","city","lambrick","white"],"frame":"<blockquote><p><strong>Focus:<\/strong> one morning, one chapel, and the girl left alone across the lawn<\/p><p><strong>Set pieces:<\/strong> the wedding, the taking and the mutiny at the gates<\/p><p><strong>Sting:<\/strong> the Lost One lets herself be taken while Alice watches the wedding, and her mother's grief brings the snow two weeks early<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":260,"seq":1,"title":"The Harding lawn, before dawn","added":true,"act":"Cold open","kind":"scene","sum":"Frost on the grass, the chapel dark, the glasshouse a grey shape across the lawn. KIT MARROW walks from the chapel door to the glasshouse with a pocket watch open in her palm, counting under her breath. Then she walks it again, faster. Then she runs it. Four minutes walking, ninety seconds running. Three Vykra girls follow her route in her footprints. She tries the glasshouse door: unlocked, and the girl inside asleep under the orange trees. Kit doesn't go in. She snaps the watch shut and looks up at the house, where a first-floor curtain falls back into place. Josephine has watched the whole rehearsal. Now the audience knows exactly what will happen during the vows, and when, and nobody else on screen does.","loc":"Harding House lawn","when":"Frost on the grass, the chapel dark, the glasshouse a grey shape across the lawn.","th":"vykra","also":["harding"],"ch":["kit","josephine"],"turn":"","w":250,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Frost on the grass, the chapel dark, the glasshouse a grey shape across the lawn. KIT MARROW walks from the chapel door to the glasshouse with a pocket watch open in her palm, counting under her breath. Then she walks it again, faster. Then she runs it. Four minutes walking, ninety seconds running. Three Vykra girls follow her route in her footprints. She tries the glasshouse door: unlocked, and the girl inside asleep under the orange trees. Kit doesn't go in. She snaps the watch shut and looks up at the house, where a first-floor curtain falls back into place. Josephine has watched the whole rehearsal. Now the audience knows exactly what will happen during the vows, and when, and nobody else on screen does.<\/p>"},{"oref":"Scene 2","id":234,"seq":2,"title":"The glasshouse, the night before","added":true,"act":"Act One","kind":"scene","sum":"He marries Tamara in the morning, and nobody has said a word about it all evening. Whimsy: the Lost One, who has never seen a wedding, insists on practising one. She plays the priest, reading with enormous solemnity from a prayer book held upside down, and makes Alice stand in for the bride. They say every word to each other, slowly, and both of them mean every word, and both of them know it. \"Wilt thou have this woman…\" \"I will.\" The Lost One turns the page: \"You may now kiss the—\" Alice: \"That part isn't ours.\" They stand there not stopping, and not moving either. The Lost One looks from one to the other, sincerely: \"You both look sad when you look at each other. Is that what weddings are for?\" Nobody answers. In the morning his mother will have a piece of paper for him.","loc":"The glasshouse","when":"He marries Tamara in the morning, and nobody has said a word about it all evening.","th":"sisters","also":["harding"],"ch":["nathaniel","alice","lostone"],"turn":"","w":570,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>He marries Tamara in the morning, and nobody has said a word about it all evening. Whimsy: the Lost One, who has never seen a wedding, insists on practising one. She plays the priest, reading with enormous solemnity from a prayer book held upside down, and makes Alice stand in for the bride. They say every word to each other, slowly, and both of them mean every word, and both of them know it. \"Wilt thou have this woman…\" \"I will.\" The Lost One turns the page: \"You may now kiss the—\" Alice: \"That part isn't ours.\" They stand there not stopping, and not moving either. The Lost One looks from one to the other, sincerely: \"You both look sad when you look at each other. Is that what weddings are for?\" Nobody answers. In the morning his mother will have a piece of paper for him.<\/p>"},{"oref":"Scene 3","id":151,"seq":3,"title":"Harding House, the groom's dressing room","added":false,"act":"Act One","kind":"scene","sum":"Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: The second Harding son. Agent: Alice Bounds. It's the first time he has ever seen her first name, and it's on a bill. \"She was paid to get close to you. By me. Whatever she's felt, I bought it.\" Nathaniel can't breathe. She wants his eyes on the altar today, and the lamp-girl's eyes on him, and nobody's on the glasshouse. Grise already knows the hour. Josephine leaves, and Eldgard takes her place at the door with Jamie's cufflinks in one hand and Jamie's pocket watch in the other, wound, swinging a little on its chain. Nathaniel watches it swing. Flash: the nursery, sixteen years ago, the warmest room in the house. NATHANIEL, five, wakes to frost spreading across the inside of his window and a girl made of ice at the foot of his bed, no taller than he is, looking at him the way you look at the first warm thing you've ever seen. He holds out his hand. She takes it. Nothing freezes. Then the door bangs open: ELDGARD, in his shirtsleeves, burned at the cuffs, a lantern in his fist. He catches the girl by the wrist, and she screams like glass splitting. Then he kneels by the bed and swings the lantern slowly before his son's eyes. \"You had a dream. You never saw anything.\" The boy, glassy: \"I had a dream. I never saw anything.\" Eldgard carries the girl down the stairs. In the morning there's a new curio under glass on the drawing-room mantel, and the boy is in a carriage going out through the north gate into the first snow he has ever seen. \"We've travelled to another land while you slept.\" A cottage, a tall fence of heater-posts. \"What's the fence for, Papa?\" \"To keep out the wolves.\" In the morning, huge prints along the fence line. Back: the watch stops swinging. It's the \"nightmare\" Nathaniel has had all his life, and he has always thought it was another world. For the first time, he knows it wasn't a dream, and that the girl he's been hiding in the glasshouse was the girl at the foot of his bed. Nathaniel: \"Did you hold his hand?\" Eldgard: \"I held his hand.\" It's the half-truth he lies in. Neither of them mentions the ledger, or the date under his name. Nathaniel takes the cufflinks and puts them on, smiling, because he knows what today is for.","loc":"Harding House","when":"Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: The second Harding son.","th":"harding","also":[],"ch":["josephine","nathaniel","eldgard","grise"],"turn":"","w":533,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: <em>The second Harding son. Agent: Alice Bounds.<\/em> It's the first time he has ever seen her first name, and it's on a bill. \"She was paid to get close to you. By me. Whatever she's felt, I bought it.\" Nathaniel can't breathe. She wants his eyes on the altar today, and the lamp-girl's eyes on him, and nobody's on the glasshouse. Grise already knows the hour. Josephine leaves, and Eldgard takes her place at the door with Jamie's cufflinks in one hand and Jamie's pocket watch in the other, wound, swinging a little on its chain. Nathaniel watches it swing. <em>Flash:<\/em> the nursery, sixteen years ago, the warmest room in the house. NATHANIEL, five, wakes to frost spreading across the inside of his window and a girl made of ice at the foot of his bed, no taller than he is, looking at him the way you look at the first warm thing you've ever seen. He holds out his hand. She takes it. Nothing freezes. Then the door bangs open: ELDGARD, in his shirtsleeves, burned at the cuffs, a lantern in his fist. He catches the girl by the wrist, and she screams like glass splitting. Then he kneels by the bed and swings the lantern slowly before his son's eyes. \"You had a dream. You never saw anything.\" The boy, glassy: \"I had a dream. I never saw anything.\" Eldgard carries the girl down the stairs. In the morning there's a new curio under glass on the drawing-room mantel, and the boy is in a carriage going out through the north gate into the first snow he has ever seen. \"We've travelled to another land while you slept.\" A cottage, a tall fence of heater-posts. \"What's the fence for, Papa?\" \"To keep out the wolves.\" In the morning, huge prints along the fence line. <em>Back:<\/em> the watch stops swinging. It's the \"nightmare\" Nathaniel has had all his life, and he has always thought it was another world. For the first time, he knows it wasn't a dream, and that the girl he's been hiding in the glasshouse was the girl at the foot of his bed. Nathaniel: \"Did you hold his hand?\" Eldgard: \"I held his hand.\" It's the half-truth he lies in. Neither of them mentions the ledger, or the date under his name. Nathaniel takes the cufflinks and puts them on, smiling, because he knows what today is for.<\/p>"},{"oref":"Scene 4","id":152,"seq":4,"title":"The glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone. He didn't call her Bounds. He didn't call her anything. Alice stands in the doorway with her coat half on, and the Lost One, who heard her say cage in this room a week ago and has thought about nothing else since, makes it easy for her: \"Go. Watch him. If you don't, you'll hate yourself, and then you'll hate me. I'll be here.\" \"Mittens on. Door locked.\" \"Yes, Ali.\" The third lie. Alice goes.","loc":"The glasshouse","when":"Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone.","th":"sisters","also":["harding"],"ch":["alice","lostone","nathaniel"],"turn":"","w":280,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone. He didn't call her Bounds. He didn't call her anything. Alice stands in the doorway with her coat half on, and the Lost One, who heard her say <em>cage<\/em> in this room a week ago and has thought about nothing else since, makes it easy for her: \"Go. Watch him. If you don't, you'll hate yourself, and then you'll hate me. I'll be here.\" \"Mittens on. Door locked.\" \"Yes, Ali.\" The third lie. Alice goes.<\/p>"},{"oref":"Scene 5","id":153,"seq":5,"title":"Guard tower","added":false,"act":"Act One","kind":"scene","sum":"Dawn on the wedding day. Nixon finally opens the folder he has carried against his chest for a week. His charity-school blood test, the green sliver, Eldgard's hand: Hargrave, N. Cadet line of Harding. Reserve. Blood suitable. He was never a charity case. He was a spare. Vane's orders arrive while it's still open on his knee: arrest Eldgard Harding after the vows, then clear the crowd at the gates \"by any means.\" Nixon folds the file away: \"I'm done being anybody's reserve, Cole.\"","loc":"Guard tower","when":"Dawn on the wedding day.","th":"guard","also":["city"],"ch":["vane","nixon","cole"],"turn":"","w":161,"ed":"","fl":[],"html":"<p>Dawn on the wedding day. Nixon finally opens the folder he has carried against his chest for a week. His charity-school blood test, the green sliver, Eldgard's hand: <em>Hargrave, N. Cadet line of Harding. Reserve. Blood suitable.<\/em> He was never a charity case. He was a spare. Vane's orders arrive while it's still open on his knee: arrest Eldgard Harding after the vows, then clear the crowd at the gates \"by any means.\" Nixon folds the file away: \"I'm done being anybody's reserve, Cole.\"<\/p>"},{"oref":"Scene 6","id":171,"seq":6,"title":"The Harding chapel, the vestry","added":true,"act":"Act One","kind":"scene","sum":"Before the guests. Tamara, in white, comes looking for somewhere to be sick and finds Nixon, uninvited, in his captain's coat, standing over a ring box on the vestry table that is waiting for a best man nobody has named. She shuts the door. \"Say one word and I'll walk out of this church with you.\" His file is in his coat; he can feel its corners. \"This morning I found out I'm on Eldgard's books. Like the coal. I can't give you something that belongs to somebody else.\" She picks up the ring box, opens it, closes it, and puts it in his hand. \"Then hand it to me properly.\" She goes out to be married. At the chapel door Josephine is waiting to settle her veil, and peels off one glove to do it. Stitched inside the glove is a Vykra knot. Tamara has carried a needle with that knot's poison on it since the gallery stairs at the hearing. Her mother-in-law's fingers settle the lace. Both women know; neither says a word. Within the hour, this room will hold a strait-coat.","loc":"The Harding chapel","when":"Before the guests.","th":"guard","also":["lambrick"],"ch":["nixon","tamara","josephine"],"turn":"","w":585,"ed":"","fl":[],"html":"<p>Before the guests. Tamara, in white, comes looking for somewhere to be sick and finds Nixon, uninvited, in his captain's coat, standing over a ring box on the vestry table that is waiting for a best man nobody has named. She shuts the door. \"Say one word and I'll walk out of this church with you.\" His file is in his coat; he can feel its corners. \"This morning I found out I'm on Eldgard's books. Like the coal. I can't give you something that belongs to somebody else.\" She picks up the ring box, opens it, closes it, and puts it in his hand. \"Then hand it to me properly.\" She goes out to be married. At the chapel door Josephine is waiting to settle her veil, and peels off one glove to do it. Stitched inside the glove is a Vykra knot. Tamara has carried a needle with that knot's poison on it since the gallery stairs at the hearing. Her mother-in-law's fingers settle the lace. Both women know; neither says a word. Within the hour, this room will hold a strait-coat.<\/p>"},{"oref":"Scene 7","id":154,"seq":7,"title":"The Harding chapel","added":false,"act":"Act One","kind":"scene","sum":"Guests, lilies, the Crown. Eldgard sits alone, unaware. Nixon walks in uninvited and stops behind the groom he hasn't spoken to since the roof. Nathaniel, not turning: \"Stand where I can see you.\" Nixon steps up beside him. A whisper: \"You look terrible.\" \"I haven't slept.\" \"Neither have I.\" He waits for the bride he kissed a week ago. Up in the gallery, at the back, where a lamp-girl would stand, is Alice in a borrowed hat.","loc":"The Harding chapel","when":"Guests, lilies, the Crown.","th":"harding","also":["guard"],"ch":["eldgard","nixon","nathaniel","tamara","alice"],"turn":"","w":233,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Guests, lilies, the Crown. Eldgard sits alone, unaware. Nixon walks in uninvited and stops behind the groom he hasn't spoken to since the roof. Nathaniel, not turning: \"Stand where I can see you.\" Nixon steps up beside him. A whisper: \"You look terrible.\" \"I haven't slept.\" \"Neither have I.\" He waits for the bride he kissed a week ago. Up in the gallery, at the back, where a lamp-girl would stand, is Alice in a borrowed hat.<\/p>"},{"oref":"Scene 8","id":251,"seq":8,"title":"The gallery","added":true,"act":"Act One","kind":"scene","sum":"Josephine turns in her pew, finds the lamp-girl at the gallery rail, and smiles at her, the first time she ever has. Alice doesn't know what it's for. She'll know in an hour.","loc":"The Harding chapel","when":"Josephine turns in her pew, finds the lamp-girl at the gallery rail, and smiles at her, the first time she ever has.","th":"vykra","also":["harding"],"ch":["josephine","alice"],"turn":"","w":110,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Josephine turns in her pew, finds the lamp-girl at the gallery rail, and smiles at her, the first time she ever has. Alice doesn't know what it's for. She'll know in an hour.<\/p>"},{"oref":"Scene 9","id":156,"seq":9,"title":"The gates","added":false,"act":"Act One","kind":"scene","sum":"An undercity crowd has gathered. Some carry candles for the Frost Witch who stopped the wolves; others are coal-men with clubs who want her burned. Lanterns form a line.","loc":"The gates","when":"An undercity crowd has gathered.","th":"city","also":["guard"],"ch":[],"turn":"","w":155,"ed":"","fl":[],"html":"<p>An undercity crowd has gathered. Some carry candles for the Frost Witch who stopped the wolves; others are coal-men with clubs who want her burned. Lanterns form a line.<\/p>"},{"oref":"Scene 10","id":158,"seq":10,"title":"The vestry door","added":false,"act":"Act Two","kind":"scene","sum":"At the groom's shoulder, Nixon sees the vestry door ease open: AJAX, in the room where Tamara asked him an hour ago, with two Bethlem attendants, a strait-coat and a lunacy order for Tamara Lambrick, spinster: her father's signature as nearest relative, two doctors', and the Chancery seal, because lunatics are the Lord Chancellor's wards and Vane is sitting in the front pew. Lambrick doesn't need a Harding son-in-law any more. Since the gasworks he sits on the Crown's board, and the Works are half his. What he needs is a daughter who can't read his books aloud, and he has waited for the one room where the Lord Chancellor can seal her mad in front of everyone. Nixon whistles their old signal, danger. Nathaniel looks, sees Ajax, and understands they have the length of one question. In the front pew Eldgard sees it too and half rises; a marshal's hand settles on his shoulder, and he sits.","loc":"The Harding chapel","when":"At the groom's shoulder, Nixon sees the vestry door ease open: AJAX, in the room where Tamara asked him an hour ago, with two Bethlem attendants, a strait-coat and a lunacy order for Tamara Lambrick, spinster: her father's signature as nearest relative, two doctors', and the Chancery seal, because lunatics are the Lord Chancellor's wards and Vane is sitting in the front pew.","th":"lambrick","also":["guard"],"ch":["nixon","ajax","nathaniel","tamara","lambrick","eldgard","vane"],"turn":"","w":308,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>At the groom's shoulder, Nixon sees the vestry door ease open: AJAX, in the room where Tamara asked him an hour ago, with two Bethlem attendants, a strait-coat and a lunacy order for <em>Tamara Lambrick, spinster<\/em>: her father's signature as nearest relative, two doctors', and the Chancery seal, because lunatics are the Lord Chancellor's wards and Vane is sitting in the front pew. Lambrick doesn't need a Harding son-in-law any more. Since the gasworks he sits on the Crown's board, and the Works are half his. What he needs is a daughter who can't read his books aloud, and he has waited for the one room where the Lord Chancellor can seal her mad in front of everyone. Nixon whistles their old signal, <em>danger<\/em>. Nathaniel looks, sees Ajax, and understands they have the length of one question. In the front pew Eldgard sees it too and half rises; a marshal's hand settles on his shoulder, and he sits.<\/p>"},{"oref":"Scene 11","id":161,"seq":11,"title":"The glasshouse","added":true,"act":"Act Two","kind":"scene","sum":"Across the lawn, nobody is watching. The Lost One sits under the orange trees with her mittens off, humming the Lantern Hymn to them in a key no church uses, and waits. When Kit and Grise's girls come through the glass on the minute, with Josephine's directions, she doesn't fight. She stands and holds out her wrists to Kit, who has heard what that touch does and takes a long breath before she puts the irons on. She breathes once on the pane by the door. Frost writes itself across it. She couldn't have walked to the core: it's Crown iron now, and the cage that can put her in her mother's place is in Crown hands, so the only way in is as somebody's prisoner. And if she'd gone with Alice in the room, Alice would have followed. She goes with them the way Miriam went to the bridge: on purpose, and without saying goodbye.","loc":"The glasshouse","when":"Across the lawn, nobody is watching.","th":"white","also":["vykra"],"ch":["lostone","grise","josephine","kit"],"turn":"","w":580,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Across the lawn, nobody is watching. The Lost One sits under the orange trees with her mittens off, humming the
