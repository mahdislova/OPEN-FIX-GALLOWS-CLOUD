iding her until she gets better. The Lost One steps out and, before Alice can stop her, takes Nathaniel's bare hand. Nothing happens. No frost. All three of them stare. He could take the Frost Killer to his father tonight: four dead in the market, his father's hunt, the first real job he has ever been given, and the one thing that would finally make him the useful son. He looks at the girl holding his hand, and at Alice. He doesn't. It's the first time in his life he acts against his own lie, and it's a crime.","loc":"The tunnel mouth","when":"Nathaniel is waiting.","th":"white","also":["sisters"],"ch":["nathaniel","alice","lostone"],"turn":"","w":249,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Nathaniel is waiting. He found it the way an engineer would: her ghostlight runs on his design and whines at his pitch, and he spent the night walking the lamp-tunnels under his own family's Works with a listening horn until he heard it. It's built from the schematic that left his coat in the dark at his engagement ball. Alice tells him the truth as she believes it: her sister nearly froze to death and came back wrong, and she's hiding her until she gets better. The Lost One steps out and, before Alice can stop her, takes Nathaniel's bare hand. Nothing happens. No frost. All three of them stare. He could take the Frost Killer to his father tonight: four dead in the market, his father's hunt, the first real job he has ever been given, and the one thing that would finally make him the useful son. He looks at the girl holding his hand, and at Alice. He doesn't. It's the first time in his life he acts against his own lie, and it's a crime.<\/p>"},{"oref":"Scene 16","id":62,"seq":16,"title":"Tamara's bedroom","added":false,"act":"Act Three","kind":"scene","sum":"Ajax is sitting on her bed. \"Your father sends his love. Stay out of his safe.\" He leaves the apple core on her pillow.","loc":"Tamara's bedroom","when":"Ajax is sitting on her bed.","th":"lambrick","also":[],"ch":["tamara","ajax"],"turn":"","w":142,"ed":"","fl":[],"html":"<p>Ajax is sitting on her bed. \"Your father sends his love. Stay out of his safe.\" He leaves the apple core on her pillow.<\/p>"},{"oref":"Scene 17","id":63,"seq":17,"title":"The tunnel mouth","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel turns to go. The Lost One, sniffing the air like an animal: \"You smell like the man who keeps my mother.\" Then she looks at him properly, and her face changes. \"I know you. You were the boy in the warm room.\" He has no idea what she means. Cut to black.","loc":"The tunnel mouth","when":"Nathaniel turns to go.","th":"white","also":["harding"],"ch":["nathaniel","lostone"],"turn":"","w":145,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Nathaniel turns to go. The Lost One, sniffing the air like an animal: \"You smell like the man who keeps my mother.\" Then she looks at him properly, and her face changes. \"I know you. You were the boy in the warm room.\" He has no idea what she means. Cut to black.<\/p>"}]},{"n":4,"title":"The Hearing","time":"38 DAYS TO FIRST SNOW","clock":"38 DAYS TO FIRST SNOW","act":"I","log":"Nathaniel and Alice hang Lambrick's enforcer over the Thames for Jamie's murder and learn Jamie paid him. Then Felix Hawke dies on the witness stand with frost on his lips, and all of London blames the girl hiding in the Harding glasshouse. Nixon, alone, finds the madman in Newgate whom Jamie visited every Sunday, and leaves with a nursery rhyme.","sum":"Josephine washes frost off her fingers","turn":"Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh","focus":"the Crown's hearing on the Harding Charter, and who killed Jamie","piece":"the coal-docks fight with Ajax; a murder on the witness stand","threads":["lambrick","sisters","harding","guard","investigation","vykra","city"],"frame":"<blockquote><p><strong>Focus:<\/strong> the Crown's hearing on the Harding Charter, and who killed Jamie<\/p><p><strong>Set pieces:<\/strong> the coal-docks fight with Ajax; a murder on the witness stand<\/p><p><strong>Double twist:<\/strong> the man Nathaniel hunts was hired by his own brother, and the \"Frost Killer\" who kills Felix in public is Nathaniel's mother<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":64,"seq":1,"title":"The Works gate, 2 November, ten minutes before the blackout","added":false,"act":"Cold open","kind":"scene","sum":"Lambrick's coach waits at the curb. He has already paid AJAX two hundred guineas to cut the outer grid tonight and shame the Hardings in front of their own ball. JAMIE steps out of the fog and pays Ajax double to cut it at one exact minute and tell Lambrick nothing: the whole city dark at once, so nobody looks twice at one Harding going down to the core inside it. Ajax, counting the gold: \"His Lordship says when the light dies, London comes back to coal.\" Jamie: \"Then London can freeze honestly.\" The audience now knows what Nathaniel doesn't: two men bought the same blackout for opposite reasons, and only one of them knew what was under the Works.","loc":"The Works gate","when":"Lambrick's coach waits at the curb.","th":"lambrick","also":["investigation"],"ch":["jamie","ajax","lambrick"],"turn":"","w":205,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Lambrick's coach waits at the curb. He has already paid AJAX two hundred guineas to cut the outer grid tonight and shame the Hardings in front of their own ball. JAMIE steps out of the fog and pays Ajax double to cut it at one exact minute and tell Lambrick nothing: the whole city dark at once, so nobody looks twice at one Harding going down to the core inside it. Ajax, counting the gold: \"His Lordship says when the light dies, London comes back to coal.\" Jamie: \"Then London can freeze honestly.\" The audience now knows what Nathaniel doesn't: two men bought the same blackout for opposite reasons, and only one of them knew what was under the Works.<\/p>"},{"oref":"Scene 2","id":65,"seq":2,"title":"Harding glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look. Whimsy: frozen butterflies on the panes, an orange tree. The Lost One makes snow for the first time, a little flurry over her palm, and laughs like a child. Alice and Nathaniel watch her and have their first real conversation, about everything except the thing between them. Alice gives him her theory, the one she's built to live inside: \"Something came back in her from the cold. It's got its own wants. But Mim's under it. Wren says the memories come back.\" Nathaniel has seen the girl touch his hand without freezing it. He looks at Alice with something like pity and doesn't argue. Later, the Lost One tries again, very carefully: \"Ali. Under the bed—\" Alice hands her an orange. \"Eat that.\" Behind the fence.","loc":"Harding glasshouse","when":"Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look.","th":"sisters","also":["harding"],"ch":["nathaniel","alice","lostone"],"turn":"","w":462,"ed":"","fl":[],"html":"<p>Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look. Whimsy: frozen butterflies on the panes, an orange tree. The Lost One makes snow for the first time, a little flurry over her palm, and laughs like a child. Alice and Nathaniel watch her and have their first real conversation, about everything except the thing between them. Alice gives him her theory, the one she's built to live inside: \"Something came back in her from the cold. It's got its own wants. But Mim's under it. Wren says the memories come back.\" Nathaniel has seen the girl touch his hand without freezing it. He looks at Alice with something like pity and doesn't argue. Later, the Lost One tries again, very carefully: \"Ali. Under the bed—\" Alice hands her an orange. \"Eat that.\" Behind the fence.<\/p>"},{"oref":"Scene 3","id":66,"seq":3,"title":"Harding House, breakfast","added":false,"act":"Act One","kind":"scene","sum":"Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir. Josephine: the Lambrick wedding moves up. Nathaniel: \"No.\" His first open defiance. Josephine reads the hearing's witness list and stops at one name: Insp. F. Hawke, on the death of James Harding. A bullet hole in front of the Crown means a Crown inquiry, and a Crown inquiry goes down the core stair and finds the Tithe waiting for her last son.","loc":"Harding House","when":"Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir.","th":"harding","also":["lambrick"],"ch":["eldgard","josephine","nathaniel"],"turn":"","w":192,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir. Josephine: the Lambrick wedding moves up. Nathaniel: \"No.\" His first open defiance. Josephine reads the hearing's witness list and stops at one name: <em>Insp. F. Hawke, on the death of James Harding.<\/em> A bullet hole in front of the Crown means a Crown inquiry, and a Crown inquiry goes down the core stair and finds the Tithe waiting for her last son.<\/p>"},{"oref":"Scene 4","id":67,"seq":4,"title":"Guard tower, the armoury","added":false,"act":"Act One","kind":"scene","sum":"A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight. Cole is back, bandaged, two fingers short, desperate to be useful, and Nixon puts him on the duty roster to give him back his pride. Then Tamara comes to Nixon, the only man in London she trusts. Ajax was in her room, and her father paid Ajax the night Jamie died. She stands close. Nixon wants to say three things and says none of them. \"I'll put a man on your door, miss.\" \"I'd rather you were the man.\" Silence.","loc":"Guard tower","when":"A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight.","th":"guard","also":["city","lambrick"],"ch":["nixon","cole","tamara"],"turn":"","w":435,"ed":"","fl":[],"html":"<p>A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight. Cole is back, bandaged, two fingers short, desperate to be useful, and Nixon puts him on the duty roster to give him back his pride. Then Tamara comes to Nixon, the only man in London she trusts. Ajax was in her room, and her father paid Ajax the night Jamie died. She stands close. Nixon wants to say three things and says none of them. \"I'll put a man on your door, miss.\" \"I'd rather you were the man.\" Silence.<\/p>"},{"oref":"Scene 5","id":69,"seq":5,"title":"Glasshouse workbench","added":false,"act":"Act One","kind":"scene","sum":"Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night. Nathaniel builds her a real gauntlet and fits it to her hand strap by strap. \"Hold still, Bounds.\" She does, which she has never done for anyone. A love scene with no kissing in it.","loc":"Glasshouse workbench","when":"Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night.","th":"investigation","also":["lambrick"],"ch":["alice","nathaniel"],"turn":"","w":232,"ed":"","fl":[],"html":"<p>Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night. Nathaniel builds her a real gauntlet and fits it to her hand strap by strap. \"Hold still, Bounds.\" She does, which she has never done for anyone. A love scene with no kissing in it.<\/p>"},{"oref":"Scene 6","id":252,"seq":6,"title":"The glasshouse, late","added":true,"act":"Act One","kind":"scene","sum":"Alice is asleep at the workbench, the new gauntlet still strapped to her hand. The Lost One sits with Nathaniel by the stove, and out of nowhere, in Miriam's voice, gives him something of his brother's: \"He talked about you. On the bridge stair, when he was cold. He said you'd fly before you ever learned to walk, and that you were the only one of them worth saving.\" Nathaniel has spent his whole life believing he was the spare. \"He said that?\" \"To me.\" She's careful not to say who me is. He doesn't think to ask. He sits with it until the stove goes out: the first time anyone has told him he was worth something without wanting something back, and it came out of a dead woman's mouth.","loc":"The glasshouse","when":"Alice is asleep at the workbench, the new gauntlet still strapped to her hand.","th":"harding","also":["sisters"],"ch":["lostone","nathaniel","alice","jamie"],"turn":"","w":260,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>Alice is asleep at the workbench, the new gauntlet still strapped to her hand. The Lost One sits with Nathaniel by the stove, and out of nowhere, in Miriam's voice, gives him something of his brother's: \"He talked about you. On the bridge stair, when he was cold. He said you'd fly before you ever learned to walk, and that you were the only one of them worth saving.\" Nathaniel has spent his whole life believing he was the spare. \"He said that?\" \"To me.\" She's careful not to say who <em>me<\/em> is. He doesn't think to ask. He sits with it until the stove goes out: the first time anyone has told him he was worth something without wanting something back, and it came out of a dead woman's mouth.<\/p>"},{"oref":"Scene 7","id":70,"seq":7,"title":"Vykra laundry","added":false,"act":"Act Two","kind":"scene","sum":"Grise: \"Bring me the frost girl.\" Alice: \"No.\" Kit holds out the scissors, handle first. Grise cuts the Vykra knot out of Alice's glove with one snip. \"Then you're no one's.\" Alice walks out into the rain with nowhere to belong. Under the awning, she takes his handkerchief out of her coat and folds it into the glove, where the knot used to be.","loc":"Vykra laundry","when":"Grise: \"Bring me the frost girl.\" Alice: \"No.\" Grise cuts the Vykra knot out of Alice's glove with one snip.","th":"vykra","also":["sisters"],"ch":["grise","alice","kit"],"turn":"","w":274,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Grise: \"Bring me the frost girl.\" Alice: \"No.\" Kit holds out the scissors, handle first. Grise cuts the Vykra knot out of Alice's glove with one snip. \"Then you're no one's.\" Alice walks out into the rain with nowhere to belong. Under the awning, she takes his handkerchief out of her coat and folds it into the glove, where the knot used to be.<\/p>"},{"oref":"Scene 8","id":71,"seq":8,"title":"Coal docks, Thursday night, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel and Alice ambush Ajax among the coal barges. The Black Gauntlet hits like a steam hammer, WHUNK, and Nathaniel recognises his own stolen prototype in it. He's losing. Alice blinds Ajax with a flash-burst from her new gauntlet, and together they hook him onto a crane and swing him out over the black river.","loc":"Coal docks","when":"Nathaniel and Alice ambush Ajax among the coal barges.","th":"lambrick","also":["investigation"],"ch":["nathaniel","alice","ajax"],"turn":"","w":223,"ed":"","fl":[],"html":"<p>Nathaniel and Alice ambush Ajax among the coal barges. The Black Gauntlet hits like a steam hammer, <em>WHUNK<\/em>, and Nathaniel recognises his own stolen prototype in it. He's losing. Alice blinds Ajax with a flash-burst from her new gauntlet, and together they hook him onto a crane and swing him out over the black river.<\/p>"},{"oref":"Scene 9","id":72,"seq":9,"title":"The crane","added":false,"act":"Act Two","kind":"scene","sum":"Ajax, upside down, laughs. \"Your brother paid me. Lambrick paid me too, but your brother paid double. I cut the outer grid. I never touched him.\" Then: \"Your father went down after. Ask the Guard who fired.\" Alice: \"Pull him up. He's the only witness we have.\" Nathaniel's hand is on the lever, and two true things pull at it: the man who helped kill his brother, or the one voice that can put Lambrick in the dock. \"He's Jamie's grave,\" he says, and lets go. Ajax drops into the Thames. Splash. The Thames keeps him, for now.","loc":"The crane","when":"Ajax, upside down, laughs.","th":"investigation","also":["lambrick","guard"],"ch":["ajax","nathaniel","alice"],"turn":"","w":335,"ed":"","fl":[],"html":"<p>Ajax, upside down, laughs. \"Your brother paid me. Lambrick paid me too, but your brother paid double. I cut the outer grid. I never touched him.\" Then: \"Your father went down after. Ask the Guard who fired.\" Alice: \"Pull him up. He's the only witness we have.\" Nathaniel's hand is on the lever, and two true things pull at it: the man who helped kill his brother, or the one voice that can put Lambrick in the dock. \"He's Jamie's grave,\" he says, and lets go. Ajax drops into the Thames. <em>Splash.<\/em> The Thames keeps him, for now.<\/p>"},{"oref":"Scene 10","id":254,"seq":10,"title":"Harding House, the servants' stair at three in the morning, then the back stairs","added":true,"act":"Act Two","kind":"scene","sum":"Nathaniel can't sleep, so he waits where nobody waits: at the foot of the servants' stair that runs down to the Works passage. At three his father comes up it with a lantern, frost on his cuffs in a house that has never been cold, and a face Nathaniel has never seen on him. Caught on a stair in his shirtsleeves, Eldgard has to lie standing up, and he does it well. Nathaniel: \"Jamie paid Lambrick's man. Why?\" Eldgard: \"Your brother was ill. Melancholy. He wanted to destroy this house.\" It's half true, which is how Eldgard lies. Then, before Nathaniel can ask about the frost, the bait he has wanted all his life: \"After the hearing I'll take you into the work. All of it.\" Nathaniel takes it, and forgets to ask. On the back stairs afterwards, Josephine asks Byron where Nathaniel goes at night. Byron lies for the boy. It's the first time he has ever lied to her.","loc":"Harding House","when":"Nathaniel can't sleep, so he waits where nobody waits: at the foot of the servants' stair that runs down to the Works passage.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","josephine","byron"],"turn":"","w":322,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Nathaniel can't sleep, so he waits where nobody waits: at the foot of the servants' stair that runs down to the Works passage. At three his father comes up it with a lantern, frost on his cuffs in a house that has never been cold, and a face Nathaniel has never seen on him. Caught on a stair in his shirtsleeves, Eldgard has to lie standing up, and he does it well. Nathaniel: \"Jamie paid Lambrick's man. Why?\" Eldgard: \"Your brother was ill. Melancholy. He wanted to destroy this house.\" It's half true, which is how Eldgard lies. Then, before Nathaniel can ask about the frost, the bait he has wanted all his life: \"After the hearing I'll take you into the work. All of it.\" Nathaniel takes it, and forgets to ask. On the back stairs afterwards, Josephine asks Byron where Nathaniel goes at night. Byron lies for the boy. It's the first time he has ever lied to her.<\/p>"},{"oref":"Scene 11","id":75,"seq":11,"title":"Newgate, cell 1417","added":false,"act":"Act Two","kind":"scene","sum":"Nixon, alone, in civilian coat, with the slip. The prisoner is an old man, SILAS MARSH, seventy if a day, in the dark at the end of the debtors' wing, picking at a string he calls his harp. Nixon: \"Jamie Harding came here every Sunday. Why?\" The old man hums, then pinches Nixon's cheek through the bars and cackles. \"Marian's chin! Marian's chin!\" Nixon goes still. \"What did you say?\" \"Seven in the Orchard, ripe for the fall. One on the tree for the lantern's call. Thirteen steps down where the cold water drips, count the apples, kiss the stones' lips.\" Nixon grabs the bars: \"Enough. Why was Jamie Harding visiting you? Tell me, you old fool.\" Marsh only cocks his head and smiles. \"He cried too, you know. Same place in the song.\" Then he turns his back and goes back to his harp. Nixon leaves with a nursery rhyme and a cold feeling he can't name.","loc":"Newgate","when":"Nixon, alone, in civilian coat, with the slip.","th":"guard","also":["investigation"],"ch":["nixon","marsh"],"turn":"","w":491,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Nixon, alone, in civilian coat, with the slip. The prisoner is an old man, SILAS MARSH, seventy if a day, in the dark at the end of the debtors' wing, picking at a string he calls his harp. Nixon: \"Jamie Harding came here every Sunday. Why?\" The old man hums, then pinches Nixon's cheek through the bars and cackles. \"Marian's chin! Marian's chin!\" Nixon goes still. \"What did you say?\" \"Seven in the Orchard, ripe for the fall. One on the tree for the lantern's call. Thirteen steps down where the cold water drips, count the apples, kiss the stones' lips.\" Nixon grabs the bars: \"Enough. Why was Jamie Harding visiting you? Tell me, you old fool.\" Marsh only cocks his head and smiles. \"He cried too, you know. Same place in the song.\" Then he turns his back and goes back to his harp. Nixon leaves with a nursery rhyme and a cold feeling he can't name.<\/p>"},{"oref":"Scene 12","id":76,"seq":12,"title":"Glasshouse","added":false,"act":"Act Two","kind":"scene","sum":"Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll say more: \"Someone made her, and I'll say so in front of the Crown.\" Therefore he's now the most dangerous man in London. Outside, under the garden wall, Josephine has heard every word. She has known for a week where her son goes at night, whatever Byron tells her. She says nothing to her husband. A Frost Killer dragged out of the Harding glasshouse takes her son to the dock beside her, so the girl will have to be caught somewhere else. On the garden path afterwards, Josephine finds the girl alone and offers her passage out of London: \"Do not make me insist.\" The girl looks at her with an ancient, unblinking stillness. \"I lived on your mantel for sixteen years, Lady Harding. You dusted my glass every morning. You knew I was a child, and you never once opened it.\" The temperature drops. \"I won't tell Alice. I won't tell your husband. I don't care. But you'll leave us alone.\" Josephine now knows exactly what lives in her watcher's room, and what it saw. She waits.","loc":"Glasshouse","when":"Felix tracks Alice there.","th":"investigation","also":["sisters"],"ch":["felix","alice","lostone"],"turn":"","w":241,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll say more: \"Someone made her, and I'll say so in front of the Crown.\" <em>Therefore<\/em> he's now the most dangerous man in London. Outside, under the garden wall, Josephine has heard every word. She has known for a week where her son goes at night, whatever Byron tells her. She says nothing to her husband. A Frost Killer dragged out of the Harding glasshouse takes her son to the dock beside her, so the girl will have to be caught somewhere else. On the garden path afterwards, Josephine finds the girl alone and offers her passage out of London: \"Do not make me insist.\" The girl looks at her with an ancient, unblinking stillness. \"I lived on your mantel for sixteen years, Lady Harding. You dusted my glass every morning. You knew I was a child, and you never once opened it.\" The temperature drops. \"I won't tell Alice. I won't tell your husband. I don't care. But you'll leave us alone.\" Josephine now knows exactly what lives in her watcher's room, and what it saw. She waits.<\/p>"},{"oref":"Scene 13","id":77,"seq":13,"title":"Parliament, committee room, the hearing","added":false,"act":"Act Three","kind":"scene","sum":"Lambrick argues that the Hardings are hiding something under the Works, and reads the Works' own feed figures into the record: the east wall draws a tenth less than it did in October. Eldgard is calm. Vane presides, and never once asks what. Nathaniel sits beside his father. Tamara is in the gallery, Nixon's Lanterns are at the doors, and a veiled woman sits in the back row. At the recess she crosses to the stand with a glass of water: \"You look pale, Inspector.\" Felix drinks.","loc":"Parliament","when":"Lambrick argues that the Hardings are hiding something under the Works.","th":"city","also":["harding"],"ch":["lambrick","eldgard","vane","nathaniel","tamara","josephine","felix"],"turn":"","w":236,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Lambrick argues that the Hardings are hiding something under the Works, and reads the Works' own feed figures into the record: the east wall draws a tenth less than it did in October. Eldgard is calm. Vane presides, and never once asks what. Nathaniel sits beside his father. Tamara is in the gallery, Nixon's Lanterns are at the doors, and a veiled woman sits in the back row. At the recess she crosses to the stand with a glass of water: \"You look pale, Inspector.\" Felix drinks.<\/p>"},{"oref":"Scene 14","id":78,"seq":14,"title":"The witness stand, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Felix: \"The deaths at the market were caused by a girl who should be dead, and the Harding Works—\" He coughs. Frost spreads across his lips and his eyes go white. He dies on the stand. The cry goes up: \"The Frost Killer is here!\" Doors slam. Nixon's Lanterns fire flash-bursts into the ceiling to stop the stampede. Vane orders the Frost Killer hunted \"with every lamp in London.\" The vote is postponed, and sympathy swings toward the Hardings. In the crush on the gallery stairs, Tamara sees the veiled woman's glove, with a Vykra knot stitched inside it. A needle drops on the stair. Tamara pockets it. That night, alone in his office, Vane takes Felix Hawke's case file out of the Yard's dispatch box, reads the first page, and feeds it to his grate a sheet at a time.","loc":"The witness stand","when":"Felix: \"The deaths at the market were caused by a girl who should be dead, and the Harding Works—\" He coughs.","th":"vykra","also":["investigation","city","guard"],"ch":["felix","vane","tamara","josephine"],"turn":"","w":520,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Felix: \"The deaths at the market were caused by a girl who should be dead, and the Harding Works—\" He coughs. Frost spreads across his lips and his eyes go white. He dies on the stand. The cry goes up: \"The Frost Killer is here!\" Doors slam. Nixon's Lanterns fire flash-bursts into the ceiling to stop the stampede. Vane orders the Frost Killer hunted \"with every lamp in London.\" The vote is postponed, and sympathy swings toward the Hardings. In the crush on the gallery stairs, Tamara sees the veiled woman's glove, with a Vykra knot stitched inside it. A needle drops on the stair. Tamara pockets it. That night, alone in his office, Vane takes Felix Hawke's case file out of the Yard's dispatch box, reads the first page, and feeds it to his grate a sheet at a time.<\/p>"},{"oref":"Scene 15","id":81,"seq":15,"title":"Glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. \"Winter's kiss. That's Vykra.\" Therefore somebody is framing her sister.","loc":"Glasshouse","when":"Nathaniel brings the news: Felix was killed by frost.","th":"sisters","also":["vykra"],"ch":["nathaniel","alice","lostone"],"turn":"","w":176,"ed":"","fl":[],"html":"<p>Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. \"Winter's kiss. That's Vykra.\" <em>Therefore<\/em> somebody is framing her sister.<\/p>"},{"oref":"Scene 16","id":82,"seq":16,"title":"Guard tower, the roof, then the armoury","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel tells Nixon what Ajax said: ask the Guard who fired. Nixon goes very still. \"Find me the name, Nix.\" \"I'll find it.\" The rifles came back from Nathaniel's shop this week with their logs bound into the cases, and that night he finds it: his own rifle in the discharge log, one round, 2 November. He tears out the page and burns it in the stove. From the bunk-room door, Cole watches him do it, and later copies the page from memory into his diary.","loc":"Guard tower","when":"Nathaniel tells Nixon what Ajax said: ask the Guard who fired.","th":"guard","also":["investigation"],"ch":["nathaniel","nixon","cole"],"turn":"","w":401,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Nathaniel tells Nixon what Ajax said: ask the Guard who fired. Nixon goes very still. \"Find me the name, Nix.\" \"I'll find it.\" The rifles came back from Nathaniel's shop this week with their logs bound into the cases, and that night he finds it: his own rifle in the discharge log, one round, 2 November. He tears out the page and burns it in the stove. From the bunk-room door, Cole watches him do it, and later copies the page from memory into his diary.<\/p>"},{"oref":"Scene 17","id":84,"seq":17,"title":"Vykra laundry","added":false,"act":"Act Three","kind":"scene","sum":"Tamara puts the needle on Grise's counting table. \"One of yours killed a policeman in front of the Crown. I want to know who. And I want in.\" Grise looks at her for a long time, then smiles. Alice was cut out yesterday, and Tamara is the new girl.","loc":"Vykra laundry","when":"Tamara puts the needle on Grise's counting table.","th":"vykra","also":[],"ch":["tamara","grise"],"turn":"","w":207,"ed":"","fl":[],"html":"<p>Tamara puts the needle on Grise's counting table. \"One of yours killed a policeman in front of the Crown. I want to know who. And I want in.\" Grise looks at her for a long time, then smiles. Alice was cut out yesterday, and Tamara is the new girl.<\/p>"},{"oref":"Scene 18","id":85,"seq":18,"title":"Harding House, Josephine's dressing room","added":false,"act":"Tag","kind":"scene","sum":"Josephine lifts her veil, peels off gloves with a Vykra knot inside, and washes frost-dust from her fingertips in a porcelain bowl. The water skins over with ice. In the mirror, Byron is standing in the doorway.","loc":"Harding House","when":"Josephine lifts her veil, peels off gloves with a Vykra knot inside, and washes frost-dust from her fingertips in a porcelain bowl.","th":"harding","also":["vykra"],"ch":["josephine","byron"],"turn":"","w":176,"ed":"","fl":[],"html":"<p>Josephine lifts her veil, peels off gloves with a Vykra knot inside, and washes frost-dust from her fingertips in a porcelain bowl. The water skins over with ice. In the mirror, Byron is standing in the doorway.<\/p>"}]},{"n":5,"title":"Lantern Night","time":"33 DAYS TO FIRST SNOW","clock":"33 DAYS TO FIRST SNOW","act":"I","log":"On the night London celebrates its light, Nathaniel breaks into his own family's Works to see what Jamie died for. He finds a chained mother bleeding green, learns his father has always known, and hears the door lock behind him, on Nixon's order.","sum":"The Lost One: \"I'm going to free her. Even if they all freeze.\"","turn":"The light is a woman in chains, and his father has always known. Nixon locks the door","focus":"the heist into the core","piece":"four separate plans on one festival night, ending with every lamp in London blazing white and bursting at once, and a crush on Westminster Bridge. (The city goes fully dark twice in this season: for an hour in the pilot, and for good in the finale. Lantern Night is the other thing light can do: it screams.)","threads":["white","harding","sisters","vykra","guard","lambrick","city"],"frame":"<blockquote><p><strong>Focus:<\/strong> the heist into the core<\/p><p><strong>Set piece:<\/strong> four separate plans on one festival night, ending with every lamp in London blazing white and bursting at once, and a crush on Westminster Bridge. (The city goes fully dark twice in this season: for an hour in the pilot, and for good in the finale. Lantern Night is the other thing light can do: it screams.)<\/p><p><strong>Sting:<\/strong> the light is a woman in chains, his father has always known, and the door is locked by his best friend. What the chain costs, and who is next to pay it, stay in the dark<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":86,"seq":1,"title":"Tyburn, the same winter, 1489","added":false,"act":"Cold open","kind":"scene","sum":"The same voice over black, still unplaced: \"The Hargraves of the Orchard. Their names are scratched on a wall under Tyburn.\" The Hargrave raid. Torches, young cousins of the Harding blood, and leading them the girl of nineteen from the treeline in the pilot, reaching the iron chain with a hammer. Alistair cuts her down at the lock. Somebody in the dark screams her name: \"Marian!\" By dawn the empty gallows field from the pilot is full: three thousand Hargraves on Harding timber, and their wives and children walked down thirteen steps into the dark. The heist we're about to watch has been tried before, and it failed.","loc":"Tyburn","when":"The Hargrave raid.","th":"white","also":["harding"],"ch":["alistair"],"turn":"","w":371,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>The same voice over black, still unplaced: \"The Hargraves of the Orchard. Their names are scratched on a wall under Tyburn.\" The Hargrave raid. Torches, young cousins of the Harding blood, and leading them the girl of nineteen from the treeline in the pilot, reaching the iron chain with a hammer. Alistair cuts her down at the lock. Somebody in the dark screams her name: \"Marian!\" By dawn the empty gallows field from the pilot is full: three thousand Hargraves on Harding timber, and their wives and children walked down thirteen steps into the dark. The heist we're about to watch has been tried before, and it failed.<\/p>"},{"oref":"Scene 2","id":87,"seq":2,"title":"Harding Works, the Upper Gallery","added":false,"act":"Act One","kind":"scene","sum":"Eldgard brings Nathaniel into \"the work\" at last: a cathedral of glass vats where engineers \"grow gallowglass from Tyburn iron.\" Nathaniel's joy is real and painful to watch. He asks about the east-wall gauges. Eldgard doesn't look up: \"The output dips at the end of a cycle. My father saw it in 1839. It comes back.\" Then: \"At the solstice I'll show you the rest.\"","loc":"Harding Works","when":"Eldgard brings Nathaniel into \"the work\" at last: a cathedral of glass vats where engineers \"grow gallowglass from Tyburn iron.\" Nathaniel's joy is real and painful to watch.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":174,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Eldgard brings Nathaniel into \"the work\" at last: a cathedral of glass vats where engineers \"grow gallowglass from Tyburn iron.\" Nathaniel's joy is real and painful to watch. He asks about the east-wall gauges. Eldgard doesn't look up: \"The output dips at the end of a cycle. My father saw it in 1839. It comes back.\" Then: \"At the solstice I'll show you the rest.\"<\/p>"},{"oref":"Scene 3","id":88,"seq":3,"title":"Glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room. My mother isn't in a nice room.\" Nathaniel defends his father; Alice defends her sister. \"He's my father, Bounds.\" \"She's my sister, Harding.\" Their first fight, and it's about family.","loc":"Glasshouse","when":"Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room.","th":"sisters","also":["harding"],"ch":["nathaniel","lostone","alice"],"turn":"","w":223,"ed":"","fl":[],"html":"<p>Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room. My mother isn't in a nice room.\" Nathaniel defends his father; Alice defends her sister. \"He's my father, Bounds.\" \"She's my sister, Harding.\" Their first fight, and it's about family.<\/p>"},{"oref":"Scene 4","id":89,"seq":4,"title":"Harding House, the silver pantry","added":false,"act":"Act One","kind":"scene","sum":"Byron gives Nathaniel his old Guard key on a black ribbon. Jamie borrowed it in October, had it copied, and gave it back with a note Byron has kept in his pocket ever since: If I don't come up, give it to Nat. Byron guarded the core thirty years ago: \"I heard her every night. I stopped hearing it when I stopped letting myself.\" He lights himself back down the servants' stair with a tallow candle. He hasn't carried a green lamp since the core, and nobody in the house has ever asked why. He keeps quiet about Josephine's hands. Not yet.","loc":"Harding House","when":"Byron gives Nathaniel his old Guard key on a black ribbon.","th":"harding","also":["white"],"ch":["byron","nathaniel"],"turn":"","w":192,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Byron gives Nathaniel his old Guard key on a black ribbon. Jamie borrowed it in October, had it copied, and gave it back with a note Byron has kept in his pocket ever since: If I don't come up, give it to Nat. Byron guarded the core thirty years ago: \"I heard her every night. I stopped hearing it when I stopped letting myself.\" He lights himself back down the servants' stair with a tallow candle. He hasn't carried a green lamp since the core, and nobody in the house has ever asked why. He keeps quiet about Josephine's hands. Not yet.<\/p>"},{"oref":"Scene 5","id":90,"seq":5,"title":"Vykra laundry","added":false,"act":"Act One","kind":"scene","sum":"Grise tests her new girl: a Works lock cipher, solved in four minutes. Grise lets slip that the inner codes change on Lantern Night. Tamara is welcomed with tea and a knife. For the first time in her life she belongs somewhere because of her mind.","loc":"Vykra laundry","when":"Grise tests her new girl: a Works lock cipher, solved in four minutes.","th":"vykra","also":[],"ch":["grise","tamara"],"turn":"","w":200,"ed":"","fl":[],"html":"<p>Grise tests her new girl: a Works lock cipher, solved in four minutes. Grise lets slip that the inner codes change on Lantern Night. Tamara is welcomed with tea and a knife. For the first time in her life she belongs somewhere because of her mind.<\/p>"},{"oref":"Scene 6","id":255,"seq":6,"title":"The Guard tower roofs, afternoon","added":true,"act":"Act One","kind":"scene","sum":"Lantern Night is hours away, and for the length of one scene they're nine years old again. Nathaniel turns up with two prototype boosters he isn't supposed to have, and he and Nixon race them across the Charing Cross rooftops, chimney to chimney, kshhh-THOOM, kshhh-THOOM, talking in the whistles they made up as boys: left, mine, you're losing. Nixon wins. Nathaniel lands in a coal scuttle on the last roof, and Nixon laughs so hard he has to sit down. It's the best afternoon either of them has had since the engagement. Nathaniel goes home to dress. Nixon stays on the roof and takes out the order that has been in his breast pocket all afternoon, in Eldgard's hand: My son will come tonight. Let him through. Seal the core behind him. The girl doesn't leave. Underneath, in answer to a question Nixon never wrote down: He'll be with me.","loc":"Guard tower roofs","when":"Lantern Night is hours away, and for the length of one scene they're nine years old again.","th":"guard","also":["harding"],"ch":["nathaniel","nixon"],"turn":"","w":300,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Lantern Night is hours away, and for the length of one scene they're nine years old again. Nathaniel turns up with two prototype boosters he isn't supposed to have, and he and Nixon race them across the Charing Cross rooftops, chimney to chimney, <em>kshhh-THOOM, kshhh-THOOM<\/em>, talking in the whistles they made up as boys: <em>left<\/em>, <em>mine<\/em>, <em>you're losing<\/em>. Nixon wins. Nathaniel lands in a coal scuttle on the last roof, and Nixon laughs so hard he has to sit down. It's the best afternoon either of them has had since the engagement. Nathaniel goes home to dress. Nixon stays on the roof and takes out the order that has been in his breast pocket all afternoon, in Eldgard's hand: <em>My son will come tonight. Let him through. Seal the core behind him. The girl doesn't leave.<\/em> Underneath, in answer to a question Nixon never wrote down: <em>He'll be with me.<\/em><\/p>"},{"oref":"Scene 7","id":92,"seq":7,"title":"Glasshouse, planning","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. A model of the Works built out of teacups and oranges; the Lost One eats the core. Tamara arrives with the code, invited by Nathaniel. Alice and Tamara meet: the fiancée and the undercity girl, the new Vykra and the cut one. Every line is polite and every line is a knife. Nathaniel is the only one who doesn't notice.","loc":"Glasshouse","when":"Whimsy.","th":"sisters","also":["vykra"],"ch":["nathaniel","lostone","tamara","alice"],"turn":"","w":241,"ed":"","fl":[],"html":"<p>Whimsy. A model of the Works built out of teacups and oranges; the Lost One eats the core. Tamara arrives with the code, invited by Nathaniel. Alice and Tamara meet: the fiancée and the undercity girl, the new Vykra and the cut one. Every line is polite and every line is a knife. Nathaniel is the only one who doesn't notice.<\/p>"},{"oref":"Scene 8","id":93,"seq":8,"title":"Lantern Night, the Strand","added":false,"act":"Act Two","kind":"scene","sum":"Fireworks over a blazing green city, crowds, the Lord Mayor, and jubilee banners over the Strand: HARDING LIGHT. WARM AS A MOTHER'S ARMS. In the crowd, Lambrick, and beside him Ajax, very alive, with a new scar from brow to jaw: the river police cut him out of a barge's anchor chain, gauntlet and all, and Lambrick paid their fee. He's eating an apple. Behind them, a coal-mob. Their plan: cut the outer grid during the finale and let London see Harding light fail before the vote.","loc":"Lantern","when":"Fireworks over a blazing green city, crowds, the Lord Mayor.","th":"lambrick","also":["city"],"ch":["lambrick","ajax"],"turn":"","w":189,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Fireworks over a blazing green city, crowds, the Lord Mayor, and jubilee banners over the Strand: HARDING LIGHT. WARM AS A MOTHER'S ARMS. In the crowd, Lambrick, and beside him Ajax, very alive, with a new scar from brow to jaw: the river police cut him out of a barge's anchor chain, gauntlet and all, and Lambrick paid their fee. He's eating an apple. Behind them, a coal-mob. Their plan: cut the outer grid during the finale and let London see Harding light fail before the vote.<\/p>"},{"oref":"Scene 9","id":94,"seq":9,"title":"Thames outfall, the heist begins","added":false,"act":"Act Two","kind":"scene","sum":"The pipe is full of black water. The Lost One freezes it into a glass road and they walk inside the river. Jamie's key opens the first grate.","loc":"Thames outfall","when":"The pipe is full of black water.","th":"white","also":["investigation"],"ch":["lostone","alice","nathaniel","tamara"],"turn":"","w":153,"ed":"","fl":[],"html":"<p>The pipe is full of black water. The Lost One freezes it into a glass road and they walk inside the river. Jamie's key opens the first grate.<\/p>"},{"oref":"Scene 10","id":95,"seq":10,"title":"The gantries","added":false,"act":"Act Two","kind":"scene","sum":"Nixon, on the high walk, sees them pass. Orders say let them through. He gives the whistle they invented at nine years old, turn back. Nathaniel hears it, smiles because it's Nix, and keeps going.","loc":"The gantries","when":"Nixon, on the high walk, sees them pass.","th":"guard","also":[],"ch":["nixon","nathaniel"],"turn":"","w":171,"ed":"","fl":[],"html":"<p>Nixon, on the high walk, sees them pass. Orders say let them through. He gives the whistle they invented at nine years old, <em>turn back<\/em>. Nathaniel hears it, smiles because it's Nix, and keeps going.<\/p>"},{"oref":"Scene 11","id":96,"seq":11,"title":"The Strand, finale","added":false,"act":"Act Two","kind":"scene","sum":"Ajax's crew cuts the outer grid. The East End goes dark in the middle of the fireworks. Inside the Works, every lock resets, and the heisters are trapped between two doors with the Guard alarm ringing.","loc":"The Strand","when":"Ajax's crew cuts the outer grid.","th":"lambrick","also":["city"],"ch":["ajax"],"turn":"","w":174,"ed":"","fl":[],"html":"<p>Ajax's crew cuts the outer grid. The East End goes dark in the middle of the fireworks. Inside the Works, every lock resets, and the heisters are trapped between two doors with the Guard alarm ringing.<\/p>"},{"oref":"Scene 12","id":97,"seq":12,"title":"The shaft","added":false,"act":"Act Two","kind":"scene","sum":"Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep. Neither of them says thank you. Click. It opens.","loc":"The shaft","when":"Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep.","th":"vykra","also":[],"ch":["tamara","alice"],"turn":"","w":171,"ed":"","fl":[],"html":"<p>Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep. Neither of them says thank you. <em>Click.<\/em> It opens.<\/p>"},{"oref":"Scene 13","id":98,"seq":13,"title":"The core","added":false,"act":"Act Two","kind":"scene","sum":"They go down, and we see her whole for the first time. MORGANA: nine feet of ice and green fire, iron hooks through her shoulders and hips, her blood running green along channels into London. Her arms are spread wide in the hooks, like someone about to hold a child. She is singing, and it's the Weeping: the Lantern Hymn's tune, with none of the words.","loc":"The core","when":"They go down, and we see her whole for the first time.","th":"white","also":[],"ch":["lostone","alice","nathaniel","tamara","morgana"],"turn":"","w":213,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>They go down, and we see her whole for the first time. MORGANA: nine feet of ice and green fire, iron hooks through her shoulders and hips, her blood running green along channels into London. Her arms are spread wide in the hooks, like someone about to hold a child. She is singing, and it's the Weeping: the Lantern Hymn's tune, with none of the words.<\/p>"},{"oref":"Scene 14","id":99,"seq":14,"title":"The chain","added":false,"act":"Act Three","kind":"scene","sum":"\"Little frost. You came.\" The Lost One grabs the chain, and for one second her whole face changes: every song Miriam ever knew comes back into her at once. Then it burns her mittens to smoke. Alice pulls her back. Morgana, to Alice: \"You have my daughter's hand. Give it back.\" Alice, holding tighter: \"She's my sister. Whatever came back in her, my sister's under it.\" Morgana tilts her great head and looks at Alice with something terribly like pity. She doesn't correct her. The Lost One doesn't either. Then, to Nathaniel, almost gently: \"My daughter came up your stairs once, little Harding. You held her hand. And your brother is not dead. He is cold.\"","loc":"The chain","when":"\"Little frost.","th":"white","also":["sisters"],"ch":["morgana","lostone","alice","nathaniel"],"turn":"","w":319,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>\"Little frost. You came.\" The Lost One grabs the chain, and for one second her whole face changes: every song Miriam ever knew comes back into her at once. Then it burns her mittens to smoke. Alice pulls her back. Morgana, to Alice: \"You have my daughter's hand. Give it back.\" Alice, holding tighter: \"She's my sister. Whatever came back in her, my sister's under it.\" Morgana tilts her great head and looks at Alice with something terribly like pity. She doesn't correct her. The Lost One doesn't either. Then, to Nathaniel, almost gently: \"My daughter came up your stairs once, little Harding. You held her hand. And your brother is not dead. He is cold.\"<\/p>"},{"oref":"Scene 15","id":100,"seq":15,"title":"The lock","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel touches the chain, and it tightens. Morgana screams, and across London the lamps surge brighter. His blood feeds it, and for one frame, in the surge, he sees snow, and a man standing very still in it. Then it's gone, and he'll tell himself it was the dream. Jamie's glass blade is still stuck in the lock where he left it, and his diagram suddenly makes sense.","loc":"The lock","when":"Nathaniel touches the chain, and it tightens.","th":"white","also":["investigation","harding"],"ch":["nathaniel","morgana","eldgard"],"turn":"","w":481,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>Nathaniel touches the chain, and it tightens. Morgana screams, and across London the lamps surge brighter. His blood feeds it, and for one frame, in the surge, he sees snow, and a man standing very still in it. Then it's gone, and he'll tell himself it was the dream. Jamie's glass blade is still stuck in the lock where he left it, and his diagram suddenly makes sense.<\/p>"},{"oref":"Scene 16","id":101,"seq":16,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew. Some of it.\" He doesn't defend it. A Harding chained her four hundred years ago, and every Harding since has kept the hooks in, because four million people are warm. \"I didn't put her there, and I can't let her go. If that chain breaks, the light dies, the walls go with it, and it takes something from us. Something always does.\" Nathaniel: \"What did Jamie know that I don't?\" \"At the solstice I'll show you the rest.\" It's the second time today he has said it, and Nathaniel files that away.","loc":"The core","when":"Eldgard steps out of the dark; he's been waiting.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":257,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew. Some of it.\" He doesn't defend it. A Harding chained her four hundred years ago, and every Harding since has kept the hooks in, because four million people are warm. \"I didn't put her there, and I can't let her go. If that chain breaks, the light dies, the walls go with it, and it takes something from us. Something always does.\" Nathaniel: \"What did Jamie know that I don't?\" \"At the solstice I'll show you the rest.\" It's the second time today he has said it, and Nathaniel files that away.<\/p>"},{"oref":"Scene 17","id":102,"seq":17,"title":"The core door","added":false,"act":"Act Three","kind":"scene","sum":"It seals with a hiss, iron on glass. Behind the glass is Nixon, following orders, his lips moving on the oath he swore on the night he was made captain, Light the dark. Keep the flame, over and over, loud enough in his own head to drown out whatever Nathaniel is hearing. Nathaniel: \"Nix!\" Nixon doesn't look away, and that's worse.","loc":"The core door","when":"It seals with a hiss, iron on glass.","th":"guard","also":[],"ch":["nixon","nathaniel"],"turn":"","w":142,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>It seals with a hiss, iron on glass. Behind the glass is Nixon, following orders, his lips moving on the oath he swore on the night he was made captain, <em>Light the dark. Keep the flame<\/em>, over and over, loud enough in his own head to drown out whatever Nathaniel is hearing. Nathaniel: \"Nix!\" Nixon doesn't look away, and that's worse.<\/p>"},{"oref":"Scene 18","id":103,"seq":18,"title":"The core, escape","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One, desperate, lets go of the cold. The core freezes around her mother, and Morgana screams, the way she screamed when Nathaniel touched the chain, only worse. Her blood flares through every channel at once. Across London, on Lantern Night, every lamp blazes white for one heartbeat and bursts. Pop-pop-pop-pop, street after street, a wave of shattering glass under the fireworks. The Lost One flinches as if she heard every one. Alice blows the door with her gauntlet. Tamara drags the Lost One into the outfall. Alice reaches for Nathaniel. He stays: \"I need to hear the rest.\" She leaves him there. On the way out through the Works office, Alice grabs a vat-hands' roster because it says Gin Lane on the spine.","loc":"The core","when":"The Lost One, desperate, lets go of the cold.","th":"white","also":["city"],"ch":["lostone","morgana","alice","tamara","nathaniel"],"turn":"","w":350,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>The Lost One, desperate, lets go of the cold. The core freezes around her mother, and Morgana screams, the way she screamed when Nathaniel touched the chain, only worse. Her blood flares through every channel at once. Across London, on Lantern Night, every lamp blazes white for one heartbeat and bursts. <em>Pop-pop-pop-pop<\/em>, street after street, a wave of shattering glass under the fireworks. The Lost One flinches as if she heard every one. Alice blows the door with her gauntlet. Tamara drags the Lost One into the outfall. Alice reaches for Nathaniel. He stays: \"I need to hear the rest.\" She leaves him there. On the way out through the Works office, Alice grabs a vat-hands' roster because it says <em>Gin Lane<\/em> on the spine.<\/p>"},{"oref":"Scene 19","id":104,"seq":19,"title":"Westminster Bridge","added":false,"act":"Act Three","kind":"scene","sum":"Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush. Cole's squad hold a barricade with flash-bursts; people still die against the railings. Out past Shadwell and Kensington, two sectors of the heat walls flicker and go grey for the first time in two hundred years, and the outerland cold walks into the streets behind them. Lambrick, on a coal cart: \"Remember who kept you warm!\"","loc":"Westminster Bridge","when":"Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush.","th":"city","also":["lambrick"],"ch":["cole","lambrick"],"turn":"","w":197,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush. Cole's squad hold a barricade with flash-bursts; people still die against the railings. Out past Shadwell and Kensington, two sectors of the heat walls flicker and go grey for the first time in two hundred years, and the outerland cold walks into the streets behind them. Lambrick, on a coal cart: \"Remember who kept you warm!\"<\/p>"},{"oref":"Scene 20","id":105,"seq":20,"title":"The core, after","added":false,"act":"Act Three","kind":"scene","sum":"Father and son, alone with the prisoner. Nathaniel: \"She said Jamie isn't dead. She said he's cold.\" Eldgard doesn't look at Morgana when he answers. \"She tells every Harding whatever will bring him to the lock. She told me my sister was still singing.\" He says it like a man pressing on an old scar. Then, for the first time, he looks at her. \"I didn't put her in those hooks. My father didn't. But I'm the one who keeps them in. Help me build something that holds her without bleeding her, and the walls never go grey again.\" It's the best offer anyone has ever made Nathaniel, and the cruellest, because it's half true. He can't tell which half. He says yes. He chooses his father, and he puts the word cold away where he keeps the weeping in the floor.","loc":"The core","when":"Father and son, alone with the prisoner.","th":"harding","also":["white"],"ch":["nathaniel","eldgard","morgana","otty","jamie"],"turn":"","w":478,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Father and son, alone with the prisoner. Nathaniel: \"She said Jamie isn't dead. She said he's cold.\" Eldgard doesn't look at Morgana when he answers. \"She tells every Harding whatever will bring him to the lock. She told me my sister was still singing.\" He says it like a man pressing on an old scar. Then, for the first time, he looks at her. \"I didn't put her in those hooks. My father didn't. But I'm the one who keeps them in. Help me build something that holds her without bleeding her, and the walls never go grey again.\" It's the best offer anyone has ever made Nathaniel, and the cruellest, because it's half true. He can't tell which half. He says yes. He chooses his father, and he puts the word <em>cold<\/em> away where he keeps the weeping in the floor.<\/p>"},{"oref":"Scene 21","id":106,"seq":21,"title":"Gin Lane rooftop, the black city","added":false,"act":"Tag","kind":"scene","sum":"Alice and the Lost One, soaked and shaking. The Lost One: \"I'm going to free her. Even if all of them freeze.\" Alice takes her burned hand anyway. Below them, London is lit in patches, every third lamp a broken stump.","loc":"Gin Lane rooftop","when":"Alice and the Lost One, soaked and shaking.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":187,"ed":"","fl":[],"html":"<p>Alice and the Lost One, soaked and shaking. The Lost One: \"I'm going to free her. Even if all of them freeze.\" Alice takes her burned hand anyway. Below them, London is lit in patches, every third lamp a broken stump.<\/p>"}]},{"n":6,"title":"Coal","time":"28 DAYS TO FIRST SNOW","clock":"28 DAYS TO FIRST SNOW","act":"I","log":"With two walls grey, Lambrick relighting one of them on coal, and Harding light failing, Alice and the Lost One try to reach the core through the gas tunnels on the night of the Charter vote. Ajax has rigged those tunnels, Nixon is waiting in them, Nathaniel runs in after them, and Byron runs in after him.","sum":"\"Then you know I love you.\"","turn":"Lambrick relights the west wall on coal. The Crown seizes the Works. Byron dies with half a sentence and a needle in his fist","focus":"a city in the cold, Byron, and the aunt who ran","piece":"the Pimlico gasworks explosion, five plans meeting in one tunnel","threads":["harding","city","sisters","guard","lambrick","investigation"],"frame":"<blockquote><p><strong>Focus:<\/strong> a city in the cold, Byron, and the aunt who ran<\/p><p><strong>Set piece:<\/strong> the Pimlico gasworks explosion, five plans meeting in one tunnel<\/p><p><strong>Sting:<\/strong> Byron dies before he can say what he came to say, so Nathaniel bluffs it out of his mother<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":256,"seq":1,"title":"Kensington, under the west wall, the night after Lantern Night","added":true,"act":"Cold open","kind":"scene","sum":"A furnace vault nobody has opened since 1700: brick arches, cold fireboxes, iron valve-wheels as tall as a man. LORD LAMBRICK takes off his own coat, which no one has ever seen him do, and puts his shoulder to the main wheel beside his engineers. Grrrnk. Coal roars in the old fireboxes, WHUMPH, and through the grating overhead the crowd in the street watches the west wall flush red-gold and cheers his name. While they're cheering, he walks to the far end of the vault, where a second wheel feeds the east wall, Gin Lane's. He turns it shut, runs a chain through the spokes, snaps a padlock on it and puts the key in his waistcoat pocket. He doesn't say a word about it to anyone. In the morning his agents start buying Gin Lane leases at a shilling apiece.","loc":"Kensington","when":"A furnace vault nobody has opened since 1700: brick arches, cold fireboxes, iron valve-wheels as tall as a man.","th":"lambrick","also":["city"],"ch":["lambrick"],"turn":"","w":282,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>A furnace vault nobody has opened since 1700: brick arches, cold fireboxes, iron valve-wheels as tall as a man. LORD LAMBRICK takes off his own coat, which no one has ever seen him do, and puts his shoulder to the main wheel beside his engineers. <em>Grrrnk.<\/em> Coal roars in the old fireboxes, <em>WHUMPH<\/em>, and through the grating overhead the crowd in the street watches the west wall flush red-gold and cheers his name. While they're cheering, he walks to the far end of the vault, where a second wheel feeds the east wall, Gin Lane's. He turns it shut, runs a chain through the spokes, snaps a padlock on it and puts the key in his waistcoat pocket. He doesn't say a word about it to anyone. In the morning his agents start buying Gin Lane leases at a shilling apiece.<\/p>"},{"oref":"Scene 2","id":108,"seq":2,"title":"London, the cold","added":false,"act":"Act One","kind":"scene","sum":"Since Lantern Night half the lamps in London are broken glass, the rest come and go, and two sectors of the walls are grey. Kensington is warm, and the coal carts with LAMBRICK on the side get cheered in the street. The east wall stays grey. Gin Lane, Shadwell, Whitechapel: nobody there votes, and nobody relights it. Prices chalked up: doubled, then tripled. A child asleep in a Gin Lane doorway, Alice's doorway, with frost in her eyelashes, and a constable looking away. By morning she isn't asleep. Grim and quiet.","loc":"London","when":"Since Lantern Night half the lamps in London are broken glass, and the rest come and go.","th":"city","also":["lambrick"],"ch":[],"turn":"","w":207,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Since Lantern Night half the lamps in London are broken glass, the rest come and go, and two sectors of the walls are grey. Kensington is warm, and the coal carts with LAMBRICK on the side get cheered in the street. The east wall stays grey. Gin Lane, Shadwell, Whitechapel: nobody there votes, and nobody relights it. Prices chalked up: doubled, then tripled. A child asleep in a Gin Lane doorway, Alice's doorway, with frost in her eyelashes, and a constable looking away. By morning she isn't asleep. Grim and quiet.<\/p>"},{"oref":"Scene 3","id":109,"seq":3,"title":"Harding Works","added":false,"act":"Act One","kind":"scene","sum":"Eldgard and Nathaniel design the *Heartglass*. Eldgard pitches it as mercy: a resonance cage that will hold her without the hooks, so the bleeding stops and the walls run steady. Father and son at one bench, finishing each other's equations. It's everything Nathaniel ever wanted. Eldgard: \"We'll need something of her blood to tune it.\" Nathaniel assumes he means Morgana.","loc":"Harding Works","when":"Eldgard and Nathaniel design the Heartglass, a resonance cage meant to hold the chain without a Harding death.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":205,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Eldgard and Nathaniel design the <strong>Heartglass<\/strong>. Eldgard pitches it as mercy: a resonance cage that will hold her without the hooks, so the bleeding stops and the walls run steady. Father and son at one bench, finishing each other's equations. It's everything Nathaniel ever wanted. Eldgard: \"We'll need something of her blood to tune it.\" Nathaniel assumes he means Morgana.<\/p>"},{"oref":"Scene 4","id":110,"seq":4,"title":"Gin Lane, a borrowed room","added":false,"act":"Act One","kind":"scene","sum":"Wren said the memories would come back. They're going the other way. Every time the cold comes out of her it costs one of Miriam's memories, and tonight the Lost One asks, \"When's your birthday, Ali?\" The same day Miriam forgot it, and the same day the Lost One remembered it with an orange. Alice: \"You knew it once.\" The Lost One, frightened, grabbing Alice's sleeve: \"There's something I have to say to you before it goes. About him. About the belt.\" Alice: \"After.\" \"There might not be an after.\" \"After, Mim.\" Then, because she's tired enough to say it: \"If she'd ever asked, I'd have had to tell her it was already forgiven. And then she'd have had nothing left to carry.\" The fence holds, and the Lost One watches the thing she needs to say slipping further away. Then, harder, because she's frightened: \"If I free my mother, I'll be strong again.\" Alice: \"If you free her, the light goes out and people die.\" The Lost One: \"People die now. I watched one on your step.\" Then, quieter: \"At the chain it all came back. Your birthday. The songs. For one second I had all of her. If I could sit by her an hour, I'd have Mim back for you.\" It's the only offer anyone has made Alice since the bridge. \"You sit by her. You don't touch the lock.\" \"Yes, Ali.\" The second lie, and this time Alice half knows it. Before dawn Alice opens the roster from the Works office. Bounds, T. Vat-hand. Glass-sick. Reassigned: Kellow Ridge. Eldgard Harding's signature is on the approval. She slides the page under the others and doesn't say a word about it. The next morning, at a river-edge chapel of the poor, she buries an empty box: nobody buried Miriam, because the Lost One is wearing her. In it, a hairpin, a scrap of the letter, the knife Miriam taught her to hold. The girl stands beside her wearing the face of the person in the box, and the minister reads the wrong name. Across town, Jamie's coffin is full of slag. Nathaniel comes in late and sits at the back. Without turning, Alice: \"Sit closer or leave.\" He sits closer. For two days afterwards she answers him in single words, and he can't tell what he did.","loc":"Gin Lane","when":"Wren said the memories would come back.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":449,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Wren said the memories would come back. They're going the other way. Every time the cold comes out of her it costs one of Miriam's memories, and tonight the Lost One asks, \"When's your birthday, Ali?\" The same day Miriam forgot it, and the same day the Lost One remembered it with an orange. Alice: \"You knew it once.\" The Lost One, frightened, grabbing Alice's sleeve: \"There's something I have to say to you before it goes. About him. About the belt.\" Alice: \"After.\" \"There might not be an after.\" \"<em>After<\/em>, Mim.\" Then, because she's tired enough to say it: \"If she'd ever asked, I'd have had to tell her it was already forgiven. And then she'd have had nothing left to carry.\" The fence holds, and the Lost One watches the thing she needs to say slipping further away. Then, harder, because she's frightened: \"If I free my mother, I'll be strong again.\" Alice: \"If you free her, the light goes out and people die.\" The Lost One: \"People die now. I watched one on your step.\" Then, quieter: \"At the chain it all came back. Your birthday. The songs. For one second I had all of her. If I could sit by her an hour, I'd have Mim back for you.\" It's the only offer anyone has made Alice since the bridge. \"You sit by her. You don't touch the lock.\" \"Yes, Ali.\" The second lie, and this time Alice half knows it. Before dawn Alice opens the roster from the Works office. <em>Bounds, T. Vat-hand. Glass-sick. Reassigned: Kellow Ridge.<\/em> Eldgard Harding's signature is on the approval. She slides the page under the others and doesn't say a word about it. The next morning, at a river-edge chapel of the poor, she buries an empty box: nobody buried Miriam, because the Lost One is wearing her. In it, a hairpin, a scrap of the letter, the knife Miriam taught her to hold. The girl stands beside her wearing the face of the person in the box, and the minister reads the wrong name. Across town, Jamie's coffin is full of slag. Nathaniel comes in late and sits at the back. Without turning, Alice: \"Sit closer or leave.\" He sits closer. For two days afterwards she answers him in single words, and he can't tell what he did.<\/p>"},{"oref":"Scene 5","id":253,"seq":5,"title":"Past Barnet, outside the north wall, afternoon","added":true,"act":"Act One","kind":"scene","sum":"The Harding carriage goes out through the north gate, and inside a hundred yards the season changes. Inside the walls it's a raw November. Out here, in the outerlands, it's always November, and worse: hedges white with rime, a pond frozen to the bottom, a rook working at something dead in a furrow. One last green heater-post stands at the mouth of a lane, guttering, bzzzt, bzzzt, warm for six feet. ELDGARD leaves the carriage there and walks the rest. At the end of the lane is a stone cottage with a slate roof and thin smoke, and in the yard WALTER PELL, eighty, a stonemason in a leather apron with a cold pipe in his teeth, is cutting a name into a headstone, tink, tink, tink, between coughs. HESTER PELL opens the door before Eldgard knocks. She is seventy-seven, born a Harding, his father's younger sister. She has the family's height and jaw and grey eyes, and she stoops under her own lintel. Her white hair is in one braid pinned flat round her head like a crown nobody gave her. She wears a brown wool dress gone soft at the elbows and a man's grey cardigan with the sleeves shoved up, sawdust in the wool, over big chapped hands, a brass wedding band worn thin, and hobnailed boots unlaced at the top. \"You've got old.\" \"It's been fifty years.\" \"Fifty this winter. I can count too.\" Then, before he can sit: \"You brought the boy here once. He was five. He cried for the fence.\" Eldgard doesn't answer. Inside: one room, a wood fire, mended plates, a candle on the sill not yet lit, a low woodpile, and a dresser with a leg missing; you can guess where it went. Nothing green anywhere. \"The heaters won't last the winter. Come back with me.\" \"You brought a carriage and left room for my trunk.\" \"I hoped you'd be sensible.\" \"You hoped I'd already agreed.\" She puts another piece of wood on the fire, and he watches it catch, fssh, pop, like a man who hasn't watched a wood fire since he was a boy. When the doctor said she would never carry, her father stopped seating her near him at dinner. \"No use to the table. It took me twenty years to see that was the kindest thing that house ever did me. I've never had a child I had to hand to anybody.\" He gives her the accusation he came with. \"You left the week before the snow.\" \"I did.\" \"Otty was nineteen.\" \"I know how old she was. I watched the walls go grey that autumn, and I knew what it meant before Father said a word. I left because I was afraid. You stayed, and called it duty.\" She doesn't claim the better side of it: other people kept paying, and she has known that every winter for fifty years. She just won't live with it in a house that runs on it. Then: \"Does the boy know yet?\" \"I'm finding another way.\" \"That wasn't what I asked.\" Silence, and the kettle ticking toward the boil, tk, tk, tk. He came to bring her in out of the cold, and to be told he did what he had to. Whether he also came because she is a living Harding, and the chain asks for nothing more than that, he may not admit even to himself; she can see all of it. \"I'm not staying because I'm happy, Eldgard. You can't see it, and it's sitting right here by the fire.\" He goes. Walter lifts two fingers off the chisel to him, a mason's courtesy to a stranger, and Eldgard doesn't return it. At the mouth of the lane the last heater-post gives one more bzzzt and goes grey. Behind it, in the cottage window, Hester strikes a match and lights the candle on the sill. Fssst. That night Eldgard comes into the Works still in his coat, crosses to the bench where his son is bent over the Heartglass, and puts his hand on Nathaniel's shoulder.","loc":"Past Barnet, outside the north wall","when":"afternoon","th":"harding","also":["city"],"ch":["eldgard","hester"],"turn":"","w":900,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>The Harding carriage goes out through the north gate, and inside a hundred yards the season changes. Inside the walls it's a raw November. Out here, in the outerlands, it's always November, and worse: hedges white with rime, a pond frozen to the bottom, a rook working at something dead in a furrow. One last green heater-post stands at the mouth of a lane, guttering, <em>bzzzt, bzzzt<\/em>, warm for six feet. ELDGARD leaves the carriage there and walks the rest. At the end of the lane is a stone cottage with a slate roof and thin smoke, and in the yard WALTER PELL, eighty, a stonemason in a leather apron with a cold pipe in his teeth, is cutting a name into a headstone, <em>tink, tink, tink<\/em>, between coughs. HESTER PELL opens the door before Eldgard knocks. She is seventy-seven, born a Harding, his father's younger sister. She has the family's height and jaw and grey eyes, and she stoops under her own lintel. Her white hair is in one braid pinned flat round her head like a crown nobody gave her. She wears a brown wool dress gone soft at the elbows and a man's grey cardigan with the sleeves shoved up, sawdust in the wool, over big chapped hands, a brass wedding band worn thin, and hobnailed boots unlaced at the top. \"You've got old.\" \"It's been fifty years.\" \"Fifty this winter. I can count too.\" Then, before he can sit: \"You brought the boy here once. He was five. He cried for the fence.\" Eldgard doesn't answer. Inside: one room, a wood fire, mended plates, a candle on the sill not yet lit, a low woodpile, and a dresser with a leg missing; you can guess where it went. Nothing green anywhere. \"The heaters won't last the winter. Come back with me.\" \"You brought a carriage and left room for my trunk.\" \"I hoped you'd be sensible.\" \"You hoped I'd already agreed.\" She puts another piece of wood on the fire, and he watches it catch, <em>fssh, pop<\/em>, like a man who hasn't watched a wood fire since he was a boy. When the doctor said she would never carry, her father stopped seating her near him at dinner. \"No use to the table. It took me twenty years to see that was the kindest thing that house ever did me. I've never had a child I had to hand to anybody.\" He gives her the accusation he came with. \"You left the week before the snow.\" \"I did.\" \"Otty was nineteen.\" \"I know how old she was. I watched the walls go grey that autumn, and I knew what it meant before Father said a word. I left because I was afraid. You stayed, and called it duty.\" She doesn't claim the better side of it: other people kept paying, and she has known that every winter for fifty years. She just won't live with it in a house that runs on it. Then: \"Does the boy know yet?\" \"I'm finding another way.\" \"That wasn't what I asked.\" Silence, and the kettle ticking toward the boil, <em>tk, tk, tk<\/em>. He came to bring her in out of the cold, and to be told he did what he had to. Whether he also came because she is a living Harding, and the chain asks for nothing more than that, he may not admit even to himself; she can see all of it. \"I'm not staying because I'm happy, Eldgard. You can't see it, and it's sitting right here by the fire.\" He goes. Walter lifts two fingers off the chisel to him, a mason's courtesy to a stranger, and Eldgard doesn't return it. At the mouth of the lane the last heater-post gives one more <em>bzzzt<\/em> and goes grey. Behind it, in the cottage window, Hester strikes a match and lights the candle on the sill. <em>Fssst.<\/em> That night Eldgard comes into the Works still in his coat, crosses to the bench where his son is bent over the Heartglass, and puts his hand on Nathaniel's shoulder.<\/p>"},{"oref":"Scene 6","id":128,"seq":6,"title":"Harding Works, the shop window, midnight","added":true,"act":"Act One","kind":"scene","sum":"Alice climbs the Works wall to tell the only person who would understand that her sister has forgotten her birthday. Through the lit glass she sees Nathaniel and Eldgard still at one bench, finishing each other's equations, his father's hand on his shoulder, the Heartglass half-built between them. It's everything he has wanted his whole life, and she can see that it is. She doesn't knock. Her breath fogs the pane. She wipes it clean with her glove, the one with his handkerchief folded inside it, and goes back down the wall. A second later Nathaniel looks up, at a window with nobody in it.","loc":"Harding Works","when":"Alice climbs the Works wall to tell the only person who would understand that her sister has forgotten her birthday.","th":"sisters","also":["investigation"],"ch":["alice","nathaniel","eldgard"],"turn":"","w":336,"ed":"","fl":[],"html":"<p>Alice climbs the Works wall to tell the only person who would understand that her sister has forgotten her birthday. Through the lit glass she sees Nathaniel and Eldgard still at one bench, finishing each other's equations, his father's hand on his shoulder, the Heartglass half-built between them. It's everything he has wanted his whole life, and she can see that it is. She doesn't knock. Her breath fogs the pane. She wipes it clean with her glove, the one with his handkerchief folded inside it, and goes back down the wall. A second later Nathaniel looks up, at a window with nobody in it.<\/p>"},{"oref":"Scene 7","id":257,"seq":7,"title":"Lambrick House, a dinner party, then the gun room","added":true,"act":"Act One","kind":"scene","sum":"Twenty guests, the Crown board's men among them, and the west-wall heat coming up through the floor grilles like applause. Tamara plays the perfect daughter through four courses, pleads a headache, takes a candle up the back stair, and opens the gun-room cabinet where her father keeps what he won't put in the safe. Charges along the Tyburn conduit where it meets his Pimlico gas main, set for the night of the vote, so the Works look rotten to the Crown. Under the plan, a lunacy order with one doctor's signature, Dr Cutler's, and her own name on it, waiting for a second. She learns her price twice in one breath. Footsteps: AJAX, sent up for cigars. She's behind the curtain with the wick pinched out between two fingers, tss, and the plan still in her other hand. Ajax takes the cigars, smells hot wax, and stands very still. \"Your father says, if you're up here, you're to come down for the pudding.\" He leaves the door open. She goes down for the pudding, and puts the plan back before breakfast.","loc":"Lambrick House","when":"Twenty guests, the Crown board's men among them, and the west-wall heat coming up through the floor grilles like applause.","th":"lambrick","also":[],"ch":["tamara","ajax","lambrick"],"turn":"","w":362,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Twenty guests, the Crown board's men among them, and the west-wall heat coming up through the floor grilles like applause. Tamara plays the perfect daughter through four courses, pleads a headache, takes a candle up the back stair, and opens the gun-room cabinet where her father keeps what he won't put in the safe. Charges along the Tyburn conduit where it meets his Pimlico gas main, set for the night of the vote, so the Works look rotten to the Crown. Under the plan, a lunacy order with one doctor's signature, Dr Cutler's, and her
