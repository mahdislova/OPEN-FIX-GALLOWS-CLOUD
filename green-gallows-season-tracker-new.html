s on a roof.</p>"},{"oref":"Scene 8","id":136,"seq":8,"title":"A Gin Lane gin shop","added":false,"act":"Act Two","kind":"scene","sum":"Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: \"Why would I care? She's not my sister.\" Tamara: \"She put out a fire around four children with the last of her cold and forgot your name doing it. Did Miriam ever do that?\" Alice, after a long time: \"No. Miriam never stood in front of anybody.\" She stops drinking.","loc":"A Gin Lane gin shop","when":"Tamara finds Alice drunk.","th":"sisters","also":["lambrick"],"ch":["tamara","alice"],"turn":"","w":254,"ed":"","fl":[],"html":"<p>Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: \"Why would I care? She's not my sister.\" Tamara: \"She put out a fire around four children with the last of her cold and forgot your name doing it. Did Miriam ever do that?\" Alice, after a long time: \"No. Miriam never stood in front of anybody.\" She stops drinking.</p>"},{"oref":"Scene 9","id":137,"seq":9,"title":"Whitechapel, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits. Wolves pour into the gaslit streets. Gas lamps freeze and burst, *tink, tink, tink*. Bodies in the snowless street.","loc":"Whitechapel","when":"Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits.","th":"white","also":["city"],"ch":[],"turn":"","w":179,"ed":"","fl":[],"html":"<p>Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits. Wolves pour into the gaslit streets. Gas lamps freeze and burst, *tink, tink, tink*. Bodies in the snowless street.</p>"},{"oref":"Scene 10","id":138,"seq":10,"title":"Commercial Road, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades. Shot the way the pilot's core raid was: black, then a strobe frame, then black. Every flash shows us a wolf somewhere new and closer. We see them only in the frames the Lanterns light, which is scarier than a wide shot and costs a tenth as much. Nixon fights like a man trying to get himself killed. Cole fights beside him with his two-finger grip.","loc":"Commercial Road","when":"Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":291,"ed":"","fl":[],"html":"<p>Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades. Shot the way the pilot's core raid was: black, then a strobe frame, then black. Every flash shows us a wolf somewhere new and closer. We see them only in the frames the Lanterns light, which is scarier than a wide shot and costs a tenth as much. Nixon fights like a man trying to get himself killed. Cole fights beside him with his two-finger grip.</p>"},{"oref":"Scene 11","id":139,"seq":11,"title":"The Pavilion music hall, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Whimsy into grim. We stay inside. A comic singer keeps a hundred people singing \"Daisy Bell\" to drown out the scratching at the doors, and the song gets louder every time the scratching does. A door panel bows inward. A child stops singing, and her mother starts her again. Nathaniel arrives on leap-boosters with a bag of flash-cartridges, and Nixon arrives from the other roof. No words. They fight back to back the way they did at nine years old, perfectly in sync, an hour after the friendship ended.","loc":"The Pavilion music hall","when":"Whimsy into grim.","th":"guard","also":["harding"],"ch":["nathaniel","nixon"],"turn":"","w":311,"ed":"","fl":[],"html":"<p>Whimsy into grim. We stay inside. A comic singer keeps a hundred people singing \"Daisy Bell\" to drown out the scratching at the doors, and the song gets louder every time the scratching does. A door panel bows inward. A child stops singing, and her mother starts her again. Nathaniel arrives on leap-boosters with a bag of flash-cartridges, and Nixon arrives from the other roof. No words. They fight back to back the way they did at nine years old, perfectly in sync, an hour after the friendship ended.</p>"},{"oref":"Scene 12","id":140,"seq":12,"title":"The Pavilion stage door, and the street","added":false,"act":"Act Two","kind":"scene","sum":"The Lost One walks into the street of wolves and says one word in a language of wind. They stop, every one of them, except the biggest. She kills it with cold, and loses another memory. A hundred people watch a girl command wolves. By morning she'll be the Frost Witch. Then Alice, sober now, reaches her through the street of wolves. The Lost One doesn't know her face anymore. Alice: \"I'm Alice. I'm your sister.\" The sisters' scene: chosen, not inherited.","loc":"The Pavilion stage door","when":"The Lost One walks into the street of wolves and says one word in a language of wind.","th":"white","also":["sisters"],"ch":["lostone","alice"],"turn":"","w":363,"ed":"","fl":[],"html":"<p>The Lost One walks into the street of wolves and says one word in a language of wind. They stop, every one of them, except the biggest. She kills it with cold, and loses another memory. A hundred people watch a girl command wolves. By morning she'll be the Frost Witch. Then Alice, sober now, reaches her through the street of wolves. The Lost One doesn't know her face anymore. Alice: \"I'm Alice. I'm your sister.\" The sisters' scene: chosen, not inherited.</p>"},{"oref":"Scene 13","id":142,"seq":13,"title":"Whitehall, then Shadwell, dawn","added":false,"act":"Act Three","kind":"scene","sum":"Two buyers for one girl. In his office, Vane declares martial law: the Frost Witch is to be captured. Lambrick has read the folio: \"Put her in the chain and the Crown never needs a Harding again. The light becomes ours.\" Vane hears only \"the lights stay on.\" Across the river, in the steam of the Shadwell laundry, Josephine and Grise agree a price for the Frost Witch, delivered to Josephine, not the Crown. Josephine: \"She's not a girl, Grise.\" Grise: \"None of us were, by the time we came here.\"","loc":"Whitehall","when":"Two buyers for one girl.","th":"city","also":["lambrick","vykra","harding"],"ch":["vane","lambrick","josephine","grise"],"turn":"","w":420,"ed":"","fl":[],"html":"<p>Two buyers for one girl. In his office, Vane declares martial law: the Frost Witch is to be captured. Lambrick has read the folio: \"Put her in the chain and the Crown never needs a Harding again. The light becomes ours.\" Vane hears only \"the lights stay on.\" Across the river, in the steam of the Shadwell laundry, Josephine and Grise agree a price for the Frost Witch, delivered to Josephine, not the Crown. Josephine: \"She's not a girl, Grise.\" Grise: \"None of us were, by the time we came here.\"</p>"},{"oref":"Scene 14","id":214,"seq":14,"title":"St Bride's, the Harding vault, dawn","added":true,"act":"Act Three","kind":"scene","sum":"All night Nathaniel fought beside the man who shot his brother, and one word from the roof has gone round his head the whole time: *Yes.* Jamie was alive when Nixon left. At dawn he goes to see his brother. Crowbar, lantern, the Harding vault under St Bride's. He breaks the seal on the coffin his best friend carried down these steps. *Krrk-CRACK.* Inside, laid out in Jamie's burial coat, are three sacks of grey slag from the Works vats and a family Bible for weight. No body. Nathaniel stands in the candle-dark with a fistful of slag, and Morgana's voice from Lantern Night comes back to him: *He is cold.* Above him, on the chancel wall, the brass plate still says DIED ABROAD.","loc":"St Bride's","when":"All night Nathaniel fought beside the man who shot his brother, and one word from the roof has gone round his head the whole time: *Yes.* Jamie was alive when Nixon left.","th":"investigation","also":["harding"],"ch":["nathaniel"],"turn":"","w":576,"ed":"","fl":[],"html":"<p>All night Nathaniel fought beside the man who shot his brother, and one word from the roof has gone round his head the whole time: *Yes.* Jamie was alive when Nixon left. At dawn he goes to see his brother. Crowbar, lantern, the Harding vault under St Bride's. He breaks the seal on the coffin his best friend carried down these steps. *Krrk-CRACK.* Inside, laid out in Jamie's burial coat, are three sacks of grey slag from the Works vats and a family Bible for weight. No body. Nathaniel stands in the candle-dark with a fistful of slag, and Morgana's voice from Lantern Night comes back to him: *He is cold.* Above him, on the chancel wall, the brass plate still says DIED ABROAD.</p>"},{"oref":"Scene 15","id":143,"seq":15,"title":"Harding Works, Eldgard's old gallery, empty","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard is drunk among the dead vats. Nathaniel drops a fistful of slag on the bench in front of him, the same grey as the dead vats all around them. \"What did you do after Nixon left?\" \"Ask me at the solstice.\" \"Now.\" \"I finished it.\" Then, almost to himself: \"The Pact is on a lead sheet in the tomb of the first Harding, Alistair. Only a Harding wedding opens it. Every bride who takes the name swears on it, through the grille, with her eyes shut. Your mother did. She never asked what it said.\" Then: \"What's the Heartglass for?\" \"Her. The daughter. She'd hold her mother forever, and you'd live.\" Nathaniel built a cage for Alice's sister.","loc":"Harding Works","when":"Eldgard is drunk among the dead vats.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":394,"ed":"","fl":[],"html":"<p>Eldgard is drunk among the dead vats. Nathaniel drops a fistful of slag on the bench in front of him, the same grey as the dead vats all around them. \"What did you do after Nixon left?\" \"Ask me at the solstice.\" \"Now.\" \"I finished it.\" Then, almost to himself: \"The Pact is on a lead sheet in the tomb of the first Harding, Alistair. Only a Harding wedding opens it. Every bride who takes the name swears on it, through the grille, with her eyes shut. Your mother did. She never asked what it said.\" Then: \"What's the Heartglass for?\" \"Her. The daughter. She'd hold her mother forever, and you'd live.\" Nathaniel built a cage for Alice's sister.</p>"},{"oref":"Scene 16","id":145,"seq":16,"title":"Guard barracks, the infirmary","added":false,"act":"Act Three","kind":"scene","sum":"Tamara comes in while Nixon is changing Cole's dressings. She gives Nixon a folder copied from her father's seized Harding papers: \"It has your name on it.\" Then, a week before her wedding, she kisses him. Cole pretends very hard to be asleep.","loc":"Guard barracks","when":"Tamara comes in while Nixon is changing Cole's dressings.","th":"guard","also":["lambrick"],"ch":["tamara","nixon","cole"],"turn":"","w":192,"ed":"","fl":[],"html":"<p>Tamara comes in while Nixon is changing Cole's dressings. She gives Nixon a folder copied from her father's seized Harding papers: \"It has your name on it.\" Then, a week before her wedding, she kisses him. Cole pretends very hard to be asleep.</p>"},{"oref":"Scene 17","id":146,"seq":17,"title":"Harding House, the long gallery, then the glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark. The Lost One stops at Jamie's: twenty-five, laughing at something outside the frame, a skate-blade over his shoulder. Her hand goes to her belly without her knowing it. Her breath catches on a feeling that isn't hers, the whole of Miriam's love for him arriving in her body at once. Alice: \"What's wrong?\" \"Nothing.\" Alice looks at the portrait, then at her, and decides not to ask. In the glasshouse, Nathaniel is waiting, and he tells Alice he built the cage. Alice hits him harder than Nathaniel hit Nixon. Then: \"So you know how to break it.\" The three of them, broken, at one table, and the plan comes out as logistics: the Pact is in Alistair's tomb, under the chapel, and the tomb opens only for a Harding wedding. The lid and the grille on the crypt stair hang on one counterweight, older than the chapel: both rise when the procession begins, both drop at the ring, and nothing below comes up again until the head of the house lifts them. Alice and the Lost One will go in the old way, through the ossuary, and read it while the vows run. So the vows go as far as the tomb needs, and Nathaniel stops before the ring; Tamara will agree, because she has her own speech to make at that altar. Nathaniel: \"Then I'll have to be nearly married.\" Alice: \"Nearly.\" Both answer too fast. To stop at exactly the right word tomorrow, he has to know exactly where it is, so they rehearse. Whimsy: the Lost One plays the priest, reading with enormous solemnity from a prayer book held upside down, and Alice stands in for the bride. They say every word to each other, slowly, and both of them mean every word, and both of them know it. \"Wilt thou have this woman…\" \"I will.\" The Lost One turns the page: \"You may now kiss the—\" Alice: \"That's after the ring. We stop before the ring.\" They stand there not stopping, and not moving either. The Lost One looks from one to the other, sincerely: \"You both look sad when you look at each other. Is that what weddings are for?\" Nobody answers. Later, at the stove, Nathaniel tells Alice about the coffin full of slag, and what Morgana said on Lantern Night: Jamie isn't dead, he's cold. Alice, hours after losing her sister for good: \"Don't live in it. I lived in it six weeks. It's warm, and then it isn't.\" From the dark under the orange trees, the Lost One, who isn't supposed to be listening: \"My mother doesn't lie.\" Two answers, and Nathaniel can only believe one of them. Twenty-one days, and everyone wants her in the chain.","loc":"Harding House","when":"Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark.","th":"harding","also":["sisters"],"ch":["alice","lostone","nathaniel","jamie","morgana"],"turn":"","w":1583,"ed":"","fl":[],"html":"<p>Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark. The Lost One stops at Jamie's: twenty-five, laughing at something outside the frame, a skate-blade over his shoulder. Her hand goes to her belly without her knowing it. Her breath catches on a feeling that isn't hers, the whole of Miriam's love for him arriving in her body at once. Alice: \"What's wrong?\" \"Nothing.\" Alice looks at the portrait, then at her, and decides not to ask. In the glasshouse, Nathaniel is waiting, and he tells Alice he built the cage. Alice hits him harder than Nathaniel hit Nixon. Then: \"So you know how to break it.\" The three of them, broken, at one table, and the plan comes out as logistics: the Pact is in Alistair's tomb, under the chapel, and the tomb opens only for a Harding wedding. The lid and the grille on the crypt stair hang on one counterweight, older than the chapel: both rise when the procession begins, both drop at the ring, and nothing below comes up again until the head of the house lifts them. Alice and the Lost One will go in the old way, through the ossuary, and read it while the vows run. So the vows go as far as the tomb needs, and Nathaniel stops before the ring; Tamara will agree, because she has her own speech to make at that altar. Nathaniel: \"Then I'll have to be nearly married.\" Alice: \"Nearly.\" Both answer too fast. To stop at exactly the right word tomorrow, he has to know exactly where it is, so they rehearse. Whimsy: the Lost One plays the priest, reading with enormous solemnity from a prayer book held upside down, and Alice stands in for the bride. They say every word to each other, slowly, and both of them mean every word, and both of them know it. \"Wilt thou have this woman…\" \"I will.\" The Lost One turns the page: \"You may now kiss the—\" Alice: \"That's after the ring. We stop before the ring.\" They stand there not stopping, and not moving either. The Lost One looks from one to the other, sincerely: \"You both look sad when you look at each other. Is that what weddings are for?\" Nobody answers. Later, at the stove, Nathaniel tells Alice about the coffin full of slag, and what Morgana said on Lantern Night: Jamie isn't dead, he's cold. Alice, hours after losing her sister for good: \"Don't live in it. I lived in it six weeks. It's warm, and then it isn't.\" From the dark under the orange trees, the Lost One, who isn't supposed to be listening: \"My mother doesn't lie.\" Two answers, and Nathaniel can only believe one of them. Twenty-one days, and everyone wants her in the chain.</p>"},{"oref":"Scene 18","id":148,"seq":18,"title":"Gin Lane rooftop","added":false,"act":"Act Three","kind":"scene","sum":"Whimsy and grief. The Lost One asks Alice to teach her the counting game again, since she lost it. For the first time Alice tells her where it came from: the fence outside the window, eight posts, and he's done. The Lost One listens, then counts them with her, and at eight she keeps going. \"Nine.\" Alice: \"There's no nine.\" \"There is now. Nine is the one where we get up.\" She gets it wrong on purpose, nine, ten, eleven, to make Alice laugh. It works. The game born under a bed has a new ending.","loc":"Gin Lane rooftop","when":"Whimsy and grief.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":330,"ed":"","fl":[],"html":"<p>Whimsy and grief. The Lost One asks Alice to teach her the counting game again, since she lost it. For the first time Alice tells her where it came from: the fence outside the window, eight posts, and he's done. The Lost One listens, then counts them with her, and at eight she keeps going. \"Nine.\" Alice: \"There's no nine.\" \"There is now. Nine is the one where we get up.\" She gets it wrong on purpose, nine, ten, eleven, to make Alice laugh. It works. The game born under a bed has a new ending.</p>"},{"oref":"Scene 19","id":149,"seq":19,"title":"Guard barracks, Nixon's room","added":false,"act":"Tag","kind":"scene","sum":"Nixon opens Tamara's folder. His charity-school blood test, the green sliver, Eldgard's hand: *Hargrave, N. Cadet line of Harding. Reserve. Blood suitable.* He was never a charity case. He was a spare.","loc":"Guard barracks","when":"Nixon opens Tamara's folder.","th":"guard","also":["harding"],"ch":["nixon"],"turn":"","w":163,"ed":"","fl":[],"html":"<p>Nixon opens Tamara's folder. His charity-school blood test, the green sliver, Eldgard's hand: *Hargrave, N. Cadet line of Harding. Reserve. Blood suitable.* He was never a charity case. He was a spare.</p>"}]},{"n":8,"title":"The Wedding","time":"14 DAYS TO FIRST SNOW","clock":"14 DAYS TO FIRST SNOW","act":"II","log":"Nathaniel's wedding is a cover for Alice's raid on the family crypt, an ambush for the bride, a trap for the groom's father, a cage for the girl and a cellar for the captain who walks into it. Everyone gets part of what they wanted, and the snow comes tonight.","sum":"Morgana makes it snow, two weeks early","turn":"Nathaniel marries Tamara to save her, and the ring drops the crypt grille between Alice and her sister. Nixon finds the Orchard","focus":"every faction moves on the same morning","piece":"the wedding, the crypt and the mutiny at the gates","threads":["harding","guard","sisters","city","lambrick","white"],"frame":"<blockquote><p><strong>Focus:</strong> every faction moves on the same morning</p><p><strong>Set piece:</strong> the wedding, the crypt and the mutiny at the gates</p><p><strong>Sting:</strong> the Lost One lets herself be taken and leaves Alice her sister's last words, and her mother's grief brings the snow two weeks early</p></blockquote>","scenes":[{"oref":"Scene 1","id":150,"seq":1,"title":"The core, sixteen years ago","added":false,"act":"Cold open","kind":"scene","sum":"NATHANIEL, five, follows a lullaby down the forbidden stairs and finds a huge, gentle woman of ice who asks his name. Eldgard snatches him up and swings a lantern slowly before his eyes. \"You had a dream.\" The boy, glassy: \"I had a dream.\" It's the \"nightmare\" Nathaniel has had all his life.","loc":"The core","when":"NATHANIEL, five, follows a lullaby down the forbidden stairs and finds a huge, gentle woman of ice who asks his name.","th":"harding","also":["white"],"ch":["nathaniel","morgana","eldgard"],"turn":"","w":218,"ed":"","fl":[],"html":"<p>NATHANIEL, five, follows a lullaby down the forbidden stairs and finds a huge, gentle woman of ice who asks his name. Eldgard snatches him up and swings a lantern slowly before his eyes. \"You had a dream.\" The boy, glassy: \"I had a dream.\" It's the \"nightmare\" Nathaniel has had all his life.</p>"},{"oref":"Scene 2","id":151,"seq":2,"title":"Harding House, the groom's dressing room","added":false,"act":"Act One","kind":"scene","sum":"Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: *The second Harding son. Agent: Alice Bounds.* It's the first time he has ever seen her first name, and it's on a bill. \"She was paid to get close to you. By me. Whatever she's felt, I bought it.\" Nathaniel can't breathe. His mother has done her sums: her son stopped fighting this wedding the day after he learned what lies in Alistair's tomb. She wants his eyes on the altar today, not the crypt stair, and Grise already knows which door the girl will use. Josephine leaves, and Eldgard takes her place at the door with Jamie's cufflinks in his palm. Nathaniel: \"Did you hold his hand?\" Eldgard: \"I held his hand.\" It's the half-truth he lies in. Nathaniel takes the cufflinks and puts them on, smiling, because he knows what today is for.","loc":"Harding House","when":"Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: *The second Harding son.","th":"harding","also":[],"ch":["josephine","nathaniel","eldgard","grise"],"turn":"","w":533,"ed":"","fl":[],"html":"<p>Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: *The second Harding son. Agent: Alice Bounds.* It's the first time he has ever seen her first name, and it's on a bill. \"She was paid to get close to you. By me. Whatever she's felt, I bought it.\" Nathaniel can't breathe. His mother has done her sums: her son stopped fighting this wedding the day after he learned what lies in Alistair's tomb. She wants his eyes on the altar today, not the crypt stair, and Grise already knows which door the girl will use. Josephine leaves, and Eldgard takes her place at the door with Jamie's cufflinks in his palm. Nathaniel: \"Did you hold his hand?\" Eldgard: \"I held his hand.\" It's the half-truth he lies in. Nathaniel takes the cufflinks and puts them on, smiling, because he knows what today is for.</p>"},{"oref":"Scene 3","id":152,"seq":3,"title":"The glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Alice and the Lost One prepare for the crypt. Alistair's tomb is opened only for Harding weddings. Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone. He didn't call her Bounds. He didn't call her anything. The wedding was her plan, and she is the one who has to watch it.","loc":"The glasshouse","when":"Alice and the Lost One prepare for the crypt.","th":"harding","also":["sisters"],"ch":["alice","lostone","nathaniel"],"turn":"","w":280,"ed":"","fl":[],"html":"<p>Alice and the Lost One prepare for the crypt. Alistair's tomb is opened only for Harding weddings. Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone. He didn't call her Bounds. He didn't call her anything. The wedding was her plan, and she is the one who has to watch it.</p>"},{"oref":"Scene 4","id":153,"seq":4,"title":"Guard tower","added":false,"act":"Act One","kind":"scene","sum":"Vane's orders: arrest Eldgard Harding after the vows, then clear the crowd at the gates \"by any means.\" Nixon, his file still in his coat: \"I'm done being anybody's reserve, Cole.\"","loc":"Guard tower","when":"Vane's orders: arrest Eldgard Harding after the vows, then clear the crowd at the gates \"by any means.\" Nixon, his file still in his coat: \"I'm done being anybody's reserve, Cole.\"","th":"guard","also":["city"],"ch":["vane","nixon","cole"],"turn":"","w":161,"ed":"","fl":[],"html":"<p>Vane's orders: arrest Eldgard Harding after the vows, then clear the crowd at the gates \"by any means.\" Nixon, his file still in his coat: \"I'm done being anybody's reserve, Cole.\"</p>"},{"oref":"Scene 5","id":171,"seq":5,"title":"The Harding chapel, the vestry","added":true,"act":"Act One","kind":"scene","sum":"Before the guests. Tamara, in white, comes looking for somewhere to be sick and finds Nixon, uninvited, in his captain's coat, standing over a ring box on the vestry table that is waiting for a best man nobody has named. She shuts the door. \"Say one word and I'll walk out of this church with you.\" His file is in his coat; he can feel its corners. \"A week ago I found out I'm on Eldgard's books. Like the coal. I can't give you something that belongs to somebody else.\" She picks up the ring box, opens it, closes it, and puts it in his hand. \"Then hand it to me properly.\" She goes out to be married. Within the hour, this room will hold a strait-coat.","loc":"The Harding chapel","when":"Before the guests.","th":"guard","also":["lambrick"],"ch":["nixon","tamara"],"turn":"","w":585,"ed":"","fl":[],"html":"<p>Before the guests. Tamara, in white, comes looking for somewhere to be sick and finds Nixon, uninvited, in his captain's coat, standing over a ring box on the vestry table that is waiting for a best man nobody has named. She shuts the door. \"Say one word and I'll walk out of this church with you.\" His file is in his coat; he can feel its corners. \"A week ago I found out I'm on Eldgard's books. Like the coal. I can't give you something that belongs to somebody else.\" She picks up the ring box, opens it, closes it, and puts it in his hand. \"Then hand it to me properly.\" She goes out to be married. Within the hour, this room will hold a strait-coat.</p>"},{"oref":"Scene 6","id":154,"seq":6,"title":"The Harding chapel","added":false,"act":"Act One","kind":"scene","sum":"Guests, lilies, the Crown. Eldgard sits alone, unaware. Nixon walks in uninvited and stops behind the groom he hasn't spoken to since the roof. Nathaniel, not turning: \"Stand where I can see you.\" Nixon steps up beside him. A whisper: \"You look terrible.\" \"I haven't slept.\" \"Neither have I.\" He waits for the bride he kissed a week ago.","loc":"The Harding chapel","when":"Guests, lilies, the Crown.","th":"harding","also":["guard"],"ch":["eldgard","nixon","nathaniel","tamara"],"turn":"","w":233,"ed":"","fl":[],"html":"<p>Guests, lilies, the Crown. Eldgard sits alone, unaware. Nixon walks in uninvited and stops behind the groom he hasn't spoken to since the roof. Nathaniel, not turning: \"Stand where I can see you.\" Nixon steps up beside him. A whisper: \"You look terrible.\" \"I haven't slept.\" \"Neither have I.\" He waits for the bride he kissed a week ago.</p>"},{"oref":"Scene 7","id":155,"seq":7,"title":"The crypt, below","added":false,"act":"Act Two","kind":"scene","sum":"Alice and the Lost One come in through the old ossuary. Whimsy: the Lost One wishes the skulls good morning, one by one, and hums the Lantern Hymn to them in a key no church uses. Alistair's tomb holds the Pact on a lead sheet in two scripts. Alice reads the first clause: a Harding life at the first snow. The second clause is in the language of the White. The Lost One reads it and tells Alice it says the same thing. It doesn't.","loc":"The crypt","when":"Alice and the Lost One come in through the old ossuary.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":301,"ed":"","fl":[],"html":"<p>Alice and the Lost One come in through the old ossuary. Whimsy: the Lost One wishes the skulls good morning, one by one, and hums the Lantern Hymn to them in a key no church uses. Alistair's tomb holds the Pact on a lead sheet in two scripts. Alice reads the first clause: a Harding life at the first snow. The second clause is in the language of the White. The Lost One reads it and tells Alice it says the same thing. It doesn't.</p>"},{"oref":"Scene 8","id":156,"seq":8,"title":"The gates","added":false,"act":"Act Two","kind":"scene","sum":"An undercity crowd has gathered. Some carry candles for the Frost Witch who stopped the wolves; others are coal-men with clubs who want her burned. Lanterns form a line.","loc":"The gates","when":"An undercity crowd has gathered.","th":"city","also":["guard"],"ch":[],"turn":"","w":155,"ed":"","fl":[],"html":"<p>An undercity crowd has gathered. Some carry candles for the Frost Witch who stopped the wolves; others are coal-men with clubs who want her burned. Lanterns form a line.</p>"},{"oref":"Scene 9","id":157,"seq":9,"title":"The chapel, the vows","added":false,"act":"Act Two","kind":"scene","sum":"\"If any man knows cause…\" Tamara opens her prayer book to read out her father's crimes, and every page is blank. Lambrick, gently, to the room: \"My daughter is unwell.\" Her lips shake. Through the vestry door, Nixon sees Ajax waiting in the room where she asked him an hour ago, with two Bethlem attendants, a strait-coat, and a lunacy order Lambrick has had a doctor sign. The blank prayer book is all the proof it needs. After the vows, the unwell bride is carried out of a Harding chapel to Bethlem, and nobody will stop it, because who contradicts a father about a madwoman? Nixon catches Nathaniel's eye and whistles their old signal, *danger*. Nathaniel looks, and sees Ajax.","loc":"The chapel","when":"\"If any man knows cause…\" Tamara opens her prayer book to read out her father's crimes, and every page is blank.","th":"lambrick","also":["harding","guard"],"ch":["tamara","lambrick","nixon","ajax","nathaniel"],"turn":"","w":614,"ed":"","fl":[],"html":"<p>\"If any man knows cause…\" Tamara opens her prayer book to read out her father's crimes, and every page is blank. Lambrick, gently, to the room: \"My daughter is unwell.\" Her lips shake. Through the vestry door, Nixon sees Ajax waiting in the room where she asked him an hour ago, with two Bethlem attendants, a strait-coat, and a lunacy order Lambrick has had a doctor sign. The blank prayer book is all the proof it needs. After the vows, the unwell bride is carried out of a Harding chapel to Bethlem, and nobody will stop it, because who contradicts a father about a madwoman? Nixon catches Nathaniel's eye and whistles their old signal, *danger*. Nathaniel looks, and sees Ajax.</p>"},{"oref":"Scene 10","id":158,"seq":10,"title":"The vestry door","added":false,"act":"Act Two","kind":"scene","sum":"Nixon sees Ajax waiting inside the vestry, in the room where she asked him an hour ago, with two Bethlem attendants, a strait-coat, and a lunacy order Lambrick has had a doctor sign. The blank prayer book is all the proof it needs. After the vows, the unwell bride is carried out of a Harding chapel to Bethlem, and nobody will stop it, because who contradicts a father about a madwoman? Nixon catches Nathaniel's eye and whistles their old signal, *danger*. Nathaniel looks, and sees Ajax.","loc":"The vestry door","when":"Nixon sees Ajax waiting inside the vestry, in the room where she asked him an hour ago, with two Bethlem attendants, a strait-coat, and a lunacy order Lambrick has had a doctor sign.","th":"guard","also":["lambrick"],"ch":["nixon","ajax","nathaniel","tamara","lambrick"],"turn":"","w":308,"ed":"","fl":[],"html":"<p>Nixon sees Ajax waiting inside the vestry, in the room where she asked him an hour ago, with two Bethlem attendants, a strait-coat, and a lunacy order Lambrick has had a doctor sign. The blank prayer book is all the proof it needs. After the vows, the unwell bride is carried out of a Harding chapel to Bethlem, and nobody will stop it, because who contradicts a father about a madwoman? Nixon catches Nathaniel's eye and whistles their old signal, *danger*. Nathaniel looks, and sees Ajax.</p>"},{"oref":"Scene 11","id":159,"seq":11,"title":"The crypt","added":false,"act":"Act Two","kind":"scene","sum":"Up above, the organ stops. The lid is up, the grille is up, and the Lost One is still bent over the lead sheet with her finger on the second clause. Alice: \"Two minutes.\" She leaves her alone and runs up the crypt stair, under the grille, to the gallery door. It's the biggest mistake she makes all season, and she makes it for love.","loc":"The crypt","when":"Up above, the organ stops.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":314,"ed":"","fl":[],"html":"<p>Up above, the organ stops. The lid is up, the grille is up, and the Lost One is still bent over the lead sheet with her finger on the second clause. Alice: \"Two minutes.\" She leaves her alone and runs up the crypt stair, under the grille, to the gallery door. It's the biggest mistake she makes all season, and she makes it for love.</p>"},{"oref":"Scene 12","id":160,"seq":12,"title":"The chapel","added":false,"act":"Act Two","kind":"scene","sum":"The plan was to stop before the ring. The priest reaches the question, and Nathaniel looks at the vestry door, at the strait-coat, at Tamara's shaking lips. If Tamara is a Harding today, under a Harding roof and in front of the Crown, her father can't touch her, because a wife can't be committed without her husband's signature. Nathaniel looks up to the gallery and finds Alice at the door, above the grille, and understands what the ring will cost: the counterweight, and her sister on the wrong side of it. So does she. She nods once, small, like a permission. She is letting him go, and more than him. Nathaniel goes past the place where he was meant to stop. \"I will.\" He says it the way he said it last night among the orange trees, and at the gallery door Alice's lips move with his. Tamara understands why: \"I will.\" Nixon hands over the ring, properly. \"Congratulations, miss.\" \"Thank you, Captain.\" The ring goes on, and far under their feet iron falls. *CLANG.* Every Harding in the chapel knows the sound. Tamara feels it come up through the stone into her shoes. When Nathaniel looks up again, the gallery door is empty.","loc":"The chapel","when":"The plan was to stop before the ring.","th":"harding","also":["sisters"],"ch":["nathaniel","tamara","nixon","alice"],"turn":"","w":657,"ed":"","fl":[],"html":"<p>The plan was to stop before the ring. The priest reaches the question, and Nathaniel looks at the vestry door, at the strait-coat, at Tamara's shaking lips. If Tamara is a Harding today, under a Harding roof and in front of the Crown, her father can't touch her, because a wife can't be committed without her husband's signature. Nathaniel looks up to the gallery and finds Alice at the door, above the grille, and understands what the ring will cost: the counterweight, and her sister on the wrong side of it. So does she. She nods once, small, like a permission. She is letting him go, and more than him. Nathaniel goes past the place where he was meant to stop. \"I will.\" He says it the way he said it last night among the orange trees, and at the gallery door Alice's lips move with his. Tamara understands why: \"I will.\" Nixon hands over the ring, properly. \"Congratulations, miss.\" \"Thank you, Captain.\" The ring goes on, and far under their feet iron falls. *CLANG.* Every Harding in the chapel knows the sound. Tamara feels it come up through the stone into her shoes. When Nathaniel looks up again, the gallery door is empty.</p>"},{"oref":"Scene 13","id":161,"seq":13,"title":"The crypt stair","added":false,"act":"Act Two","kind":"scene","sum":"Alice hits the grille with both hands. *Clang-clang-clang.* Below, the tomb lid is down, and lanterns are coming through the ossuary: Grise's Vykra, at the door Josephine sold them. The Lost One sees them, and sees Alice behind the bars, and doesn't fight. She climbs to the grille and pushes the lead sheet through to her: the clause she lied about, handed to the one person who will read it too late to stop her. Miriam sewed her goodbye into a coat lining. This one hands hers over. Then she goes back down the stair and holds out her wrists. Alice runs for the long way round.","loc":"The crypt stair","when":"Alice hits the grille with both hands.","th":"white","also":["vykra"],"ch":["lostone","grise","josephine"],"turn":"","w":580,"ed":"","fl":[],"html":"<p>Alice hits the grille with both hands. *Clang-clang-clang.* Below, the tomb lid is down, and lanterns are coming through the ossuary: Grise's Vykra, at the door Josephine sold them. The Lost One sees them, and sees Alice behind the bars, and doesn't fight. She climbs to the grille and pushes the lead sheet through to her: the clause she lied about, handed to the one person who will read it too late to stop her. Miriam sewed her goodbye into a coat lining. This one hands hers over. Then she goes back down the stair and holds out her wrists. Alice runs for the long way round.</p>"},{"oref":"Scene 14","id":162,"seq":14,"title":"The chapel steps","added":false,"act":"Act Two","kind":"scene","sum":"Vane's marshals arrest Eldgard for hiding the core from the Crown. He looks at his wife and understands. \"Josie.\" She doesn't look away.","loc":"The chapel steps","when":"Vane's marshals arrest Eldgard for hiding the core from the Crown.","th":"harding","also":["city"],"ch":["vane","eldgard","josephine"],"turn":"","w":140,"ed":"","fl":[],"html":"<p>Vane's marshals arrest Eldgard for hiding the core from the Crown. He looks at his wife and understands. \"Josie.\" She doesn't look away.</p>"},{"oref":"Scene 15","id":163,"seq":15,"title":"The gates, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Nixon walks out of the chapel still holding the empty ring box. The crowd sees Eldgard in irons and surges. Coal-men and Frost Witch believers clash. Vane: \"Lanterns, fire.\" Nixon: \"Lanterns, stand down.\" Vane's second company raises their rifles, and Nixon's company raises theirs back. Cole walks out between the lines with his hands up. Nobody fires. Vane rips the lantern from Nixon's collar, and forty Lanterns tear off their own, drop them in the snowless gutter, and walk away with their captain.","loc":"The gates","when":"Nixon walks out of the chapel still holding the empty ring box.","th":"guard","also":["city"],"ch":["nixon","vane","cole"],"turn":"","w":296,"ed":"","fl":[],"html":"<p>Nixon walks out of the chapel still holding the empty ring box. The crowd sees Eldgard in irons and surges. Coal-men and Frost Witch believers clash. Vane: \"Lanterns, fire.\" Nixon: \"Lanterns, stand down.\" Vane's second company raises their rifles, and Nixon's company raises theirs back. Cole walks out between the lines with his hands up. Nobody fires. Vane rips the lantern from Nixon's collar, and forty Lanterns tear off their own, drop them in the snowless gutter, and walk away with their captain.</p>"},{"oref":"Scene 16","id":164,"seq":16,"title":"The ossuary","added":false,"act":"Act Three","kind":"scene","sum":"Alice comes down the long way, through the riot at the gates with the lead sheet under her coat, ten minutes too late. Empty. On the stone wall, in frost: DON'T FOLLOW ME, the same words as Miriam's letter. Her knees go. She nodded.","loc":"The ossuary","when":"Alice comes down the long way, through the riot at the gates with the lead sheet under her coat, ten minutes too late.","th":"sisters","also":["white"],"ch":["alice"],"turn":"","w":235,"ed":"","fl":[],"html":"<p>Alice comes down the long way, through the riot at the gates with the lead sheet under her coat, ten minutes too late. Empty. On the stone wall, in frost: DON'T FOLLOW ME, the same words as Miriam's letter. Her knees go. She nodded.</p>"},{"oref":"Scene 17","id":165,"seq":17,"title":"Harding House, the old nursery","added":false,"act":"Act Three","kind":"scene","sum":"The newlyweds sit alone with the wedding breakfast. \"We said forty years of politeness.\" \"We managed four minutes.\" Tamara: \"Thank you.\" \"Don't.\" She tells him she loves Nixon. \"I know. I watched him hand me the ring.\" One unsaid thing, finally said. At the door he finds her own shawl already laid over the chair he will sleep in. Neither mentions it. Across the lawn, a lamp comes on in the glasshouse. He stands at the window and watches it until the candle in his hand burns down to his fingers, and then he goes.","loc":"Harding House","when":"The newlyweds sit alone with the wedding breakfast.","th":"lambrick","also":["harding"],"ch":["nathaniel","tamara"],"turn":"","w":354,"ed":"","fl":[],"html":"<p>The newlyweds sit alone with the wedding breakfast. \"We said forty years of politeness.\" \"We managed four minutes.\" Tamara: \"Thank you.\" \"Don't.\" She tells him she loves Nixon. \"I know. I watched him hand me the ring.\" One unsaid thing, finally said. At the door he finds her own shawl already laid over the chair he will sleep in. Neither mentions it. Across the lawn, a lamp comes on in the glasshouse. He stands at the window and watches it until the candle in his hand burns down to his fingers, and then he goes.</p>"},{"oref":"Scene 18","id":228,"seq":18,"title":"The glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Alice brings Nathaniel the lead sheet. \"What did you see up there?\" he asks. \"You, being brave,\" she says, and puts it in his hands before either of them has to say what it cost. Married an hour and lied to by everyone, he reads it anyway. The second clause has a Latin twin, and the Lost One never read that one aloud: *Or a daughter of the White may take her mother's place, and the mother walk free, si mater sinat:* if the mother allows it. Under it, smaller, the forfeit: *And if a Harding break what a Harding made, the White shall have one of that house, given and not taken.* Nathaniel reads that line twice and says nothing about it. Nathaniel: \"Then it fails. No mother allows that.\" Alice: \"She went because she wanted to. She thinks she can make her.\" It's Alice's own lie, love as holding on, coming back at her from the other side of the glass.","loc":"The glasshouse","when":"Alice brings Nathaniel the lead sheet.","th":"harding","also":["sisters"],"ch":["alice","lostone","nathaniel"],"turn":"","w":280,"ed":"","fl":[],"html":"<p>Alice brings Nathaniel the lead sheet. \"What did you see up there?\" he asks. \"You, being brave,\" she says, and puts it in his hands before either of them has to say what it cost. Married an hour and lied to by everyone, he reads it anyway. The second clause has a Latin twin, and the Lost One never read that one aloud: *Or a daughter of the White may take her mother's place, and the mother walk free, si mater sinat:* if the mother allows it. Under it, smaller, the forfeit: *And if a Harding break what a Harding made, the White shall have one of that house, given and not taken.* Nathaniel reads that line twice and says nothing about it. Nathaniel: \"Then it fails. No mother allows that.\" Alice: \"She went because she wanted to. She thinks she can make her.\" It's Alice's own lie, love as holding on, coming back at her from the other side of the glass.</p>"},{"oref":"Scene 19","id":167,"seq":19,"title":"The Works, thirteen steps","added":false,"act":"Act Three","kind":"scene","sum":"Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head. He finds the coal-hatch stair behind the Works and counts down. Thirteen. Behind the last stone is a door, and behind the door is the Orchard: a long low gallery of iron-barred bunks, child-sized shackles, a wall scratched with names and tally marks. Each name is a Hargrave. He finds MARIAN, with a date four years after he was told she died of fever. He sits on her bunk. *Creak.* A wooden spoon is still under the pillow. Over the lintel, in old chalk, are two initials: J.H. Jamie was here first. Nixon understands what he was picked out of, and who kept it from him.","loc":"The Works","when":"Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head.","th":"guard","also":["white"],"ch":["nixon"],"turn":"","w":413,"ed":"","fl":[],"html":"<p>Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head. He finds the coal-hatch stair behind the Works and counts down. Thirteen. Behind the last stone is a door, and behind the door is the Orchard: a long low gallery of iron-barred bunks, child-sized shackles, a wall scratched with names and tally marks. Each name is a Hargrave. He finds MARIAN, with a date four years after he was told she died of fever. He sits on her bunk. *Creak.* A wooden spoon is still under the pillow. Over the lintel, in old chalk, are two initials: J.H. Jamie was here first. Nixon understands what he was picked out of, and who kept it from him.</p>"},{"oref":"Scene 20","id":168,"seq":20,"title":"Newgate","added":false,"act":"Act Three","kind":"scene","sum":"Josephine visits Eldgard through the bars. \"You made a deal with Lambrick,\" he says. \"The girl to the chain, our son kept out of it, and you to Newgate.\" \"Yes.\" \"You sold me.\" \"I sold the man who sold our son.\" He asks one thing: \"Was any of it real?\" \"Thirty years. All of it.\" It's the first time in a generation neither of them lies. \"Our son lives.\" Eldgard: \"You've killed him. Did you read the Latin? *Si mater sinat.* If the mother allows it. I've stood in front of her for forty years, and she's never once given a Harding anything he could keep. She'll break that glass before she lets her child hang in it, and when it breaks they'll need a Harding anyway.\" Josephine: \"Four hundred years in hooks. Nobody refuses the door.\" Eldgard: \"You would.\" It lands. Josephine's face: she may have made a mistake, and it's too late to unmake it.","loc":"Newgate","when":"Josephine visits Eldgard through the bars.","th":"harding","also":["city"],"ch":["josephine","eldgard"],"turn":"","w":525,"ed":"","fl":[],"html":"<p>Josephine visits Eldgard through the bars. \"You made a deal with Lambrick,\" he says. \"The girl to the chain, our son kept out of it, and you to Newgate.\" \"Yes.\" \"You sold me.\" \"I sold the man who sold our son.\" He asks one thing: \"Was any of it real?\" \"Thirty years. All of it.\" It's the first time in a generation neither of them lies. \"Our son lives.\" Eldgard: \"You've killed him. Did you read the Latin? *Si mater sinat.* If the mother allows it. I've stood in front of her for forty years, and she's never once given a Harding anything he could keep. She'll break that glass before she lets her child hang in it, and when it breaks they'll need a Harding anyway.\" Josephine: \"Four hundred years in hooks. Nobody refuses the door.\" Eldgard: \"You would.\" It lands. Josephine's face: she may have made a mistake, and it's too late to unmake it.</p>"},{"oref":"Scene 21","id":169,"seq":21,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother. She speaks to Morgana in the language of the White: \"I've come to take your place.\" Morgana understands. For four hundred years she has wanted the door, and here it is, held open by her own child. She screams. It's grief, not rage, and it's no.","loc":"The core","when":"Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother.","th":"white","also":["city"],"ch":["lambrick","vane","lostone","morgana"],"turn":"","w":263,"ed":"","fl":[],"html":"<p>Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother. She speaks to Morgana in the language of the White: \"I've come to take your place.\" Morgana understands. For four hundred years she has wanted the door, and here it is, held open by her own child. She screams. It's grief, not rage, and it's no.</p>"},{"oref":"Scene 22","id":170,"seq":22,"title":"London","added":false,"act":"Tag","kind":"scene","sum":"The scream rises through the Works and into the sky, and it begins to snow, two weeks early. Alice in the glasshouse door. Nixon and his forty on a rooftop. Tamara at a window in her wedding dress. Josephine on the Newgate steps. Eldgard at his cell window, flakes on his face: \"First snow.\" Card: **0 DAYS.**","loc":"London","when":"The scream rises through the Works and into the sky, and it begins to snow, two weeks early.","th":"city","also":["white"],"ch":["alice","nixon","tamara","josephine","eldgard"],"turn":"","w":228,"ed":"","fl":[],"html":"<p>The scream rises through the Works and into the sky, and it begins to snow, two weeks early. Alice in the glasshouse door. Nixon and his forty on a rooftop. Tamara at a window in her wedding dress. Josephine on the Newgate steps. Eldgard at his cell window, flakes on his face: \"First snow.\" Card: <strong>0 DAYS.</strong></p>"}]},{"n":9,"title":"The Snow Confession","time":"FIRST SNOW","clock":"FIRST SNOW","act":"III","log":"With the snow falling and the binding set for midnight, Nathaniel breaks his father out of Newgate with Nixon's mutineers, Alice takes the Vykra from Mother Grise, and Tamara steals her father's keys. At the Works gate, Eldgard takes a blow meant for his son and spends his last breath on everything he did.","sum":"Josephine pulls the lever","turn":"Eldgard dies and tells everything","focus":"the assault. Everyone's plan runs toward one room","piece":"the Newgate break-out, then storming the Works through snow and wolves","threads":["harding","investigation","lambrick","vykra","guard","city","white"],"frame":"<blockquote><p><strong>Focus:</strong> the assault. Everyone's plan runs toward one room</p><p><strong>Set piece:</strong> the Newgate break-out, then storming the Works through snow and wolves</p><p><strong>Sting:</strong> Eldgard dies telling the truth, and it's worse than the lies</p></blockquote>","scenes":[{"oref":"Scene 1","id":216,"seq":1,"title":"The Serpentine, twenty years ago","added":false,"act":"Cold open","kind":"scene","sum":"Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls. Then, kneeling on the ice: \"One day the city will need you to be very brave.\" \"I'll be brave, Papa.\" Eldgard's face as he hears it.","loc":"The Serpentine","when":"Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls.","th":"harding","also":[],"ch":["eldgard","jamie"],"turn":"","w":187,"ed":"","fl":[],"html":"<p>Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls. Then, kneeling on the ice: \"One day the city will need you to be very brave.\" \"I'll be brave, Papa.\" Eldgard's face as he hears it.</p>"},{"oref":"Scene 2","id":172,"seq":2,"title":"The glasshouse, snow falling through the broken panes","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel says it first, because he has had all afternoon to hear the clang again: \"You were above the grille when you nodded. I saw you, and I said it anyway.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Had already lied to me about the clause. She was going, Nathaniel. I only chose who got saved on the way.\" He owes her something he can never pay back, and both of them know it, and it makes him cruel for exactly one line: \"My mother's receipt had your name on it. That's where I learned it. On a bill.\" Alice doesn't flinch, which is how he knows it went in. Then she gives him the rest of the sentence from this morning, all of it, the way she gave her sister fifteen years in one breath: \"At first I was paid. Then you flew across that foundry into a coal bin for an audience of one, and you looked at me like I was the first person who'd ever watched. After that I'd have done it for nothing. I did do it for nothing. Grise cut me loose a month ago, and I kept coming.\" Snow ticks on the broken glass. \"I'm married.\" \"I know. I nodded.\" He reaches for her across the workbench. She lets him get halfway, then stands. \"Midnight. The core. After that, we'll see what either of us is allowed.\" For the first time it's her plan and he follows it: midnight at the core. They need Eldgard, the only one who knows the lower lock, and they need Nixon.","loc":"The glasshouse","when":"Nathaniel says it first, because he has had all afternoon to hear the clang again: \"You were above the grille when you nodded.","th":"harding","also":["sisters"],"ch":["alice","nathaniel"],"turn":"","w":1116,"ed":"","fl":[],"html":"<p>Nathaniel says it first, because he has had all afternoon to hear the clang again: \"You were above the grille when you nodded. I saw you, and I said it anyway.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Had already lied to me about the clause. She was going, Nathaniel. I only chose who got saved on the way.\" He owes her something he can never pay back, and both of them know it, and it makes him cruel for exactly one line: \"My mother's receipt had your name on it. That's where I learned it. On a bill.\" Alice doesn't flinch, which is how he knows it went in. Then she gives him the rest of the sentence from this morning, all of it, the way she gave her sister fifteen years in one breath: \"At first I was paid. Then you flew across that foundry into a coal bin for an audience of one, and you looked at me like I was the first person who'd ever watched. After that I'd have done it for nothing. I did do it for nothing. Grise cut me loose a month ago, and I kept coming.\" Snow ticks on the broken glass. \"I'm married.\" \"I know. I nodded.\" He reaches for her across the workbench. She lets him get halfway, then stands. \"Midnight. The core. After that, we'll see what either of us is allowed.\" For the first time it's her plan and he follows it: midnight at the core. They need Eldgard, the only one who knows the lower lock, and they need Nixon.</p>"},{"oref":"Scene 3","id":173,"seq":3,"title":"An abandoned bell foundry, Whitechapel","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. Forty disgraced Lanterns cook sausages on flash-gauntlets set to low. Nathaniel walks in. \"You shot my brother.\" \"Yes.\" \"My father did the rest. I think.\" Silence. \"What do you need?\" \"Newgate, then the Works.\" Nixon: \"You know we're cousins? Cadet line.\" \"Then you're family. God help you.\"","loc":"An abandoned bell foundry","when":"Whimsy.","th":"investigation","also":["guard"],"ch":["nixon","nathaniel"],"turn":"","w":205,"ed":"","fl":[],"html":"<p>Whimsy. Forty disgraced Lanterns cook sausages on flash-gauntlets set to low. Nathaniel walks in. \"You shot my brother.\" \"Yes.\" \"My father did the rest. I think.\" Silence. \"What do you need?\" \"Newgate, then the Works.\" Nixon: \"You know we're cousins? Cadet line.\" \"Then you're family. God help you.\"</p>"},{"oref":"Scene 4","id":174,"seq":4,"title":"Lambrick House","added":false,"act":"Act One","kind":"scene","sum":"Lambrick: \"If the girl fails, the Crown needs a Harding by midnight. You'll bring your husband.\" Tamara: \"Yes, Father.\" He believes her, because he has never once looked at her. In the study an hour later, she opens the safe one last time and takes the Works master key. Ajax is in the doorway with an apple. This time she holds up a winter's kiss needle, Vykra issue: \"Try it.\" He steps aside, then goes to tell her father.","loc":"Lambrick House","when":"Lambrick: \"If the girl fails, the Crown needs a Harding by midnight.","th":"lambrick","also":["harding","guard"],"ch":["lambrick","tamara","ajax"],"turn":"","w":378,"ed":"","fl":[],"html":"<p>Lambrick: \"If the girl fails, the Crown needs a Harding by midnight. You'll bring your husband.\" Tamara: \"Yes, Father.\" He believes her, because he has never once looked at her. In the study an hour later, she opens the safe one last time and takes the Works master key. Ajax is in the doorway with an apple. This time she holds up a winter's kiss needle, Vykra issue: \"Try it.\" He steps aside, then goes to tell her father.</p>"},{"oref":"Scene 5","id":176,"seq":5,"title":"Vykra laundry","added":false,"act":"Act One","kind":"scene","sum":"Grise: \"I sold your sister because she's worth more than you.\" Alice calls a challenge by Vykra law. A knife fight among steaming sheets, *fwip, fwip*, shadows through linen. Alice wins on a rhythm Miriam taught her, the counting game, the count she used to hide inside. One post, two post, through eight, and on *nine* she moves, the count the Lost One gave her, the one where you get up. She spares the old woman. The Vykra girls pick up their knives. \"Where?\" \"Tyburn.\"","loc":"Vykra laundry","when":"Grise: \"I sold your sister because she's worth more than you.\" Alice calls a challenge by Vykra law.","th":"vykra","also":["sisters"],"ch":["grise","alice"],"turn":"","w":301,"ed":"","fl":[],"html":"<p>Grise: \"I sold your sister because she's worth more than you.\" Alice calls a challenge by Vykra law. A knife fight among steaming sheets, *fwip, fwip*, shadows through linen. Alice wins on a rhythm Miriam taught her, the counting game, the count she used to hide inside. One post, two post, through eight, and on *nine* she moves, the count the Lost One gave her, the one where you get up. She spares the old woman. The Vykra girls pick up their knives. \"Where?\" \"Tyburn.\"</p>"},{"oref":"Scene 6","id":177,"seq":6,"title":"Harding House, the snowlit hall","added":false,"act":"Act One","kind":"scene","sum":"Josephine alone beside Byron's empty chair. She opens a hidden box of Vykra knives she hasn't touched in thirty years and puts them on.","loc":"Harding House","when":"Josephine alone beside Byron's empty chair.","th":"harding","also":["vykra"],"ch":["josephine"],"turn":"","w":142,"ed":"","fl":[],"html":"<p>Josephine alone beside Byron's empty chair. She opens a hidden box of Vykra knives she hasn't touched in thirty years and puts them on.</p>"},{"oref":"Scene 7","id":178,"seq":7,"title":"Newgate yard, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's forty come over the walls on leap-boosters, *kshhh-THOOM* in the snow. Flash-bursts strobe the yard. Nathaniel cuts the cell bars with his gauntlet. Eldgard: \"You came for me.\" \"I came for your key.\" Two cells down, Nixon quietly opens 1417 as well. Old Marsh shuffles out into the yard, looks up at the snow, and says, perfectly lucid, \"They always count from the first snow.\" Cole persuades a turnkey to unlock the gate with extreme politeness and a lantern rifle.","loc":"Newgate yard","when":"Nixon's forty come over the walls on leap-boosters, *kshhh-THOOM* in the snow.","th":"guard","also":["harding"],"ch":["nixon","nathaniel","eldgard","marsh","cole"],"turn":"","w":291,"ed":"","fl":[],"html":"<p>Nixon's forty come over the walls on leap-boosters, *kshhh-THOOM* in the snow. Flash-bursts strobe the yard. Nathaniel cuts the cell bars with his gauntlet. Eldgard: \"You came for me.\" \"I came for your key.\" Two cells down, Nixon quietly opens 1417 as well. Old Marsh shuffles out into the yard, looks up at the snow, and says, perfectly lucid, \"They always count from the first snow.\" Cole persuades a turnkey to unlock the gate with extreme politeness and a lantern rifle.</p>"},{"oref":"Scene 8","id":179,"seq":8,"title":"Newgate rooftops","added":false,"act":"Act Two","kind":"scene","sum":"Crown guards on the roofs. Eldgard can't leap, so Nixon carries him: the spare carrying the man who bred him. Eldgard: \"Thank you, Captain.\" Nixon: \"Don't.\"","loc":"Newgate rooftops","when":"Crown guards on the roofs.","th":"guard","also":["harding"],"ch":["nixon","eldgard"],"turn":"","w":148,"ed":"","fl":[],"html":"<p>Crown guards on the roofs. Eldgard can't leap, so Nixon carries him: the spare carrying the man who bred him. Eldgard: \"Thank you, Captain.\" Nixon: \"Don't.\"</p>"},{"oref":"Scene 9","id":180,"seq":9,"title":"The Works, the gallery and the core below","added":false,"act":"Act Two","kind":"scene","sum":"Snow thickens over Tyburn. Where it lies deep, wolves start to shape themselves out of the drifts. Vane is nervous. Lambrick: \"Midnight. The girl, or the boy.\" Below them, cracks spread through the Heartglass around the Lost One: every time the glass hums toward the trade, her mother pulls against her own hooks, and another crack runs. *Tik. Tik.* Morgana, hoarse: \"You were free. Why did you come back?\" The Lost One: \"Because you're my mother.\" Morgana: \"That is why I won't.\" Footsteps on Byron's old Guard stair: Josephine is coming down.","loc":"The Works","when":"Snow thickens over Tyburn.","th":"city","also":["lambrick","white","harding"],"ch":["vane","lambrick","lostone","morgana","josephine"],"turn":"","w":513,"ed":"","fl":[],"html":"<p>Snow thickens over Tyburn. Where it lies deep, wolves start to shape themselves out of the drifts. Vane is nervous. Lambrick: \"Midnight. The girl, or the boy.\" Below them, cracks spread through the Heartglass around the Lost One: every time the glass hums toward the trade, her mother pulls against her own hooks, and another crack runs. *Tik. Tik.* Morgana, hoarse: \"You were free. Why did you come back?\" The Lost One: \"Because you're my mother.\" Morgana: \"That is why I won't.\" Footsteps on Byron's old Guard stair: Josephine is coming down.</p>"},{"oref":"Scene 10","id":182,"seq":10,"title":"The outfall, outside the Works","added":false,"act":"Act Two","kind":"scene","sum":"The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle. Whimsy before the storm. Cole asks Tamara if married ladies are allowed to fight. She hands him a knife. Then Tamara's key turns. The Lanterns go over the walls and the Vykra go up the outfall.","loc":"The outfall","when":"The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle.","th":"harding","also":["guard","lambrick"],"ch":["alice","nixon","tamara","nathaniel","eldgard","cole"],"turn":"","w":260,"ed":"","fl":[],"html":"<p>The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle. Whimsy before the storm. Cole asks Tamara if married ladies are allowed to fight. She hands him a knife. Then Tamara's key turns. The Lanterns go over the walls and the Vykra go up the outfall.</p>"},{"oref":"Scene 11","id":184,"seq":11,"title":"The courtyard, set piece","added":false,"act":"Act Two","kind":"scene","sum":"A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men. Then the wolves come out of the drifts and attack everyone. Flash-bursts turn the snow green.","loc":"The courtyard","when":"A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men.","th":"city","also":["white"],"ch":[],"turn":"","w":150,"ed":"","fl":[],"html":"<p>A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men. Then the wolves come out of the drifts and attack everyone. Flash-bursts turn the snow green.</p>"},{"oref":"Scene 12","id":185,"seq":12,"title":"The courtyard","added":false,"act":"Act Three","kind":"scene","sum":"Ajax and the Black Gauntlet, *WHUNK*, drive Nathaniel into the ground. Ajax grins down at him, scarred from the Thames: \"You should've pulled me up, Harding.\" The fist goes up for the killing blow, and Eldgard steps under it. His ribs give way. Alice, who told him to pull Ajax up, drives the man off with flash after flash, and he retreats inside. Inside is the core, and her sister, and the clock on the Works tower says twenty to twelve. She has the charge left to chase him. She looks at the door. She looks at Nathaniel on his knees in the snow with his father across his lap. She stays.","loc":"The courtyard","when":"Ajax and the Black Gauntlet, *WHUNK*, drive Nathaniel into the ground.","th":"guard","also":["harding"],"ch":["ajax","nathaniel","eldgard","alice"],"turn":"","w":482,"ed":"","fl":[],"html":"<p>Ajax and the Black Gauntlet, *WHUNK*, drive Nathaniel into the ground. Ajax grins down at him, scarred from the Thames: \"You should've pulled me up, Harding.\" The fist goes up for the killing blow, and Eldgard steps under it. His ribs give way. Alice, who told him to pull Ajax up, drives the man off with flash after flash, and he retreats inside. Inside is the core, and her sister, and the clock on the Works tower says twenty to twelve. She has the charge left to chase him. She looks at the door. She looks at Nathaniel on his knees in the snow with his father across his lap. She stays.</p>"},{"oref":"Scene 13","id":186,"seq":13,"title":"The Snow Confession, I","added":false,"act":"Act Three","kind":"scene","sum":"Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have. Nathaniel holds his father in the snow, and asks the question from the dressing room again, because this time there's no wedding to get through. \"Did you hold his hand?\" Eldgard: \"I held his hand.\" A breath. \"Over the lock. Nixon's round went through his shoulder. He would have lived. I held his hand on the iron until the chain drank enough to last to the snow.\" Nathaniel doesn't let go of him. That's the cruelty of the scene: he can't. \"I spent your brother on forty-nine days.\" Nathaniel: \"And then you filled his coffin with slag. I opened it.\" \"The chain leaves nothing to bury. It left nothing of Otty. The Captain carried it for me.\" Nathaniel: \"She says he's cold. Not dead.\" On his father's other side, Nixon remembers the weight on the steps of St Bride's. \"Don't go looking for him, Nathaniel. That's how she gets a Harding to the lock. Hoping.\"","loc":"The Snow Confession","when":"Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","otty","alice"],"turn":"","w":643,"ed":"","fl":[],"html":"<p>Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have. Nathaniel holds his father in the snow, and asks the question from the dressing room again, because this time there's no wedding to get through. \"Did you hold his hand?\" Eldgard: \"I held his hand.\" A breath. \"Over the lock. Nixon's round went through his shoulder. He would have lived. I held his hand on the iron until the chain drank enough to last to the snow.\" Nathaniel doesn't let go of him. That's the cruelty of the scene: he can't. \"I spent your brother on forty-nine days.\" Nathaniel: \"And then you filled his coffin with slag. I opened it.\" \"The chain leaves nothing to bury. It left nothing of Otty. The Captain carried it for me.\" Nathaniel: \"She says he's cold. Not dead.\" On his father's other side, Nixon remembers the weight on the steps of St Bride's. \"Don't go looking for him, Nathaniel. That's how she gets a Harding to the lock. Hoping.\"</p>"},{"oref":"Scene 14","id":187,"seq":14,"title":"The Snow Confession, II","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard: \"When you were five—\" Nathaniel: \"I know. She told me I'd been down the stairs. I remembered the lantern on my own.\" Eldgard almost laughs, blood in it: \"Then she was kinder than I was.\" He turns his head to Nixon, kneeling at his other side. \"Cadet line. My spare. I took you from the Orchard at six. Your mother asked after you every day for four years, and I told her you were learning your letters.\" Nixon: \"I was.\" \"I know. I checked.\" It's the worst thing he says all night, and he means it as love. \"Forgive me, or don't.\" Nixon learns in one breath that he didn't kill Jamie, and what he was raised for, and does neither. \"Jamie found your mother's bunk, Captain. He chalked his initials over that door so the next one down would know somebody had seen it. Then he came up and asked me how many. I told him the truth, once. That was the night he stopped being my son and started being his own.\" To Nathaniel: \"There was always a way out. Free her, and pay in light. Alistair chose sons. My father chose my sister Otty. She was nineteen. She walked down the stair singing, and Byron held her ribbon. I was eight. They told me Switzerland, and they cut it in brass.\" The thing he's never said: \"I could have gone down that stair myself. I raised a boy for it instead.\" He presses the wolf-crest ring into Nathaniel's palm. \"Don't be me. The lock opens with what closed it: Harding blood, and a blade that's already in it.\" Nathaniel's other hand goes behind him without looking, and finds Alice's. He dies. Snow settles on his open eyes and doesn't melt.","loc":"The Snow Confession","when":"Eldgard: \"When you were five—\" Nathaniel: \"I know.","th":"harding","also":["guard","white"],"ch":["eldgard","nixon","nathaniel","jamie","alistair","alice"],"turn":"","w":976,"ed":"","fl":[],"html":"<p>Eldgard: \"When you were five—\" Nathaniel: \"I know. She told me I'd been down the stairs. I remembered the lantern on my own.\" Eldgard almost laughs, blood in it: \"Then she was kinder than I was.\" He turns his head to Nixon, kneeling at his other side. \"Cadet line. My spare. I took you from the Orchard at six. Your mother asked after you every day for four years, and I told her you were learning your letters.\" Nixon: \"I was.\" \"I know. I checked.\" It's the worst thing he says all night, and he means it as love. \"Forgive me, or don't.\" Nixon learns in one breath that he didn't kill Jamie, and what he was raised for, and does neither. \"Jamie found your mother's bunk, Captain. He chalked his initials over that door so the next one down would know somebody had seen it. Then he came up and asked me how many. I told him the truth, once. That was the night he stopped being my son and started being his own.\" To Nathaniel: \"There was always a way out. Free her, and pay in light. Alistair chose sons. My father chose my sister Otty. She was nineteen. She walked down the stair singing, and Byron held her ribbon. I was eight. They told me Switzerland, and they cut it in brass.\" The thing he's never said: \"I could have gone down that stair myself. I raised a boy for it instead.\" He presses the wolf-crest ring into Nathaniel's palm. \"Don't be me. The lock opens with what closed it: Harding blood, and a blade that's already in it.\" Nathaniel's other hand goes behind him without looking, and finds Alice's. He dies. Snow settles on his open eyes and doesn't melt.</p>"},{"oref":"Scene 15","id":189,"seq":15,"title":"The courtyard, then the core stair","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel stands. He doesn't put the ring on. He pockets it. From the same pocket he takes Jamie's key on its black ribbon, the one that opens Byron's old Guard stair. Alice is at his side, and Nixon is at the other. They go in. On the core stair, Tamara and Nixon hold it against Crown troops so the others can get down. Under fire, she says: \"If we die, I want it on record I was married for twelve hours.\" Nixon: \"Noted.\" Flash. Flash.","loc":"The courtyard","when":"Nathaniel stands.","th":"harding","also":["guard","city"],"ch":["nathaniel","alice","nixon","tamara"],"turn":"","w":378,"ed":"","fl":[],"html":"<p>Nathaniel stands. He doesn't put the ring on. He pockets it. From the same pocket he takes Jamie's key on its black ribbon, the one that opens Byron's old Guard stair. Alice is at his side, and Nixon is at the other. They go in. On the core stair, Tamara and Nixon hold it against Crown troops so the others can get down. Under fire, she says: \"If we die, I want it on record I was married for twelve hours.\" Nixon: \"Noted.\" Flash. Flash.</p>"},{"oref":"Scene 16","id":191,"seq":16,"title":"The core floor","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel and Alice reach the bottom. The Lost One is screaming inside the cracking Heartglass, Morgana is straining at her hooks, Lambrick and Vane are on the gallery, and Josephine is at the lever.","loc":"The core floor","when":"Nathaniel and Alice reach the bottom.","th":"white","also":["city"],"ch":["nathaniel","alice","lostone","morgana","lambrick","vane","josephine"],"turn":"","w":168,"ed":"","fl":[],"html":"<p>Nathaniel and Alice reach the bottom. The Lost One is screaming inside the cracking Heartglass, Morgana is straining at her hooks, Lambrick and Vane are on the gallery, and Josephine is at the lever.</p>"},{"oref":"Scene 17","id":192,"seq":17,"title":"The core","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel: \"Mother. Step away.\" Alice: \"That's my sister.\" Josephine, gently, to neither of them: \"Your father said her mother would never allow it.\" Nathaniel: \"Then don't.\" \"Four hundred years in hooks, Nathaniel. Nobody refuses the door.\" It's the choice she made at breakfast in Episode 7, between her son and everything else, made one last time with her hand on iron. If the girl holds, no Harding dies tonight, and Josephine can live with what it cost. She pulls the lever. Cut to black.","loc":"The core","when":"Nathaniel: \"Mother.","th":"harding","also":["white"],"ch":["nathaniel","alice","josephine"],"turn":"","w":311,"ed":"","fl":[],"html":"<p>Nathaniel: \"Mother. Step away.\" Alice: \"That's my sister.\" Josephine, gently, to neither of them: \"Your father said her mother would never allow it.\" Nathaniel: \"Then don't.\" \"Four hundred years in hooks, Nathaniel. Nobody refuses the door.\" It's the choice she made at breakfast in Episode 7, between her son and everything else, made one last time with her hand on iron. If the girl holds, no Harding dies tonight, and Josephine can live with what it cost. She pulls the lever. Cut to black.</p>"}]},{"n":10,"title":"The Tithe","time":"THE LONGEST NIGHT","clock":"THE LONGEST NIGHT","act":"III","log":"The Heartglass cracks, the Crown comes for the last Harding son, and Nixon offers himself instead. Nathaniel does what no Harding has done in four hundred years. He opens the lock, and London pays in light.","sum":"The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie alive in the White. DAY ONE","turn":"Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name","focus":"the choice Alistair refused","piece":"London goes dark for good, and the White comes through","threads":["white","harding","guard","city","lambrick"],"frame":"<blockquote><p><strong>Focus:</strong> the choice Alistair refused</p><p><strong>Set piece:</strong> London goes dark for good, and the White comes through</p><p><strong>Double twist:</strong> Nathaniel refuses every sacrifice offered to him, Morgana still demands a Harding, and Josephine goes in his place</p><p><strong>Final image:</strong> \"The Record,\" a montage of the season's climaxes under Nathaniel's voice, ending on a heartbeat, then a hard cut to Jamie, alive in the White</p></blockquote>","scenes":[{"oref":"Scene 1","id":193,"seq":1,"title":"The core, 1489, an hour before the pilot's cold open","added":false,"act":"Cold open","kind":"scene","sum":"Alistair at the chain, his net still wet with frost; the child is in it. Morgana, fresh in her hooks, makes him an offer: \"Free me, and pay in light. Keep me, and pay in sons.\" Then the part no Harding ever wrote down: \"Either way, my child goes free tonight.\" He slides the wolf-crest ring onto his finger. \"Sons.\" He cuts the net. In the doorway behind him, his firstborn, Edric, nine years old, the boy with the lantern from the pilot, holds it up for his father, then carries it down the stair ahead of him, alone. The same choice Nathaniel faces tonight.","loc":"The core","when":"Alistair at the chain, his net still wet with frost; the child is in it.","th":"white","also":["harding"],"ch":["alistair","morgana"],"turn":"","w":381,"ed":"","fl":[],"html":"<p>Alistair at the chain, his net still wet with frost; the child is in it. Morgana, fresh in her hooks, makes him an offer: \"Free me, and pay in light. Keep me, and pay in sons.\" Then the part no Harding ever wrote down: \"Either way, my child goes free tonight.\" He slides the wolf-crest ring onto his finger. \"Sons.\" He cuts the net. In the doorway behind him, his firstborn, Edric, nine years old, the boy with the lantern from the pilot, holds it up for his father, then carries it down the stair ahead of him, alone. The same choice Nathaniel faces tonight.</p>"},{"oref":"Scene 2","id":194,"seq":2,"title":"The core, a minute to midnight","added":false,"act":"Act One","kind":"scene","sum":"The lever drops. The Heartglass floods the Lost One with green fire, and she screams, and the door swings open for her mother: the hooks loosen, and for the first time in four hundred years Morgana could step out. She doesn't. She takes the chain in both hands and drags herself back onto the iron, hooks tearing deeper, pulling against the trade until the glass around her daughter cracks from her side. *Krrrrk.* \"Not her.\" The chain shudders and doesn't take. At the lever, Josephine watches a mother refuse the door and hears her husband in Newgate: *You would.* Lambrick, from the gallery: \"Then the boy! Take the Harding!\" Vane's marshals start down the stairs.","loc":"The core","when":"The lever drops.","th":"harding","also":["white"],"ch":["lostone","lambrick","vane","josephine","morgana"],"turn":"","w":496,"ed":"","fl":[],"html":"<p>The lever drops. The Heartglass floods the Lost One with green fire, and she screams, and the door swings open for her mother: the hooks loosen, and for the first time in four hundred years Morgana could step out. She doesn't. She takes the chain in both hands and drags herself back onto the iron, hooks tearing deeper, pulling against the trade until the glass around her daughter cracks from her side. *Krrrrk.* \"Not her.\" The chain shudders and doesn't take. At the lever, Josephine watches a mother refuse the door and hears her husband in Newgate: *You would.* Lambrick, from the gallery: \"Then the boy! Take the Harding!\" Vane's marshals start down the stairs.</p>"},{"oref":"Scene 3","id":195,"seq":3,"title":"The core floor","added":false,"act":"Act One","kind":"scene","sum":"Alice smashes the Heartglass with her gauntlet, *KSSHHH*, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs for her son and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better. Nathaniel steps between them: \"Mother.\" Then Nixon comes down the stair bleeding, with Tamara behind him. \"I'm Harding blood. Take me. They grew me for this the way they grew my m
