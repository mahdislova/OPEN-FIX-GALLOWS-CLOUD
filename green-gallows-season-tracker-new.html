idor: \"You had her and you let her go.\" Then, softly: \"I know what you did at the core, Captain. So do you.\"</p>"},{"oref":"Scene 16","id":61,"seq":16,"title":"The tunnel mouth","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel is waiting. The ghostlight is built to his own design: the schematic that left his coat in the dark at his engagement ball. Alice tells him the truth as she believes it: her sister nearly froze to death and came back wrong, and she's hiding her until she gets better. The Lost One steps out and, before Alice can stop her, takes Nathaniel's bare hand. Nothing happens. No frost. All three of them stare.","loc":"The tunnel mouth","when":"Nathaniel is waiting.","th":"white","also":["sisters"],"ch":["nathaniel","alice","lostone"],"turn":"","w":249,"ed":"","fl":[],"html":"<p>Nathaniel is waiting. The ghostlight is built to his own design: the schematic that left his coat in the dark at his engagement ball. Alice tells him the truth as she believes it: her sister nearly froze to death and came back wrong, and she's hiding her until she gets better. The Lost One steps out and, before Alice can stop her, takes Nathaniel's bare hand. Nothing happens. No frost. All three of them stare.</p>"},{"oref":"Scene 17","id":62,"seq":17,"title":"Tamara's bedroom","added":false,"act":"Act Three","kind":"scene","sum":"Ajax is sitting on her bed. \"Your father sends his love. Stay out of his safe.\" He leaves the apple core on her pillow.","loc":"Tamara's bedroom","when":"Ajax is sitting on her bed.","th":"lambrick","also":[],"ch":["tamara","ajax"],"turn":"","w":142,"ed":"","fl":[],"html":"<p>Ajax is sitting on her bed. \"Your father sends his love. Stay out of his safe.\" He leaves the apple core on her pillow.</p>"},{"oref":"Scene 18","id":63,"seq":18,"title":"The tunnel mouth","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel turns to go. The Lost One, sniffing the air like an animal: \"You smell like the man who keeps my mother.\" Cut to black.","loc":"The tunnel mouth","when":"Nathaniel turns to go.","th":"white","also":["harding"],"ch":["nathaniel","lostone"],"turn":"","w":145,"ed":"","fl":[],"html":"<p>Nathaniel turns to go. The Lost One, sniffing the air like an animal: \"You smell like the man who keeps my mother.\" Cut to black.</p>"}]},{"n":4,"title":"The Hearing","time":"38 DAYS TO FIRST SNOW","clock":"38 DAYS TO FIRST SNOW","act":"I","log":"Nathaniel and Alice hang Lambrick's enforcer over the Thames for Jamie's murder and learn Jamie paid him. Then Felix Hawke dies on the witness stand with frost on his lips, and all of London blames the girl hiding in the Harding glasshouse. Nixon, alone, finds the madman in Newgate whom Jamie visited every Sunday, and leaves with a nursery rhyme.","sum":"Josephine washes frost off her fingers","turn":"Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh","focus":"the Crown's hearing on the Harding Charter, and who killed Jamie","piece":"the coal-docks fight with Ajax; a murder on the witness stand","threads":["lambrick","sisters","harding","guard","investigation","vykra","city"],"frame":"<blockquote><p><strong>Focus:</strong> the Crown's hearing on the Harding Charter, and who killed Jamie</p><p><strong>Set piece:</strong> the coal-docks fight with Ajax; a murder on the witness stand</p><p><strong>Double twist:</strong> the man Nathaniel hunts was hired by his own brother, and the \"Frost Killer\" who kills Felix in public is Nathaniel's mother</p></blockquote>","scenes":[{"oref":"Scene 1","id":64,"seq":1,"title":"The Works gate, 2 November, ten minutes before the blackout","added":false,"act":"Cold open","kind":"scene","sum":"Jamie meets Ajax and pays him two hundred guineas to cut the outer grid: the whole city dark at once, so nobody looks twice at one Harding going down to the core inside it. In a coach, Lambrick: \"Free her, and the light dies, and London comes back to coal. To me.\" Jamie: \"Then London can freeze honestly.\" The audience now knows what Nathaniel doesn't: Jamie had partners.","loc":"The Works gate","when":"Jamie meets Ajax and pays him two hundred guineas to cut the outer grid: the whole city dark at once, so nobody looks twice at one Harding going down to the core inside it.","th":"lambrick","also":["investigation"],"ch":["jamie","ajax","lambrick"],"turn":"","w":205,"ed":"","fl":[],"html":"<p>Jamie meets Ajax and pays him two hundred guineas to cut the outer grid: the whole city dark at once, so nobody looks twice at one Harding going down to the core inside it. In a coach, Lambrick: \"Free her, and the light dies, and London comes back to coal. To me.\" Jamie: \"Then London can freeze honestly.\" The audience now knows what Nathaniel doesn't: Jamie had partners.</p>"},{"oref":"Scene 2","id":65,"seq":2,"title":"Harding glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look. Whimsy: frozen butterflies on the panes, an orange tree. The Lost One makes snow for the first time, a little flurry over her palm, and laughs like a child. Alice and Nathaniel watch her and have their first real conversation, about everything except the thing between them. Alice gives him her theory, the one she's built to live inside: \"Something came back in her from the cold. It's got its own wants. But Mim's under it. Wren says the memories come back.\" Nathaniel has seen the girl touch his hand without freezing it. He looks at Alice with something like pity and doesn't argue. Later, the Lost One tries again, very carefully: \"Ali. Under the bed—\" Alice hands her an orange. \"Eat that.\" Behind the fence.","loc":"Harding glasshouse","when":"Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look.","th":"sisters","also":["harding"],"ch":["nathaniel","alice","lostone"],"turn":"","w":462,"ed":"","fl":[],"html":"<p>Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look. Whimsy: frozen butterflies on the panes, an orange tree. The Lost One makes snow for the first time, a little flurry over her palm, and laughs like a child. Alice and Nathaniel watch her and have their first real conversation, about everything except the thing between them. Alice gives him her theory, the one she's built to live inside: \"Something came back in her from the cold. It's got its own wants. But Mim's under it. Wren says the memories come back.\" Nathaniel has seen the girl touch his hand without freezing it. He looks at Alice with something like pity and doesn't argue. Later, the Lost One tries again, very carefully: \"Ali. Under the bed—\" Alice hands her an orange. \"Eat that.\" Behind the fence.</p>"},{"oref":"Scene 3","id":66,"seq":3,"title":"Harding House, breakfast","added":false,"act":"Act One","kind":"scene","sum":"Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir. Josephine: the Lambrick wedding moves up. Nathaniel: \"No.\" His first open defiance. Josephine reads the hearing's witness list and stops at one name: *Insp. F. Hawke.*","loc":"Harding House","when":"Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir.","th":"harding","also":["lambrick"],"ch":["eldgard","josephine","nathaniel"],"turn":"","w":192,"ed":"","fl":[],"html":"<p>Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir. Josephine: the Lambrick wedding moves up. Nathaniel: \"No.\" His first open defiance. Josephine reads the hearing's witness list and stops at one name: *Insp. F. Hawke.*</p>"},{"oref":"Scene 4","id":67,"seq":4,"title":"Guard tower, the armoury","added":false,"act":"Act One","kind":"scene","sum":"A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight. Cole is back, bandaged, two fingers short, desperate to be useful, and Nixon puts him on the duty roster to give him back his pride. Then Tamara comes to Nixon, the only man in London she trusts. Ajax was in her room, and her father paid Ajax the night Jamie died. She stands close. Nixon wants to say three things and says none of them. \"I'll put a man on your door, miss.\" \"I'd rather you were the man.\" Silence.","loc":"Guard tower","when":"A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight.","th":"guard","also":["city","lambrick"],"ch":["nixon","cole","tamara"],"turn":"","w":435,"ed":"","fl":[],"html":"<p>A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight. Cole is back, bandaged, two fingers short, desperate to be useful, and Nixon puts him on the duty roster to give him back his pride. Then Tamara comes to Nixon, the only man in London she trusts. Ajax was in her room, and her father paid Ajax the night Jamie died. She stands close. Nixon wants to say three things and says none of them. \"I'll put a man on your door, miss.\" \"I'd rather you were the man.\" Silence.</p>"},{"oref":"Scene 5","id":69,"seq":5,"title":"Glasshouse workbench","added":false,"act":"Act One","kind":"scene","sum":"Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night. Nathaniel builds her a real gauntlet and fits it to her hand strap by strap. \"Hold still, Bounds.\" She does, which she has never done for anyone. A love scene with no kissing in it.","loc":"Glasshouse workbench","when":"Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night.","th":"investigation","also":["lambrick"],"ch":["alice","nathaniel"],"turn":"","w":232,"ed":"","fl":[],"html":"<p>Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night. Nathaniel builds her a real gauntlet and fits it to her hand strap by strap. \"Hold still, Bounds.\" She does, which she has never done for anyone. A love scene with no kissing in it.</p>"},{"oref":"Scene 6","id":70,"seq":6,"title":"Vykra laundry","added":false,"act":"Act Two","kind":"scene","sum":"Grise: \"Bring me the frost girl.\" Alice: \"No.\" Grise cuts the Vykra knot out of Alice's glove with one snip. \"Then you're no one's.\" Alice walks out into the rain with nowhere to belong. Under the awning, she takes his handkerchief out of her coat and folds it into the glove, where the knot used to be.","loc":"Vykra laundry","when":"Grise: \"Bring me the frost girl.\" Alice: \"No.\" Grise cuts the Vykra knot out of Alice's glove with one snip.","th":"vykra","also":["sisters"],"ch":["grise","alice"],"turn":"","w":274,"ed":"","fl":[],"html":"<p>Grise: \"Bring me the frost girl.\" Alice: \"No.\" Grise cuts the Vykra knot out of Alice's glove with one snip. \"Then you're no one's.\" Alice walks out into the rain with nowhere to belong. Under the awning, she takes his handkerchief out of her coat and folds it into the glove, where the knot used to be.</p>"},{"oref":"Scene 7","id":71,"seq":7,"title":"Coal docks, Thursday night, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel and Alice ambush Ajax among the coal barges. The Black Gauntlet hits like a steam hammer, *WHUNK*, and Nathaniel recognises his own stolen prototype in it. He's losing. Alice blinds Ajax with a flash-burst from her new gauntlet, and together they hook him onto a crane and swing him out over the black river.","loc":"Coal docks","when":"Nathaniel and Alice ambush Ajax among the coal barges.","th":"lambrick","also":["investigation"],"ch":["nathaniel","alice","ajax"],"turn":"","w":223,"ed":"","fl":[],"html":"<p>Nathaniel and Alice ambush Ajax among the coal barges. The Black Gauntlet hits like a steam hammer, *WHUNK*, and Nathaniel recognises his own stolen prototype in it. He's losing. Alice blinds Ajax with a flash-burst from her new gauntlet, and together they hook him onto a crane and swing him out over the black river.</p>"},{"oref":"Scene 8","id":72,"seq":8,"title":"The crane","added":false,"act":"Act Two","kind":"scene","sum":"Ajax, upside down, laughs. \"Your brother paid me. Lambrick paid me too, but your brother paid double. I cut the outer grid. I never touched him.\" Then: \"Your father went down after. Ask the Guard who fired.\" Alice: \"Pull him up. He's the only witness we have.\" Nathaniel's hand is on the lever, and two true things pull at it: the man who helped kill his brother, or the one voice that can put Lambrick in the dock. \"He's Jamie's grave,\" he says, and lets go. Ajax drops into the Thames. *Splash.* The Thames keeps him, for now.","loc":"The crane","when":"Ajax, upside down, laughs.","th":"investigation","also":["lambrick","guard"],"ch":["ajax","nathaniel","alice"],"turn":"","w":335,"ed":"","fl":[],"html":"<p>Ajax, upside down, laughs. \"Your brother paid me. Lambrick paid me too, but your brother paid double. I cut the outer grid. I never touched him.\" Then: \"Your father went down after. Ask the Guard who fired.\" Alice: \"Pull him up. He's the only witness we have.\" Nathaniel's hand is on the lever, and two true things pull at it: the man who helped kill his brother, or the one voice that can put Lambrick in the dock. \"He's Jamie's grave,\" he says, and lets go. Ajax drops into the Thames. *Splash.* The Thames keeps him, for now.</p>"},{"oref":"Scene 9","id":73,"seq":9,"title":"Harding House, the study, then the back stairs","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel: \"Jamie paid Lambrick's man. Why?\" Eldgard: \"Your brother was ill. Melancholy. He wanted to destroy this house.\" It's half true, which is how Eldgard lies. Then the bait Nathaniel has wanted all his life: \"After the hearing I'll take you into the work. All of it.\" On the back stairs afterwards, Josephine asks Byron where Nathaniel goes at night. Byron lies for the boy. It's the first time he has ever lied to her.","loc":"Harding House","when":"Nathaniel: \"Jamie paid Lambrick's man.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","josephine","byron"],"turn":"","w":314,"ed":"","fl":[],"html":"<p>Nathaniel: \"Jamie paid Lambrick's man. Why?\" Eldgard: \"Your brother was ill. Melancholy. He wanted to destroy this house.\" It's half true, which is how Eldgard lies. Then the bait Nathaniel has wanted all his life: \"After the hearing I'll take you into the work. All of it.\" On the back stairs afterwards, Josephine asks Byron where Nathaniel goes at night. Byron lies for the boy. It's the first time he has ever lied to her.</p>"},{"oref":"Scene 10","id":75,"seq":10,"title":"Newgate, cell 1417","added":false,"act":"Act Two","kind":"scene","sum":"Nixon, alone, in civilian coat, with the slip. The prisoner is an old man, TOBIAS MARSH, seventy if a day, in the dark at the end of the debtors' wing, picking at a string he calls his harp. Nixon: \"Jamie Harding came here every Sunday. Why?\" The old man hums, then pinches Nixon's cheek through the bars and cackles. \"Marian's chin! Marian's chin!\" Nixon goes still. \"What did you say?\" \"Seven in the Orchard, ripe for the fall. One on the tree for the lantern's call. Thirteen steps down where the cold water drips, count the apples, kiss the stones' lips.\" Nixon grabs the bars: \"Enough. Why was Jamie Harding visiting you? Tell me, you old fool.\" Marsh only cocks his head and smiles. \"He cried too, you know. Same place in the song.\" Then he turns his back and goes back to his harp. Nixon leaves with a nursery rhyme and a cold feeling he can't name.","loc":"Newgate","when":"Nixon, alone, in civilian coat, with the slip.","th":"guard","also":["investigation"],"ch":["nixon","marsh"],"turn":"","w":491,"ed":"","fl":[],"html":"<p>Nixon, alone, in civilian coat, with the slip. The prisoner is an old man, TOBIAS MARSH, seventy if a day, in the dark at the end of the debtors' wing, picking at a string he calls his harp. Nixon: \"Jamie Harding came here every Sunday. Why?\" The old man hums, then pinches Nixon's cheek through the bars and cackles. \"Marian's chin! Marian's chin!\" Nixon goes still. \"What did you say?\" \"Seven in the Orchard, ripe for the fall. One on the tree for the lantern's call. Thirteen steps down where the cold water drips, count the apples, kiss the stones' lips.\" Nixon grabs the bars: \"Enough. Why was Jamie Harding visiting you? Tell me, you old fool.\" Marsh only cocks his head and smiles. \"He cried too, you know. Same place in the song.\" Then he turns his back and goes back to his harp. Nixon leaves with a nursery rhyme and a cold feeling he can't name.</p>"},{"oref":"Scene 11","id":76,"seq":11,"title":"Glasshouse","added":false,"act":"Act Two","kind":"scene","sum":"Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll say more: \"Someone made her, and I'll say so in front of the Crown.\" *Therefore* he's now the most dangerous man in London.","loc":"Glasshouse","when":"Felix tracks Alice there.","th":"investigation","also":["sisters"],"ch":["felix","alice","lostone"],"turn":"","w":241,"ed":"","fl":[],"html":"<p>Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll say more: \"Someone made her, and I'll say so in front of the Crown.\" *Therefore* he's now the most dangerous man in London.</p>"},{"oref":"Scene 12","id":77,"seq":12,"title":"Parliament, committee room, the hearing","added":false,"act":"Act Three","kind":"scene","sum":"Lambrick argues that the Hardings are hiding something under the Works. Eldgard is calm. Vane presides. Nathaniel sits beside his father. Tamara is in the gallery, Nixon's Lanterns are at the doors, and a veiled woman sits in the back row. At the recess she crosses to the stand with a glass of water: \"You look pale, Inspector.\" Felix drinks.","loc":"Parliament","when":"Lambrick argues that the Hardings are hiding something under the Works.","th":"city","also":["harding"],"ch":["lambrick","eldgard","vane","nathaniel","tamara","josephine","felix"],"turn":"","w":236,"ed":"","fl":[],"html":"<p>Lambrick argues that the Hardings are hiding something under the Works. Eldgard is calm. Vane presides. Nathaniel sits beside his father. Tamara is in the gallery, Nixon's Lanterns are at the doors, and a veiled woman sits in the back row. At the recess she crosses to the stand with a glass of water: \"You look pale, Inspector.\" Felix drinks.</p>"},{"oref":"Scene 13","id":78,"seq":13,"title":"The witness stand, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Felix: \"The deaths at the market were caused by a girl who should be dead, and the Harding Works—\" He coughs. Frost spreads across his lips and his eyes go white. He dies on the stand. The cry goes up: \"The Frost Killer is here!\" Doors slam. Nixon's Lanterns fire flash-bursts into the ceiling to stop the stampede. Vane orders the Frost Killer hunted \"with every lamp in London.\" The vote is postponed, and sympathy swings toward the Hardings. In the crush on the gallery stairs, Tamara sees the veiled woman's glove, with a Vykra knot stitched inside it. A needle drops on the stair. Tamara pockets it.","loc":"The witness stand","when":"Felix: \"The deaths at the market were caused by a girl who should be dead, and the Harding Works—\" He coughs.","th":"vykra","also":["investigation","city","guard"],"ch":["felix","vane","tamara","josephine"],"turn":"","w":520,"ed":"","fl":[],"html":"<p>Felix: \"The deaths at the market were caused by a girl who should be dead, and the Harding Works—\" He coughs. Frost spreads across his lips and his eyes go white. He dies on the stand. The cry goes up: \"The Frost Killer is here!\" Doors slam. Nixon's Lanterns fire flash-bursts into the ceiling to stop the stampede. Vane orders the Frost Killer hunted \"with every lamp in London.\" The vote is postponed, and sympathy swings toward the Hardings. In the crush on the gallery stairs, Tamara sees the veiled woman's glove, with a Vykra knot stitched inside it. A needle drops on the stair. Tamara pockets it.</p>"},{"oref":"Scene 14","id":81,"seq":14,"title":"Glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. \"Winter's kiss. That's Vykra.\" *Therefore* somebody is framing her sister.","loc":"Glasshouse","when":"Nathaniel brings the news: Felix was killed by frost.","th":"sisters","also":["vykra"],"ch":["nathaniel","alice","lostone"],"turn":"","w":176,"ed":"","fl":[],"html":"<p>Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. \"Winter's kiss. That's Vykra.\" *Therefore* somebody is framing her sister.</p>"},{"oref":"Scene 15","id":82,"seq":15,"title":"Guard tower, the roof, then the armoury","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel tells Nixon what Ajax said: ask the Guard who fired. Nixon goes very still. \"Find me the name, Nix.\" \"I'll find it.\" That night he finds it: his own rifle in the discharge log, one round, 2 November. He tears out the page and burns it in the stove. From the bunk-room door, Cole watches him do it, and later copies the page from memory into his diary.","loc":"Guard tower","when":"Nathaniel tells Nixon what Ajax said: ask the Guard who fired.","th":"guard","also":["investigation"],"ch":["nathaniel","nixon","cole"],"turn":"","w":401,"ed":"","fl":[],"html":"<p>Nathaniel tells Nixon what Ajax said: ask the Guard who fired. Nixon goes very still. \"Find me the name, Nix.\" \"I'll find it.\" That night he finds it: his own rifle in the discharge log, one round, 2 November. He tears out the page and burns it in the stove. From the bunk-room door, Cole watches him do it, and later copies the page from memory into his diary.</p>"},{"oref":"Scene 16","id":84,"seq":16,"title":"Vykra laundry","added":false,"act":"Act Three","kind":"scene","sum":"Tamara puts the needle on Grise's counting table. \"One of yours killed a policeman in front of the Crown. I want to know who. And I want in.\" Grise looks at her for a long time, then smiles. Alice was cut out yesterday, and Tamara is the new girl.","loc":"Vykra laundry","when":"Tamara puts the needle on Grise's counting table.","th":"vykra","also":[],"ch":["tamara","grise"],"turn":"","w":207,"ed":"","fl":[],"html":"<p>Tamara puts the needle on Grise's counting table. \"One of yours killed a policeman in front of the Crown. I want to know who. And I want in.\" Grise looks at her for a long time, then smiles. Alice was cut out yesterday, and Tamara is the new girl.</p>"},{"oref":"Scene 17","id":85,"seq":17,"title":"Harding House, Josephine's dressing room","added":false,"act":"Tag","kind":"scene","sum":"Josephine lifts her veil, peels off gloves with a Vykra knot inside, and washes frost-dust from her fingertips in a porcelain bowl. The water skins over with ice. In the mirror, Byron is standing in the doorway.","loc":"Harding House","when":"Josephine lifts her veil, peels off gloves with a Vykra knot inside, and washes frost-dust from her fingertips in a porcelain bowl.","th":"harding","also":["vykra"],"ch":["josephine","byron"],"turn":"","w":176,"ed":"","fl":[],"html":"<p>Josephine lifts her veil, peels off gloves with a Vykra knot inside, and washes frost-dust from her fingertips in a porcelain bowl. The water skins over with ice. In the mirror, Byron is standing in the doorway.</p>"}]},{"n":5,"title":"Lantern Night","time":"33 DAYS TO FIRST SNOW","clock":"33 DAYS TO FIRST SNOW","act":"I","log":"On the night London celebrates its light, Nathaniel breaks into his own family's Works to see what Jamie died for. He finds a chained mother bleeding green, learns he's the next Harding meant to die for her, and hears the door lock behind him, on Nixon's order.","sum":"The Lost One: \"I'm going to free her. Even if they all freeze.\"","turn":"The light is a woman. Nathaniel is the next Tithe. Nixon locks the door","focus":"the heist into the core","piece":"four separate plans on one festival night, ending with every lamp in London blazing white and bursting at once, and a crush on Westminster Bridge. (The city goes fully dark twice in this season: for an hour in the pilot, and for good in the finale. Lantern Night is the other thing light can do: it screams.)","threads":["white","harding","sisters","vykra","guard","lambrick","city"],"frame":"<blockquote><p><strong>Focus:</strong> the heist into the core</p><p><strong>Set piece:</strong> four separate plans on one festival night, ending with every lamp in London blazing white and bursting at once, and a crush on Westminster Bridge. (The city goes fully dark twice in this season: for an hour in the pilot, and for good in the finale. Lantern Night is the other thing light can do: it screams.)</p><p><strong>Sting:</strong> the light is a woman, the Tithe is Nathaniel, and the door is locked by his best friend</p></blockquote>","scenes":[{"oref":"Scene 1","id":86,"seq":1,"title":"Tyburn, the same winter, 1489","added":false,"act":"Cold open","kind":"scene","sum":"The Hargrave raid. Torches, young cousins of the Harding blood, and leading them the girl of nineteen from the treeline in the pilot, reaching the iron chain with a hammer. Alistair cuts her down at the lock. By dawn the empty gallows field from the pilot is full: three thousand Hargraves on Harding timber, and their wives and children walked down thirteen steps into the dark. The heist we're about to watch has been tried before, and it failed.","loc":"Tyburn","when":"The Hargrave raid.","th":"white","also":["harding"],"ch":["alistair"],"turn":"","w":371,"ed":"","fl":[],"html":"<p>The Hargrave raid. Torches, young cousins of the Harding blood, and leading them the girl of nineteen from the treeline in the pilot, reaching the iron chain with a hammer. Alistair cuts her down at the lock. By dawn the empty gallows field from the pilot is full: three thousand Hargraves on Harding timber, and their wives and children walked down thirteen steps into the dark. The heist we're about to watch has been tried before, and it failed.</p>"},{"oref":"Scene 2","id":87,"seq":2,"title":"Harding Works, the Upper Gallery","added":false,"act":"Act One","kind":"scene","sum":"Eldgard brings Nathaniel into \"the work\" at last: a cathedral of glass vats where engineers \"grow gallowglass from Tyburn iron.\" Nathaniel's joy is real and painful to watch. \"At the solstice I'll show you the rest.\"","loc":"Harding Works","when":"Eldgard brings Nathaniel into \"the work\" at last: a cathedral of glass vats where engineers \"grow gallowglass from Tyburn iron.\" Nathaniel's joy is real and painful to watch.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":174,"ed":"","fl":[],"html":"<p>Eldgard brings Nathaniel into \"the work\" at last: a cathedral of glass vats where engineers \"grow gallowglass from Tyburn iron.\" Nathaniel's joy is real and painful to watch. \"At the solstice I'll show you the rest.\"</p>"},{"oref":"Scene 3","id":88,"seq":3,"title":"Glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room. My mother isn't in a nice room.\" Nathaniel defends his father; Alice defends her sister. \"He's my father, Bounds.\" \"She's my sister, Harding.\" Their first fight, and it's about family.","loc":"Glasshouse","when":"Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room.","th":"sisters","also":["harding"],"ch":["nathaniel","lostone","alice"],"turn":"","w":223,"ed":"","fl":[],"html":"<p>Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room. My mother isn't in a nice room.\" Nathaniel defends his father; Alice defends her sister. \"He's my father, Bounds.\" \"She's my sister, Harding.\" Their first fight, and it's about family.</p>"},{"oref":"Scene 4","id":89,"seq":4,"title":"Harding House, the silver pantry","added":false,"act":"Act One","kind":"scene","sum":"Byron gives Nathaniel a key on a black ribbon. Jamie left it with him. Byron guarded the core thirty years ago: \"I heard her every night. I stopped hearing it when I stopped letting myself.\" He keeps quiet about Josephine's hands. Not yet.","loc":"Harding House","when":"Byron gives Nathaniel a key on a black ribbon.","th":"harding","also":["white"],"ch":["byron","nathaniel"],"turn":"","w":192,"ed":"","fl":[],"html":"<p>Byron gives Nathaniel a key on a black ribbon. Jamie left it with him. Byron guarded the core thirty years ago: \"I heard her every night. I stopped hearing it when I stopped letting myself.\" He keeps quiet about Josephine's hands. Not yet.</p>"},{"oref":"Scene 5","id":90,"seq":5,"title":"Vykra laundry","added":false,"act":"Act One","kind":"scene","sum":"Grise tests her new girl: a Works lock cipher, solved in four minutes. Grise lets slip that the inner codes change on Lantern Night. Tamara is welcomed with tea and a knife. For the first time in her life she belongs somewhere because of her mind.","loc":"Vykra laundry","when":"Grise tests her new girl: a Works lock cipher, solved in four minutes.","th":"vykra","also":[],"ch":["grise","tamara"],"turn":"","w":200,"ed":"","fl":[],"html":"<p>Grise tests her new girl: a Works lock cipher, solved in four minutes. Grise lets slip that the inner codes change on Lantern Night. Tamara is welcomed with tea and a knife. For the first time in her life she belongs somewhere because of her mind.</p>"},{"oref":"Scene 6","id":91,"seq":6,"title":"Guard tower","added":false,"act":"Act One","kind":"scene","sum":"Eldgard gives Nixon Lantern Night security for the Works, plus a private order. \"My son will come tonight. Let him through. Seal the core behind him. The girl doesn't leave.\" Nixon: \"And Nathaniel?\" \"He's my son, Captain. He'll be with me.\"","loc":"Guard tower","when":"Eldgard gives Nixon Lantern Night security for the Works, plus a private order.","th":"guard","also":["harding"],"ch":["eldgard","nixon"],"turn":"","w":187,"ed":"","fl":[],"html":"<p>Eldgard gives Nixon Lantern Night security for the Works, plus a private order. \"My son will come tonight. Let him through. Seal the core behind him. The girl doesn't leave.\" Nixon: \"And Nathaniel?\" \"He's my son, Captain. He'll be with me.\"</p>"},{"oref":"Scene 7","id":92,"seq":7,"title":"Glasshouse, planning","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. A model of the Works built out of teacups and oranges; the Lost One eats the core. Tamara arrives with the code, invited by Nathaniel. Alice and Tamara meet: the fiancée and the undercity girl, the new Vykra and the cut one. Every line is polite and every line is a knife. Nathaniel is the only one who doesn't notice.","loc":"Glasshouse","when":"Whimsy.","th":"sisters","also":["vykra"],"ch":["nathaniel","lostone","tamara","alice"],"turn":"","w":241,"ed":"","fl":[],"html":"<p>Whimsy. A model of the Works built out of teacups and oranges; the Lost One eats the core. Tamara arrives with the code, invited by Nathaniel. Alice and Tamara meet: the fiancée and the undercity girl, the new Vykra and the cut one. Every line is polite and every line is a knife. Nathaniel is the only one who doesn't notice.</p>"},{"oref":"Scene 8","id":93,"seq":8,"title":"Lantern Night, the Strand","added":false,"act":"Act Two","kind":"scene","sum":"Fireworks over a blazing green city, crowds, the Lord Mayor. In the crowd, Lambrick and a scarred, very alive Ajax with a coal-mob. Their plan: cut the outer grid during the finale and let London see Harding light fail before the vote.","loc":"Lantern","when":"Fireworks over a blazing green city, crowds, the Lord Mayor.","th":"lambrick","also":["city"],"ch":["lambrick","ajax"],"turn":"","w":189,"ed":"","fl":[],"html":"<p>Fireworks over a blazing green city, crowds, the Lord Mayor. In the crowd, Lambrick and a scarred, very alive Ajax with a coal-mob. Their plan: cut the outer grid during the finale and let London see Harding light fail before the vote.</p>"},{"oref":"Scene 9","id":94,"seq":9,"title":"Thames outfall, the heist begins","added":false,"act":"Act Two","kind":"scene","sum":"The pipe is full of black water. The Lost One freezes it into a glass road and they walk inside the river. Jamie's key opens the first grate.","loc":"Thames outfall","when":"The pipe is full of black water.","th":"white","also":["investigation"],"ch":["lostone","alice","nathaniel","tamara"],"turn":"","w":153,"ed":"","fl":[],"html":"<p>The pipe is full of black water. The Lost One freezes it into a glass road and they walk inside the river. Jamie's key opens the first grate.</p>"},{"oref":"Scene 10","id":95,"seq":10,"title":"The gantries","added":false,"act":"Act Two","kind":"scene","sum":"Nixon, on the high walk, sees them pass. Orders say let them through. He gives the whistle they invented at nine years old, *turn back*. Nathaniel hears it, smiles because it's Nix, and keeps going.","loc":"The gantries","when":"Nixon, on the high walk, sees them pass.","th":"guard","also":[],"ch":["nixon","nathaniel"],"turn":"","w":171,"ed":"","fl":[],"html":"<p>Nixon, on the high walk, sees them pass. Orders say let them through. He gives the whistle they invented at nine years old, *turn back*. Nathaniel hears it, smiles because it's Nix, and keeps going.</p>"},{"oref":"Scene 11","id":96,"seq":11,"title":"The Strand, finale","added":false,"act":"Act Two","kind":"scene","sum":"Ajax's crew cuts the outer grid. The East End goes dark in the middle of the fireworks. Inside the Works, every lock resets, and the heisters are trapped between two doors with the Guard alarm ringing.","loc":"The Strand","when":"Ajax's crew cuts the outer grid.","th":"lambrick","also":["city"],"ch":["ajax"],"turn":"","w":174,"ed":"","fl":[],"html":"<p>Ajax's crew cuts the outer grid. The East End goes dark in the middle of the fireworks. Inside the Works, every lock resets, and the heisters are trapped between two doors with the Guard alarm ringing.</p>"},{"oref":"Scene 12","id":97,"seq":12,"title":"The shaft","added":false,"act":"Act Two","kind":"scene","sum":"Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep. Neither of them says thank you. *Click.* It opens.","loc":"The shaft","when":"Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep.","th":"vykra","also":[],"ch":["tamara","alice"],"turn":"","w":171,"ed":"","fl":[],"html":"<p>Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep. Neither of them says thank you. *Click.* It opens.</p>"},{"oref":"Scene 13","id":98,"seq":13,"title":"The core","added":false,"act":"Act Two","kind":"scene","sum":"They go down, and we see her whole for the first time. MORGANA: nine feet of ice and green fire, iron hooks through her shoulders and hips, her blood running green along channels into London. She is singing, and it's the Weeping: the Lantern Hymn's tune, with none of the words.","loc":"The core","when":"They go down, and we see her whole for the first time.","th":"white","also":[],"ch":["lostone","alice","nathaniel","tamara","morgana"],"turn":"","w":213,"ed":"","fl":[],"html":"<p>They go down, and we see her whole for the first time. MORGANA: nine feet of ice and green fire, iron hooks through her shoulders and hips, her blood running green along channels into London. She is singing, and it's the Weeping: the Lantern Hymn's tune, with none of the words.</p>"},{"oref":"Scene 14","id":99,"seq":14,"title":"The chain","added":false,"act":"Act Three","kind":"scene","sum":"\"Little frost. You came.\" The Lost One grabs the chain, and it burns her mittens to smoke. Alice pulls her back. Morgana, to Alice: \"You have my daughter's hand. Give it back.\" Alice, holding tighter: \"She's my sister. Whatever came back in her, my sister's under it.\" Morgana tilts her great head and looks at Alice with something terribly like pity. She doesn't correct her. The Lost One doesn't either. Then, to Nathaniel, almost gently: \"You came down these stairs once, little Harding. And your brother is not dead. He is cold.\"","loc":"The chain","when":"\"Little frost.","th":"white","also":["sisters"],"ch":["morgana","lostone","alice","nathaniel"],"turn":"","w":319,"ed":"","fl":[],"html":"<p>\"Little frost. You came.\" The Lost One grabs the chain, and it burns her mittens to smoke. Alice pulls her back. Morgana, to Alice: \"You have my daughter's hand. Give it back.\" Alice, holding tighter: \"She's my sister. Whatever came back in her, my sister's under it.\" Morgana tilts her great head and looks at Alice with something terribly like pity. She doesn't correct her. The Lost One doesn't either. Then, to Nathaniel, almost gently: \"You came down these stairs once, little Harding. And your brother is not dead. He is cold.\"</p>"},{"oref":"Scene 15","id":100,"seq":15,"title":"The lock","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel touches the chain, and it tightens. Morgana screams, and across London the lamps surge brighter. His blood feeds it. Jamie's glass blade is still stuck in the lock where he left it, and his diagram suddenly makes sense. Then Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew.\" The Tithe: every fifty winters, at first snow, a Harding gives his life to the chain, or it breaks and London freezes. \"I raised Jamie for it. Jamie ran. Now it's you.\" Nathaniel: \"Why not you?\" Eldgard doesn't answer. The silence goes on a beat too long, and Nathaniel files it away.","loc":"The lock","when":"Nathaniel touches the chain, and it tightens.","th":"white","also":["investigation","harding"],"ch":["nathaniel","morgana","eldgard"],"turn":"","w":481,"ed":"","fl":[],"html":"<p>Nathaniel touches the chain, and it tightens. Morgana screams, and across London the lamps surge brighter. His blood feeds it. Jamie's glass blade is still stuck in the lock where he left it, and his diagram suddenly makes sense. Then Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew.\" The Tithe: every fifty winters, at first snow, a Harding gives his life to the chain, or it breaks and London freezes. \"I raised Jamie for it. Jamie ran. Now it's you.\" Nathaniel: \"Why not you?\" Eldgard doesn't answer. The silence goes on a beat too long, and Nathaniel files it away.</p>"},{"oref":"Scene 16","id":101,"seq":16,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew.\" The Tithe: every fifty winters, at first snow, a Harding gives his life to the chain, or it breaks and London freezes. \"I raised Jamie for it. Jamie ran. Now it's you.\" Nathaniel: \"Why not you?\" Eldgard doesn't answer. The silence goes on a beat too long, and Nathaniel files it away.","loc":"The core","when":"Eldgard steps out of the dark; he's been waiting.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":257,"ed":"","fl":[],"html":"<p>Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew.\" The Tithe: every fifty winters, at first snow, a Harding gives his life to the chain, or it breaks and London freezes. \"I raised Jamie for it. Jamie ran. Now it's you.\" Nathaniel: \"Why not you?\" Eldgard doesn't answer. The silence goes on a beat too long, and Nathaniel files it away.</p>"},{"oref":"Scene 17","id":102,"seq":17,"title":"The core door","added":false,"act":"Act Three","kind":"scene","sum":"It seals with a hiss, iron on glass. Behind the glass is Nixon, following orders. Nathaniel: \"Nix!\" Nixon doesn't look away, and that's worse.","loc":"The core door","when":"It seals with a hiss, iron on glass.","th":"guard","also":[],"ch":["nixon","nathaniel"],"turn":"","w":142,"ed":"","fl":[],"html":"<p>It seals with a hiss, iron on glass. Behind the glass is Nixon, following orders. Nathaniel: \"Nix!\" Nixon doesn't look away, and that's worse.</p>"},{"oref":"Scene 18","id":103,"seq":18,"title":"The core, escape","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One, desperate, lets go of the cold. The core freezes around her mother, and Morgana screams, the way she screamed when Nathaniel touched the chain, only worse. Her blood flares through every channel at once. Across London, on Lantern Night, every lamp blazes white for one heartbeat and bursts. *Pop-pop-pop-pop*, street after street, a wave of shattering glass under the fireworks. The Lost One flinches as if she heard every one. Alice blows the door with her gauntlet. Tamara drags the Lost One into the outfall. Alice reaches for Nathaniel. He stays: \"I need to hear the rest.\" She leaves him there.","loc":"The core","when":"The Lost One, desperate, lets go of the cold.","th":"white","also":["city"],"ch":["lostone","morgana","alice","tamara","nathaniel"],"turn":"","w":350,"ed":"","fl":[],"html":"<p>The Lost One, desperate, lets go of the cold. The core freezes around her mother, and Morgana screams, the way she screamed when Nathaniel touched the chain, only worse. Her blood flares through every channel at once. Across London, on Lantern Night, every lamp blazes white for one heartbeat and bursts. *Pop-pop-pop-pop*, street after street, a wave of shattering glass under the fireworks. The Lost One flinches as if she heard every one. Alice blows the door with her gauntlet. Tamara drags the Lost One into the outfall. Alice reaches for Nathaniel. He stays: \"I need to hear the rest.\" She leaves him there.</p>"},{"oref":"Scene 19","id":104,"seq":19,"title":"Westminster Bridge","added":false,"act":"Act Three","kind":"scene","sum":"Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush. Cole's squad hold a barricade with flash-bursts; people still die against the railings. Lambrick, on a coal cart: \"Remember who kept you warm!\"","loc":"Westminster Bridge","when":"Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush.","th":"city","also":["lambrick"],"ch":["cole","lambrick"],"turn":"","w":197,"ed":"","fl":[],"html":"<p>Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush. Cole's squad hold a barricade with flash-bursts; people still die against the railings. Lambrick, on a coal cart: \"Remember who kept you warm!\"</p>"},{"oref":"Scene 20","id":105,"seq":20,"title":"The core, after","added":false,"act":"Act Three","kind":"scene","sum":"Father and son, alone with the prisoner. Nathaniel: \"She said Jamie isn't dead. She said he's cold.\" Eldgard doesn't look at Morgana when he answers. \"She tells every Harding whatever will bring him to the lock. She told me my sister was still singing.\" He says it like a man pressing on an old scar. \"Thirty-three days. I won't lose two sons. Help me find another way.\" Nathaniel can't tell if any of it is a lie. He says yes. He chooses his father, and he puts the word *cold* away where he keeps the weeping in the floor.","loc":"The core","when":"Father and son, alone with the prisoner.","th":"harding","also":["white"],"ch":["nathaniel","eldgard","morgana","otty","jamie"],"turn":"","w":478,"ed":"","fl":[],"html":"<p>Father and son, alone with the prisoner. Nathaniel: \"She said Jamie isn't dead. She said he's cold.\" Eldgard doesn't look at Morgana when he answers. \"She tells every Harding whatever will bring him to the lock. She told me my sister was still singing.\" He says it like a man pressing on an old scar. \"Thirty-three days. I won't lose two sons. Help me find another way.\" Nathaniel can't tell if any of it is a lie. He says yes. He chooses his father, and he puts the word *cold* away where he keeps the weeping in the floor.</p>"},{"oref":"Scene 21","id":106,"seq":21,"title":"Gin Lane rooftop, the black city","added":false,"act":"Tag","kind":"scene","sum":"Alice and the Lost One, soaked and shaking. The Lost One: \"I'm going to free her. Even if all of them freeze.\" Alice takes her burned hand anyway. Below them, London is lit in patches, every third lamp a broken stump.","loc":"Gin Lane rooftop","when":"Alice and the Lost One, soaked and shaking.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":187,"ed":"","fl":[],"html":"<p>Alice and the Lost One, soaked and shaking. The Lost One: \"I'm going to free her. Even if all of them freeze.\" Alice takes her burned hand anyway. Below them, London is lit in patches, every third lamp a broken stump.</p>"}]},{"n":6,"title":"Coal","time":"28 DAYS TO FIRST SNOW","clock":"28 DAYS TO FIRST SNOW","act":"I","log":"With Harding light failing and Lambrick coal filling the streets, Alice and the Lost One try to reach the core through the gas tunnels on the night of the Charter vote. Ajax has rigged those tunnels, Nixon is waiting in them, Nathaniel runs in after them, and Byron runs in after him.","sum":"\"Then you know I love you.\"","turn":"The Crown seizes the Works. Byron dies telling the truth","focus":"a city in the cold, and Byron","piece":"the Pimlico gasworks explosion, five plans meeting in one tunnel","threads":["harding","city","sisters","guard","lambrick","investigation"],"frame":"<blockquote><p><strong>Focus:</strong> a city in the cold, and Byron</p><p><strong>Set piece:</strong> the Pimlico gasworks explosion, five plans meeting in one tunnel</p><p><strong>Sting:</strong> Byron dies before he can say what he came to say, and then he says it</p></blockquote>","scenes":[{"oref":"Scene 1","id":107,"seq":1,"title":"The core gate, thirty years ago","added":false,"act":"Cold open","kind":"scene","sum":"Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl with a knife sent to kill young Eldgard. It's JOSEPHINE, nineteen. He lets her go. A year later she marries the man she was sent to kill. Byron serves at the wedding. In his tunic pocket is a faded blue ribbon, from a different night, fifty years gone.","loc":"The core gate","when":"Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl with a knife sent to kill young Eldgard.","th":"harding","also":["vykra"],"ch":["byron","josephine"],"turn":"","w":236,"ed":"","fl":[],"html":"<p>Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl with a knife sent to kill young Eldgard. It's JOSEPHINE, nineteen. He lets her go. A year later she marries the man she was sent to kill. Byron serves at the wedding. In his tunic pocket is a faded blue ribbon, from a different night, fifty years gone.</p>"},{"oref":"Scene 2","id":108,"seq":2,"title":"London, the cold","added":false,"act":"Act One","kind":"scene","sum":"Since Lantern Night half the lamps in London are broken glass, and the rest come and go. Coal carts with LAMBRICK on the side. Prices chalked up: doubled, then tripled. A child asleep in a doorway with frost in her eyelashes, and a constable looking away. Grim and quiet.","loc":"London","when":"Since Lantern Night half the lamps in London are broken glass, and the rest come and go.","th":"city","also":["lambrick"],"ch":[],"turn":"","w":207,"ed":"","fl":[],"html":"<p>Since Lantern Night half the lamps in London are broken glass, and the rest come and go. Coal carts with LAMBRICK on the side. Prices chalked up: doubled, then tripled. A child asleep in a doorway with frost in her eyelashes, and a constable looking away. Grim and quiet.</p>"},{"oref":"Scene 3","id":109,"seq":3,"title":"Harding Works","added":false,"act":"Act One","kind":"scene","sum":"Eldgard and Nathaniel design the **Heartglass**, a resonance cage meant to hold the chain without a Harding death. Father and son at one bench, finishing each other's equations. It's everything Nathaniel ever wanted. Eldgard: \"We'll need something of her blood to tune it.\" Nathaniel assumes he means Morgana.","loc":"Harding Works","when":"Eldgard and Nathaniel design the **Heartglass**, a resonance cage meant to hold the chain without a Harding death.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":205,"ed":"","fl":[],"html":"<p>Eldgard and Nathaniel design the <strong>Heartglass</strong>, a resonance cage meant to hold the chain without a Harding death. Father and son at one bench, finishing each other's equations. It's everything Nathaniel ever wanted. Eldgard: \"We'll need something of her blood to tune it.\" Nathaniel assumes he means Morgana.</p>"},{"oref":"Scene 4","id":110,"seq":4,"title":"Gin Lane, a borrowed room","added":false,"act":"Act One","kind":"scene","sum":"Wren said the memories would come back. They're going the other way. Every use of the cold costs one of Miriam's memories, and tonight the Lost One asks, \"When's your birthday, Ali?\" The same day Miriam forgot it, and the same day the Lost One remembered it with an orange. Alice: \"You knew it once.\" The Lost One, frightened, grabbing Alice's sleeve: \"There's something I have to say to you before it goes. About him. About the belt.\" Alice: \"After.\" \"There might not be an after.\" \"*After*, Mim.\" The fence holds, and the Lost One watches the thing she needs to say slipping further away. Then, harder, because she's frightened: \"If I free my mother, I'll be strong again.\" Alice: \"If you free her, the light goes out and people die.\" The Lost One: \"People die now. I watched one on your step.\"","loc":"Gin Lane","when":"Wren said the memories would come back.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":449,"ed":"","fl":[],"html":"<p>Wren said the memories would come back. They're going the other way. Every use of the cold costs one of Miriam's memories, and tonight the Lost One asks, \"When's your birthday, Ali?\" The same day Miriam forgot it, and the same day the Lost One remembered it with an orange. Alice: \"You knew it once.\" The Lost One, frightened, grabbing Alice's sleeve: \"There's something I have to say to you before it goes. About him. About the belt.\" Alice: \"After.\" \"There might not be an after.\" \"*After*, Mim.\" The fence holds, and the Lost One watches the thing she needs to say slipping further away. Then, harder, because she's frightened: \"If I free my mother, I'll be strong again.\" Alice: \"If you free her, the light goes out and people die.\" The Lost One: \"People die now. I watched one on your step.\"</p>"},{"oref":"Scene 5","id":128,"seq":5,"title":"Harding Works, the shop window, midnight","added":true,"act":"Act One","kind":"scene","sum":"Alice climbs the Works wall to tell the only person who would understand that her sister has forgotten her birthday. Through the lit glass she sees Nathaniel and Eldgard still at one bench, finishing each other's equations, his father's hand on his shoulder, the Heartglass half-built between them. It's everything he has wanted his whole life, and she can see that it is. She doesn't knock. Her breath fogs the pane. She wipes it clean with her glove, the one with his handkerchief folded inside it, and goes back down the wall. A second later Nathaniel looks up, at a window with nobody in it.","loc":"Harding Works","when":"Alice climbs the Works wall to tell the only person who would understand that her sister has forgotten her birthday.","th":"sisters","also":["investigation"],"ch":["alice","nathaniel","eldgard"],"turn":"","w":336,"ed":"","fl":[],"html":"<p>Alice climbs the Works wall to tell the only person who would understand that her sister has forgotten her birthday. Through the lit glass she sees Nathaniel and Eldgard still at one bench, finishing each other's equations, his father's hand on his shoulder, the Heartglass half-built between them. It's everything he has wanted his whole life, and she can see that it is. She doesn't knock. Her breath fogs the pane. She wipes it clean with her glove, the one with his handkerchief folded inside it, and goes back down the wall. A second later Nathaniel looks up, at a window with nobody in it.</p>"},{"oref":"Scene 6","id":112,"seq":6,"title":"Lambrick House, the gun room","added":false,"act":"Act One","kind":"scene","sum":"Tamara, behind a curtain, hears her father and Ajax: charges along the Tyburn conduit where it meets his Pimlico gas main, set to blow on the night of the vote so Harding's Works look rotten to the Crown. Ajax: \"And if your daughter gets in the way?\" Lambrick, after a pause: \"Then my daughter should have stayed home.\"","loc":"Lambrick House","when":"Tamara, behind a curtain, hears her father and Ajax: charges along the Tyburn conduit where it meets his Pimlico gas main, set to blow on the night of the vote so Harding's Works look rotten to the Crown.","th":"lambrick","also":[],"ch":["tamara","lambrick","ajax"],"turn":"","w":231,"ed":"","fl":[],"html":"<p>Tamara, behind a curtain, hears her father and Ajax: charges along the Tyburn conduit where it meets his Pimlico gas main, set to blow on the night of the vote so Harding's Works look rotten to the Crown. Ajax: \"And if your daughter gets in the way?\" Lambrick, after a pause: \"Then my daughter should have stayed home.\"</p>"},{"oref":"Scene 7","id":114,"seq":7,"title":"A Covent Garden tea shop","added":false,"act":"Act Two","kind":"scene","sum":"Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core. Tamara tells her about the charges. The only route in runs through Ajax's tunnels. Tamara: \"Then go another night.\" Alice: \"There isn't one. She's forgetting me.\" Two girls who dislike each other, starting to understand each other. The girl who pours their tea has a knot stitched inside her glove, and neither of them looks at her hands.","loc":"A Covent Garden tea shop","when":"Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core.","th":"sisters","also":["lambrick"],"ch":["alice","tamara"],"turn":"","w":285,"ed":"","fl":[],"html":"<p>Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core. Tamara tells her about the charges. The only route in runs through Ajax's tunnels. Tamara: \"Then go another night.\" Alice: \"There isn't one. She's forgetting me.\" Two girls who dislike each other, starting to understand each other. The girl who pours their tea has a knot stitched inside her glove, and neither of them looks at her hands.</p>"},{"oref":"Scene 8","id":115,"seq":8,"title":"The frozen canal at Little Venice","added":false,"act":"Act Two","kind":"scene","sum":"They meet in secret under a bridge, snowless cold, their breath smoking between them. He tells her about the Heartglass: \"We can save both of them.\" She tells him the Lost One is forgetting her. When she pulls off a glove to warm her hands, something falls out of it into the frost: his handkerchief, folded small, kept where a Vykra keeps the thing that says whose she is. He picks it up. \"You kept it.\" \"Bounds keeps things.\" For once in his life he doesn't wait to be reached for. He kisses her, and finds out she has been waiting since the ballroom. *Tik. Tik.* Ice ticking off the bridge above them. Then both of them use the kiss to hide the dangerous part: she's going in tonight, and he still doesn't know what the Heartglass is for.","loc":"The frozen canal at Little Venice","when":"They meet in secret under a bridge, snowless cold, their breath smoking between them.","th":"investigation","also":["sisters"],"ch":["nathaniel","alice"],"turn":"","w":538,"ed":"","fl":[],"html":"<p>They meet in secret under a bridge, snowless cold, their breath smoking between them. He tells her about the Heartglass: \"We can save both of them.\" She tells him the Lost One is forgetting her. When she pulls off a glove to warm her hands, something falls out of it into the frost: his handkerchief, folded small, kept where a Vykra keeps the thing that says whose she is. He picks it up. \"You kept it.\" \"Bounds keeps things.\" For once in his life he doesn't wait to be reached for. He kisses her, and finds out she has been waiting since the ballroom. *Tik. Tik.* Ice ticking off the bridge above them. Then both of them use the kiss to hide the dangerous part: she's going in tonight, and he still doesn't know what the Heartglass is for.</p>"},{"oref":"Scene 9","id":113,"seq":9,"title":"Harding House, the linen room, then the study","added":false,"act":"Act Two","kind":"scene","sum":"Byron confronts Josephine. \"I saw your hands.\" \"I did it for Nathaniel.\" \"You always say that.\" She has a needle in her sleeve, and she doesn't use it. \"Thirty years, Josie.\" He leaves. She sits on the linen and doesn't cry. Then a maid brings her a folded note in Grise's hand, bought an hour ago from a tea-girl in Covent Garden: *Tyburn conduit. Vote night. The girl.* Josephine takes it straight down to her husband's study. \"How do you know?\" \"I'm your wife.\" Eldgard sends for Nixon: take the girl alive. The Heartglass needs her. The woman who has just spared Byron's life has set the trap he will die in, and neither of them knows it.","loc":"Harding House","when":"Byron confronts Josephine.","th":"harding","also":["vykra"],"ch":["byron","josephine","eldgard"],"turn":"","w":536,"ed":"","fl":[],"html":"<p>Byron confronts Josephine. \"I saw your hands.\" \"I did it for Nathaniel.\" \"You always say that.\" She has a needle in her sleeve, and she doesn't use it. \"Thirty years, Josie.\" He leaves. She sits on the linen and doesn't cry. Then a maid brings her a folded note in Grise's hand, bought an hour ago from a tea-girl in Covent Garden: *Tyburn conduit. Vote night. The girl.* Josephine takes it straight down to her husband's study. \"How do you know?\" \"I'm your wife.\" Eldgard sends for Nixon: take the girl alive. The Heartglass needs her. The woman who has just spared Byron's life has set the trap he will die in, and neither of them knows it.</p>"},{"oref":"Scene 10","id":118,"seq":10,"title":"Harding Works, then the Harding House hall","added":false,"act":"Act Two","kind":"scene","sum":"A cipher note from Tamara in their childhood code reaches Nathaniel: *The conduit. Charges. She's going in.* He runs, grabbing the leap-gauntlet as he goes. In the hall, Byron sees him tear out of the yard. He takes his old Lantern from its glass case on the wall, still charged after thirty years, and follows.","loc":"Harding Works","when":"A cipher note from Tamara in their childhood code reaches Nathaniel: *The conduit.","th":"lambrick","also":["harding","guard"],"ch":["nathaniel","byron"],"turn":"","w":289,"ed":"","fl":[],"html":"<p>A cipher note from Tamara in their childhood code reaches Nathaniel: *The conduit. Charges. She's going in.* He runs, grabbing the leap-gauntlet as he goes. In the hall, Byron sees him tear out of the yard. He takes his old Lantern from its glass case on the wall, still charged after thirty years, and follows.</p>"},{"oref":"Scene 11","id":120,"seq":11,"title":"The Tyburn conduit, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Alice and the Lost One go down. Ajax's men are lighting fuses in a side drain. Four tunnel children are sleeping in the warm pipe-nook beyond it. Nixon's squad waits in the dark ahead, Cole among them. In the dark, Cole holds up his diary: \"Tell Mr. Harding, sir, or I will.\" Nixon: \"After the vote.\" Cole agrees, because he still believes in him.","loc":"The Tyburn conduit","when":"Alice and the Lost One go down.","th":"lambrick","also":["guard"],"ch":["alice","lostone","nixon","cole"],"turn":"","w":304,"ed":"","fl":[],"html":"<p>Alice and the Lost One go down. Ajax's men are lighting fuses in a side drain. Four tunnel children are sleeping in the warm pipe-nook beyond it. Nixon's squad waits in the dark ahead, Cole among them. In the dark, Cole holds up his diary: \"Tell Mr. Harding, sir, or I will.\" Nixon: \"After the vote.\" Cole agrees, because he still believes in him.</p>"},{"oref":"Scene 12","id":121,"seq":12,"title":"The ambush","added":false,"act":"Act Three","kind":"scene","sum":"Flash-bursts. Nixon corners the Lost One, and she grabs his bare wrist. No frost. He doesn't freeze, the way Nathaniel didn't, and in the strobe and the shouting nobody sees it but the camera. She goes white anyway. She can smell Harding on him the way she smelled it on Nathaniel, and under it the cellar beneath her mother; and one of the names in the song she has heard in every lamp since the bridge belongs to the same blood: \"They told you your mother had a fever. She didn't.\" He lets go as if burned. Alice fights Nixon, gauntlet to gauntlet, in a tunnel too narrow to swing in: the two leads' first real clash. Neither of them wants to win. Then Nathaniel arrives screaming \"Gas!\" Ajax, seeing the Guard, lights early. The Lost One's cold meets a flash-burst in the main.","loc":"The ambush","when":"Flash-bursts.","th":"guard","also":["white","lambrick"],"ch":["nixon","lostone","alice","nathaniel","ajax"],"turn":"","w":408,"ed":"","fl":[],"html":"<p>Flash-bursts. Nixon corners the Lost One, and she grabs his bare wrist. No frost. He doesn't freeze, the way Nathaniel didn't, and in the strobe and the shouting nobody sees it but the camera. She goes white anyway. She can smell Harding on him the way she smelled it on Nathaniel, and under it the cellar beneath her mother; and one of the names in the song she has heard in every lamp since the bridge belongs to the same blood: \"They told you your mother had a fever. She didn't.\" He lets go as if burned. Alice fights Nixon, gauntlet to gauntlet, in a tunnel too narrow to swing in: the two leads' first real clash. Neither of them wants to win. Then Nathaniel arrives screaming \"Gas!\" Ajax, seeing the Guard, lights early. The Lost One's cold meets a flash-burst in the main.</p>"},{"oref":"Scene 13","id":123,"seq":13,"title":"Pimlico, then Parliament","added":false,"act":"Act Three","kind":"scene","sum":"The gasworks erupts. *WHOOOM.* Fire rolls along the river. A mile downriver the Charter vote is three names from done: Eldgard, Lambrick and Vane in their places, Nathaniel's chair empty, and Josephine looking at it when the windows blow in on the voting lords.","loc":"Pimlico","when":"The gasworks erupts.","th":"lambrick","also":["city","harding"],"ch":["eldgard","lambrick","vane","josephine"],"turn":"","w":265,"ed":"","fl":[],"html":"<p>The gasworks erupts. *WHOOOM.* Fire rolls along the river. A mile downriver the Charter vote is three names from done: Eldgard, Lambrick and Vane in their places, Nathaniel's chair empty, and Josephine looking at it when the windows blow in on the voting lords.</p>"},{"oref":"Scene 14","id":124,"seq":14,"title":"The rubble","added":false,"act":"Act Three","kind":"scene","sum":"Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him. Dying, he says: \"Your mother killed the inspector. She does it for you. Don't let her.\" Then: \"You were always enough.\" He dies with his hand on the boy's face. In his other fist is the blue ribbon.","loc":"The rubble","when":"Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him.","th":"harding","also":["investigation"],"ch":["byron","nathaniel"],"turn":"","w":218,"ed":"","fl":[],"html":"<p>Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him. Dying, he says: \"Your mother killed the inspector. She does it for you. Don't let her.\" Then: \"You were always enough.\" He dies with his hand on the boy's face. In his other fist is the blue ribbon.</p>"},{"oref":"Scene 15","id":125,"seq":15,"title":"The river stair","added":false,"act":"Act Three","kind":"scene","sum":"Nixon carries Cole out of the fire. Alice comes up with the Lost One, who uses the last of her cold to smother the flames around four trapped children. Then she looks at Alice politely, like a stranger. \"Thank you, miss.\" She doesn't know her name. Alice tells herself it's the shock again, worse this time. It's the last time she'll manage to.","loc":"The river stair","when":"Nixon carries Cole out of the fire.","th":"sisters","also":["guard"],"ch":["nixon","cole","alice","lostone"],"turn":"","w":244,"ed":"","fl":[],"html":"<p>Nixon carries Cole out of the fire. Alice comes up with the Lost One, who uses the last of her cold to smother the flames around four trapped children. Then she looks at Alice politely, like a stranger. \"Thank you, miss.\" She doesn't know her name. Alice tells herself it's the shock again, worse this time. It's the last time she'll manage to.</p>"},{"oref":"Scene 16","id":126,"seq":16,"title":"Parliament, broken glass","added":false,"act":"Act Three","kind":"scene","sum":"Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board. Lambrick takes a seat on it. Eldgard has lost the Works.","loc":"Parliament","when":"Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board.","th":"city","also":["lambrick"],"ch":["vane","lambrick","eldgard"],"turn":"","w":158,"ed":"","fl":[],"html":"<p>Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board. Lambrick takes a seat on it. Eldgard has lost the Works.</p>"},{"oref":"Scene 17","id":127,"seq":17,"title":"Harding House, the music room","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel walks in covered in ash. Josephine is at the piano. \"Byron's dead.\" She weeps, really. \"He told me about Inspector Hawke.\" The music stops. A long beat. \"Then you know I love you.\"","loc":"Harding House","when":"Nathaniel walks in covered in ash.","th":"harding","also":["investigation"],"ch":["nathaniel","josephine"],"turn":"","w":168,"ed":"","fl":[],"html":"<p>Nathaniel walks in covered in ash. Josephine is at the piano. \"Byron's dead.\" She weeps, really. \"He told me about Inspector Hawke.\" The music stops. A long beat. \"Then you know I love you.\"</p>"}]},{"n":7,"title":"The Girl Who Isn't","time":"21 DAYS TO FIRST SNOW","clock":"21 DAYS TO FIRST SNOW","act":"II","log":"Alice finds the letter Miriam never left her and learns that the thing she has been protecting is not her sister. Nixon finally tells Nathaniel who fired the shot. Then the chain thins enough for the White to come through, and the only way through the night is together.","sum":"Nixon's file: \"Reserve. Blood suitable.\"","turn":"\"You're not her.\" Then Alice chooses her anyway. Nixon confesses","focus":"two reveals on one day: the sister and the best friend","piece":"wolves of the White run through Whitechapel, and Nathaniel and Nixon fight side by side an hour after the friendship breaks","threads":["sisters","harding","lambrick","guard","white","investigation","city","vykra"],"frame":"<blockquote><p><strong>Focus:</strong> two reveals on one day: the sister and the best friend</p><p><strong>Set piece:</strong> wolves of the White run through Whitechapel, and Nathaniel and Nixon fight side by side an hour after the friendship breaks</p><p><strong>Sting:</strong> Alice chooses the creature anyway, and Nixon learns he was raised as spare parts</p></blockquote>","scenes":[{"oref":"Scene 1","id":215,"seq":1,"title":"Gin Lane, 2 November, morning","added":false,"act":"Cold open","kind":"scene","sum":"Miriam's last day, from Miriam's side. She is radiant, sick in a basin, and hand on her belly. Alice is asleep on the other side of the bed. Miriam starts a letter: *Ali, about him, when we were small—* She stares at it a long time. She scores it out until the paper tears. She starts again, and this time writes it fast: three short lines we don't get to read. She means to leave it on Alice's pillow, loses her nerve, and sews it into her coat lining. Then she pulls on the red mittens.","loc":"Gin Lane","when":"Miriam's last day, from Miriam's side.","th":"sisters","also":[],"ch":["miriam"],"turn":"","w":319,"ed":"","fl":[],"html":"<p>Miriam's last day, from Miriam's side. She is radiant, sick in a basin, and hand on her belly. Alice is asleep on the other side of the bed. Miriam starts a letter: *Ali, about him, when we were small—* She stares at it a long time. She scores it out until the paper tears. She starts again, and this time writes it fast: three short lines we don't get to read. She means to leave it on Alice's pillow, loses her nerve, and sews it into her coat lining. Then she pulls on the red mittens.</p>"},{"oref":"Scene 2","id":129,"seq":2,"title":"Gin Lane, a borrowed room","added":false,"act":"Act One","kind":"scene","sum":"Afternoon. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. *I'm leaving with him. I'm sorry, Ali. Don't follow me.* Miriam was leaving her and never meant to say goodbye. Then the door bangs. The Lost One, home from the market with an armful of oranges she is enormously proud of, chattering about a man who sells hot chestnuts out of a drum. She doesn't use Alice's name; she hasn't since the gasworks. Alice puts the letter in her apron pocket, smiles, and peels her an orange. She says nothing. She says nothing all evening, and we watch her not say it.","loc":"Gin Lane","when":"Afternoon.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":161,"ed":"","fl":[],"html":"<p>Afternoon. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. *I'm leaving with him. I'm sorry, Ali. Don't follow me.* Miriam was leaving her and never meant to say goodbye. Then the door bangs. The Lost One, home from the market with an armful of oranges she is enormously proud of, chattering about a man who sells hot chestnuts out of a drum. She doesn't use Alice's name; she hasn't since the gasworks. Alice puts the letter in her apron pocket, smiles, and peels her an orange. She says nothing. She says nothing all evening, and we watch her not say it.</p>"},{"oref":"Scene 3","id":130,"seq":3,"title":"The same room. The peak of the sisters' story","added":false,"act":"Act One","kind":"scene","sum":"Late, one candle. Alice holds out the letter. \"You were leaving.\" The Lost One, who lost Alice's name in the gasworks, still knows this face and still knows this hurt. \"Yes.\" And the fence comes down, because Alice is too angry to hold it up: \"You always left. You left me under that bed. Every time. You promised nothing would touch me, and then you counted fence posts while he—\" She can't finish. Fifteen years, and she has finally said it out loud, to the only person who was there. The Lost One has been waiting six weeks to be let in. She has the guilt, and it's the last thing of Miriam's left in her, because the cold took the birthdays and the songs and the name and couldn't get its teeth into this. She kneels on the floor so she's lower than Alice, the way you'd kneel to a child under a bed. \"I should have stood in front of you. Every time. I'm sorry. I was so frightened of him that I let you be frightened alone, and I've hated myself every day since.\" Then the thing Miriam never could have said: \"If he came through that door now, I'd stand in front of you. I'd let him freeze.\" It is the apology Alice has wanted her whole life, word for word, and it's perfect. That's how she knows. Miriam couldn't have said it. Miriam *flinched*. Alice, barely a breath: \"Say my name.\" The Lost One opens her mouth, and there's nothing there. A long silence. \"You're not her.\" \"No.\" Plainly: Morgana's daughter, who came through on the bridge, wearing Miriam's body and Miriam's memories like a coat. Alice: \"Where is she?\" \"Gone. I'm sorry. She was going to leave you, Ali. She told me on the bridge. She was frightened, and it wasn't of you.\" Then the real horror, said gently, as a gift: \"I'm not sorry for her. I'm sorry for me. I love you. I don't know whose that is anymore. I think it's mine.\" Alice looks at the thing that has been her sister for six weeks, the one that remembered her birthday, peeled her an orange and just gave her the only apology she has ever been given, and understands that her real sister never loved her this well. \"Get out.\" The door closes on her.","loc":"The same room","when":"Late, one candle.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":900,"ed":"","fl":[],"html":"<p>Late, one candle. Alice holds out the letter. \"You were leaving.\" The Lost One, who lost Alice's name in the gasworks, still knows this face and still knows this hurt. \"Yes.\" And the fence comes down, because Alice is too angry to hold it up: \"You always left. You left me under that bed. Every time. You promised nothing would touch me, and then you counted fence posts while he—\" She can't finish. Fifteen years, and she has finally said it out loud, to the only person who was there. The Lost One has been waiting six weeks to be let in. She has the guilt, and it's the last thing of Miriam's left in her, because the cold took the birthdays and the songs and the name and couldn't get its teeth into this. She kneels on the floor so she's lower than Alice, the way you'd kneel to a child under a bed. \"I should have stood in front of you. Every time. I'm sorry. I was so frightened of him that I let you be frightened alone, and I've hated myself every day since.\" Then the thing Miriam never could have said: \"If he came through that door now, I'd stand in front of you. I'd let him freeze.\" It is the apology Alice has wanted her whole life, word for word, and it's perfect. That's how she knows. Miriam couldn't have said it. Miriam *flinched*. Alice, barely a breath: \"Say my name.\" The Lost One opens her mouth, and there's nothing there. A long silence. \"You're not her.\" \"No.\" Plainly: Morgana's daughter, who came through on the bridge, wearing Miriam's body and Miriam's memories like a coat. Alice: \"Where is she?\" \"Gone. I'm sorry. She was going to leave you, Ali. She told me on the bridge. She was frightened, and it wasn't of you.\" Then the real horror, said gently, as a gift: \"I'm not sorry for her. I'm sorry for me. I love you. I don't know whose that is anymore. I think it's mine.\" Alice looks at the thing that has been her sister for six weeks, the one that remembered her birthday, peeled her an orange and just gave her the only apology she has ever been given, and understands that her real sister never loved her this well. \"Get out.\" The door closes on her.</p>"},{"oref":"Scene 4","id":131,"seq":4,"title":"Harding House, breakfast","added":false,"act":"Act One","kind":"scene","sum":"Eldgard sits silent and diminished without his Works. Josephine runs the table now: the wedding is in seven days, and the Lambrick money will buy the Works back. Nathaniel: \"Or what, Mother? You'll poison me?\" Josephine, buttering toast: \"If I had to choose between you and London, I chose a long time ago.\"","loc":"Harding House","when":"Eldgard sits silent and diminished without his Works.","th":"harding","also":[],"ch":["eldgard","josephine","nathaniel"],"turn":"","w":218,"ed":"","fl":[],"html":"<p>Eldgard sits silent and diminished without his Works. Josephine runs the table now: the wedding is in seven days, and the Lambrick money will buy the Works back. Nathaniel: \"Or what, Mother? You'll poison me?\" Josephine, buttering toast: \"If I had to choose between you and London, I chose a long time ago.\"</p>"},{"oref":"Scene 5","id":132,"seq":5,"title":"The core, under Crown control","added":false,"act":"Act One","kind":"scene","sum":"Vane and Lambrick tour it with Tamara on her father's arm. On the stair down, Lambrick, quietly, the only time he talks to her as if she were a person: \"Your mother hated the green. Said it made everyone at dinner look drowned. I kept her room on coal till the end.\" Then he looks up at Morgana. There's no horror in his face, only arithmetic: \"She could be bled faster.\" The man who kept one room warm out of love would freeze a city for the same reason, and calls both of them providing. On the clerk's desk sits Eldgard's seized Heartglass folio. Tamara reads one line: *Vessel: White-born.*","loc":"The core","when":"Vane and Lambrick tour it with Tamara on her father's arm.","th":"lambrick","also":["city"],"ch":["lambrick","vane","tamara","morgana"],"turn":"","w":366,"ed":"","fl":[],"html":"<p>Vane and Lambrick tour it with Tamara on her father's arm. On the stair down, Lambrick, quietly, the only time he talks to her as if she were a person: \"Your mother hated the green. Said it made everyone at dinner look drowned. I kept her room on coal till the end.\" Then he looks up at Morgana. There's no horror in his face, only arithmetic: \"She could be bled faster.\" The man who kept one room warm out of love would freeze a city for the same reason, and calls both of them providing. On the clerk's desk sits Eldgard's seized Heartglass folio. Tamara reads one line: *Vessel: White-born.*</p>"},{"oref":"Scene 6","id":134,"seq":6,"title":"Blackwood Bridge, fog","added":false,"act":"Act Two","kind":"scene","sum":"The Lost One, thrown out, walks to the place she first came through. Howls in the fog. Wolves of the White, white-furred and blue-eyed, pad out of nothing and bow to her. That's the most dangerous thing that could happen.","loc":"Blackwood Bridge","when":"The Lost One, thrown out, walks to the place she first came through.","th":"white","also":[],"ch":["lostone"],"turn":"","w":184,"ed":"","fl":[],"html":"<p>The Lost One, thrown out, walks to the place she first came through. Howls in the fog. Wolves of the White, white-furred and blue-eyed, pad out of nothing and bow to her. That's the most dangerous thing that could happen.</p>"},{"oref":"Scene 7","id":133,"seq":7,"title":"Guard tower roof, their boyhood spot","added":false,"act":"Act Two","kind":"scene","sum":"This morning Nixon got a medal for carrying Cole out of the gasworks, and the ceremony was pure irony. Afterwards Cole, two fingers short, held out the diary: \"Today, sir.\" So this afternoon, at the spot they've had since they were nine, Nixon tells him. \"I fired the shot. I didn't know it was him.\" Nathaniel hits him once, hard. Nixon lets him. \"Your father told me to lie. He came down after.\" \"Was Jamie alive when you left?\" \"Yes.\" Nathaniel walks away without a word. A friendship of fifteen years ends on a roof.","loc":"Guard tower roof","when":"This morning Nixon got a medal for carrying Cole out of the gasworks, and the ceremony was pure irony.","th":"guard","also":["investigation"],"ch":["nixon","cole","nathaniel"],"turn":"","w":500,"ed":"","fl":[],"html":"<p>This morning Nixon got a medal for carrying Cole out of the gasworks, and the ceremony was pure irony. Afterwards Cole, two fingers short, held out the diary: \"Today, sir.\" So this afternoon, at the spot they've had since they were nine, Nixon tells him. \"I fired the shot. I didn't know it was him.\" Nathaniel hits him once, hard. Nixon lets him. \"Your father told me to lie. He came down after.\" \"Was Jamie alive when you left?\" \"Yes.\" Nathaniel walks away without a word. A friendship of fifteen years end
