ine</td><td>Ep 1, cold open</td><td>Ep 5, cold open: she comes back with a hammer, and by dawn the empty field is full</td></tr><tr><td>Alistair steps aside to let the frost child go</td><td>Ep 1, cold open</td><td>Ep 10, cold open: the mother bought her child's freedom with her own, the same trade she refuses to let her daughter undo at the lever</td></tr><tr><td>Cole on the gantry sees Jamie alive</td><td>Ep 1, scene 16; Ep 2, scene 4 (the diary)</td><td>Ep 10, Westminster: \"The man on the floor was still talking\"</td></tr><tr><td>Jamie's coffin is too heavy</td><td>Ep 2, scenes 3 (Byron's shaking hands) and 7 (Nixon carries it)</td><td>Ep 7, scene 14: Nathaniel opens it himself and finds slag; Ep 9, Snow Confession I: \"The Captain carried it for me\"; Ep 10, the Record: \"There was no body\"</td></tr><tr><td>\"He is cold\"</td><td>Ep 5, scene 14</td><td>Ep 7, scene 14 (the empty coffin); Ep 5, scene 20 (\"She told me my sister was still singing\"); Ep 7, scene 17 (\"Don't live in it\" against \"My mother doesn't lie\"); Ep 9, Snow Confession I; Ep 10, scene 12; Ep 10, final scene</td></tr><tr><td>*Si mater sinat*: if the mother allows it</td><td>Ep 8, scene 18</td><td>Ep 8, Newgate (\"You would\"); Ep 9, scene 9 and tag; Ep 10, scene 2 (\"Not her\"); Ep 10, Tyburn hill (\"Not him\")</td></tr><tr><td>Josephine knows why her son agreed to the wedding</td><td>Ep 8, scene 2</td><td>Ep 8, scene 13: the Vykra at the door she sold them</td></tr><tr><td>Otty's brass: DIED ABROAD</td><td>Ep 2 funeral</td><td>Ep 9 (\"they cut it in brass\"); Ep 10, Westminster: \"who did not die abroad\"</td></tr><tr><td>Lambrick kept his wife's room on coal</td><td>Ep 7, the core tour</td><td>Ep 10, the vault: \"It was always for you\"</td></tr><tr><td>Grise's tea-girl in Covent Garden</td><td>Ep 6, the tea shop</td><td>Ep 6, the note that sends Nixon, and Byron, into the conduit; Ep 10, scenes 10 and 12: Alice's runner. \"She said not to tell you she asked.\"</td></tr><tr><td>\"I held his hand\"</td><td>Ep 8, the groom's dressing room</td><td>Ep 9, Snow Confession I: \"Over the lock\"</td></tr><tr><td>Josephine at breakfast: \"I chose a long time ago\"</td><td>Ep 7, breakfast</td><td>Ep 9 tag, the lever; Ep 10, she chooses again, the other way</td></tr></tbody>\n</table>","inherit":"<p><strong>What Season 2 inherits</strong></p>\n<ul>\n<li><strong>A London with no light.</strong> Coal is power now, and Tamara owns the coal. The young woman who wanted to be her father's heir has become something more dangerous.</li>\n<li><strong>A Harding child carried by a daughter of the White.</strong> Both worlds will want it.</li>\n<li><strong>Jamie, alive in the White</strong> with his mother and Morgana. The father of that child is on the wrong side of the world.</li>\n<li><strong>Everyone the chain ever took.</strong> If Jamie is breathing in the White, so is the boy with the lantern: Edric, nine for four hundred years. And Otty, who walked down singing, and who, Morgana told Eldgard, is singing still. And the Hargraves of the Orchard, whose names are now on the Crown's record. Season 2's question writes itself: what do you owe the dead when they aren't dead?</li>\n<li><strong>Nixon and Tamara</strong>: married to his cousin, holding his hand, nothing decided. Nathaniel and Alice: a kiss on Tyburn hill and no promise, because he's still Tamara's husband, and Tamara's hold on the city's coal rests on being Lady Harding. Three people in love, and the only marriage among them is the one keeping London warm.</li>\n</ul>"},"world":{"html":"<p><strong>The rule:</strong> gallowglass is Morgana's frozen blood. Iron and Harding blood hold her chain. The oath runs four hundred winters, and every fiftieth first snow the chain must be fed with a life, or it breaks. For three centuries a hanged Hargrave sufficed. In 1839 the chain refused the hanged and the herded, and demanded what Alistair first gave it: a Harding who walks down the stair of their own will. Blood taken by force only buys time. That is why Jamie, held to the lock against his will, bought forty-nine days and not fifty years. Alistair's son paid the founding, Eldgard's sister was the first Harding life the chain demanded since, and tonight's Tithe is the second, and the four-hundredth winter besides. If it breaks, she goes free, the light goes out for good, and the White comes through for one night. And the oath carries a forfeit that only the lead remembers: if a Harding breaks what a Harding made, the White may take one of that house before the night is out, given and not taken.</p>\n<p>Everything else follows from that sentence.</p>\n<p><strong>The three layers of the secret</strong></p>\n<table>\n<thead><tr><th>Layer</th><th>Who believes it</th><th>What it says</th></tr></thead>\n<tbody><tr><td>Public</td><td>London</td><td>Gallowglass grows from iron under Tyburn. In 1489 the Hargrave rebels were hanged there for treason.</td></tr><tr><td>Second</td><td>Glim addicts, old Guardsmen, the Vykra</td><td>The light hums with a woman crying. People call it the Weeping and say it's the hanged.</td></tr><tr><td>Truth</td><td>Eldgard, later Nathaniel</td><td>Morgana, a mother from the White, has been chained under the Works since 1489. The Hargraves were a Harding cadet branch, hanged by their own cousins for trying to free her. Her daughter ran into the snow.</td></tr></tbody>\n</table>\n<p><strong>What gallowglass does</strong></p>\n<ul>\n<li>Burned in lamps and furnaces, it gives a green-white light and steady heat. The Ring, London's lamp grid, carries it under every street.</li>\n<li>Ground to dust it becomes <strong>glim</strong>, the undercity's drug. Users hear the Weeping, which is the first clue, given in Episode 1. It is Morgana's lullaby to her daughter, and London has sung it for four hundred years as the Lantern Hymn, with new words nailed over the old tune. Under the tune, for anyone with her blood, are the names of every life the house fed her, and every Hargrave who died within her hearing.</li>\n<li>It refuses anyone of the White unless they carry Harding blood, which is why the Lost One can touch Nathaniel without freezing him.</li>\n</ul>\n<p><strong>The Royal Lantern Guard.</strong> Chartered in 1689 to protect the Ring, they are London's elite, armed by the Harding Works. Oath: *Light the dark. Keep the flame.* Ranks run Wick (recruit), Flame (trooper), Lantern-Captain.</p>\n<ul>\n<li><strong>Lantern gauntlet:</strong> a forearm rig with a gallowglass core. It fires a <strong>flash-burst</strong>, a blinding strobe that drops a man and sends wolves of the White running.</li>\n<li><strong>Leap-boosters:</strong> steam and crystal thrust packs for rooftop flight, thirty seconds per charge. When the charge runs out, you fall.</li>\n<li><strong>Tether-hook:</strong> a grapple line for swings and quick climbs.</li>\n<li><strong>Quench-blade:</strong> a glass sabre that drinks heat, built for fast takedowns. One touch numbs a limb; a long cut freezes the blood.</li>\n<li><strong>Lantern rifle:</strong> fires crystal rounds that burst into light. Every discharge goes into a log. That log matters in Episodes 4 and 5.</li>\n</ul>\n<p><strong>Undercity tech.</strong> <strong>Ghostlights</strong> are bootleg gauntlets, unstable and loud. Alice builds hers from parts stolen out of Nathaniel's shop. <strong>Ajax's Black Gauntlet</strong> is Nathaniel's own abandoned prototype, stolen two years ago, which hits like a piston.</p>\n<p><strong>The Vykra.</strong> A guild of undercity women, spies and knives for hire, run by Mother Grise from a Shadwell laundry. Their mark is a knot stitched inside the glove. Their poison, <strong>winter's kiss</strong>, is distilled from gallowglass and kills with frost on the lips, so it looks like the Frost Killer's work.</p>\n<p><strong>The White.</strong> A world of snow, wind and wolves on the far side of the chain. Time stops there. Whatever crosses over carries the cold with it. The Lost One kills by freezing when she's frightened, and each time she uses the cold she loses one of Miriam's memories.</p>\n<p><strong>Places.</strong> Harding House (Mayfair) and its glasshouse. The Harding Works over Tyburn, with the core deep below. Gin Lane tenements. Blackwood Bridge. The Shadwell laundry. Lambrick House and the Pimlico gasworks, where the Tyburn conduit (the old Works drain) runs under the city into the Thames. The Lantern Guard tower at Charing Cross. Parliament. Newgate.</p>\n<p>The Hardings did not find a monster. They took a mother, and four centuries of light run on that. Alistair's son paid the founding in 1489, a Harding sister paid in 1839, and 1889 is the second cycle.</p>\n<table>\n<thead><tr><th>Year</th><th>What happened</th><th>Where we learn it</th></tr></thead>\n<tbody><tr><td>1488–89</td><td>A hard winter. The wall between London and the White thins at Tyburn, and Morgana's daughter wanders through. The Hardings are the Crown's hangmen at Tyburn.</td><td>Ep 5 (Morgana), Ep 9</td></tr><tr><td>1489</td><td>Alistair Harding nets the frost child and uses her as bait. Morgana comes for her, and he chains her in cold iron. Her blood burns green on the gallows timber.</td><td>Ep 1 cold open (in shadow), Ep 10 cold open</td></tr><tr><td>1489</td><td>The bargain. Morgana: \"Free me, and pay in light. Keep me, and pay in sons.\" The daughter goes free, the mother stays, and the oath is sealed with Alistair's blood for four hundred winters, fed with a life every fifty years. His firstborn, Edric, nine, is the founding payment.</td><td>Ep 1 cold open (the boy with the lantern; Alistair steps aside for the child), Ep 10 cold open, Ep 9</td></tr><tr><td>1489–90</td><td>The blood hardens into gallowglass. The Hargraves, a Harding cadet branch, try to free her. Alistair hangs the ringleaders, three thousand on the field, and keeps the rest alive underground as the house's spare blood. The Hardings call the place the Orchard. \"Hargrave\" becomes the punishment name, and their blood is still Harding blood.</td><td>Ep 1 (the cousin at the treeline), Ep 5 cold open (the raid and the full field), Ep 3 blood test, Ep 4 (Marsh's rhyme), Ep 8 (the Orchard)</td></tr><tr><td>1539–1783</td><td>Tyburn feeds the chain. A life hanged on Harding timber at first snow counts, because the gallows is soaked in her blood. The Hardings keep the Crown's gallows so the Crown never has to know.</td><td>Ep 5</td></tr><tr><td>1783–1839</td><td>The last hanging at Tyburn. Substitutes grow thinner: Hargraves from the Orchard, led up under a Newgate warrant to stand in for a hanging. The chain frays, then refuses them.</td><td>Ep 2 (chain links), Ep 9</td></tr><tr><td>1839</td><td>The chain demands a Harding. Ottoline \"Otty\" Harding, nineteen, Eldgard's older sister, goes down at first snow of her own will. The family says she died of fever in Switzerland. Eldgard is eight. Byron, fourteen, is her page and keeps her ribbon. First cycle.</td><td>Ep 2 plaque, Ep 6 ribbon, Ep 9</td></tr><tr><td>1860–72</td><td>Eldgard marries Josephine, ex-Vykra. Jamie is born in 1864 and raised as the next payment. In 1861 Tobias Marsh, an Orchard man, escapes, is caught and is locked in Newgate as a madman, cell 1417. In 1872 Eldgard takes a six-year-old Hargrave, Nixon, out of the Orchard, tells him his mother Marian died of fever, and sends him to the charity school as the spare. She dies in the cells four years later.</td><td>Ep 4 (Marsh), Ep 7 (the file), Ep 8 (Marian's name), Ep 9</td></tr><tr><td>1889</td><td>The four-hundredth winter and the second cycle. Jamie's blood cracks the lock on 2 November, and the daughter crosses into Miriam's body.</td><td>Ep 1, Ep 9, Ep 10</td></tr></tbody>\n</table>\n<p><strong>Why fifty, and why it lands now.</strong> 1489 plus four hundred is 1889, and 1839 plus fifty is 1889. The two clocks meet this winter. Morgana designed it that way: the oath ends here, so this is the one feeding she can break by being fed.</p>\n<p><strong>Otty, in the season.</strong> She is never seen. She appears four times: the brass on the chancel wall in Ep 2, Eldgard's \"She told me my sister was still singing\" in Ep 5, the blue ribbon in Byron's pocket in Ep 6, and Eldgard's confession in Ep 9. By then the audience knows what Eldgard's \"I raised Jamie for it\" is a copy of.</p>\n<p><strong>The Orchard.</strong> Under the Works, thirteen steps below the coal-hatch stair, is a gallery of bunks and iron rings where Hargraves were kept alive for four hundred years: fed well, kept healthy, allowed up only to die. They were the house's spare blood, and the cattle in the contract. Hardings are taught never to say the word upstairs. By 1889 the herd is gone. Marsh's rhyme counts the seven who were left when he ran, and Nixon is the only Hargrave anyone ever brought out into the light.</p>\n<p><strong>Tobias Marsh.</strong> An Orchard man who ran in 1861 and was caught. The Crown holds him in Newgate as a madman, cell 1417, and nobody listens to what he sings. Jamie Harding visited him every Sunday for two years and learned the way down. The diagram in Jamie's boot-tree in Ep 2 has a stair of thirteen steps drawn beside the chain. That is why Jamie went to the Works with a plan in Ep 1, and why Nixon, tracing a dead boy's footsteps without knowing it, ends up in the Orchard in Ep 8.</p>\n<p><strong>How Nixon learns it.</strong></p>\n<ol>\n<li>Ep 3: his blood test glows green, and Eldgard pats his head: \"Still good.\" Felix gives him the Newgate slip.</li>\n<li>Ep 4: Marsh pinches his cheek, \"Marian's chin!\", and sings the rhyme. Nixon walks away not understanding it.</li>\n<li>Ep 7: the file, \"Reserve. Blood suitable.\" He learns he is the spare, not what the spare is for.</li>\n<li>Ep 8: he follows the rhyme down thirteen steps and finds the Orchard and his mother's name. This is the scene that turns him.</li>\n<li>Ep 9: Eldgard confirms it in the Snow Confession. Nixon frees Marsh from Newgate in the break-out.</li>\n<li>Ep 10: he offers himself with his eyes open. \"They grew me for this the way they grew my mother.\"</li>\n</ol><h3>Supporting cast</h3><ul><li><strong>Lord Hector Lambrick</strong>, 55. A coal baron losing the light war. He wants London back on coal and owned by him. When he sees Morgana, his reaction is greed, and he wants her bled faster.</li><li><strong>Ajax Fink</strong>, 35. Lambrick's enforcer, an ex-Guardsman drummed out of the corps, carrying the Black Gauntlet. He's funny, patient and terrifying, and he survives too long.</li><li><strong>Mother Grise</strong>, 70. Runs the Vykra out of the Shadwell laundry. She sells to everyone and loves no one, except, briefly, girls who beat her.</li><li><strong>Inspector Felix Hawke</strong>, 40. Met police. The only man who saw a corpse get up, and the first to die for saying so in public (Episode 4).</li><li><strong>Lord Chancellor Vane</strong>, 60. The Crown. He doesn't want the truth, only the lights on.</li><li><strong>Jamie Harding</strong>, 25 (Episode 1 and cold opens). The heir raised to die for the chain, who chose love and sabotage instead.</li><li><strong>Miriam Bounds</strong>, 23 (Episode 1 and cold opens). Alice's older sister, carrying Jamie's child, about to leave Alice for good. Hard, quick and funny, a Vykra runner who never flinches in a fight, and who flinched every single time it mattered.</li><li><strong>Old Wren</strong>, 60s. Gin Lane herb-woman who set Alice's arm when she was nine and never asked how it broke. She's the one who tells Alice her sister will get better.</li></ul>\n<h3>The wound under the sisters</h3>\n<p>When Alice and Miriam were small, their stepfather drank and kept a belt. Miriam, four years older, made Alice a promise in the dark under their bed: *nothing will ever touch you while I'm here.* Then the belt came out, and Miriam didn't move. She never once moved. What she did was teach Alice to count: the posts of the fence outside the window, one to eight, over and over, until it was over. \"Eight posts and he's done.\" That's the counting game. The sisters have played it as a joke for fifteen years, and neither of them has ever said where it came from. The stepfather went into the river one winter, drunk, and nobody looked for him.</p>\n<p>Alice keeps all of it <strong>behind the eightfold fence</strong>, her own phrase, the one she uses when anyone gets close: *that's behind the fence.* It's the root of her lie. She learned that love is holding on, because nobody held the line for her.</p>\n<p>Miriam carried it differently: guilt, all of it, never said. When the Lost One comes through on the bridge and puts Miriam on like a coat, it gets the guilt with the memories. A creature that has never felt anything human now has fifteen years of a sister's shame, and no idea what to do with it.</p>\n<p><strong>How the show handles it.</strong> The abuse is never shown. It lives in sound (a buckle, a floorboard), in Alice's flinch, and in the counting. It's about what it did to two girls, not about the man.</p>\n<p><strong>The irony at the heart of the sisters' story.</strong> Miriam knew she owed Alice an apology and never gave it. The Lost One isn't Miriam, but she gives it, and that's how Alice knows her sister is dead.</p>\n<h3>How the season stays producible</h3>\n<p>Morgana is a practical performer in prosthetics from the waist up, with CG for the ice and fire and the full nine feet saved for Eps 5, 8 and 10. The pilot shows only her hand. The wolves are shown the way the flash-bursts show everything: one strobe frame at a time, so we render frames, not sequences, and the audience's imagination does the rest. Ep 4 (a hearing room and a dock) and Ep 7's Pavilion (one interior, a hundred extras and a song) are the season's contained episodes, which pays for the Newgate break-out and Tyburn hill.</p>\n<h3>The choices that shape the season</h3>\n<p>Every episode turns on a decision where both options are right and both cost something. Nathaniel makes the heaviest ones, and nobody makes a choice that can be undone.</p>\n<table>\n<thead><tr><th>Ep</th><th>Who</th><th>The choice</th><th>What it costs</th><th>What it changes</th></tr></thead>\n<tbody><tr><td>3</td><td>Nixon</td><td>Capture the Lost One, or save Cole</td><td>Duty. He lets her go</td><td>Vane has a reason to break him later</td></tr><tr><td>4</td><td>Nathaniel</td><td>Pull Ajax up (the only witness against Lambrick) or let him drop (Jamie's grave)</td><td>Justice for his brother, and the case against Lambrick</td><td>The ledger now has to come from Tamara, and in Ep 9 Ajax comes back to kill his father</td></tr><tr><td>5</td><td>Nathaniel</td><td>Leave with Alice and the Lost One, or stay to hear the rest from his father</td><td>Alice's trust, and the Lost One's safety</td><td>He chooses his father, and Alice leaves without him</td></tr><tr><td>7</td><td>Alice</td><td>The sister she lost, or the girl standing in front of her</td><td>Her grief</td><td>She chooses the Lost One anyway</td></tr><tr><td>7</td><td>Nixon</td><td>Keep Jamie's death secret, or confess to his best friend</td><td>The friendship</td><td>Nathaniel stops trusting him</td></tr><tr><td>8</td><td>Alice</td><td>Run back down before the ring, or nod and let Nathaniel save Tamara</td><td>Her sister, sealed below the grille</td><td>The Lost One is taken, and Nathaniel owes Alice a debt he can never repay</td></tr><tr><td>8</td><td>Nixon</td><td>Say the word and take Tamara out of the church, or hand her the ring</td><td>Her, maybe for good</td><td>He hands it to her properly, and walks out of the chapel holding the empty box</td></tr><tr><td>8</td><td>Nixon</td><td>Obey Vane and fire, or stand down</td><td>His rank and his men</td><td>Forty Lanterns follow him</td></tr><tr><td>8</td><td>Nathaniel</td><td>Stop before the ring, as planned, or go past it</td><td>His freedom, the \"nearly\" he promised Alice, and her sister, sealed below. He sees the cost in Alice's face and goes past anyway</td><td>Tamara is untouchable, and he's married</td></tr><tr><td>9</td><td>Alice</td><td>Chase Ajax toward her sister, or stay with Nathaniel while his father dies</td><td>Minutes her sister doesn't have</td><td>His hand finds hers behind his back</td></tr><tr><td>9</td><td>Josephine</td><td>Believe Eldgard that the mother will never allow the trade, or bet that nobody in hooks refuses an open door</td><td>Alice's sister, and any forgiveness from her son</td><td>Morgana refuses the door, the Heartglass cracks, and the price falls back on a Harding</td></tr><tr><td>10</td><td>Morgana</td><td>Walk out through the door her daughter holds open, or tear her own hooks deeper to shut it</td><td>Four hundred years of wanting out</td><td>The Heartglass cracks, and Josephine sees exactly what she herself will do on Tyburn hill</td></tr><tr><td>10</td><td>Alice</td><td>Let Nathaniel walk into the White, as she just let her sister choose, or stand in front of him</td><td>The lesson she has only just learned about letting go</td><td>She learns the difference: you let go of someone choosing to live, and you stand in front of someone choosing to die. Josephine goes instead</td></tr><tr><td>10</td><td>Alice</td><td>Burn her hand on the lock, knowing it puts out every light in London</td><td>Her hand, and her share of a city's hatred</td><td>\"Us.\" The light ends because both of them chose it</td></tr><tr><td>10</td><td>Nathaniel</td><td>Go to Alice on Gin Lane, or stay and watch his mother</td><td>The girl he loves, alone in the dark</td><td>He stays, and follows his mother up the hill</td></tr><tr><td>10</td><td>Nathaniel</td><td>Walk into the White himself, or let his mother go in his place</td><td>His life, or his mother's</td><td>He says \"Go,\" then refuses the Crown's silence and puts every name on the record</td></tr></tbody>\n</table>","craft":"<p>Eight rules, each taken from a writer you named, and each one checked against every episode below.</p>\n<ol>\n<li><strong>Therefore and but, never \"and then.\"</strong> Each scene is caused by the last one or cuts across it. Parker and Stone's test: if the honest word between two beats is \"and then,\" one of them goes. (<a href=\"https://perell.com/note/but-therefore-rule/\">Perell</a>)</li>\n<li><strong>Secrets with long fuses (Brent Weeks).</strong> Weeks plots the character arcs and the big external climaxes, then layers in secrets he pays off books later. Here each major secret has three layers: what the public believes, what the audience learns, and what the character learns last, when it stings most. Everything serves his one rule: keep people turning pages. (<a href=\"https://reactormag.com/highlights-from-brent-weeks-r-fantasy-ama/\">Reactor, Weeks AMA</a>)</li>\n<li><strong>Plans collide.</strong> Most set pieces happen because three or four characters have separate plans for the same night. Nobody's plan works as drawn. The explosion, the heist and the wolves in the streets all come out of choices, never coincidence.</li>\n<li><strong>Sisters only trauma can split (Arcane).</strong> Alex Yee: the sisters had to be \"so emotionally entwined that only an event that traumatic\" could drive a wedge between them. Alice and the Lost One get three episodes of closeness before the first wound and four before the break. (<a href=\"https://www.syfy.com/syfy-wire/arcane-co-creator-alex-yee-unpacks-the-act-i-twists?amp\">SYFY, Alex Yee</a>)</li>\n<li><strong>Power lives inside intimate relationships (Willimon).</strong> \"Politics itself doesn't interest me. It's power that interests me.\" Every marriage, friendship and parent-child pair here is also a power arrangement, shown through behaviour and hands more than speeches. (<a href=\"https://script-consultant.co.uk/bfi-beau-willimon-interview-notes-pt1/\">BFI notes</a>)</li>\n<li><strong>One vision per episode.</strong> Each episode has one focus you could put on its poster (the ball, the morgue, the hunt, the hearing, the heist), 17 to 22 scenes for about 44 minutes, and every scene turns something. The three tent-poles (Ep 5, the midseason heist; Ep 8, the wedding; Ep 10, the finale) run 21 to 22 so their set pieces have room. The rest run 17 to 19, with scenes that only carry information folded into scenes that carry feeling.</li>\n<li><strong>The grid.</strong> Your colleague's Want / Obstacle / Solution / Twist table runs for the four or five characters who carry each episode. The others rest and come back with their own stories later.</li>\n<li><strong>Whimsy earns the grim.</strong> Each episode alternates a light beat with a dark one, gives at least one feeling that goes unsaid, and gives one young character a chance to prove they belong. Every episode ends on a tag that changes the board: a reveal, an escalation, or a choice that can't be taken back.</li>\n</ol>"},"season":{"html":"<p>London, November 1889, and the whole city glows green. Every lamp, tram and furnace burns gallowglass, a crystal that only House Harding knows how to grow, at the Harding Works on the old gallows field at Tyburn. The Hardings say it grows from iron in the ground. In fact it grows from a woman. For four hundred years they have kept a creature from the frozen world beyond, the White, chained under the Works, and they bleed her for light. The oath that holds her was sworn for four hundred winters, and it is fed with a life at the first snow every fifty years. The last life was Eldgard's own older sister. The next is due this winter, the four-hundredth, and it is the last the oath can hold.</p>\n<p><strong>Series engine.</strong> London runs on a secret. Every faction wants to own the secret, the girl at its centre or the boy who will inherit it. Every week, one plan for the light runs into another.</p>\n<p><strong>Season question.</strong> Can Nathaniel Harding end the bargain that lights London without becoming the father who kept it? Under it runs the sisters' question: will Alice Bounds let the thing wearing her dead sister's face choose its own life?</p>\n<p><strong>Theme.</strong> Protection as control. Every adult in this show hurts someone to keep them safe. The young ones have to learn whether love can let go.</p>\n<p><strong>Tone.</strong> The dread of *Chernobyl*, the sisters of *Arcane*, *House of Cards* in the drawing rooms. Whimsy breathes between the violence: a creature learning what an orange is, a recruit tangled in laundry lines, two engaged friends who plan to be very polite to each other for forty years.</p>\n<p><strong>The clock.</strong> Every episode opens on a card: 49 DAYS TO FIRST SNOW. Everyone assumes the first snow means the solstice, 21 December. At the end of Episode 8 the snow comes two weeks early, because the prisoner makes it fall, and the last two episodes play out over one night.</p>\n<p><strong>Kept from your outline:</strong> the Harding legacy and the 1489 massacre at the Gallows; Miriam's death and the Lost One; the sister reveal (\"You're not her\"); Josephine's protection turning into control; Eldgard's Snow Confession; Nixon's Hargrave blood; Tamara the operative; the Vykra; Ajax; Miriam's red mittens.</p>\n<p><strong>Cut:</strong> Edmund, Virgil, the Chapel, the Duke, the Prime Minister, Trevane. Each one did a job someone else now does, or existed only to deliver information. Morgana moves from a nun's body in the Chapel to the chain under the Works, so the villain's secret and the light's secret become the same secret.</p>\n<p><strong>New:</strong> Mother Grise, who runs the Vykra; Lord Chancellor Vane, for the Crown; and the Royal Lantern Guard as a full corps with its own gear, ranks and oath.</p><h3>The clock, episode by episode</h3><table>\n<thead><tr><th>Ep</th><th>Clock</th><th>Title</th><th>Focus</th><th>Set piece</th><th>The turn</th></tr></thead>\n<tbody><tr><td>Ep</td><td>Clock</td><td>Title</td><td>Focus</td><td>Set piece</td><td>The turn</td></tr><tr><td>1</td><td>49 days</td><td>The Engagement</td><td>One night, two parties: the ball above, the glim run below</td><td>The Works blackout: Lantern Guard raid the core in strobe light</td><td>Nixon shoots a saboteur and finds out it's Jamie. Miriam freezes on a bridge</td></tr><tr><td>2</td><td>47 days</td><td>The Wake</td><td>What came back?</td><td>Morgue escape. The Frost Killer is born</td><td>Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core</td></tr><tr><td>3</td><td>42 days</td><td>Lanterns</td><td>Nixon's hunt</td><td>Leaper chase across the Christmas crystal market</td><td>Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One</td></tr><tr><td>4</td><td>38 days</td><td>The Hearing</td><td>The Charter hearing and Jamie's killer</td><td>Docks fight with Ajax, then a murder on the witness stand</td><td>Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh</td></tr><tr><td>5</td><td>33 days</td><td>Lantern Night</td><td>The heist into the core</td><td>Four plans on one festival night, then every lamp in London bursts at once, and the crush</td><td>The light is a woman. Nathaniel is the next Tithe. Nixon locks the door</td></tr><tr><td>6</td><td>28 days</td><td>Coal</td><td>The cold city and Byron</td><td>Pimlico gasworks explosion</td><td>The Crown seizes the Works. Byron dies telling the truth</td></tr><tr><td>7</td><td>21 days</td><td>The Girl Who Isn't</td><td>Two reveals: the sister and the best friend</td><td>Wolves of the White in Whitechapel; the music-hall siege</td><td>\"You're not her.\" Then Alice chooses her anyway. Nixon confesses</td></tr><tr><td>8</td><td>14 days</td><td>The Wedding</td><td>Every faction moves on the same morning</td><td>The wedding, the crypt and the mutiny</td><td>Nathaniel marries Tamara to save her, and the ring drops the crypt grille between Alice and her sister. Nixon finds the Orchard</td></tr><tr><td>9</td><td>First snow</td><td>The Snow Confession</td><td>Evening to midnight: the assault</td><td>Newgate break-out, then storming the Works</td><td>Eldgard dies and tells everything</td></tr><tr><td>10</td><td>The longest night</td><td>The Tithe</td><td>Midnight to dawn</td><td>London goes dark and the wolves come</td><td>Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name</td></tr></tbody>\n</table>","map":[{"clock":"Clock","title":"Title","focus":"Focus","piece":"Set piece","turn":"The turn","tag":"Tag"},{"clock":"49 days","title":"The Engagement","focus":"One night, two parties: the ball above, the glim run below","piece":"The Works blackout: Lantern Guard raid the core in strobe light","turn":"Nixon shoots a saboteur and finds out it's Jamie. Miriam freezes on a bridge","tag":"The frozen girl in the morgue opens her eyes"},{"clock":"47 days","title":"The Wake","focus":"What came back?","piece":"Morgue escape. The Frost Killer is born","turn":"Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core","tag":"Morgana lifts her head: \"My daughter is here.\""},{"clock":"42 days","title":"Lanterns","focus":"Nixon's hunt","piece":"Leaper chase across the Christmas crystal market","turn":"Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One","tag":"\"You smell like the man who keeps my mother.\""},{"clock":"38 days","title":"The Hearing","focus":"The Charter hearing and Jamie's killer","piece":"Docks fight with Ajax, then a murder on the witness stand","turn":"Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh","tag":"Josephine washes frost off her fingers"},{"clock":"33 days","title":"Lantern Night","focus":"The heist into the core","piece":"Four plans on one festival night, then every lamp in London bursts at once, and the crush","turn":"The light is a woman. Nathaniel is the next Tithe. Nixon locks the door","tag":"The Lost One: \"I'm going to free her. Even if they all freeze.\""},{"clock":"28 days","title":"Coal","focus":"The cold city and Byron","piece":"Pimlico gasworks explosion","turn":"The Crown seizes the Works. Byron dies telling the truth","tag":"\"Then you know I love you.\""},{"clock":"21 days","title":"The Girl Who Isn't","focus":"Two reveals: the sister and the best friend","piece":"Wolves of the White in Whitechapel; the music-hall siege","turn":"\"You're not her.\" Then Alice chooses her anyway. Nixon confesses","tag":"Nixon's file: \"Reserve. Blood suitable.\""},{"clock":"14 days","title":"The Wedding","focus":"Every faction moves on the same morning","piece":"The wedding, the crypt and the mutiny","turn":"Nathaniel marries Tamara to save her, and the ring drops the crypt grille between Alice and her sister. Nixon finds the Orchard","tag":"Morgana makes it snow, two weeks early"},{"clock":"First snow","title":"The Snow Confession","focus":"Evening to midnight: the assault","piece":"Newgate break-out, then storming the Works","turn":"Eldgard dies and tells everything","tag":"Josephine pulls the lever"},{"clock":"The longest night","title":"The Tithe","focus":"Midnight to dawn","piece":"London goes dark and the wolves come","turn":"Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name","tag":"The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie alive in the White. DAY ONE"}]}}</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH=Object.fromEntries(D.threads.map(t=>[t[0],{id:t[0],name:t[1],desc:t[2]}]));
const CH=Object.fromEntries(D.chars);
const short=id=>{const n=CH[id]||id;if(id==='lostone')return 'Lost One';if(id==='duke')return 'Duke';if(id==='pm')return 'Prime Minister';if(id==='vane')return 'Vane';if(id==='lambrick')return 'Lambrick';if(id==='grise')return 'Grise';if(id==='wren')return 'Wren';if(id==='felix')return 'Felix';if(id==='eldgard')return 'Eldgard';if(id==='josephine')return 'Josephine';if(id==='nathaniel')return 'Nathaniel';if(id==='lostone')return 'Lost One';return n.replace(/^(The |Lord |Councilman )/,'').split(' ')[0]};
const tc=id=>`var(--t-${id})`;
const ALL=[];D.eps.forEach(e=>e.scenes.forEach(s=>{s.ep=e.n;ALL.push(s)}));
const byId=new Map(ALL.map(s=>[s.id,s]));
const store={get(k){try{return localStorage.getItem('gg.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('gg.'+k,v)}catch(e){}}};
let focus=new Set(), query='', charFilter='';
const PIN='<svg viewBox="0 0 11 13" aria-hidden="true"><path d="M5.5 12s4.2-4 4.2-7A4.2 4.2 0 0 0 1.3 5c0 3 4.2 7 4.2 7z"/><circle cx="5.5" cy="5" r="1.4"/></svg>';

/* theme */
const root=document.documentElement;
const savedTheme=store.get('theme'); if(savedTheme) root.dataset.theme=savedTheme;
$('#theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dark?'light':'dark';store.set('theme',root.dataset.theme)};

/* legend */
function drawLegend(){
  const L=$('#legend');
  L.innerHTML='<span class="hint">Storylines</span>'+D.threads.map(t=>`<button class="tchip" type="button" data-t="${t[0]}" style="--c:${tc(t[0])}" aria-pressed="${focus.has(t[0])}" title="${esc(t[2])}"><i></i>${esc(t[1])}</button>`).join('')+(focus.size?'<button class="clear" type="button" id="clearf">Show all</button>':'');
  $$('.tchip',L).forEach(b=>b.onclick=()=>toggleFocus(b.dataset.t));
  const c=$('#clearf');if(c)c.onclick=()=>{focus.clear();applyFilters()};
}
function toggleFocus(t){focus.has(t)?focus.delete(t):focus.add(t);applyFilters()}
function matches(s){
  if(focus.size && !(focus.has(s.th)||s.also.some(a=>focus.has(a)))) return false;
  if(charFilter && !s.ch.includes(charFilter)) return false;
  if(query){if(!s._t)s._t=(s.title+' '+s.sum+' '+s.loc+' '+s.when+' '+s.turn+' '+s.ch.map(c=>CH[c]||c).join(' ')+' '+s.html.replace(/<[^>]+>/g,' ')).toLowerCase();const hay=s._t;if(!query.split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function applyFilters(){
  drawLegend();
  $$('[data-sid]').forEach(el=>{const s=byId.get(+el.dataset.sid);el.classList.toggle('dim',!matches(s))});
  $$('.tcount button').forEach(b=>b.setAttribute('aria-pressed',focus.has(b.dataset.t)));
  const n=$('#vis-count');if(n){const ep=D.eps.find(e=>e.n===cur.ep);const sc=ep.scenes.filter(s=>s.kind==='scene');const v=sc.filter(matches).length;n.textContent=v===sc.length?`${sc.length} scenes`:`${v} of ${sc.length} scenes match`}
}

/* braid strip */
function braid(ep,big){
  return `<div class="braid${big?' big':''}" role="list">`+ep.scenes.filter(s=>s.kind==='scene').map(s=>`<button type="button" role="listitem" data-sid="${s.id}" data-go="${s.id}" style="--c:${tc(s.th)};--w:${Math.max(70,Math.min(s.w,900))}" title="${esc(s.seq+'. '+s.title+' ('+TH[s.th].name+')')}">${big?s.seq:''}</button>`).join('')+'</div>';
}

/* season */
function drawSeason(){
  const V=$('#v-season');
  const counts={};ALL.forEach(s=>{if(s.kind==='scene')counts[s.th]=(counts[s.th]||0)+1});
  V.innerHTML=`<div class="season-head"><div><h2>Ten episodes, from the engagement to the longest night</h2><p>${esc(D.eps.length)} episodes, ${ALL.filter(s=>s.kind==='scene').length} scenes. Each strip is one episode in scene order. A segment's colour is the storyline that scene moves forward, and its width follows how much happens in it. Select an episode to open its scene board, or a segment to jump straight to that scene.</p></div>
  <div class="clock" aria-label="Season clock"><div class="acts"><span>Act I</span><span>Act II</span><span>Act III</span></div>${D.eps.map(e=>`<div class="cell${e.n>=9?' snow':''}"><b>${e.n}</b><span>${esc(e.time.split(',')[0])}</span></div>`).join('')}</div></div>
  <div class="loom">${D.eps.map(e=>`<a class="lrow" href="#ep${e.n}"><div class="ln">${e.n}</div><div><div class="lt">${esc(e.title)}</div><div class="lg">${esc(e.log)}</div></div><div class="bwrap">${braid(e,false)}<div class="bmeta">${e.scenes.filter(s=>s.kind==='scene').length} scenes, ${esc(e.time)}</div></div><div class="tn">${esc(e.turn)}</div></a>`).join('')}</div>
  <div class="thread-key">${D.threads.map(t=>`<div style="--c:${tc(t[0])}"><i></i><div><b>${esc(t[1])}</b><span>${esc(t[2])}</span> <em>${counts[t[0]]||0} scenes</em></div></div>`).join('')}</div>`;
  wireGo(V);
}

/* episode */
function card(s){
  const fl=s.fl.length?`<span class="badge flag" title="${esc(s.fl.map(f=>f.id).join(', '))}">${s.fl.length===1?s.fl[0].id:s.fl.length+' flags'}</span>`:'';
  const where=(s.loc||s.when)?`<div class="where">${PIN}<span>${esc(s.loc)}${s.loc&&s.when?', ':''}${s.when?`<span class="when">${esc(s.when)}</span>`:''}</span></div>`:'';
  return `<article class="card" id="s${s.id}" data-sid="${s.id}" style="--c:${tc(s.th)}">
   <div class="top"><span class="seq" aria-label="Scene ${s.seq}">${s.seq}</span><div><h4>${esc(s.title)}</h4>${s.oref?`<div class="oref">${esc(s.oref)}</div>`:''}${(s.added||fl||s.ed)?`<div class="badges" style="margin-top:.3rem">${s.added?'<span class="badge add" title="Added in a recent pass">Added</span>':''}${s.ed?`<span class="badge ed" title="${esc(s.ed)}">Edited</span>`:''}${fl}</div>`:''}</div></div>
   ${where}
   <p class="sum">${esc(s.sum)}</p>
   ${s.turn?`<p class="turn"><b>Changes:</b> ${esc(s.turn)}</p>`:''}
   <div class="foot">${s.ch.map(c=>`<button type="button" class="cchip" data-char="${c}" title="Show ${esc(CH[c]||c)}'s scenes">${esc(short(c))}</button>`).join('')}${s.also.length?`<span class="also" title="Also touches: ${esc(s.also.map(a=>TH[a]?TH[a].name:a).join(', '))}">${s.also.map(a=>`<i style="--c:${tc(a)}"></i>`).join('')}</span>`:''}<button type="button" class="readbtn" aria-expanded="false">Read the scene</button></div>
   <div class="full">${s.html}</div></article>`;
}
function drawEpisode(n,scrollTo){
  const e=D.eps.find(x=>x.n===n); const V=$('#v-episode');
  const sc=e.scenes.filter(s=>s.kind==='scene');
  const tcount={};sc.forEach(s=>tcount[s.th]=(tcount[s.th]||0)+1);
  const order=Object.keys(tcount).sort((a,b)=>tcount[b]-tcount[a]);
  const present=[...new Set(e.scenes.flatMap(s=>s.ch))].sort((a,b)=>D.chars.findIndex(c=>c[0]===a)-D.chars.findIndex(c=>c[0]===b));
  let body='',lastAct=null;
  e.scenes.forEach(s=>{
    if(s.kind==='ref')return;
    const act=s.act||'';
    if(act!==lastAct){lastAct=act;if(act)body+=`<div class="actdiv"><h3>${esc(act)}</h3></div>`}
    if(s.kind==='marker'){body+=`<div class="marker" data-sid="${s.id}" style="--c:${tc(s.th)}"><b>${esc(s.title)}</b>. ${esc(s.sum)}</div>`;return}
    body+=card(s);
  });
  const refs=e.scenes.filter(s=>s.kind==='ref');
  V.innerHTML=`<div class="epnav">${D.eps.map(x=>`<a href="#ep${x.n}" ${x.n===n?'aria-current="page"':''} title="${esc(x.title)}">${x.n}</a>`).join('')}<span class="sp"></span>${n>1?`<a class="step" href="#ep${n-1}">Previous</a>`:''}${n<D.eps.length?`<a class="step" href="#ep${n+1}">Next episode</a>`:''}</div>
  <div class="ephead"><div><div class="num">Episode ${n} of 10, Act ${e.act}. ${esc(e.time)}</div><h2>${esc(e.title)}</h2><p class="log">${esc(e.log)}</p><p class="story">${esc(e.sum)}</p></div>
  <aside><h3>By the end</h3><p>${esc(e.turn)}</p><h3>Storylines in this episode</h3><div class="tcount">${order.map(t=>`<button type="button" data-t="${t}" style="--c:${tc(t)}" aria-pressed="false"><i></i><span>${esc(TH[t].name)}</span><span>${tcount[t]}</span></button>`).join('')}</div></aside></div>
  <div class="stripwrap">${braid(e,true)}<div class="cap"><span>Opening</span><span>Scene order, coloured by storyline</span><span>Final image</span></div></div>
  <div class="filters"><label>Character <select id="charsel"><option value="">Everyone</option>${present.map(c=>`<option value="${c}" ${c===charFilter?'selected':''}>${esc(CH[c]||c)}</option>`).join('')}</select></label><button type="button" class="iconbtn" id="openall">Open every scene</button><span class="count" id="vis-count"></span></div>
  <div class="grid">${body}</div>
  ${refs.length||e.frame?`<div class="refs">${e.frame?`<details class="ref"><summary>Episode notes <span>from the top of the outline section</span></summary><div class="full">${e.frame}</div></details>`:''}${refs.map(s=>`<details class="ref"><summary>${esc(s.title)} <span>${esc(s.sum)}</span></summary><div class="full">${s.html}</div></details>`).join('')}</div>`:''}`;
  $$('.tcount button',V).forEach(b=>b.onclick=()=>toggleFocus(b.dataset.t));
  $('#charsel').onchange=ev=>{charFilter=ev.target.value;applyFilters()};
  $('#openall').onclick=ev=>{const open=ev.target.textContent.startsWith('Open');$$('.card',V).forEach(c=>setOpen(c,open));ev.target.textContent=open?'Close every scene':'Open every scene'};
  $$('.readbtn',V).forEach(b=>b.onclick=()=>{const c=b.closest('.card');setOpen(c,!c.classList.contains('open'));if(c.classList.contains('open'))c.scrollIntoView({block:'nearest',behavior:'smooth'})});
  $$('.cchip',V).forEach(b=>b.onclick=()=>{charFilter=charFilter===b.dataset.char?'':b.dataset.char;$('#charsel').value=charFilter;applyFilters()});
  wireGo(V);
  applyFilters();
  if(scrollTo){const el=$('#s'+scrollTo);if(el){setOpen(el,true);requestAnimationFrame(()=>{el.scrollIntoView({block:'start'});el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1800)})}}
  else window.scrollTo(0,0);
}
function setOpen(c,open){c.classList.toggle('open',open);const b=$('.readbtn',c);if(b){b.textContent=open?'Close':'Read the scene';b.setAttribute('aria-expanded',open)}}
function wireGo(V){$$('[data-go]',V).forEach(b=>b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();const s=byId.get(+b.dataset.go);go(`ep${s.ep}/s${s.id}`)})}

/* characters */
function drawCharacters(sel){
  const V=$('#v-characters');
  const list=D.chars.map(c=>c[0]).filter(id=>D.arcs[id]||ALL.some(s=>s.ch.includes(id)));
  const cnt=(id,n)=>D.eps[n-1].scenes.filter(s=>s.kind==='scene'&&s.ch.includes(id)).length;
  const max=Math.max(...list.flatMap(id=>D.eps.map(e=>cnt(id,e.n))));
  sel=sel&&list.includes(sel)?sel:(store.get('char')||'nathaniel');
  store.set('char',sel);
  const rows=list.map(id=>`<tr data-c="${id}" aria-selected="${id===sel}" tabindex="0"><th>${esc(CH[id]||id)}</th>${D.eps.map(e=>{const k=cnt(id,e.n);const a=D.arcs[id]&&D.arcs[id][e.n];return k||a?`<td title="${esc(a?a.line:'')}"><span class="pip" style="--v:${(k/max).toFixed(2)}"></span>${a?`<small>${esc(a.state)}</small>`:''}</td>`:'<td class="none">·</td>'}).join('')}</tr>`).join('');
  const arc=D.arcs[sel]||{};
  const journey=D.eps.map(e=>{const a=arc[e.n];const ss=e.scenes.filter(s=>s.kind==='scene'&&s.ch.includes(sel));
    return `<div class="jcard${!a&&!ss.length?' off':''}"><div class="h"><b>${e.n}. ${esc(e.title)}</b><span>${ss.length} scene${ss.length===1?'':'s'}</span></div>${a?`<div class="st">${esc(a.state)}</div><p>${esc(a.line)}</p>`:`<p style="color:var(--muted)">${ss.length?'In the episode, no arc note.':'Not in this episode.'}</p>`}${ss.length?`<div class="sc">${ss.map(s=>`<a href="#ep${e.n}/s${s.id}" style="--c:${tc(s.th)}" title="${esc(s.seq+'. '+s.title)}">${s.seq}</a>`).join('')}</div>`:''}</div>`}).join('');
  const total=ALL.filter(s=>s.kind==='scene'&&s.ch.includes(sel)).length;
  const eps=D.eps.filter(e=>arc[e.n]||cnt(sel,e.n)).map(e=>e.n);
  V.innerHTML=`<div class="chars-layout"><div class="journey"><h2>${esc(CH[sel]||sel)}</h2><p class="sub">${total} scenes across ${eps.length} episode${eps.length===1?'':'s'}${eps.length?` (${eps[0]} to ${eps[eps.length-1]})`:''}. Each episode shows where they end up, then the scenes they're in, coloured by storyline.</p><div class="jlist">${journey}</div></div>
  <div><h3 style="font-family:var(--display);font-size:1.5rem;margin:0 0 .5rem">Who is in which episode</h3><p class="sub" style="color:var(--muted);margin:0 0 .7rem;font-size:.88rem">Bar length is how many scenes they have. The note under it is where they end that episode. Select a name to open their journey.</p>
  <div class="matrix-wrap"><table class="matrix"><thead><tr><th style="text-align:left;font-family:var(--ui);font-size:.8rem;padding-left:.7rem">Character</th>${D.eps.map(e=>`<th title="${esc(e.title)}">${e.n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
  $$('tbody tr',V).forEach(r=>{const open=()=>go('characters/'+r.dataset.c);r.onclick=open;r.onkeydown=ev=>{if(ev.key==='Enter')open()}});
  window.scrollTo(0,0);
}

/* notes */
function drawNotes(){
  const V=$('#v-notes');
  let out='',total=0;
  D.eps.forEach(e=>{const items=e.scenes.flatMap(s=>s.fl.map(f=>({f,s})));if(!items.length)return;total+=items.length;
    out+=`<h3>Episode ${e.n}: ${esc(e.title)}</h3>`+items.map(({f,s})=>`<div class="note"><div class="id ${f.type}">${esc(f.id)}</div><div><a href="#ep${e.n}/s${s.id}">${s.seq?s.seq+'. ':''}${esc(s.title)}</a><p>${esc(f.text)}</p></div></div>`).join('')});
  V.innerHTML=`<div class="notes"><h2>Flags and open decisions</h2><p class="sub">${total} items pulled from the outline: merge flags (C numbers) mark places where two documents disagree or a call was made that needs your eye. Open decisions (O numbers) are choices nobody has made yet.</p>${out}</div>`;
  window.scrollTo(0,0);
}


/* documents */
function docBlock(h){return '<div class="doc">'+(h||'')+'</div>'}
function drawWorld(){
  const V=$('#v-world');
  V.innerHTML='<div class="doc"><h2>The world, and the one rule under it</h2>'+
    '<p class="lede">'+esc(D.seasonIntro||'')+'</p>'+
    (D.world&&D.world.html||'')+
    '<h2>The craft rules this season obeys</h2><p class="lede">Eight rules, each taken from a writer you named, and each one checked against every episode.</p>'+
    (D.world&&D.world.craft||'')+
    '</div>';
  window.scrollTo(0,0);
}
function drawLedger(){
  const V=$('#v-ledger');
  const rows=(D.ledger&&D.ledger.rows)||[];
  const list=rows.length?('<h3>Every setup, in one place</h3><table><thead><tr><th>Setup</th><th>Planted</th><th>Paid off</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+
    '</tbody></table>'):'';
  V.innerHTML='<div class="doc"><h2>Setup and payoff ledger</h2>'+
    '<p class="lede">'+rows.length+' setups, and where each one closes. Everything planted is paid off inside the season, except the handful left open on purpose for Season 2.</p>'+
    list+
    (D.ledger&&D.ledger.inherit||'')+
    '</div>';
  window.scrollTo(0,0);
}

/* router */
const cur={v:'season',ep:1};
function readHash(){try{return decodeURIComponent((location.hash||'').slice(1))}catch(e){return ''}}
function go(h){
  try{if(readHash()!==h)history.pushState(null,'','#'+h)}catch(e){}
  route(h);
}
function route(forced){
  const h=(typeof forced==='string'&&forced)||readHash()||store.get('hash')||'season';
  let m;
  ['season','episode','characters','notes','world','ledger'].forEach(v=>$('#v-'+v).hidden=true);
  if((m=h.match(/^ep(\d+)(?:\/s(\d+))?$/))){cur.v='episode';const n=Math.min(10,Math.max(1,+m[1]));if(n!==cur.ep)charFilter='';cur.ep=n;$('#v-episode').hidden=false;drawEpisode(n,m[2]?+m[2]:null)}
  else if((m=h.match(/^characters(?:\/(\w+))?$/))){cur.v='characters';$('#v-characters').hidden=false;drawCharacters(m[1])}
  else if(h==='notes'){cur.v='notes';$('#v-notes').hidden=false;drawNotes()}
  else if(h==='world'){cur.v='world';$('#v-world').hidden=false;drawWorld()}
  else if(h==='ledger'){cur.v='ledger';$('#v-ledger').hidden=false;drawLedger()}
  else {cur.v='season';$('#v-season').hidden=false;drawSeason();window.scrollTo(0,0)}
  $('#legend').hidden=!(cur.v==='season'||cur.v==='episode');
  $$('nav.tabs a').forEach(a=>{const on=a.dataset.v===cur.v;on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');if(a.dataset.v==='episode')a.href='#ep'+cur.ep});
  store.set('hash',h);
  applyFilters();
}
window.addEventListener('popstate',()=>route());
window.addEventListener('hashchange',()=>{if(readHash()!==store.get('hash'))route()});
/* every in-page link goes through go(), so navigation works even where the address bar can't change (previews, sandboxed frames) */
document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a||ev.defaultPrevented||ev.metaKey||ev.ctrlKey)return;ev.preventDefault();go(a.getAttribute('href').slice(1))});
$('#q').addEventListener('input',ev=>{query=ev.target.value.trim().toLowerCase();if(query&&cur.v!=='episode'&&cur.v!=='season'){go('ep'+cur.ep)}applyFilters()});
document.addEventListener('keydown',ev=>{if(cur.v!=='episode'||ev.target.closest('input,select,textarea'))return;if(ev.key==='ArrowRight'&&cur.ep<10)go('ep'+(cur.ep+1));if(ev.key==='ArrowLeft'&&cur.ep>1)go('ep'+(cur.ep-1))});
route();
})();
</script>
</body>
</html>
