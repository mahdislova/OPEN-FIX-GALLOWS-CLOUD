other. Let me be something on purpose.\" Cole: \"Sir, no.\"","loc":"The core floor","when":"Alice smashes the Heartglass with her gauntlet, *KSSHHH*, and drags the Lost One out, half turned to crystal.","th":"harding","also":["sisters","guard"],"ch":["alice","lostone","josephine","nathaniel","nixon","tamara","cole"],"turn":"","w":456,"ed":"","fl":[],"html":"<p>Alice smashes the Heartglass with her gauntlet, *KSSHHH*, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs for her son and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better. Nathaniel steps between them: \"Mother.\" Then Nixon comes down the stair bleeding, with Tamara behind him. \"I'm Harding blood. Take me. They grew me for this the way they grew my mother. Let me be something on purpose.\" Cole: \"Sir, no.\"</p>"},{"oref":"Scene 4","id":232,"seq":4,"title":"The core floor","added":false,"act":"Act One","kind":"scene","sum":"Alice smashes the Heartglass with her gauntlet, *KSSHHH*, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs for her son and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better. Nathaniel steps between them: \"Mother.\" Then Nixon comes down the stair bleeding, with Tamara behind him. \"I'm Harding blood. Take me. They grew me for this the way they grew my mother. Let me be something on purpose.\" Cole: \"Sir, no.\"","loc":"The core floor","when":"Alice smashes the Heartglass with her gauntlet, *KSSHHH*, and drags the Lost One out, half turned to crystal.","th":"harding","also":["sisters","guard"],"ch":["alice","lostone","josephine","nathaniel","nixon","tamara","cole"],"turn":"","w":456,"ed":"","fl":[],"html":"<p>Alice smashes the Heartglass with her gauntlet, *KSSHHH*, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs for her son and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better. Nathaniel steps between them: \"Mother.\" Then Nixon comes down the stair bleeding, with Tamara behind him. \"I'm Harding blood. Take me. They grew me for this the way they grew my mother. Let me be something on purpose.\" Cole: \"Sir, no.\"</p>"},{"oref":"Scene 5","id":197,"seq":5,"title":"The lock","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years. Nathaniel pulls, and it doesn't move. *Krrk.* His hands slip on it. Alice is beside him before he asks, and the gauntlet he built for her in the glasshouse, strap by strap, is already whining up to overload, *eeeeeeee*, the way he told her never to run it. He knows what she's about to do. \"If this works, every light in London goes out. They'll hate me for a hundred years.\" \"Us,\" she says, and puts the gauntlet's core against the iron. The heat comes back through the plate into her palm and she holds it there, the smell of her own glove burning, until the ice round the blade lets go. He pulls it free, cuts his palm on it, and presses his blood and his father's wolf ring into the iron, knowing what the lead says it costs: one of his house, before dawn, given and not taken. His father's warning is in his ear: *hoping*. He can't swear his brother isn't part of why his hand is steady. Harding blood closed it, and Harding blood opens it, but it took an undercity girl's burned hand to get the blade out. Somewhere above, a church bell strikes twelve.","loc":"The lock","when":"Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years.","th":"white","also":["harding"],"ch":["nathaniel","alice"],"turn":"","w":805,"ed":"","fl":[],"html":"<p>Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years. Nathaniel pulls, and it doesn't move. *Krrk.* His hands slip on it. Alice is beside him before he asks, and the gauntlet he built for her in the glasshouse, strap by strap, is already whining up to overload, *eeeeeeee*, the way he told her never to run it. He knows what she's about to do. \"If this works, every light in London goes out. They'll hate me for a hundred years.\" \"Us,\" she says, and puts the gauntlet's core against the iron. The heat comes back through the plate into her palm and she holds it there, the smell of her own glove burning, until the ice round the blade lets go. He pulls it free, cuts his palm on it, and presses his blood and his father's wolf ring into the iron, knowing what the lead says it costs: one of his house, before dawn, given and not taken. His father's warning is in his ear: *hoping*. He can't swear his brother isn't part of why his hand is steady. Harding blood closed it, and Harding blood opens it, but it took an undercity girl's burned hand to get the blade out. Somewhere above, a church bell strikes twelve.</p>"},{"oref":"Scene 6","id":198,"seq":6,"title":"London","added":false,"act":"Act One","kind":"scene","sum":"The chain falls. The last time London went dark, the light came back within the hour. This time the green dies street by street, the same wave as the pilot, and nothing comes back. One wordless shot after another: a tram dying in the snow, a hospital ward going black, a mother on Gin Lane lighting a tallow candle with shaking hands.","loc":"London","when":"The chain falls.","th":"city","also":["white"],"ch":[],"turn":"","w":241,"ed":"","fl":[],"html":"<p>The chain falls. The last time London went dark, the light came back within the hour. This time the green dies street by street, the same wave as the pilot, and nothing comes back. One wordless shot after another: a tram dying in the snow, a hospital ward going black, a mother on Gin Lane lighting a tallow candle with shaking hands.</p>"},{"oref":"Scene 7","id":199,"seq":7,"title":"The core","added":false,"act":"Act Two","kind":"scene","sum":"Morgana rises out of the pit as her wounds close, nine feet tall. She looks down at Nathaniel: \"A Harding opened it.\" She doesn't thank him. The White pours through behind her, with wind, snow and wolves, and she goes up through the Works roof toward Tyburn hill.","loc":"The core","when":"Morgana rises out of the pit as her wounds close, nine feet tall.","th":"white","also":["city"],"ch":["morgana","nathaniel"],"turn":"","w":205,"ed":"","fl":[],"html":"<p>Morgana rises out of the pit as her wounds close, nine feet tall. She looks down at Nathaniel: \"A Harding opened it.\" She doesn't thank him. The White pours through behind her, with wind, snow and wolves, and she goes up through the Works roof toward Tyburn hill.</p>"},{"oref":"Scene 8","id":200,"seq":8,"title":"The Works vault","added":false,"act":"Act Two","kind":"scene","sum":"Lambrick is stuffing the last gallowglass into satchels; it's the most valuable thing left on earth. Tamara finds him and offers her hand: \"Come out, Father.\" He holds up a satchel to her, almost pleading: \"This is for you. All of it. It was always for you.\" \"Then leave it.\" He looks at the crystals. He looks at her. He can't put them down; he never could. She walks out. Behind her the wolves come into the vault.","loc":"The Works vault","when":"Lambrick is stuffing the last gallowglass into satchels; it's the most valuable thing left on earth.","th":"lambrick","also":[],"ch":["lambrick","tamara"],"turn":"","w":283,"ed":"","fl":[],"html":"<p>Lambrick is stuffing the last gallowglass into satchels; it's the most valuable thing left on earth. Tamara finds him and offers her hand: \"Come out, Father.\" He holds up a satchel to her, almost pleading: \"This is for you. All of it. It was always for you.\" \"Then leave it.\" He looks at the crystals. He looks at her. He can't put them down; he never could. She walks out. Behind her the wolves come into the vault.</p>"},{"oref":"Scene 9","id":201,"seq":9,"title":"The core stair","added":false,"act":"Act Two","kind":"scene","sum":"Nixon against Ajax: quench-blade against Black Gauntlet. Nixon takes the quick-takedown: blade into the gauntlet's crystal, which freezes the piston, then into Ajax. He dies frozen mid-laugh, his apple rolling down the stairs.","loc":"The core stair","when":"Nixon against Ajax: quench-blade against Black Gauntlet.","th":"guard","also":[],"ch":["nixon","ajax"],"turn":"","w":166,"ed":"","fl":[],"html":"<p>Nixon against Ajax: quench-blade against Black Gauntlet. Nixon takes the quick-takedown: blade into the gauntlet's crystal, which freezes the piston, then into Ajax. He dies frozen mid-laugh, his apple rolling down the stairs.</p>"},{"oref":"Scene 10","id":202,"seq":10,"title":"London, the longest night","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. The Vykra hold Gin Lane with knives and candles. Alice holds the lane with the Lost One wrapped in coats in a doorway behind her, and between wolves she grabs the tea-girl from Covent Garden, the one with the knot in her glove. \"Go to the Works. Find out if he's alive. Don't tell him I asked.\" The girl goes. Alice is three steps after her before she knows she's moving; behind her a child starts to scream, *aaaAAH*, and she turns back to her knife. Every time a flash lights the sky over Tyburn, she looks. Tamara throws open every Lambrick coal depot free to the city, and there are fires in every street. Whimsy in the dark: Cole teaches a crowd of children to make flash-shadow rabbits on the walls.","loc":"London","when":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements.","th":"city","also":["guard"],"ch":["nixon","tamara","cole","nathaniel"],"turn":"","w":554,"ed":"","fl":[],"html":"<p>Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. The Vykra hold Gin Lane with knives and candles. Alice holds the lane with the Lost One wrapped in coats in a doorway behind her, and between wolves she grabs the tea-girl from Covent Garden, the one with the knot in her glove. \"Go to the Works. Find out if he's alive. Don't tell him I asked.\" The girl goes. Alice is three steps after her before she knows she's moving; behind her a child starts to scream, *aaaAAH*, and she turns back to her knife. Every time a flash lights the sky over Tyburn, she looks. Tamara throws open every Lambrick coal depot free to the city, and there are fires in every street. Whimsy in the dark: Cole teaches a crowd of children to make flash-shadow rabbits on the walls.</p>"},{"oref":"Scene 11","id":203,"seq":11,"title":"Blackfriars Bridge","added":false,"act":"Act Two","kind":"scene","sum":"The charges run out along Cole's line. He holds it with his last cartridge, two fingers short and seventeen years old, until it's empty. Nixon finds him in the last dark before dawn, sitting up against the parapet as if he were resting, his diary open in his lap to the burned log page.","loc":"Blackfriars Bridge","when":"The charges run out along Cole's line.","th":"guard","also":["city"],"ch":["cole","nixon"],"turn":"","w":220,"ed":"","fl":[],"html":"<p>The charges run out along Cole's line. He holds it with his last cartridge, two fingers short and seventeen years old, until it's empty. Nixon finds him in the last dark before dawn, sitting up against the parapet as if he were resting, his diary open in his lap to the burned log page.</p>"},{"oref":"Scene 12","id":204,"seq":12,"title":"The core, empty","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel and Josephine alone, the hooks hanging empty. He tells her about the coffin: slag from the vats, no body, and the word *cold*. She wept over that box for a week, and her husband let her. \"Dead is dead, Nathaniel. I've made enough dead to know.\" She doesn't believe it, and she says it anyway. Then: \"I'd do it all again.\" \"I know. That's why I can't be you.\" At the foot of the stair she stops. \"I paid for that girl.\" \"You paid for a week, Mother. You couldn't afford the rest.\" Josephine almost smiles. It's the first thing about her son she has ever failed to buy. Boots on the stair: the tea-girl, bleeding from the scalp. \"Gin Lane's holding. Just. She said not to tell you she asked.\" Nathaniel is at the stair before she has finished. And Josephine, who has controlled every door in his life, says: \"Go to her.\" It's so unlike her that he stops with his hand on the rail and looks at her, really looks, and sees a woman who has already decided something. \"Not until you tell me where you're going.\" She won't. So he stays, and doesn't go to the girl he loves, because he's watching his mother the way she taught him to watch everyone. He's still watching when she starts up the hill.","loc":"The core","when":"Nathaniel and Josephine alone, the hooks hanging empty.","th":"harding","also":[],"ch":["nathaniel","josephine","jamie","alice"],"turn":"","w":1653,"ed":"","fl":[],"html":"<p>Nathaniel and Josephine alone, the hooks hanging empty. He tells her about the coffin: slag from the vats, no body, and the word *cold*. She wept over that box for a week, and her husband let her. \"Dead is dead, Nathaniel. I've made enough dead to know.\" She doesn't believe it, and she says it anyway. Then: \"I'd do it all again.\" \"I know. That's why I can't be you.\" At the foot of the stair she stops. \"I paid for that girl.\" \"You paid for a week, Mother. You couldn't afford the rest.\" Josephine almost smiles. It's the first thing about her son she has ever failed to buy. Boots on the stair: the tea-girl, bleeding from the scalp. \"Gin Lane's holding. Just. She said not to tell you she asked.\" Nathaniel is at the stair before she has finished. And Josephine, who has controlled every door in his life, says: \"Go to her.\" It's so unlike her that he stops with his hand on the rail and looks at her, really looks, and sees a woman who has already decided something. \"Not until you tell me where you're going.\" She won't. So he stays, and doesn't go to the girl he loves, because he's watching his mother the way she taught him to watch everyone. He's still watching when she starts up the hill.</p>"},{"oref":"Scene 13","id":205,"seq":13,"title":"Tyburn hill, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Morgana stands over London in the storm, with wolves in a ring around her. Four hundred years of grievance. Josephine climbs, and Nathaniel climbs after her. From the Gin Lane side, Alice comes up the hill carrying the Lost One. Across the snow they see each other for the first time since the lock, alive, and there's no time for any of it.","loc":"Tyburn hill","when":"Morgana stands over London in the storm, with wolves in a ring around her.","th":"white","also":["harding"],"ch":["morgana","nathaniel","alice","lostone","josephine"],"turn":"","w":281,"ed":"","fl":[],"html":"<p>Morgana stands over London in the storm, with wolves in a ring around her. Four hundred years of grievance. Josephine climbs, and Nathaniel climbs after her. From the Gin Lane side, Alice comes up the hill carrying the Lost One. Across the snow they see each other for the first time since the lock, alive, and there's no time for any of it.</p>"},{"oref":"Scene 14","id":206,"seq":14,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\" Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar.","loc":"Tyburn hill","when":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood.","th":"white","also":["sisters"],"ch":["lostone","alice","morgana"],"turn":"","w":446,"ed":"","fl":[],"html":"<p>The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\" Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar.</p>"},{"oref":"Scene 15","id":233,"seq":15,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\" Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar.","loc":"Tyburn hill","when":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood.","th":"white","also":["sisters"],"ch":["lostone","alice","morgana"],"turn":"","w":446,"ed":"","fl":[],"html":"<p>The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\" Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar.</p>"},{"oref":"Scene 16","id":231,"seq":16,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One tells her the last thing: \"On the bridge she was still alive. She asked me something. 'Go back to Ali. Stand in front of her. I never did.' I said yes. Then I wanted to.\" Miriam's last thought was Alice, after all, and her last act was to find someone braver to keep the promise she broke. Alice laughs and cries at once: her sister did love her. She just couldn't do it herself. The Lost One stays. Morgana, who tore her own hooks rather than let her daughter pay, lets her stay, which is harder. Then she names the price the lead has carried for four hundred years: \"A Harding chained me. A Harding comes with me.\" Given, not taken. Nathaniel steps forward, and Alice steps in front of him, into the place nobody ever stood for her, her fist in his coat. Her first word to him all night: \"Don't.\"","loc":"Tyburn hill","when":"The Lost One tells her the last thing: \"On the bridge she was still alive.","th":"white","also":["sisters"],"ch":["lostone","alice","morgana"],"turn":"","w":446,"ed":"","fl":[],"html":"<p>The Lost One tells her the last thing: \"On the bridge she was still alive. She asked me something. 'Go back to Ali. Stand in front of her. I never did.' I said yes. Then I wanted to.\" Miriam's last thought was Alice, after all, and her last act was to find someone braver to keep the promise she broke. Alice laughs and cries at once: her sister did love her. She just couldn't do it herself. The Lost One stays. Morgana, who tore her own hooks rather than let her daughter pay, lets her stay, which is harder. Then she names the price the lead has carried for four hundred years: \"A Harding chained me. A Harding comes with me.\" Given, not taken. Nathaniel steps forward, and Alice steps in front of him, into the place nobody ever stood for her, her fist in his coat. Her first word to him all night: \"Don't.\"</p>"},{"oref":"Scene 17","id":209,"seq":17,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her. Then, to her son: \"I'm a Harding. I chose the name. I swore on that lead with my eyes shut.\" He catches his mother's wrist. Alice is still in front of him, her fist still in his coat. Two women holding him, one from each side of his life, and both of them are right. The wolves shift their weight in the snow. Josephine, quietly, the only time all season she asks him for anything: \"They'll say I died of fever in Switzerland.\" Nathaniel: \"No. They'll say your name.\" A long beat. His hand opens. \"Go.\" She kisses his forehead. To Alice: \"Keep him out of the Works.\" It's the contract she paid for in Episode 2, now given as a blessing. She takes Morgana's hand and they walk into the white. The wolves follow, and the storm goes with them. *Why this isn't Otty again:* Otty went willingly too, and his grandfather let her. The difference between Nathaniel and every Harding before him isn't the choice. It's the lie. Otty got a brass plate that said DIED ABROAD. Josephine gets the record (scenes 19 and 20).","loc":"Tyburn hill","when":"Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her.","th":"white","also":["harding"],"ch":["josephine","nathaniel","alice","morgana"],"turn":"","w":677,"ed":"","fl":[],"html":"<p>Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her. Then, to her son: \"I'm a Harding. I chose the name. I swore on that lead with my eyes shut.\" He catches his mother's wrist. Alice is still in front of him, her fist still in his coat. Two women holding him, one from each side of his life, and both of them are right. The wolves shift their weight in the snow. Josephine, quietly, the only time all season she asks him for anything: \"They'll say I died of fever in Switzerland.\" Nathaniel: \"No. They'll say your name.\" A long beat. His hand opens. \"Go.\" She kisses his forehead. To Alice: \"Keep him out of the Works.\" It's the contract she paid for in Episode 2, now given as a blessing. She takes Morgana's hand and they walk into the white. The wolves follow, and the storm goes with them. *Why this isn't Otty again:* Otty went willingly too, and his grandfather let her. The difference between Nathaniel and every Harding before him isn't the choice. It's the lie. Otty got a brass plate that said DIED ABROAD. Josephine gets the record (scenes 19 and 20).</p>"},{"oref":"Scene 18","id":213,"seq":18,"title":"Tyburn hill, dawn","added":true,"act":"Act Three","kind":"scene","sum":"The snow stops in the middle of falling. Nathaniel is on his knees where his mother was, and for a long time nothing happens. Alice doesn't touch him. She kneels in front of him in the snow and lets him have it, because nobody ever let her. When it comes it isn't crying. It's a sound with no word in it, *hhh, hhh*, a man trying to breathe around something too big for his chest. She stays where he can see her until it passes. Then she takes the handkerchief out of her glove, the one he gave her at his brother's grave, and tears it in two. *Rrrip.* Half goes round the palm he cut at the lock. He takes the other half out of her fingers without asking and binds the hand she burned for him. Neither of them is any good at it. She doesn't know what to say to a man who has just said \"Go\" to his mother, so she gives him the most private thing she owns. Under her breath, the way Miriam taught her under the bed, she counts for him. \"One post. Two post.\" He knows it. He heard it in a ballroom corridor five weeks ago and never asked. He counts with her. At eight she stops, because eight is where it has always ended. He keeps going. \"Nine.\" Nobody told him about nine. He got there on his own. And then, for the first time in ten episodes, he says her name. \"Alice.\" She hears it. He has never once said it, and she knows which bill he read it on. He's saying it now, when nobody has paid for it. He kisses her, or she kisses him; for the rest of their lives they will disagree about which.","loc":"Tyburn hill","when":"The snow stops in the middle of falling.","th":"sisters","also":["harding"],"ch":["nathaniel","alice"],"turn":"","w":1140,"ed":"","fl":[],"html":"<p>The snow stops in the middle of falling. Nathaniel is on his knees where his mother was, and for a long time nothing happens. Alice doesn't touch him. She kneels in front of him in the snow and lets him have it, because nobody ever let her. When it comes it isn't crying. It's a sound with no word in it, *hhh, hhh*, a man trying to breathe around something too big for his chest. She stays where he can see her until it passes. Then she takes the handkerchief out of her glove, the one he gave her at his brother's grave, and tears it in two. *Rrrip.* Half goes round the palm he cut at the lock. He takes the other half out of her fingers without asking and binds the hand she burned for him. Neither of them is any good at it. She doesn't know what to say to a man who has just said \"Go\" to his mother, so she gives him the most private thing she owns. Under her breath, the way Miriam taught her under the bed, she counts for him. \"One post. Two post.\" He knows it. He heard it in a ballroom corridor five weeks ago and never asked. He counts with her. At eight she stops, because eight is where it has always ended. He keeps going. \"Nine.\" Nobody told him about nine. He got there on his own. And then, for the first time in ten episodes, he says her name. \"Alice.\" She hears it. He has never once said it, and she knows which bill he read it on. He's saying it now, when nobody has paid for it. He kisses her, or she kisses him; for the rest of their lives they will disagree about which.</p>"},{"oref":"Scene 19","id":210,"seq":19,"title":"Westminster, first light","added":false,"act":"Act Three","kind":"scene","sum":"The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires. Vane names Nathaniel \"the man who put out London\" and signs a warrant. Tamara, Lady Harding and heir to Lambrick, puts the Heartglass folio on his desk, with the Crown's seal on the binding order. Nixon lays Cole's diary beside it, taken from the dead boy's lap: the burned discharge-log page copied word for word, and under it, in a seventeen-year-old's careful hand, *2 Nov. Capt. hit him in the shoulder. Mr Harding sent the Capt. to the gate. The man on the floor was still talking.* It puts Nixon's shot on the record, and the man who stayed behind with a living boy. Nixon could burn that page a second time. He sets it down open. Vane slides a captain's lantern across the desk to Nixon, the price of his silence. Nixon leaves it there: \"The Guard will keep its own flame.\" Vane, cornered, offers Nathaniel the pardon on one condition: the Crown seals what happened under Tyburn, for the public good. Nathaniel: \"No. Write it down.\" Vane: \"The Crown doesn't keep that kind of record.\" \"Then start.\" Nathaniel turns to the clerk, and the clerk dips his pen. \"Edric Harding—\"","loc":"Westminster","when":"The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires.","th":"city","also":["harding"],"ch":["vane","tamara","nixon","nathaniel","cole","eldgard"],"turn":"","w":639,"ed":"","fl":[],"html":"<p>The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires. Vane names Nathaniel \"the man who put out London\" and signs a warrant. Tamara, Lady Harding and heir to Lambrick, puts the Heartglass folio on his desk, with the Crown's seal on the binding order. Nixon lays Cole's diary beside it, taken from the dead boy's lap: the burned discharge-log page copied word for word, and under it, in a seventeen-year-old's careful hand, *2 Nov. Capt. hit him in the shoulder. Mr Harding sent the Capt. to the gate. The man on the floor was still talking.* It puts Nixon's shot on the record, and the man who stayed behind with a living boy. Nixon could burn that page a second time. He sets it down open. Vane slides a captain's lantern across the desk to Nixon, the price of his silence. Nixon leaves it there: \"The Guard will keep its own flame.\" Vane, cornered, offers Nathaniel the pardon on one condition: the Crown seals what happened under Tyburn, for the public good. Nathaniel: \"No. Write it down.\" Vane: \"The Crown doesn't keep that kind of record.\" \"Then start.\" Nathaniel turns to the clerk, and the clerk dips his pen. \"Edric Harding—\"</p>"},{"oref":"Scene 20","id":211,"seq":20,"title":"The Record, final montage","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel's dictation carries over everything that follows. It starts as testimony, read flat and exact like a ledger, and somewhere in the middle it stops being for the clerk. No score until line 7, then the Lantern Hymn, the tune only, the way Morgana sang it. Every image is a climax from the season, seen the morning after.","loc":"The Record","when":"Nathaniel's dictation carries over everything that follows.","th":"city","also":["harding","sisters"],"ch":["nathaniel","alice","lostone","nixon","tamara","marsh","morgana","josephine","grise"],"turn":"","w":900,"ed":"","fl":[],"html":"<p>Nathaniel's dictation carries over everything that follows. It starts as testimony, read flat and exact like a ledger, and somewhere in the middle it stops being for the clerk. No score until line 7, then the Lantern Hymn, the tune only, the way Morgana sang it. Every image is a climax from the season, seen the morning after.</p>\n<table>\n<thead><tr><th>Nathaniel (V.O.)</th><th>On screen</th></tr></thead>\n<tbody><tr><td>\"Edric Harding. Nine years old. The year of our Lord fourteen hundred and eighty-nine. He carried the lantern down the stair himself, because his father asked him to.\"</td><td><strong>The Works, dead.</strong> Snow falls through the broken roof onto empty iron hooks. The channels where her blood ran into London are dry and grey.</td></tr><tr><td>\"The Hargraves of the Orchard. Their names are scratched on a wall under Tyburn. I will read every one of them, if the clerk has ink.\"</td><td><strong>The Orchard.</strong> Old Marsh holds the candle and reads the names off the wall, perfectly lucid now. Nixon writes them into Cole's diary. His thumb stops on MARIAN.</td></tr><tr><td>\"Ottoline Harding. Nineteen. Eighteen thirty-nine. She did not die abroad.\"</td><td><strong>St Bride's.</strong> A mason's chisel takes DIED ABROAD off a brass plate, one letter at a time. Byron's blue ribbon is tied through the bracket.</td></tr><tr><td>\"James Harding. My brother. He tried to end it, and we said he was ill. We buried a coffin of slag and called it him. There was no body. I don't know where he is.\"</td><td><strong>The long gallery.</strong> Jamie's portrait, laughing at something outside the frame.</td></tr><tr><td>\"Inspector Felix Hawke, of Scotland Yard. He stood up in front of the Crown to say that someone had made the Frost Killer, and he was poisoned on the stand for it. My mother did it, for me. London blamed a frightened girl.\"</td><td><strong>Scotland Yard.</strong> Felix's sling still hangs on his chair. A constable takes the FROST KILLER bills down off the wall, one by one.</td></tr><tr><td>\"Josephine Harding. My mother. She walked into the White on the longest night so the debt would end. She will have no brass that lies.\"</td><td><strong>The music room.</strong> The piano lid closed. On it, a Vykra knife and a pair of gloves with the knot stitched inside.</td></tr><tr><td>\"For four hundred years this city was warm because somebody was cold. We called it light. We called it progress. We wrote a hymn over her crying so we'd never have to hear it.\"</td><td><strong>Gin Lane.</strong> The mother from the night before lights a second tallow candle off her first and passes it through a broken pane to her neighbour. Window to window, the flame travels down the lane.</td></tr><tr><td>\"Every one of us lived on it. Most of us never knew the price. Some of us knew, and kept the lamps lit anyway.\"</td><td><strong>The Works vault.</strong> A satchel half-buried in a drift, Lambrick's glove still on the strap. The crystals spilling out of it have gone dull as river stones.</td></tr><tr><td>\"I can't give you the light back. I won't. What I can give you is the bill, and the names of the people who paid it.\"</td><td><strong>A Lambrick depot, gates thrown open.</strong> Tamara, in her father's greatcoat over a ruined wedding dress, signs the ledger as heir while the coal goes out to the queue for nothing. She looks up from the book, and she's the one deciding now.</td></tr><tr><td>\"So write them down. Keep them where your children can read them. And the next time somebody offers you a light that never goes out, ask who is paying for it.\"</td><td><strong>The Guard tower roof.</strong> Forty Lanterns with no lanterns. Nixon hangs Cole's battered Wick lamp on the rail and lights it with a match, a plain candle-flame, nothing else. Tamara steps out onto the roof. She doesn't take his hand. She stands beside him, close enough that it doesn't matter.</td></tr><tr><td>\"We will be cold for a while. We'll build something that doesn't need a girl in chains or a boy on the stair. It may be worse. It will be ours.\"</td><td><strong>The Shadwell laundry.</strong> Alice stitches a new knot inside her own glove, a pattern nobody taught her. Mother Grise, without being asked, pours her a cup of tea.</td></tr><tr><td>\"That is the record. Let it stand.\"</td><td><strong>Harding House, cold and dark.</strong> Nathaniel drops the wolf-crest ring into the dead grate. Alice sets Jamie's ring, the one from Miriam's cord, on the mantel beside it. His bound hand comes to rest over her bound hand: two halves of one handkerchief. There is no inch between them now.</td></tr><tr><td>*(The hymn ends. Silence. Then, very faint, a heartbeat.)*</td><td><strong>Gin Lane, morning.</strong> The Lost One, warm for the first time, sneezes, astonished. Then she's sick in a basin, exactly like Miriam in Episode 7's cold open. Alice laughs, then stops, and puts her hand on her sister's belly. The heartbeat swells under everything. The cold that held Miriam frozen has gone out of her, and what it was holding has started again. Jamie's child. The Lost One: \"Is that me?\" Alice: \"No. That's someone else.\"</td></tr></tbody>\n</table>\n<p><strong>Final scene</strong></p>"},{"oref":"Scene 21","id":212,"seq":21,"title":"The White","added":false,"act":"Final scene","kind":"scene","sum":"Hard cut on the heartbeat. Wind, and nothing else. Endless snow. Josephine walks beside Morgana through the drifts, where the chain's dead went, and stops. A man is standing in the snow with frost in his hair and his breath smoking. He's breathing. JAMIE HARDING turns, and he doesn't understand what he's seeing. \"Mother?\" Josephine's face: four hundred years of Harding grief, and for one second, joy. Far behind him, small in the white, a boy of nine holds up a lantern that has been burning for four hundred years. Cut to black. The card that opened every episode comes up one last time. It doesn't count down. **DAY ONE.**","loc":"The White","when":"Hard cut on the heartbeat.","th":"white","also":["harding"],"ch":["josephine","morgana","jamie"],"turn":"","w":366,"ed":"","fl":[],"html":"<p>Hard cut on the heartbeat. Wind, and nothing else. Endless snow. Josephine walks beside Morgana through the drifts, where the chain's dead went, and stops. A man is standing in the snow with frost in his hair and his breath smoking. He's breathing. JAMIE HARDING turns, and he doesn't understand what he's seeing. \"Mother?\" Josephine's face: four hundred years of Harding grief, and for one second, joy. Far behind him, small in the white, a boy of nine holds up a lantern that has been burning for four hundred years. Cut to black. The card that opened every episode comes up one last time. It doesn't count down. <strong>DAY ONE.</strong></p>"}]}],"threads":[["harding","The Harding House","Eldgard, Josephine, Byron, Jamie and Nathaniel: the Works, the pact, the Tithe, and the family that keeps it."],["sisters","The Sisters","Alice and Miriam, then the Lost One: Gin Lane, the Vykra, the counting game, and the apology nobody ever gave."],["investigation","Nathaniel’s Investigation","Nathaniel digging into his brother’s death, the chain under the Works, and the Heartglass he builds to hold it."],["guard","The Lantern Guard","Nixon, the corps, the Orchard, the Hargrave blood, and the mutiny that tears the Guard in two."],["lambrick","House Lambrick","Lambrick, Ajax, coal and Tamara: the light war, the ciphers, and a wedding used as a weapon."],["vykra","The Vykra","Mother Grise, the Shadwell laundry, winter’s kiss, and the contracts that put a knife in every room."],["city","The City and the Crown","Vane, Parliament, the Charter, the cold streets, and a London that pays for its light."],["white","The White","Morgana, the chain, the wolves, the frost and 1489: the thing the city is built on."]],"chars":[["nathaniel","Nathaniel Harding"],["alice","Alice Bounds"],["lostone","The Lost One"],["nixon","Nixon Hargrave"],["tamara","Tamara Lambrick"],["cole","Cole Pruett"],["eldgard","Eldgard Harding"],["josephine","Josephine Harding"],["byron","Byron"],["lambrick","Lord Hector Lambrick"],["ajax","Ajax Fink"],["grise","Mother Grise"],["felix","Inspector Felix Hawke"],["vane","Lord Chancellor Vane"],["morgana","Morgana"],["jamie","Jamie Harding"],["miriam","Miriam Bounds"],["wren","Old Wren"],["marsh","Tobias Marsh"],["alistair","Alistair Harding"],["otty","Ottoline “Otty” Harding"]],"arcs":{"nathaniel":{"1":{"line":"Demonstrates his leap-gauntlet, is told \"toys after supper\" at his own engagement, hears weeping in the walls during the blackout and finds the lamp-girl by her match (she hears nothing, and leaves with his schematic), then breaks down in the stables: his brother is dead.","state":"grieving, kept in the dark"},"2":{"line":"Refused the coffin, he forces the core level and finds a spent Guard cartridge, then hands the case to Nixon: the man who fired it.","state":"hunting, betrayed unknowingly"},"3":{"line":"Given his first real job re-equipping the Guard, he builds leap-rigs, recognises Alice's ghostlight, and learns her secret at the tunnel.","state":"armed the hunt, knows"},"4":{"line":"Ambushes Ajax with Alice at the coal docks, hears that Jamie paid him double, drops him into the Thames, and accepts his father's post-hearing promise.","state":"deceived, still hunting"},"5":{"line":"Descends into the core with Alice and Tamara, touches the chain, learns he is the next Tithe, hears Morgana say Jamie is cold, not dead, and stays when Nixon seals the door.","state":"chooses his father"},"6":{"line":"Builds the Heartglass with his father, kisses Alice at the frozen canal when her glove gives up the handkerchief she kept, runs into the rigged tunnel, and hears Byron name his mother as Hawke's killer.","state":"knows the killer"},"7":{"line":"Learns from Nixon that Jamie was alive when he left, fights beside him at the Pavilion anyway, opens Jamie's coffin at dawn and finds slag, throws it on his father's bench, then rehearses the vows with Alice.","state":"Nearly married"},"8":{"line":"Learns Alice's first name from his mother's receipt, a bill. Sees her above the grille, takes her nod, and marries Tamara to stop her father committing her, sealing Alice's sister below. Reads *si mater sinat*.","state":"Married and lied to"},"9":{"line":"Has the whole fight with Alice and follows her plan, breaks Eldgard out of Newgate, watches Ajax, the man he let drop, kill his father, and holds him through the Snow Confession.","state":"Fatherless, determined"},"10":{"line":"Opens the lock with his blood and Alice's burned hand, stays with his mother instead of going to Alice, lets his mother go, and at dawn on Tyburn hill counts to nine with Alice and says her name for the first time. Then dictates the true record.","state":"Most hated man, and hers"}},"alice":{"1":{"line":"Runs glim, takes Mother Grise's first Vykra contract, tails Miriam to Jamie, works the ball as a lamp-girl and lifts the Harding son's gauntlet schematic by matchlight in the blackout, then finds her sister frozen and identifies the body.","state":"sister's eyes opened"},"2":{"line":"Follows Miriam's frost trail, talks the creature down with the counting game, takes her to Wren and believes the miracle, then breaks into Jamie's bedroom, where she hides with Nathaniel in Jamie's wardrobe and keeps her hand over his mouth too long.","state":"lying and grieving"},"3":{"line":"Moves the Lost One through the crystal market, watches four die, hides her under the Works, and tells Nathaniel a truth she believes.","state":"cornered, exposed"},"4":{"line":"Hides her sister in the orangery, refuses Grise and is cut from the Vykra, then learns the poison that killed Felix was winter's kiss.","state":"expelled, still guarding"},"5":{"line":"Goes into the Works beside her sister, holds her back from the burning chain, blows the core door, and is left behind when Nathaniel stays.","state":"sister slipping away"},"6":{"line":"Climbs the Works wall and doesn't knock on Nathaniel's happiness, begs Tamara for a route into the core, kisses Nathaniel at the canal, fights Nixon in the tunnel, and hears the Lost One call her 'miss'.","state":"sister forgotten"},"7":{"line":"Finds Miriam's letter, throws the Lost One out, then runs into the wolf attack and chooses her: \"I'm Alice. I'm your sister.\"","state":"Chosen sister"},"8":{"line":"Reads the Pact in the crypt, leaves the Lost One for two minutes, nods Nathaniel past the ring, and watches through the grille as her sister hands her the truth and goes.","state":"Nodded, sister taken"},"9":{"line":"Tells Nathaniel all of it, from the coal bin to \"for nothing\"; challenges Mother Grise and wins on the count of nine; then, with her sister minutes from the lever, stays kneeling at Nathaniel's back while his father dies.","state":"Commands the Vykra"},"10":{"line":"Smashes the Heartglass, burns her hand on the lock so Nathaniel can open it (\"Us.\"), holds Gin Lane and sends a runner she tells not to say who asked, stands in front of him on Tyburn hill, and at dawn hears her name.","state":"Let her go; held him"}},"jamie":{"1":{"line":"Told he begins \"his preparation\" and that he knows what the Tithe is, he slips from the ball, cuts the core lock with a crystal blade, and is shot by Nixon.","state":"shot, bleeding out"},"2":{"line":"Lies in a closed coffin at Harding House; Felix's Newgate slip reveals he visited prisoner 1417 every Sunday for two years.","state":"dead, still asking"},"4":{"line":"Cold open, 2 November: pays Ajax two hundred guineas to cut the outer grid and tells Lambrick that London can freeze honestly.","state":"dead that night"},"9":{"line":"In the cold open, five years old on the Serpentine, he promises his father he'll be brave.","state":"Frozen memory"}},"miriam":{"1":{"line":"Runs glim with Alice, hides a ring on a cord, kisses Jamie on the Blackwood stair, waits on the bridge at midnight, and freezes solid.","state":"frozen, then answering"},"2":{"line":"Her body sits up in the morgue, screams, and runs barefoot into the night; her voice and habits are left inside the thing that wears her.","state":"body emptied, stolen"},"7":{"line":"In the cold open, she scores out \"Ali, about him\", sews the letter into her coat lining, and pulls on the red mittens.","state":"Already gone"}},"lostone":{"1":{"line":"In the cold open the tiny frost girl slips out of the pit while the wolves follow her; at midnight she stands beside Miriam on the bridge and nods.","state":"out, walking free"},"2":{"line":"Kills a cat, copies Miriam's words and habits, calls Alice \"Ali\", draws a chain and whispers \"Mother\", and freezes Felix's hand to the doorframe.","state":"hiding, lying kindly"},"3":{"line":"Peels Alice an orange, shatters the market's crystals and kills four, cries ice, and survives by touching Nathaniel's bare hand without freezing him.","state":"hidden, unravelling"},"4":{"line":"Makes her first snow in the orangery, offers Felix an orange and an apology, and is blamed for a murder she did not commit.","state":"hidden, blamed"},"5":{"line":"Freezes the outfall into a glass road, grabs the burning chain, and lets the cold go until every lamp in London bursts.","state":"resolute, unrepentant"},"6":{"line":"Grabs Nixon's bare wrist without frosting him, smothers flames around four trapped children, then thanks Alice politely, not knowing her name.","state":"forgetting Alice"},"7":{"line":"Admits she isn't Miriam, takes Alice's fury and the door, then commands the wolves and becomes the Frost Witch.","state":"Frost Witch"},"8":{"line":"Lies about the second clause, then pushes the lead sheet through the grille to Alice and lets the Vykra take her, leaving DON'T FOLLOW ME in frost.","state":"Taken willingly"},"9":{"line":"Hangs in the Heartglass as her mother tears against her own hooks to refuse the trade: \"That is why I won't.\"","state":"Cracking the cage"},"10":{"line":"Stands between her mother and the city, sings the hymn in the old tongue, and stays with Alice, mortal and warm.","state":"Mortal, staying"}},"nixon":{"1":{"line":"Made Lantern-Captain at 23, he shoots the masked saboteur in the core, unmasks Jamie, and accepts Eldgard's lie at the gate.","state":"leashed, keeping the lie"},"2":{"line":"Files a false report, tells Cole \"flashes lie\", carries a coffin that weighs wrong, and accepts Nathaniel's cartridge case, becoming the investigator of his own shot.","state":"investigating himself"},"3":{"line":"Given Eldgard's private order to take the frost girl alive, he leads the market sweep but carries Cole to the furnace room instead.","state":"disobeyed, compromised"},"4":{"line":"Puts Cole back on the roster, hears Marsh's Orchard rhyme in Newgate, finds his own rifle in the discharge log, and burns the page as Cole watches.","state":"guilty, watched"},"5":{"line":"Gives Nathaniel the boyhood whistle to turn back, then seals the core door on Eldgard's order and does not look away.","state":"obedient, ashamed"},"6":{"line":"Tells Cole to wait until after the vote, ambushes the tunnel, lets the Lost One go when she names his mother, and carries Cole out of the fire.","state":"owes Cole everything"},"7":{"line":"Wins a medal for carrying Cole out, confesses the shot on the guard tower roof, then learns from Tamara's folder he was a reserve.","state":"Knows he's spare"},"8":{"line":"Refuses Tamara in the vestry because he's on Eldgard's books, hands her the ring properly, refuses Vane's order to fire, walks out with forty Lanterns and the empty ring box, then finds the Orchard.","state":"Mutineer, orphan"},"9":{"line":"Carries Eldgard over Newgate's rooftops, frees Marsh, and hears in one breath that his round didn't kill Jamie.","state":"Forgiven, unmoored"},"10":{"line":"Offers his life as Harding blood, is refused, holds the bridges all night, finds Cole dead at dawn, and puts his own shot on the record with Cole's diary.","state":"Captain by choice"}},"cole":{"1":{"line":"The seventeen-year-old Wick smacks himself in the eye saluting his new captain, then, forgotten on the gantry, sees the man on the floor still talking.","state":"eager, bruised Wick"},"2":{"line":"He tells Nixon he saw the shot go through the man, is told flashes lie, decides to believe him, and writes it in his diary anyway.","state":"cheerful, diary kept"},"3":{"line":"Trained on Nathaniel's new boosters, he fires early and dangles in laundry, then freezes from the hand up and loses two fingers.","state":"maimed, still loyal"},"4":{"line":"Back on duty two fingers short, and secretly copying into his diary the discharge page Nixon burned.","state":"diary copied"},"5":{"line":"Holds a bridge barricade with flash-bursts while the Lantern Night crush kills people against the railings.","state":"holding the line"},"6":{"line":"Shows Nixon his diary and gives him until after the vote, then is carried out of the fire by the man he still believes in.","state":"burned, carried out"},"7":{"line":"Gets his dressings changed while Tamara kisses Nixon, and pretends very hard to be asleep.","state":"Discreet witness"},"8":{"line":"Walks out between the rifle lines at the gates with his hands up, and nobody fires.","state":"Peacemaker"},"9":{"line":"Asks Tamara whether married ladies are allowed to fight, and is handed a knife.","state":"Armed and grinning"},"10":{"line":"Teaches children flash-shadow rabbits, holds Blackfriars Bridge with his last cartridge and dies at his post. His diary puts the truth of 2 November on the record.","state":"Dead at post"}},"eldgard":{"1":{"line":"He tells Jamie his preparation begins after tonight, pins Nixon's lantern, refuses Nathaniel's gauntlet in public, then buries his son at the gate.","state":"buried it, lying"},"2":{"line":"Alone with the chained light he says \"He was mine, and I spent him\", counts forty-seven, and drops his lamp when Morgana raises her head.","state":"face to face"},"3":{"line":"He hands Nathaniel the Guard contract, is told Nixon let the girl go, and answers: \"I know what you did at the core.\"","state":"holding the leash"},"4":{"line":"Calls Jamie melancholy and says he wanted to destroy the house, then baits Nathaniel with the whole work after the hearing.","state":"son baited"},"5":{"line":"Opens the Upper Gallery to Nathaniel, waits in the core to explain the Tithe, and answers \"cold\" with \"She told me my sister was still singing.\"","state":"son at his side"},"6":{"line":"Designs the Heartglass with Nathaniel, orders the girl taken alive for her blood, and loses the Works to a Crown board.","state":"works lost"},"7":{"line":"Diminished without his Works, he tells Nathaniel the Pact is sworn on lead in Alistair's tomb and that the Heartglass is a cage, faced with a fistful of slag from his son's coffin.","state":"Drunk confessor"},"8":{"line":"Gives Nathaniel Jamie's cufflinks, says \"I held his hand\", is arrested at the chapel steps, and warns Josephine in Newgate: *si mater sinat*.","state":"Arrested"},"9":{"line":"Leads the break-out, takes the blow of the man his son let live, owns the slag in Jamie's coffin, and spends his last breath on the whole truth.","state":"Dead in the snow"},"10":{"line":"Only bones and a casket now; the confession he left behind is what lets Nathaniel choose light.","state":"Dead, vindicated"}},"josephine":{"1":{"line":"From the gallery she tells Byron the lamp-girl \"holds her wrist like a knife-girl\", then at grey dawn looks at her husband a beat too long.","state":"silent, keeping history"},"2":{"line":"Veiled, she pays Grise in gold for the contract on her own son and doubles it now Jamie is dead, keeping him out of the Works.","state":"buying her son's safety"},"4":{"line":"Moves the wedding up, reads the witness list, poisons Felix on the stand with winter's kiss, and is seen by Byron washing frost from her hands.","state":"seen by Byron"},"6":{"line":"Cold open, thirty years ago: a Vykra knife-girl Byron spares, who marries the man she was sent to kill. She refuses Byron's needle, then tips Eldgard.","state":"confessed, unrepentant"},"7":{"line":"Runs the table, buys the Works back with Lambrick money, and tells Nathaniel she chose London long ago.","state":"Chose London"},"8":{"line":"Gives Nathaniel Grise's receipt, sells Grise the crypt door and Eldgard to Lambrick, then hears in Newgate: \"You would.\"","state":"Husband sold"},"9":{"line":"Puts on Vykra knives she hasn't touched in thirty years, goes down alone, and bets that nobody in hooks refuses the door. Pulls the lever.","state":"Pulls lever"},"10":{"line":"Watches Morgana refuse the door, learns her son's love was the one thing she couldn't buy, tells him \"Go to her\", tells Morgana \"Not him\", and walks into the White, where Jamie is waiting.","state":"Gone into White"}},"byron":{"1":{"line":"He picks soot from Nathaniel's hair with dry wit, shares one unreadable look with Josephine over the lamp-girl, and says nothing else.","state":"watching, unreadable"},"2":{"line":"He gently moves Nathaniel's hand off the coffin lid with shaking hands, then lets Alice out of the servants' door and only smiles.","state":"seeing everything"},"3":{"line":"\"You notice,\" he tells Nathaniel over the tea, and the ghostlight clue lands: his master is his mother's son.","state":"quiet, prompting"},"4":{"line":"Lies to Josephine about where Nathaniel goes at night, the first lie he has ever told her.","state":"first lie told"},"5":{"line":"Gives Nathaniel Jamie's key on a black ribbon and admits he guarded the core thirty years ago, hearing her every night.","state":"secret half-shared"},"6":{"line":"Follows Nathaniel into the conduit with his old Lantern, takes the beam's weight himself, and dies telling him his mother killed the inspector.","state":"dead, truth told"}},"lambrick":{"1":{"line":"The coal baron arrives at the ball with Tamara and their engagement is announced to the room under the thousand green chandeliers.","state":"alliance sealed"},"2":{"line":"In the coach he tells Tamara the heir is dead so she must marry fast: \"You're a wedding, not a ledger.\"","state":"pushing marriage"},"3":{"line":"Named in his own ledger: Tamara copies six months of payments to A.F. and slips the page to Nathaniel on the ice.","state":"paid the killer"},"4":{"line":"Cold open: promises Jamie that freeing her kills the light and returns London to coal. At the hearing he accuses the Hardings of hiding something under the Works.","state":"attack stalled"},"5":{"line":"Watches the Strand with Ajax's coal-mob, then rides a coal cart through the Westminster Bridge crush: 'Remember who kept you warm!'","state":"exploiting disaster"},"6":{"line":"Says his daughter should have stayed home if she gets in the way, then takes a seat on the Crown board that seizes the Works.","state":"on the board"},"7":{"line":"Tours the Crown's new core, remembers his wife's coal-heated room, and says the girl could be bled faster.","state":"Providing"},"8":{"line":"Calls his daughter unwell and has a lunacy order waiting in the vestry with two Bethlem attendants.","state":"Nearly won"},"9":{"line":"Tells Tamara to bring her husband by midnight if the girl fails, watching from the gallery.","state":"Counting hours"},"10":{"line":"Stuffs the last gallowglass into satchels and cannot put the crystals down, even for her.","state":"Died clutching"}},"tamara":{"1":{"line":"She carries a cipher wheel in her fan and agrees with Nathaniel to be very polite to each other for forty years.","state":"engaged, unsentimental"},"2":{"line":"Told to marry fast, she reads her father's account book upside down and spots \"2 Nov, Works gate, 200 gns, A.F.\"","state":"suspicious, reading"},"3":{"line":"She takes Nathaniel skating, slips him the ledger copy naming Ajax Fink, then finds Ajax on her bed with a warning from her father.","state":"found out, warned"},"4":{"line":"Asks Nixon to protect her, spots a Vykra knot inside the veiled woman's glove, pockets the dropped needle, and offers it to Grise for a place.","state":"new Vykra girl"},"5":{"line":"Solves the Works cipher for Grise, then recodes the inner door by ear while Alice holds her belt over the shaft, becoming Alice's equal and rival.","state":"proven, rival"},"6":{"line":"Overhears her father's conduit charges and his answer about her, then warns Nathaniel in their childhood cipher, the warning that brings him into the blast.","state":"warning backfired"},"7":{"line":"Tours the core on her father's arm, reads Vessel: White-born, gives Nixon his stolen file, and kisses him a week before the wedding.","state":"In love, engaged"},"8":{"line":"Asks Nixon in the vestry to say one word, is refused, has her prayer book turned blank, and says \"I will\" to Nathaniel to stay out of Bethlem.","state":"Lady Harding"},"9":{"line":"Pretends to obey her father, steals the Works master key, and faces Ajax down with a Vykra needle.","state":"Holds the key"},"10":{"line":"Offers her father her hand, walks out of the vault, then throws the coal depots open and signs as heir.","state":"Heir of Lambrick"}},"grise":{"1":{"line":"In the steaming laundry she hands Alice her first contract in a sealed envelope from a client she won't name: the second Harding son.","state":"contract placed"},"2":{"line":"She takes Josephine's gold and doubles the contract, keeping the second son close and out of the Works.","state":"paid twice over"},"3":{"line":"She demands a real report on the Harding son in three days or the frost girl on Gin Lane becomes her business.","state":"waiting, threatening"},"4":{"line":"Demands the frost girl, snips the Vykra knot out of Alice's glove, tells her she is no one's, and takes Tamara as the new girl.","state":"new girl found"},"5":{"line":"Tests Tamara with a Works cipher solved in four minutes, lets slip that the inner codes change on Lantern Night, and welcomes her with tea and a knife.","state":"recruiter satisfied"},"7":{"line":"Agrees a price with Josephine for the Frost Witch, delivered to Josephine and not the Crown.","state":"Sold the girl"},"9":{"line":"Tells Alice the sister was worth more, fights her among steaming sheets, and loses on the count of nine.","state":"Spared, beaten"},"10":{"line":"Pours Alice a cup of tea in the Shadwell laundry without being asked.","state":"Tea and peace"}},"felix":{"1":{"line":"He pulls back the sheet for Alice to identify her sister, and when the corpse's eyes move his hand goes numb on his revolver.","state":"shaken, file open"},"2":{"line":"Two frozen attendants and a missing corpse, a Crown order to drop it, and a witness naming the Bounds girl of Gin Lane: he keeps the file.","state":"suspicious, unconvinced"},"3":{"line":"Frostbitten hand in a sling, he tells Nixon Miriam Bounds was dead, Jamie took a bullet, and slides over the Newgate visitor's slip.","state":"closing in"},"4":{"line":"Tracks Alice to the glasshouse, promises to tell the Crown that someone made the girl, and dies on the witness stand with frost on his lips.","state":"dead on stand"}},"vane":{"2":{"line":"Attends Jamie Harding's funeral at St Bride's among the great houses, the Crown's presence over a family's grief.","state":"watching the houses"},"4":{"line":"Presides over the Charter hearing, orders the Frost Killer hunted with every lamp in London, and has the vote postponed.","state":"hunt ordered"},"6":{"line":"Bleeding from the temple, announces the Charter suspended and the Works handed to a Crown board.","state":"charter suspended"},"7":{"line":"Declares martial law at dawn and hears only that the lights stay on.","state":"Order restored"},"8":{"line":"Arrests Eldgard, orders the crowd cleared by any means, then names Nathaniel the man who put out London.","state":"Crown cornered"},"9":{"line":"Watches the snow thicken over Tyburn and lets Lambrick set the midnight deadline.","state":"Waiting on girl or boy"},"10":{"line":"Signs the warrant, buys Nixon's silence with a captain's lantern, and is forced to start a true record.","state":"Forced to write"}},"otty":{"2":{"line":"Her chancel brass at St Bride's reads OTTOLINE HARDING, 1820 TO 1839, DIED ABROAD; Nathaniel asks who she was and Byron says only \"your father's sister\".","state":"brass, unexplained"}},"wren":{"2":{"line":"The bonesetter who set Alice's arm as a child hears a heart that is barely there, holds a mirror under a breath that barely fogs it, and calls it shock.","state":"knows, says little"}},"alistair":{"1":{"line":"In the 1489 cold open, wolf-crest ring on his hand, he opens the ice woman's wrist and her green blood lights the first gallowglass lantern.","state":"unmoved, first light"},"5":{"line":"Cold open, Tyburn 1489: cuts down the girl of nineteen at the lock, ending the first attempt on the chain.","state":"raid repelled"},"10":{"line":"At the chain in 1489 he chooses sons over light, and his firstborn Edric carries the lantern down the stair.","state":"Chose sons"}},"morgana":{"1":{"line":"Chained by hooks in the iron pit below Tyburn, a woman of ice whose opened wrist lights the first gallowglass lantern; a tiny frost girl slips out and runs.","state":"chained, drained"},"5":{"line":"Seen whole, nine feet of ice and green fire, hooked and chained and singing the Weeping, she tells Nathaniel his brother is not dead, only cold.","state":"chained, screaming"},"7":{"line":"Seen on the core wall as Lambrick does his arithmetic, while the Lost One names her as mother.","state":"Being bled"},"8":{"line":"In the cold open, the woman of ice who sings the lullaby; at the core, she understands her daughter's plan and her grief brings the snow.","state":"Grieving mother"},"9":{"line":"Strains at her hooks and asks the Lost One why she came back.","state":"Chain breaking"},"10":{"line":"Rises nine feet tall, demands a Harding, accepts Josephine, and walks home into the white.","state":"Free at last"}},"ajax":{"3":{"line":"He sits on Tamara's bed, delivers her father's love, warns her off the safe and leaves the apple core on her pillow.","state":"warning delivered"},"4":{"line":"Cold open: takes Jamie's two hundred guineas to cut the outer grid. At the coal docks he is hooked onto a crane and dropped into the Thames.","state":"in the Thames"},"5":{"line":"Scarred and alive, brings a coal-mob to the Strand and cuts the outer grid during the fireworks, darkening the East End mid-heist.","state":"sabotage done"},"6":{"line":"Plans charges on the Tyburn conduit with Lambrick; in the tunnel he sees the Guard, lights the fuse early, and the gasworks goes up.","state":"fire lit early"},"9":{"line":"Drives Nathaniel into the ground with the Black Gauntlet and steps aside for Tamara's needle.","state":"Blocked"},"10":{"line":"Fights Nixon on the core stair and dies frozen mid-laugh, his apple rolling down.","state":"Frozen dead"}},"marsh":{"4":{"line":"Newgate's prisoner 1417, picking at a string he calls his harp, pinches Nixon's cheek, says 'Marian's chin', and recites the Orchard rhyme.","state":"rhyme delivered"},"9":{"line":"Walks out of opened cell 1417, looks up at the snow, and says perfectly lucidly that they always count from the first snow.","state":"Lucid, freed"}}},"notes":{},"ledger":{"rows":[["The frost girl running from the pit in 1489","Ep 1, cold open","Ep 2 tag (\"My daughter is here\"), Ep 7 (\"You're not her\")"],["Miriam asks the frost girl something on the bridge","Ep 1, scene 15","Ep 10, scene 16: \"She asked me to go back to Ali\""],["Nixon's shot in the core","Ep 1, scene 14","Ep 7 confession; Ep 9: the round went through the shoulder"],["Eldgard kneels by Jamie; we cut away","Ep 1, scene 16","Ep 9 Snow Confession: he held Jamie's hand over the lock"],["Nathaniel hears the Weeping","Ep 1, scenes 12 and 19; Ep 1, scene 13 (the lamp-girl, beside him, hears nothing)","Ep 5: it's Morgana, and Harding blood hears her"],["Josephine: \"She holds her wrist like a knife-girl\"","Ep 1, scene 10","Ep 2 contract; Ep 4 tag; Ep 9 knives; Ep 10 fight"],["\"Keep him out of the Works\"","Ep 2, scene 9","Ep 10, scene 17, given to Alice as a blessing"],["Felix: \"She was with child\"","Ep 2, scene 16","Ep 7 cold open; Ep 10, the final montage: the heartbeat"],["Miriam's red mittens","Ep 1, scene 15; Ep 2, scene 5","Ep 5: burned on the chain; Ep 7 cold open: Miriam pulls them on for the last time"],["Cole's diary","Ep 2, scene 4","Ep 4 (he sees the burned log page), Ep 6 and 7 (\"Today, sir\"); Ep 10, Westminster: Nixon's shot, and Eldgard alone with a living boy, on the record"],["The green blood test","Ep 3, cold open","Ep 7 tag (the file); Ep 9 (\"Cadet line. My spare\")"],["The Black Gauntlet is Nathaniel's stolen prototype","Ep 4, scene 7","Ep 9 (it nearly kills him, and kills Eldgard); Ep 10 (Nixon freezes its piston)"],[
