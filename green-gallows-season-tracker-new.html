 Lantern Hymn to them in a key no church uses, and waits. When Kit and Grise's girls come through the glass on the minute, with Josephine's directions, she doesn't fight. She stands and holds out her wrists to Kit, who has heard what that touch does and takes a long breath before she puts the irons on. She breathes once on the pane by the door. Frost writes itself across it. She couldn't have walked to the core: it's Crown iron now, and the cage that can put her in her mother's place is in Crown hands, so the only way in is as somebody's prisoner. And if she'd gone with Alice in the room, Alice would have followed. She goes with them the way Miriam went to the bridge: on purpose, and without saying goodbye.<\/p>"},{"oref":"Scene 12","id":160,"seq":12,"title":"The chapel, the vows","added":false,"act":"Act Two","kind":"scene","sum":"\"If any man knows cause…\" Lambrick stands. Gently, to the room: \"My daughter is unwell.\" The attendants come up the aisle with the strait-coat, and the priest stops with his mouth open, looking to Vane. Nixon's hand is on his rifle and his company is at the gates; he could carry her out of this chapel in a minute. Nathaniel sees him think it and shakes his head once: carry her out and she's a runaway lunatic with a Chancery seal on her for the rest of her life. The order names a spinster. Make her a wife and it names nobody, and her nearest relative is her husband. It was always the plan. It just has to happen in the next thirty seconds. Nathaniel looks up and finds Alice at the gallery rail. She nods once, small, like a permission. She is letting him go. \"Go on,\" he tells the priest, and doesn't wait for him: \"I will.\" He says it the way he said it last night among the orange trees, and at the rail Alice's lips move with his. Tamara: \"I will.\" Nixon steps into the aisle, square in the attendants' path, and is very slow and very polite about getting out of it. Then he hands over the ring, properly. \"Congratulations, miss.\" \"Thank you, Captain.\" The ring goes on. Vane looks at the order, then at the bride, then at two hundred witnesses. Voiding a marriage in front of them means a Chancery hearing, and a Chancery hearing goes on the record. \"This is addressed to a spinster. I see a wife.\" The attendants fold the strait-coat. When Nathaniel looks up again, the gallery rail is empty.","loc":"The Harding chapel","when":"\"If any man knows cause…\" Lambrick stands.","th":"harding","also":["lambrick","sisters","guard"],"ch":["nathaniel","tamara","nixon","alice","lambrick","vane"],"turn":"","w":720,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>\"If any man knows cause…\" Lambrick stands. Gently, to the room: \"My daughter is unwell.\" The attendants come up the aisle with the strait-coat, and the priest stops with his mouth open, looking to Vane. Nixon's hand is on his rifle and his company is at the gates; he could carry her out of this chapel in a minute. Nathaniel sees him think it and shakes his head once: carry her out and she's a runaway lunatic with a Chancery seal on her for the rest of her life. The order names a spinster. Make her a wife and it names nobody, and her nearest relative is her husband. It was always the plan. It just has to happen in the next thirty seconds. Nathaniel looks up and finds Alice at the gallery rail. She nods once, small, like a permission. She is letting him go. \"Go on,\" he tells the priest, and doesn't wait for him: \"I will.\" He says it the way he said it last night among the orange trees, and at the rail Alice's lips move with his. Tamara: \"I will.\" Nixon steps into the aisle, square in the attendants' path, and is very slow and very polite about getting out of it. Then he hands over the ring, properly. \"Congratulations, miss.\" \"Thank you, Captain.\" The ring goes on. Vane looks at the order, then at the bride, then at two hundred witnesses. Voiding a marriage in front of them means a Chancery hearing, and a Chancery hearing goes on the record. \"This is addressed to a spinster. I see a wife.\" The attendants fold the strait-coat. When Nathaniel looks up again, the gallery rail is empty.<\/p>"},{"oref":"Scene 13","id":159,"seq":13,"title":"The glasshouse, after","added":true,"act":"Act Two","kind":"scene","sum":"Alice runs, out through the gates where the riot is starting and across the lawn, ten minutes too late. The door hangs open. The orange trees are dusted white. On the pane, in frost: DON'T FOLLOW ME, the same words as Miriam's letter. Her knees go. She was watching a wedding.","loc":"The glasshouse","when":"Alice runs, out through the gates where the riot is starting and across the lawn, ten minutes too late.","th":"sisters","also":[],"ch":["alice"],"turn":"","w":160,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Alice runs, out through the gates where the riot is starting and across the lawn, ten minutes too late. The door hangs open. The orange trees are dusted white. On the pane, in frost: DON'T FOLLOW ME, the same words as Miriam's letter. Her knees go. She was watching a wedding.<\/p>"},{"oref":"Scene 14","id":162,"seq":14,"title":"The chapel steps","added":false,"act":"Act Two","kind":"scene","sum":"Vane's marshals arrest Eldgard for the murder of his son James, on his wife's sworn word and a coffin full of slag. A murderer can be hanged quietly. A Keeper who might stand up in court and read out the Crown's annex can't be left free, and with Eldgard in Newgate nobody is left to argue with the men who now own the core. The marshals take his watch, his cane and his collar studs. They leave the wolf-crest ring on his hand, because nobody outside the family knows what it closed. He looks at his wife and understands. \"Josie.\" She doesn't look away.","loc":"The chapel steps","when":"Vane's marshals arrest Eldgard for the murder of his son James, on his wife's sworn word and a coffin full of slag.","th":"harding","also":["city"],"ch":["vane","eldgard","josephine"],"turn":"","w":140,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>Vane's marshals arrest Eldgard for the murder of his son James, on his wife's sworn word and a coffin full of slag. A murderer can be hanged quietly. A Keeper who might stand up in court and read out the Crown's annex can't be left free, and with Eldgard in Newgate nobody is left to argue with the men who now own the core. The marshals take his watch, his cane and his collar studs. They leave the wolf-crest ring on his hand, because nobody outside the family knows what it closed. He looks at his wife and understands. \"Josie.\" She doesn't look away.<\/p>"},{"oref":"Scene 15","id":163,"seq":15,"title":"The gates, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Nixon walks out of the chapel still holding the empty ring box. The crowd sees Eldgard in irons and surges. Coal-men and Frost Witch believers clash. Vane: \"Lanterns, fire.\" Nixon: \"Lanterns, stand down.\" Vane's second company raises their rifles, and Nixon's company raises theirs back. Cole walks out between the lines with his hands up. Nobody fires. Vane rips the lantern from Nixon's collar: \"Keep the flame, Captain.\" Nixon: \"I am.\" Forty Lanterns tear off their own, drop them in the snowless gutter, and walk away with their captain.","loc":"The gates","when":"Nixon walks out of the chapel still holding the empty ring box.","th":"guard","also":["city"],"ch":["nixon","vane","cole"],"turn":"","w":296,"ed":"","fl":[],"html":"<p>Nixon walks out of the chapel still holding the empty ring box. The crowd sees Eldgard in irons and surges. Coal-men and Frost Witch believers clash. Vane: \"Lanterns, fire.\" Nixon: \"Lanterns, stand down.\" Vane's second company raises their rifles, and Nixon's company raises theirs back. Cole walks out between the lines with his hands up. Nobody fires. Vane rips the lantern from Nixon's collar: \"Keep the flame, Captain.\" Nixon: \"I am.\" Forty Lanterns tear off their own, drop them in the snowless gutter, and walk away with their captain.<\/p>"},{"oref":"Scene 16","id":165,"seq":16,"title":"Harding House, the old nursery","added":false,"act":"Act Three","kind":"scene","sum":"The newlyweds sit alone with the wedding breakfast. \"We said forty years of politeness.\" \"We managed four minutes.\" Tamara: \"Thank you.\" \"Don't.\" She tells him she loves Nixon. \"I know. I watched him hand me the ring.\" One unsaid thing, finally said. At the door he finds her own shawl already laid over the chair he will sleep in. Neither mentions it. Across the lawn, a lamp comes on in the glasshouse. He stands at the window and watches it until the candle in his hand burns down to his fingers, and then he goes.","loc":"Harding House","when":"The newlyweds sit alone with the wedding breakfast.","th":"lambrick","also":["harding"],"ch":["nathaniel","tamara"],"turn":"","w":354,"ed":"","fl":[],"html":"<p>The newlyweds sit alone with the wedding breakfast. \"We said forty years of politeness.\" \"We managed four minutes.\" Tamara: \"Thank you.\" \"Don't.\" She tells him she loves Nixon. \"I know. I watched him hand me the ring.\" One unsaid thing, finally said. At the door he finds her own shawl already laid over the chair he will sleep in. Neither mentions it. Across the lawn, a lamp comes on in the glasshouse. He stands at the window and watches it until the candle in his hand burns down to his fingers, and then he goes.<\/p>"},{"oref":"Scene 17","id":228,"seq":17,"title":"The glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel finds Alice on the floor under the frosted pane. \"What did you see up there?\" he asks. \"You, being brave,\" she says, before either of them has to say what it cost. He reads the glass. Alice: \"She heard me say cage in this room. She's gone to get in it.\" Nathaniel: \"Then it fails. No mother lets her child hang in her place.\" Alice: \"She went because she wanted to. She thinks she can make her.\" It's Alice's own lie, love as holding on, coming back at her from the other side of the glass.","loc":"The glasshouse","when":"Nathaniel finds Alice on the floor under the frosted pane.","th":"sisters","also":["harding"],"ch":["alice","nathaniel"],"turn":"","w":280,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Nathaniel finds Alice on the floor under the frosted pane. \"What did you see up there?\" he asks. \"You, being brave,\" she says, before either of them has to say what it cost. He reads the glass. Alice: \"She heard me say <em>cage<\/em> in this room. She's gone to get in it.\" Nathaniel: \"Then it fails. No mother lets her child hang in her place.\" Alice: \"She went because she wanted to. She thinks she can make her.\" It's Alice's own lie, love as holding on, coming back at her from the other side of the glass.<\/p>"},{"oref":"Scene 18","id":167,"seq":18,"title":"The Works, thirteen steps","added":false,"act":"Act Three","kind":"scene","sum":"Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head. He finds the coal-hatch stair behind the Works and counts down. Thirteen. Behind the last stone is a door, and behind the door is the Orchard: a long low gallery of iron-barred bunks, child-sized shackles, a wall scratched with names and tally marks. Each name is a Hargrave. The first, cut deep and worn almost smooth, is MARIAN, 1489. The tallies beside the names are a keeper's count, and over them, in a keeper's chalk, one word: APPLES. Count the apples. The children were the apples. A skipping rhyme every London child knows goes through his head, Green light, green light, who's in the cellar tonight?, and he is standing in the cellar. The last name on the wall is MARIAN too, with a date four years after he was told his mother died of fever. For four hundred years the Orchard named its girls after the first one who tried. He sits on her bunk. Creak. A wooden spoon is still under the pillow. Over the lintel, in old chalk, are two initials: J.H. Jamie was here first. Nixon understands what he was picked out of, and who kept it from him.","loc":"The Works","when":"Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head.","th":"guard","also":["white"],"ch":["nixon"],"turn":"","w":413,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"<p>Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head. He finds the coal-hatch stair behind the Works and counts down. Thirteen. Behind the last stone is a door, and behind the door is the Orchard: a long low gallery of iron-barred bunks, child-sized shackles, a wall scratched with names and tally marks. Each name is a Hargrave. The first, cut deep and worn almost smooth, is MARIAN, 1489. The tallies beside the names are a keeper's count, and over them, in a keeper's chalk, one word: APPLES. <em>Count the apples.<\/em> The children were the apples. A skipping rhyme every London child knows goes through his head, <em>Green light, green light, who's in the cellar tonight?<\/em>, and he is standing in the cellar. The last name on the wall is MARIAN too, with a date four years after he was told his mother died of fever. For four hundred years the Orchard named its girls after the first one who tried. He sits on her bunk. <em>Creak.<\/em> A wooden spoon is still under the pillow. Over the lintel, in old chalk, are two initials: J.H. Jamie was here first. Nixon understands what he was picked out of, and who kept it from him.<\/p>"},{"oref":"Scene 19","id":168,"seq":19,"title":"Newgate","added":false,"act":"Act Three","kind":"scene","sum":"Josephine visits Eldgard through the bars. \"You made a deal with Lambrick,\" he says. \"The girl to the chain, our son kept out of it, and me to Newgate.\" \"Yes.\" \"You sold me.\" \"I sold the man who sold our son.\" \"How did you bring Lambrick in?\" \"He paid Grise to have you killed when he was twenty-five. I was the knife. He never knew which girl failed him, until last week.\" Eldgard almost laughs. He asks one thing: \"Was any of it real?\" \"Thirty years. All of it.\" It's the first time in a generation neither of them lies. \"Our son lives.\" Eldgard: \"You've killed him. I've stood in front of her for forty years, and she's never once given a Harding anything he could keep. She'll break that glass before she lets her child hang in it, and when it breaks they'll need a Harding anyway.\" Josephine: \"Four hundred years in hooks. Nobody refuses the door.\" Eldgard: \"You would.\" It lands. Josephine's face: she may have made a mistake, and it's too late to unmake it.","loc":"Newgate","when":"Josephine visits Eldgard through the bars.","th":"harding","also":["city"],"ch":["josephine","eldgard"],"turn":"","w":525,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Josephine visits Eldgard through the bars. \"You made a deal with Lambrick,\" he says. \"The girl to the chain, our son kept out of it, and me to Newgate.\" \"Yes.\" \"You sold me.\" \"I sold the man who sold our son.\" \"How did you bring Lambrick in?\" \"He paid Grise to have you killed when he was twenty-five. I was the knife. He never knew which girl failed him, until last week.\" Eldgard almost laughs. He asks one thing: \"Was any of it real?\" \"Thirty years. All of it.\" It's the first time in a generation neither of them lies. \"Our son lives.\" Eldgard: \"You've killed him. I've stood in front of her for forty years, and she's never once given a Harding anything he could keep. She'll break that glass before she lets her child hang in it, and when it breaks they'll need a Harding anyway.\" Josephine: \"Four hundred years in hooks. Nobody refuses the door.\" Eldgard: \"You would.\" It lands. Josephine's face: she may have made a mistake, and it's too late to unmake it.<\/p>"},{"oref":"Scene 20","id":264,"seq":20,"title":"Shadwell, a back room, dusk","added":true,"act":"Act Three","kind":"scene","sum":"Alice can't reach the sister she lost today; the core is Crown iron. Kit slides a receipt across a table, paid for by Vykra who don't love Josephine: an apothecary's book, a purchase of Xyon made two hours before Miriam Bounds went off Blackwood Bridge. A false name, but the apothecary kept descriptions. Penknife. Signet. L. \"Edmund Lambrick. Bastard son.\" Alice: \"I already knew it was him.\" She didn't. She has hunted a nobleman from the party for six weeks, and now he has a name. She can reach this one.","loc":"Shadwell","when":"Alice can't reach the sister she lost today; the core is Crown iron.","th":"vykra","also":["sisters"],"ch":["alice","kit"],"turn":"","w":182,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Alice can't reach the sister she lost today; the core is Crown iron. Kit slides a receipt across a table, paid for by Vykra who don't love Josephine: an apothecary's book, a purchase of Xyon made two hours before Miriam Bounds went off Blackwood Bridge. A false name, but the apothecary kept descriptions. Penknife. Signet. <em>L.<\/em> \"Edmund Lambrick. Bastard son.\" Alice: \"I already knew it was him.\" She didn't. She has hunted a nobleman from the party for six weeks, and now he has a name. She can reach this one.<\/p>"},{"oref":"Scene 21","id":265,"seq":21,"title":"Edmund's townhouse, the wedding night","added":true,"act":"Act Three","kind":"scene","sum":"Across the street, in Lambrick House, Tamara, married six hours, has come back for her mother's jewel case and stands at a lit window. Alice climbs the trellis. Edmund, in shirtsleeves, finds a girl with wolf's eyes in his chair. \"Do you know who Miriam Bounds is?\" He talks, and keeps talking, and walks backward to the sideboard while he does. Cornered, he smashes his decanter into her face: the Xyon-cut wine he keeps for his \"kindnesses,\" into her mouth and the split in her lip. She pulls the wire anyway. Then the hour is gone. We get the start and the end; the middle is missing.","loc":"Edmund's townhouse","when":"Across the street, in Lambrick House, Tamara, married six hours, has come back for her mother's jewel case and stands at a lit window.","th":"sisters","also":["lambrick"],"ch":["alice","edmund","tamara"],"turn":"","w":214,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Across the street, in Lambrick House, Tamara, married six hours, has come back for her mother's jewel case and stands at a lit window. Alice climbs the trellis. Edmund, in shirtsleeves, finds a girl with wolf's eyes in his chair. \"Do you know who Miriam Bounds is?\" He talks, and keeps talking, and walks backward to the sideboard while he does. Cornered, he smashes his decanter into her face: the Xyon-cut wine he keeps for his \"kindnesses,\" into her mouth and the split in her lip. She pulls the wire anyway. Then the hour is gone. We get the start and the end; the middle is missing.<\/p>"},{"oref":"Scene 22","id":266,"seq":22,"title":"The tidy house","added":true,"act":"Act Three","kind":"scene","sum":"Minutes later: wine on the rug, a chair overturned, one curtain torn from its tieback. Tamara kneels by her brother and takes the signet off his finger before she's decided anything. Lambrick arrives inside the hour with Ajax. \"Who was here?\" \"No one. I found him like this.\" He looks at her sleeve, and at the torn curtain. \"Then he was unwell. He has been unwell for some time.\" Ajax's men carry the body out walking backward. It's the first lie Tamara has told her father to his face, and he lets it stand, because he needs a daughter now. Three streets away Alice wakes on the cobbles with glittering dust on her cuff, a Crimson Club matchbook, and a strip of black silk with a silver L at the edge. One hour is gone. She climbs the trellis again. The room has been tidied, and there are drag marks, and two sets of boots walking backward. She believes he got away.","loc":"Edmund's townhouse","when":"Minutes later: wine on the rug, a chair overturned, one curtain torn from its tieback.","th":"lambrick","also":["sisters"],"ch":["tamara","lambrick","ajax","alice"],"turn":"","w":324,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Minutes later: wine on the rug, a chair overturned, one curtain torn from its tieback. Tamara kneels by her brother and takes the signet off his finger before she's decided anything. Lambrick arrives inside the hour with Ajax. \"Who was here?\" \"No one. I found him like this.\" He looks at her sleeve, and at the torn curtain. \"Then he was unwell. He has been unwell for some time.\" Ajax's men carry the body out walking backward. It's the first lie Tamara has told her father to his face, and he lets it stand, because he needs a daughter now. Three streets away Alice wakes on the cobbles with glittering dust on her cuff, a Crimson Club matchbook, and a strip of black silk with a silver <em>L<\/em> at the edge. One hour is gone. She climbs the trellis again. The room has been tidied, and there are drag marks, and two sets of boots walking backward. She believes he got away.<\/p>"},{"oref":"Scene 23","id":169,"seq":23,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother. She speaks to Morgana in the language of the White: \"I've come to take your place.\" Morgana understands. For four hundred years she has wanted the door, and here it is, held open by her own child. She screams. It's grief, not rage, and it's no.","loc":"The core","when":"Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother.","th":"white","also":["city"],"ch":["lambrick","vane","lostone","morgana"],"turn":"","w":263,"ed":"","fl":[],"html":"<p>Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother. She speaks to Morgana in the language of the White: \"I've come to take your place.\" Morgana understands. For four hundred years she has wanted the door, and here it is, held open by her own child. She screams. It's grief, not rage, and it's no.<\/p>"},{"oref":"Scene 24","id":170,"seq":24,"title":"London","added":false,"act":"Tag","kind":"scene","sum":"The scream rises through the Works and into the sky, and it begins to snow, two weeks early. This time the walls can't melt it, and for the first time in living memory snow settles on London. Alice in the glasshouse door. Nixon and his forty on a rooftop. Tamara at a window in her wedding dress. Josephine on the Newgate steps. Eldgard at his cell window, flakes on his face. He has counted to the solstice like every Keeper before him, and in four hundred years of ledgers she has never once been early. \"First snow.\" Whatever is owed is owed by midnight. Card: *0 DAYS.*","loc":"London","when":"The scream rises through the Works and into the sky, and it begins to snow, two weeks early.","th":"city","also":["white"],"ch":["alice","nixon","tamara","josephine","eldgard"],"turn":"","w":228,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>The scream rises through the Works and into the sky, and it begins to snow, two weeks early. This time the walls can't melt it, and for the first time in living memory snow settles on London. Alice in the glasshouse door. Nixon and his forty on a rooftop. Tamara at a window in her wedding dress. Josephine on the Newgate steps. Eldgard at his cell window, flakes on his face. He has counted to the solstice like every Keeper before him, and in four hundred years of ledgers she has never once been early. \"First snow.\" Whatever is owed is owed by midnight. Card: <strong>0 DAYS.<\/strong><\/p>"}]},{"n":9,"title":"The Snow Confession","time":"FIRST SNOW","clock":"FIRST SNOW","act":"III","log":"With the snow falling and the binding set for midnight, Nathaniel breaks his father out of Newgate with Nixon's mutineers, Alice takes the Vykra from Mother Grise, and Tamara steals her father's keys. At the Works gate, Eldgard takes a blow meant for his son and spends his last breath on everything he did.","sum":"Josephine pulls the lever","turn":"Eldgard dies and tells everything","focus":"the assault. Everyone's plan runs toward one room","piece":"the Newgate break-out, then storming the Works through snow and wolves","threads":["harding","investigation","lambrick","vykra","guard","city","white"],"frame":"<blockquote><p><strong>Focus:<\/strong> the assault. Everyone's plan runs toward one room<\/p><p><strong>Set pieces:<\/strong> the Newgate break-out, then storming the Works through snow and wolves<\/p><p><strong>Sting:<\/strong> Eldgard dies telling the truth, and it's worse than the lies<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":261,"seq":1,"title":"London, dusk, the first snow","added":true,"act":"Cold open","kind":"scene","sum":"For the first time in living memory, snow lies in London's streets. Gin Lane children who have never seen it stand with their tongues out. A cabman in the Strand stops his horse to stare at the white on its back. A lamplighter on his ladder holds out his palm, watches a flake not melt, and laughs. Then, on Tyburn hill, where the drift lies deepest, the snow begins to shape itself: a muzzle, shoulders, blue eyes opening in the white. A Crown sentry fires a flash. In the strobe the drift is only a drift. In the dark after it, it isn't.","loc":"London","when":"For the first time in living memory, snow lies in London's streets.","th":"city","also":["white"],"ch":[],"turn":"","w":206,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>For the first time in living memory, snow lies in London's streets. Gin Lane children who have never seen it stand with their tongues out. A cabman in the Strand stops his horse to stare at the white on its back. A lamplighter on his ladder holds out his palm, watches a flake not melt, and laughs. Then, on Tyburn hill, where the drift lies deepest, the snow begins to shape itself: a muzzle, shoulders, blue eyes opening in the white. A Crown sentry fires a flash. In the strobe the drift is only a drift. In the dark after it, it isn't.<\/p>"},{"oref":"Scene 2","id":172,"seq":2,"title":"The glasshouse, snow falling through the broken panes","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel says it first, because he has had all afternoon to see that frost on the pane: \"You nodded, and I said it, and while we were saying it they took her.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Sent me up there. She'd already decided. She was going, Nathaniel. I only chose who got saved on the way.\" He owes her something he can never pay back, and both of them know it, and it makes him cruel for exactly one line: \"My mother's receipt had your name on it. That's where I learned it. On a bill.\" Alice doesn't flinch, which is how he knows it went in. Then she gives him the rest of the sentence from this morning, all of it, the way she gave her sister fifteen years in one breath: \"At first I was paid. Then you flew across that foundry into a coal bin for an audience of one, and you looked at me like I was the first person who'd ever watched. After that I'd have done it for nothing. I did do it for nothing. Grise cut me loose a month ago, and I kept coming.\" Snow ticks on the broken glass. \"I'm married.\" \"I know. I nodded.\" He reaches for her across the workbench. She lets him get halfway, then stands. \"Midnight. The core. After that, we'll see what either of us is allowed.\" Then they argue it like engineers, because it's the only way either of them can bear to. He spreads the wall map on the bench: if the light dies, every sector goes dark at once, coal can hold the west for six hours, and he doesn't know how long a city lasts after that. Alice puts her finger on the east wall. \"Which London? Gin Lane's been on a dead wall for three weeks. We've got the laundry boilers and the Vykra's coal, and every door in the lane already knows how to stop a draught. We can hold one night. Can Mayfair?\" He doesn't have an answer. It's the first time anyone has made him count the people he was saving. For the first time it's her plan and he follows it: midnight at the core. They need the wolf-crest ring, the one Alistair closed the chain with, and it's on Eldgard's hand in a Crown cell. And they need Nixon. Before they go, she tells him the thing she hasn't, before he can ask: \"I lost an hour outside Edmund Lambrick's door last night. I don't know what I did in it.\" He's angry, and moved, and takes his time choosing which. \"Don't do that again without me.\" It's the first secret she has handed over without being cornered.","loc":"The glasshouse","when":"Nathaniel says it first, because he has had all afternoon to see that frost on the pane: \"You nodded, and I said it, and while we were saying it they took her.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Sent me up there.","th":"harding","also":["sisters"],"ch":["alice","nathaniel"],"turn":"","w":1116,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Nathaniel says it first, because he has had all afternoon to see that frost on the pane: \"You nodded, and I said it, and while we were saying it they took her.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Sent me up there. She'd already decided. She was going, Nathaniel. I only chose who got saved on the way.\" He owes her something he can never pay back, and both of them know it, and it makes him cruel for exactly one line: \"My mother's receipt had your name on it. That's where I learned it. On a bill.\" Alice doesn't flinch, which is how he knows it went in. Then she gives him the rest of the sentence from this morning, all of it, the way she gave her sister fifteen years in one breath: \"At first I was paid. Then you flew across that foundry into a coal bin for an audience of one, and you looked at me like I was the first person who'd ever watched. After that I'd have done it for nothing. I did do it for nothing. Grise cut me loose a month ago, and I kept coming.\" Snow ticks on the broken glass. \"I'm married.\" \"I know. I nodded.\" He reaches for her across the workbench. She lets him get halfway, then stands. \"Midnight. The core. After that, we'll see what either of us is allowed.\" Then they argue it like engineers, because it's the only way either of them can bear to. He spreads the wall map on the bench: if the light dies, every sector goes dark at once, coal can hold the west for six hours, and he doesn't know how long a city lasts after that. Alice puts her finger on the east wall. \"Which London? Gin Lane's been on a dead wall for three weeks. We've got the laundry boilers and the Vykra's coal, and every door in the lane already knows how to stop a draught. We can hold one night. Can Mayfair?\" He doesn't have an answer. It's the first time anyone has made him count the people he was saving. For the first time it's her plan and he follows it: midnight at the core. They need the wolf-crest ring, the one Alistair closed the chain with, and it's on Eldgard's hand in a Crown cell. And they need Nixon. Before they go, she tells him the thing she hasn't, before he can ask: \"I lost an hour outside Edmund Lambrick's door last night. I don't know what I did in it.\" He's angry, and moved, and takes his time choosing which. \"Don't do that again without me.\" It's the first secret she has handed over without being cornered.<\/p>"},{"oref":"Scene 3","id":173,"seq":3,"title":"An abandoned bell foundry, Whitechapel","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. Forty disgraced Lanterns cook sausages on flash-gauntlets set to low. Nathaniel walks in. \"You shot my brother.\" \"Yes.\" \"My father did the rest. I think.\" Silence. \"What do you need?\" \"Newgate, then the Works.\" Nixon: \"You know we're cousins? Cadet line.\" \"Then you're family. God help you.\"","loc":"An abandoned bell foundry","when":"Whimsy.","th":"investigation","also":["guard"],"ch":["nixon","nathaniel"],"turn":"","w":205,"ed":"","fl":[],"html":"<p>Whimsy. Forty disgraced Lanterns cook sausages on flash-gauntlets set to low. Nathaniel walks in. \"You shot my brother.\" \"Yes.\" \"My father did the rest. I think.\" Silence. \"What do you need?\" \"Newgate, then the Works.\" Nixon: \"You know we're cousins? Cadet line.\" \"Then you're family. God help you.\"<\/p>"},{"oref":"Scene 4","id":174,"seq":4,"title":"Lambrick House","added":false,"act":"Act One","kind":"scene","sum":"Lambrick: \"If the girl fails, the Crown needs a Harding by midnight, and it has to walk down on its own feet. Your father-in-law would hang first. The boy will walk if he thinks it saves somebody. You'll bring your husband.\" Then, kindly: \"Bring him, and I'll burn the order at Bethlem. Don't, and remember that a widow's nearest relative is her father again.\" Tamara: \"Yes, Father.\" He believes her, because he has never once looked at her. In the study an hour later, she opens the safe one last time and takes the Works master key, and this time the ledger itself, every page, and the cipher maps of the old coal mains with every live valve marked: six months of payments to A.F., down to the night of the Charter vote. A.F., Pimlico, 300 gns. Ajax is in the doorway with an apple. This time she holds up a winter's kiss needle, Vykra issue: \"Try it.\" He steps aside, then goes to tell her father. About what she saw from her window on her wedding night, she says nothing at all.","loc":"Lambrick House","when":"Lambrick: \"If the girl fails, the Crown needs a Harding by midnight, and it has to walk down on its own feet.","th":"lambrick","also":["harding","guard"],"ch":["lambrick","tamara","ajax"],"turn":"","w":378,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Lambrick: \"If the girl fails, the Crown needs a Harding by midnight, and it has to walk down on its own feet. Your father-in-law would hang first. The boy will walk if he thinks it saves somebody. You'll bring your husband.\" Then, kindly: \"Bring him, and I'll burn the order at Bethlem. Don't, and remember that a widow's nearest relative is her father again.\" Tamara: \"Yes, Father.\" He believes her, because he has never once looked at her. In the study an hour later, she opens the safe one last time and takes the Works master key, and this time the ledger itself, every page, and the cipher maps of the old coal mains with every live valve marked: six months of payments to A.F., down to the night of the Charter vote. <em>A.F., Pimlico, 300 gns.<\/em> Ajax is in the doorway with an apple. This time she holds up a winter's kiss needle, Vykra issue: \"Try it.\" He steps aside, then goes to tell her father. About what she saw from her window on her wedding night, she says nothing at all.<\/p>"},{"oref":"Scene 5","id":241,"seq":5,"title":"Gin Lane, Old Wren's door, dusk","added":true,"act":"Act One","kind":"scene","sum":"Snow on Gin Lane. On her way to take the Vykra, Alice stops at OLD WREN's door, because there may not be another chance. \"You knew. The first night. You held the mirror under her mouth, and you knew.\" Wren doesn't deny it. \"I knew you couldn't hear it yet. Five weeks you had a sister. I'd give them to you again.\" Alice: \"And the child?\" Wren: \"Still there. Cold holds what it holds. It held her heart still on that bridge, and it's holding the baby the same way. I didn't know if either would ever start again, so I told you it was gone.\" Alice can't decide whether to thank her or hate her, and there isn't time to decide. Wren touches the arm she set when Alice was nine: \"Nobody stood in front of you then, either. Go on.\" Alice goes.","loc":"Gin Lane","when":"Snow on Gin Lane.","th":"sisters","also":[],"ch":["alice","wren"],"turn":"","w":342,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>Snow on Gin Lane. On her way to take the Vykra, Alice stops at OLD WREN's door, because there may not be another chance. \"You knew. The first night. You held the mirror under her mouth, and you knew.\" Wren doesn't deny it. \"I knew you couldn't hear it yet. Five weeks you had a sister. I'd give them to you again.\" Alice: \"And the child?\" Wren: \"Still there. Cold holds what it holds. It held her heart still on that bridge, and it's holding the baby the same way. I didn't know if either would ever start again, so I told you it was gone.\" Alice can't decide whether to thank her or hate her, and there isn't time to decide. Wren touches the arm she set when Alice was nine: \"Nobody stood in front of you then, either. Go on.\" Alice goes.<\/p>"},{"oref":"Scene 6","id":176,"seq":6,"title":"Vykra laundry","added":false,"act":"Act One","kind":"scene","sum":"Grise: \"I sold your sister because she's worth more than you.\" Alice calls a challenge by Vykra law, and Vykra law says she goes through the mother's best knife first. Kit steps out of the steam. A knife fight among the sheets, fwip, fwip, shadows through linen, two girls who learned every move side by side. Kit is faster. Kit was always faster. Alice wins on a rhythm Miriam taught her, the counting game, the count she used to hide inside. One post, two post, through eight, and on nine she moves, the count the Lost One gave her, the one where you get up. Kit ends up on the wet boards with her own knife at her throat, laughing: \"You never once looked at the girl with the pot. You of all people.\" \"I'm looking now.\" Alice lets her up. Grise lays her knife on the counting table without being asked: she can count too. The Vykra girls pick up their knives. \"Where?\" \"Tyburn.\" Kit picks hers up last.","loc":"Vykra laundry","when":"Grise: \"I sold your sister because she's worth more than you.\" Alice calls a challenge by Vykra law.","th":"vykra","also":["sisters"],"ch":["grise","alice","kit"],"turn":"","w":301,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Grise: \"I sold your sister because she's worth more than you.\" Alice calls a challenge by Vykra law, and Vykra law says she goes through the mother's best knife first. Kit steps out of the steam. A knife fight among the sheets, <em>fwip, fwip<\/em>, shadows through linen, two girls who learned every move side by side. Kit is faster. Kit was always faster. Alice wins on a rhythm Miriam taught her, the counting game, the count she used to hide inside. One post, two post, through eight, and on <em>nine<\/em> she moves, the count the Lost One gave her, the one where you get up. Kit ends up on the wet boards with her own knife at her throat, laughing: \"You never once looked at the girl with the pot. You of all people.\" \"I'm looking now.\" Alice lets her up. Grise lays her knife on the counting table without being asked: she can count too. The Vykra girls pick up their knives. \"Where?\" \"Tyburn.\" Kit picks hers up last.<\/p>"},{"oref":"Scene 7","id":177,"seq":7,"title":"Harding House, the snowlit hall","added":false,"act":"Act One","kind":"scene","sum":"Josephine alone beside Byron's empty chair. She opens a hidden box of Vykra knives she hasn't touched in thirty years and puts them on.","loc":"Harding House","when":"Josephine alone beside Byron's empty chair.","th":"harding","also":["vykra"],"ch":["josephine"],"turn":"","w":142,"ed":"","fl":[],"html":"<p>Josephine alone beside Byron's empty chair. She opens a hidden box of Vykra knives she hasn't touched in thirty years and puts them on.<\/p>"},{"oref":"Scene 8","id":178,"seq":8,"title":"Newgate yard, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's forty come over the walls on leap-boosters, kshhh-THOOM in the snow. Flash-bursts strobe the yard. Nathaniel cuts the cell bars with his gauntlet. Eldgard: \"You came for me.\" \"I came for your ring.\" Two cells down, Nixon quietly opens 1417 as well. Old Marsh shuffles out into the yard, looks up at the snow, and says, perfectly lucid, \"They always count from the first snow.\" Cole persuades a turnkey to unlock the gate with extreme politeness and a lantern rifle.","loc":"Newgate yard","when":"Nixon's forty come over the walls on leap-boosters, kshhh-THOOM in the snow.","th":"guard","also":["harding"],"ch":["nixon","nathaniel","eldgard","marsh","cole"],"turn":"","w":291,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>Nixon's forty come over the walls on leap-boosters, <em>kshhh-THOOM<\/em> in the snow. Flash-bursts strobe the yard. Nathaniel cuts the cell bars with his gauntlet. Eldgard: \"You came for me.\" \"I came for your ring.\" Two cells down, Nixon quietly opens 1417 as well. Old Marsh shuffles out into the yard, looks up at the snow, and says, perfectly lucid, \"They always count from the first snow.\" Cole persuades a turnkey to unlock the gate with extreme politeness and a lantern rifle.<\/p>"},{"oref":"Scene 9","id":179,"seq":9,"title":"Newgate rooftops","added":false,"act":"Act Two","kind":"scene","sum":"Crown guards on the roofs. Eldgard can't leap, so Nixon carries him: the spare carrying the man who bred him. Eldgard: \"Thank you, Captain.\" Nixon: \"Don't.\"","loc":"Newgate rooftops","when":"Crown guards on the roofs.","th":"guard","also":["harding"],"ch":["nixon","eldgard"],"turn":"","w":148,"ed":"","fl":[],"html":"<p>Crown guards on the roofs. Eldgard can't leap, so Nixon carries him: the spare carrying the man who bred him. Eldgard: \"Thank you, Captain.\" Nixon: \"Don't.\"<\/p>"},{"oref":"Scene 10","id":180,"seq":10,"title":"The Works, the gallery and the core below","added":false,"act":"Act Two","kind":"scene","sum":"Snow thickens over Tyburn. Where it lies deep, wolves start to shape themselves out of the drifts. Vane is nervous. In his breast pocket is the sealed 1689 annex to the Harding Charter, the Crown's own signature on the chain; every Lord Chancellor has kept it locked in his desk, and tonight he took it out. Lambrick: \"Midnight. The girl, or the boy.\" Below them, cracks spread through the Heartglass around the Lost One: every time the glass hums toward the trade, her mother pulls against her own hooks, and another crack runs. Tik. Tik. Morgana, hoarse: \"You were free. Why did you come back?\" The Lost One: \"Because you're my mother.\" Morgana doesn't answer. Another crack runs. Footsteps on Byron's old Guard stair: Josephine is coming down.","loc":"The Works","when":"Snow thickens over Tyburn.","th":"city","also":["lambrick","white","harding"],"ch":["vane","lambrick","lostone","morgana","josephine"],"turn":"","w":513,"ed":"","fl":[],"html":"<p>Snow thickens over Tyburn. Where it lies deep, wolves start to shape themselves out of the drifts. Vane is nervous. In his breast pocket is the sealed 1689 annex to the Harding Charter, the Crown's own signature on the chain; every Lord Chancellor has kept it locked in his desk, and tonight he took it out. Lambrick: \"Midnight. The girl, or the boy.\" Below them, cracks spread through the Heartglass around the Lost One: every time the glass hums toward the trade, her mother pulls against her own hooks, and another crack runs. <em>Tik. Tik.<\/em> Morgana, hoarse: \"You were free. Why did you come back?\" The Lost One: \"Because you're my mother.\" Morgana doesn't answer. Another crack runs. Footsteps on Byron's old Guard stair: Josephine is coming down.<\/p>"},{"oref":"Scene 11","id":182,"seq":11,"title":"The outfall, outside the Works","added":false,"act":"Act Two","kind":"scene","sum":"The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle. Whimsy before the storm. Cole asks Tamara if married ladies are allowed to fight. She hands him a knife. Then Tamara's key turns. The Lanterns go over the walls and the Vykra go up the outfall.","loc":"The outfall","when":"The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle.","th":"harding","also":["guard","lambrick"],"ch":["alice","nixon","tamara","nathaniel","eldgard","cole"],"turn":"","w":260,"ed":"","fl":[],"html":"<p>The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle. Whimsy before the storm. Cole asks Tamara if married ladies are allowed to fight. She hands him a knife. Then Tamara's key turns. The Lanterns go over the walls and the Vykra go up the outfall.<\/p>"},{"oref":"Scene 12","id":184,"seq":12,"title":"The courtyard, set piece","added":false,"act":"Act Two","kind":"scene","sum":"A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men. Then the wolves come out of the drifts and attack everyone. Flash-bursts turn the snow green.","loc":"The courtyard","when":"A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men.","th":"city","also":["white"],"ch":[],"turn":"","w":150,"ed":"","fl":[],"html":"<p>A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men. Then the wolves come out of the drifts and attack everyone. Flash-bursts turn the snow green.<\/p>"},{"oref":"Scene 13","id":185,"seq":13,"title":"The courtyard","added":false,"act":"Act Three","kind":"scene","sum":"Ajax and the Black Gauntlet, WHUNK, drive Nathaniel into the ground. Ajax grins down at him, scarred from the Thames: \"You should've pulled me up, Harding.\" The fist goes up for the killing blow, and Eldgard steps under it. His ribs give way. Alice, who told him to pull Ajax up, drives the man off with flash after flash, and he retreats inside. Inside is the core, and her sister, and the clock on the Works tower says twenty to twelve. She has the charge left to chase \" Flash. \"Over the lock. Nixon's round went through his shoulder. He would have lived.\" Alice fires up the stairwell, and a body falls past the rail. \"I held his hand on the iron until the crack he'd cut closed over. It took all of him to mend it. I spent your brother on a crack in a lock.\" Nathaniel nearly drops him, and doesn't. That's the cruelty of it: he can't. \"And then you filled his coffin with slag. I opened it.\" \"The chain leaves nothing to bury. It left nothing of Otty. The Captain carried it for me.\" On the other shoulder, Nixon remembers the weight on the steps of St Bride's, and doesn't break step. Nathaniel: \"She says he's cold. Not dead.\" \"Don't go looking for him, Nathaniel. That's how she gets a Harding to the lock. Hoping.\"","loc":"The Snow Confession","when":"Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","otty","alice"],"turn":"","w":643,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Down into the dark, Eldgard's arms over his son's shoulder and the captain's, Alice backing down behind them with her gauntlet up, Crown boots on the stair above and flash-bursts lighting the stairwell white, <em>fzzt<\/em>, then black. He confesses the way he lived, in pieces, between shots. Nathaniel asks the question from the dressing room again, because this time there's no wedding to get through. \"Did you hold his hand?\" \"I held his hand.\" Flash. \"Over the lock. Nixon's round went through his shoulder. He would have lived.\" Alice fires up the stairwell, and a body falls past the rail. \"I held his hand on the iron until the crack he'd cut closed over. It took all of him to mend it. I spent your brother on a crack in a lock.\" Nathaniel nearly drops him, and doesn't. That's the cruelty of it: he can't. \"And then you filled his coffin with slag. I opened it.\" \"The chain leaves nothing to bury. It left nothing of Otty. The Captain carried it for me.\" On the other shoulder, Nixon remembers the weight on the steps of St Bride's, and doesn't break step. Nathaniel: \"She says he's cold. Not dead.\" \"Don't go looking for him, Nathaniel. That's how she gets a Harding to the lock. Hoping.\"<\/p>"},{"oref":"Scene 15","id":187,"seq":15,"title":"The Snow Confession, II: the landing","added":false,"act":"Act Three","kind":"scene","sum":"Halfway down, the Guard stair turns toward the core at a landing: the place Byron stood watch, on the stair Otty walked down singing. Eldgard's legs go, and they lay him on the stone. Snow has followed them down the stairwell. Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have. Eldgard: \"When you were five—\" Nathaniel: \"I know. I remember the girl at the foot of my bed. I remembered the lantern on my own.\" Eldgard almost laughs, blood in it: \"Then she was kinder than I was.\" He turns his head to Nixon, kneeling at his other side. \"Cadet line. My spare. I took you from the Orchard at six. Your mother asked after you every day for four years, and I told her you were learning your letters.\" Nixon: \"I was.\" \"I know. I checked.\" He means it as love. \"The Orchard's children stopped walking in 'thirty-nine, so I raised one outside it. A Hargrave with a name and a rank and a family to love, who would walk down that stair for my son one night without being asked. I couldn't order it. An order would have spoiled you. I let you lock him in on Lantern Night so you'd see what he was for.\" It's the worst thing he says all night. \"Forgive me, or don't.\" Nixon learns in one breath that he didn't kill Jamie, and what he was raised for, and does neither. \"Jamie found your mother's bunk, Captain. He chalked his initials over that door so the next one down would know somebody had seen it. Then he came up and asked me how many. I told him the truth, once. That was the night he stopped being my son and started being his own.\" To Nathaniel: \"There was always a way out. Free her, and pay in light. Open that lock and the light dies for good, the walls with it, the White comes through till dawn, and one of us walks into it with her. It has to be given. She won't take it. Alistair chose sons. My father chose my sister Otty. Aunt Hester ran the week before the snow, and Otty was nineteen. She walked down the stair singing, and Byron held her ribbon. I was eight. They told me Switzerland, and they cut it in brass. And the Crown knew. Every Lord Chancellor since 1689 has signed the annex and locked it in his desk. Vane signed it in my study and asked me to spare him the details.\" The thing he's never said: \"I could have gone down that stair myself. I could have opened the lock and walked into the White with her. I raised a boy for it instead.\" Flash: the Serpentine, twenty years ago. Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls. Then, kneeling on the ice: \"One day the city will need you to be very brave.\" \"I'll be brave, Papa.\" On the bank, JOSEPHINE holds the boy's scarf and doesn't take her eyes off him. Back: he presses the wolf-crest ring into Nathaniel's palm. \"Don't be me. The lock opens with what closed it: Harding blood, this ring, and a blade that's already in it.\" Nathaniel's other hand goes behind him without looking, and finds Alice's. He dies. The snow that followed them down the stairwell settles on his open eyes and doesn't melt.","loc":"The Snow Confession","when":"Eldgard: \"When you were five—\" Nathaniel: \"I know.","th":"harding","also":["guard","white"],"ch":["eldgard","nixon","nathaniel","jamie","alistair","alice"],"turn":"","w":976,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Halfway down, the Guard stair turns toward the core at a landing: n. I was eight. They told me Switzerland, and they cut it in brass. And the Crown knew. Every Lord Chancellor since 1689 has signed the annex and locked it in his desk. Vane signed it in my study and asked me to spare him the details.\" The thing he's never said: \"I could have gone down that stair myself. I could have opened the lock and walked into the White with her. I raised a boy for it instead.\" <em>Flash:<\/em> the Serpentine, twenty years ago. Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls. Then, kneeling on the ice: \"One day the city will need you to be very brave.\" \"I'll be brave, Papa.\" On the bank, JOSEPHINE holds the boy's scarf and doesn't take her eyes off him. <em>Back:<\/em> he presses the wolf-crest ring into Nathaniel's palm. \"Don't be me. The lock opens with what closed it: Harding blood, this ring, and a blade that's already in it.\" Nathaniel's other hand goes behind him without looking, and finds Alice's. He dies. The snow that followed them down the stairwell settles on his open eyes and doesn't melt.<\/p>"},{"oref":"Scene 16","id":189,"seq":16,"title":"The landing, then the last flight","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel stands. He doesn't put the ring on. He pockets it. Above them, the Crown troops have found the Guard stair. Nixon goes back up to hold it, and Tamara comes down it to meet him with her father's key still in her fist. Under fire, she says: \"If we die, I want it on record I was married for twelve hours.\" Nixon: \"Noted.\" Flash. Flash. Alice is at Nathaniel's side. They take the last flight down.","loc":"The courtyard","when":"Nathaniel stands.","th":"harding","also":["guard","city"],"ch":["nathaniel","alice","nixon","tamara"],"turn":"","w":378,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Nathaniel stands. He doesn't put the ring on. He pockets it. Above them, the Crown troops have found the Guard stair. Nixon goes back up to hold it, and Tamara comes down it to meet him with her father's key still in her fist. Under fire, she says: \"If we die, I want it on record I was married for twelve hours.\" Nixon: \"Noted.\" Flash. Flash. Alice is at Nathaniel's side. They take the last flight down.<\/p>"},{"oref":"Scene 17","id":191,"seq":17,"title":"The core floor","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel and Alice reach the bottom. The Lost One is screaming inside the cracking Heartglass, Morgana is straining at her hooks, Lambrick and Vane are on the gallery, and Josephine is at the lever.","loc":"The core floor","when":"Nathaniel and Alice reach the bottom.","th":"white","also":["city"],"ch":["nathaniel","alice","lostone","morgana","lambrick","vane","josephine"],"turn":"","w":168,"ed":"","fl":[],"html":"<p>Nathaniel and Alice reach the bottom. The Lost One is screaming inside the cracking Heartglass, Morgana is straining at her hooks, Lambrick and Vane are on the gallery, and Josephine is at the lever.<\/p>"},{"oref":"Scene 18","id":192,"seq":18,"title":"The core","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel: \"Mother. Step away.\" Alice: \"That's my sister.\" Josephine, gently, to neither of them: \"Your father said her mother would never allow it.\" Nathaniel: \"Then don't.\" \"Four hundred years in hooks, Nathaniel. Nobody refuses the door.\" It's the choice she made at breakfast in Episode 7, between her son and everything else, made one last time with her hand on iron. If the girl holds, no Harding dies tonight, and Josephine can live with what it cost. She pulls the lever. Cut to black.","loc":"The core","when":"Nathaniel: \"Mother.","th":"harding","also":["white"],"ch":["nathaniel","alice","josephine"],"turn":"","w":311,"ed":"","fl":[],"html":"<p>Nathaniel: \"Mother. Step away.\" Alice: \"That's my sister.\" Josephine, gently, to neither of them: \"Your father said her mother would never allow it.\" Nathaniel: \"Then don't.\" \"Four hundred years in hooks, Nathaniel. Nobody refuses the door.\" It's the choice she made at breakfast in Episode 7, between her son and everything else, made one last time with her hand on iron. If the girl holds, no Harding dies tonight, and Josephine can live with what it cost. She pulls the lever. Cut to black.<\/p>"}]},{"n":10,"title":"The Tithe","time":"THE LAST NIGHT","clock":"THE LAST NIGHT","act":"III","log":"The Heartglass cracks, the Crown comes for the last Harding son, and Nixon offers himself instead. Nathaniel does what no Harding has done in four hundred years. He opens the lock, and London pays in light.","sum":"The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE","turn":"Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name","focus":"the choice Alistair refused","piece":"London goes dark for good, and the White comes through","threads":["white","harding","guard","city","lambrick"],"frame":"<blockquote><p><strong>Focus:<\/strong> the choice Alistair refused<\/p><p><strong>Set piece:<\/strong> every light and every wall in London goes dark for good, and the White comes through<\/p><p><strong>Double twist:<\/strong> Nathaniel refuses every sacrifice offered to him, Morgana still demands a Harding, and Josephine goes in his place<\/p><p><strong>Final image:<\/strong> \"The Record,\" a montage of the season's climaxes under Nathaniel's voice, ending on a heartbeat, then a hard cut to Jamie, kept in the White<\/p><\/blockquote>","scenes":[{"oref":"Scene 1","id":193,"seq":1,"title":"The core, 1489, an hour before the pilot's cold open","added":false,"act":"Cold open","kind":"scene","sum":"The voice over black one last time: \"He carried the lantern down the stair himself, because his father asked him to.\" Alistair at the chain, his net still wet with frost; the child is in it. Morgana, fresh in her hooks, makes him an offer: \"Free me, and pay in light. Keep me, and pay in sons.\" Then the part no Harding ever wrote down: \"Either way, my child goes free tonight.\" He slides the wolf-crest ring onto his finger. \"Sons.\" He cuts the net. In the doorway behind him, his firstborn, Edric, nine years old, the boy with the lantern from the pilot, holds it up for his father, then carries it down the stair ahead of him, alone. The same choice Nathaniel faces tonight.","loc":"The core","when":"Alistair at the chain, his net still wet with frost; the child is in it.","th":"white","also":["harding"],"ch":["alistair","morgana"],"turn":"","w":381,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>The voice over black one last time: \"He carried the lantern down the stair himself, because his father asked him to.\" Alistair at the chain, his net still wet with frost; the child is in it. Morgana, fresh in her hooks, makes him an offer: \"Free me, and pay in light. Keep me, and pay in sons.\" Then the part no Harding ever wrote down: \"Either way, my child goes free tonight.\" He slides the wolf-crest ring onto his finger. \"Sons.\" He cuts the net. In the doorway behind him, his firstborn, Edric, nine years old, the boy with the lantern from the pilot, holds it up for his father, then carries it down the stair ahead of him, alone. The same choice Nathaniel faces tonight.<\/p>"},{"oref":"Scene 2","id":194,"seq":2,"title":"The core, ten minutes to midnight","added":false,"act":"Act One","kind":"scene","sum":"The lever drops. The Heartglass floods the Lost One with green fire, and she screams, and the door swings open for her mother: the hooks loosen, and for the first time in four hundred years Morgana could step out. She doesn't. She takes the chain in both hands and drags herself back onto the iron, hooks tearing deeper, pulling against the trade until the glass around her daughter cracks from her side. Krrrrk. \"Not her.\" The chain shudders and doesn't take. At the lever, Josephine watches a mother refuse the door and hears her husband in Newgate: You would. Lambrick, from the gallery: \"Then the boy. He'll walk if it saves somebody. Take the girl he came for.\" Vane's marshals start down the stairs, for Alice.","loc":"The core","when":"The lever drops.","th":"harding","also":["white"],"ch":["lostone","lambrick","vane","josephine","morgana"],"turn":"","w":496,"ed":"Revised in the Oct 10 pass","fl":[],"html":"<p>The lever drops. The Heartglass floods the Lost One with green fire, and she screams, and the door swings open for her mother: the hooks loosen, and for the first time in four hundred years Morgana could step out. She doesn't. She takes the chain in both hands and drags herself back onto the iron, hooks tearing deeper, pulling against the trade until the glass around her daughter cracks from her side. <em>Krrrrk.<\/em> \"Not her.\" The chain shudders and doesn't take. At the lever, Josephine watches a mother refuse the door and hears her husband in Newgate: <em>You would.<\/em> Lambrick, from the gallery: \"Then the boy. He'll walk if it saves somebody. Take the girl he came for.\" Vane's marshals start down the stairs, for Alice.<\/p>"},{"oref":"Scene 3","id":195,"seq":3,"title":"The core floor","added":false,"act":"Act One","kind":"scene","sum":"Alice smashes the Heartglass with her gauntlet, KSSHHH, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs to make her son walk, and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better, and her last cut opens Alice under the ribs. Nathaniel steps between them: \"Mother.\" On the stair afterwards, the half-crystal girl, through chattering teeth, tells Alice what she heard in the hour the walls went cold, among the dead arriving out on th ng into the iron, knowing what his father told him in the snow it costs: when the chain breaks, one of the house goes with her. His father's warning is in his ear: hoping. He can't swear his brother isn't part of why his hand is steady. Harding blood closed it, and Harding blood opens it, but it took an undercity girl's burned hand to get the blade out. Somewhere above, a church bell strikes twelve.","loc":"The lock","when":"Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years.","th":"white","also":["harding"],"ch":["nathaniel","alice"],"turn":"","w":805,"ed":"Revised Nov 8: heat walls and staggered reveals","fl":[],"html":"<p>Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years. Nathaniel pulls, and it doesn't move. <em>Krrk.<\/em> His hands slip on it. Alice is beside him before he asks, and the gauntlet he built for her in the glasshouse, strap by strap, is already whining up to overload, <em>eeeeeeee<\/em>, the way he told her never to run it. He knows what she's about to do. \"If this works, every light in London goes out, and every wall with it. They'll hate me for a hundred years.\" She has already counted Gin Lane's coal and its doors. \"Us,\" she says, and puts the gauntlet's core against the iron. The heat comes back through the plate into her palm and she holds it there, the smell of her own glove burning, until the ice round the blade lets go. He pulls it free, cuts his palm on it, and presses his blood and his father's wolf ring into the iron, knowing what his father told him in the snow it costs: when the chain breaks, one of the house goes with her. His father's warning is in his ear: <em>hoping<\/em>. He can't swear his brother isn't part of why his hand is steady. Harding blood closed it, and Harding blood opens it, but it took an undercity girl's burned hand to get the blade out. Somewhere above, a church bell strikes twelve.<\/p>"},{"oref":"Scene 6","id":198,"seq":6,"title":"London","added":false,"act":"Act One","kind":"scene","sum":"The chain falls. The last time London went dark, the light came back within the hour. This time the green dies street by street, the same wave as the pilot, and nothing comes back. On the horizon the walls go out sector by sector, the one thing nobody was ever allowed to switch off, and the outerland cold comes in over them like a tide. One wordless shot after another: a tram dying in the snow, its enamel bill still promising HARDING LIGHT. WARM AS A MOTHER'S ARMS, a hospital ward going black, a mother on Gin Lane lighting a tallow candle with shaking hands. Under the Works, Nathaniel listens, and for the first time since he was five, nothing is crying in the walls.","loc":"London","when":"The chain falls.","th":"city","also":["white"],"ch":[],"turn":"","w":241,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>The chain falls. The last time London went dark, the light came back within the hour. This time the green dies street by street, the same wave as the pilot, and nothing comes back. On the horizon the walls go out sector by sector, the one thing nobody was ever allowed to switch off, and the outerland cold comes in over them like a tide. One wordless shot after another: a tram dying in the snow, its enamel bill still promising HARDING LIGHT. WARM AS A MOTHER'S ARMS, a hospital ward going black, a mother on Gin Lane lighting a tallow candle with shaking hands. Under the Works, Nathaniel listens, and for the first time since he was five, nothing is crying in the walls.<\/p>"},{"oref":"Scene 7","id":199,"seq":7,"title":"The core","added":false,"act":"Act Two","kind":"scene","sum":"Morgana rises out of the pit as her wounds close, nine feet tall. She looks down at Nathaniel and says his name, the way her daughter heard it whispered in a nursery sixteen years ago: \"Nathaniel.\" Then: \"A Harding opened it.\" She doesn't thank him. The White pours through behind her, with wind, snow and wolves, and she goes up through the Works roof toward Tyburn hill. Where the chain was anchored, the core floor splits, and the White comes up through the crack in a wall of wind: Alice and the half-crystal girl on the outfall side, Nathaniel and his mother on the other. Alice can't see across it. The girl in her arms is going colder by the minute, the outfall is the only way open, and the only fire Alice can count on tonight is on Gin Lane, where the Vykra are holding. She takes it.","loc":"The core","when":"Morgana rises out of the pit as her wounds close, nine feet tall.","th":"white","also":["city"],"ch":["morgana","nathaniel"],"turn":"","w":205,"ed":"Revised Nov 10: the sisters merged, Edmund, the turtle, Alistair","fl":[],"html":"<p>Morgana rises out of the pit as her wounds close, nine feet tall. She looks down at Nathaniel and says his name, the way her daughter heard it whispered in a nursery sixteen years ago: \"Nathaniel.\" Then: \"A Harding opened it.\" She doesn't thank him. The White pours through behind her, with wind, snow and wolves, and she goes up through the Works roof toward Tyburn hill. Where the chain was anchored, the core floor splits, and the White comes up through the crack in a wall of wind: Alice and the half-crystal girl on the outfall side, Nathaniel and his mother on the other. Alice can't see across it. The girl in her arms is going colder by the minute, the outfall is the only way open, and the only fire Alice can count on tonight is on Gin Lane, where the Vykra are holding. She takes it.<\/p>"},{"oref":"Scene 8","id":201,"seq":8,"title":"The core stair","added":false,"act":"Act Two","kind":"scene","sum":"Nixon against Ajax: quench-blade against Black Gauntlet. Nixon takes the quick-takedown: blade into the gauntlet's crystal, which freezes the piston, then into Ajax. He dies frozen mid-laugh, his apple rolling down the stairs. With Ajax dead, the Guard stair is clear: the one way out of the Works the wolves haven't found. Nixon whistles down it the third signal they made up at nine, the one they never once needed: come on.","loc":"The core stair","when":"Nixon against Ajax: quench-blade against Black Gauntlet.","th":"guard","also":[],"ch":["nixon","ajax"],"turn":"","w":166,"ed":"","fl":[],"html":"<p>Nixon against Ajax: quench-blade against Black Gauntlet. Nixon takes the quick-takedown: blade into the gauntlet's crystal, which freezes the piston, then into Ajax. He dies frozen mid-laugh, his apple rolling down the stairs. With Ajax dead, the Guard stair is clear: the one way out of the Works the wolves haven't found. Nixon whistles down it the third signal they made up at nine, the one they never once needed: <em>come on<\/em>.<\/p>"},{"oref":"Scene 9","id":202,"seq":9,"title":"London, the night the snow came early","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. The Vykra hold Gin Lane with knives and candles. Alice holds the lane with the Lost One wrapped in coats in a doorway behind her, as close to the coal as Alice can get her, and between wolves she grabs Kit, who fought her for the Vykra six hours ago. \"Go to the Works. Find out if he's alive. Don't tell him I asked.\" Kit goes. Alice is three steps after her before she knows she's moving; behind her a child starts to scream, aaaAAH, and she turns back to her knife. Every time a flash lights the sky over Tyburn, she looks. Tamara throws open every Lambrick coal depot free to the city and opens the old valves on her father's maps. Coal can't hold the walls, not all of them, not all night, so she doesn't try: she sends it where the people are, and there are fires in every street. On Gin Lane the Vykra hold the wolves at a ring of Lambrick coal; without it, the lane would have frozen before the wolves ever reached it. Whimsy in the dark: Cole teaches a crowd of children to make flash-shadow rabbits on the walls.","loc":"London","when":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements.","th":"city","also":["guard"],"ch":["nixon","tamara","cole","nathaniel","kit"],"turn":"","w":554,"ed":"Revised Nov 9: pressure pass (Weeks, Willimon, Nolan)","fl":[],"html":"<p>Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. The Vykra hold Gin Lane with knives and candles. Alice holds the lane with the Lost One wrapped in coats in a doorway behind her, as close to the coal as Alice can get her, and between wolves she grabs Kit, who fought her for the Vykra six hours ago. \"Go to the Works. Find out if he's alive. Don't tell him I asked.\" Kit goes. Alice is three steps after her before she knows she's moving; behind her a child starts to scream, <em>aaaAAH<\/em>, and she turns back to her knife. Every time a flash lights the sky over Tyburn, she looks. Tamara throws open every Lambrick coal depot free to the city and opens the old valves on her father's maps. Coal can't hold the walls, not all of them, not all night, so she doesn't try: she sends it where the people are, and there are fires in every street. On Gin Lane the Vykra hold the wolves at a ring of Lambrick coal; without it, the lane would have frozen before the wolves ever reached it. Whimsy in the dark: Cole teaches a crowd of children to make flash-shadow rabbits on the walls.<\/p>"},{"oref":"Scene 10","id":203,"seq":10,"title":"The Tyburn Road barricade","added":false,"act":"Act Two","kind":"scene","sum":"The charges run out along Cole's line, a barricade of overturned trams across Tyburn Road, the last thing between Gin Lane's fires and the hill. He holds it with his last cartridge, two fingers short and seventeen years old, until it's empty. Behind his line, a girl in a Vykra glove comes up the road with another girl in her arms, half crystal, heading for Tyburn, because an hour before dawn the girl woke by the fire and asked for her mother. He knows her: the ghostlight girl from the market, who fought beside him at the Works gate. He doesn't know why she's carrying the Frost Witch toward the hill, and he doesn't ask. He holds the road until she's past it. Nixon finds him in the last dark before dawn, sitting up against an overturned tram as if he were resting, his diary open in his lap. Under the burned log page, a last line in pencil: Held the road. Nobody past who shouldn't be.","loc":"Tyburn Road","when":"The charges run out along Cole's line, a barricade of overturned trams across Tyburn Road, the last thing between Gin Lane's fires and the hill.","th":"guard","also":["city"],"ch":["cole","nixon"],"turn":"","w":220,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>The charges run out along Cole's line, a barricade of overturned trams across Tyburn Road, the last thing between Gin Lane's fires and the hill. He holds it with his last cartridge, two fingers short and seventeen years old, until it's empty. Behind his line, a girl in a Vykra glove comes up the road with another girl in her arms, half crystal, heading for Tyburn, because an hour before dawn the girl woke by the fire and asked for her mother. He knows her: the ghostlight girl from the market, who fought beside him at the Works gate. He doesn't know why she's carrying the Frost Witch toward the hill, and he doesn't ask. He holds the road until she's past it. Nixon finds him in the last dark before dawn, sitting up against an overturned tram as if he were resting, his diary open in his lap. Under the burned log page, a last line in pencil: <em>Held the road. Nobody past who shouldn't be.<\/em><\/p>"},{"oref":"Scene 11","id":204,"seq":11,"title":"The core, empty","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel and Josephine alone, the hooks hanging empty. \"I'd do it all again.\" \"I know. That's why I can't be you.\" At the foot of the stair she stops. \"I paid for that girl.\" \"You paid for a week, Mother. You couldn't afford the rest.\" Josephine almost smiles. It's the first thing about her son she has ever failed to buy. Boots on the stair: Kit, bleeding from the scalp. \"Gin Lane's holding. Just. She said not to tell you she asked.\" Nathaniel is at the stair before she has finished. And Josephine, who has controlled every door in his life, says: \"Go to her.\" It's so unlike her that he stops with his hand on the rail and looks at her, really looks, and sees a woman who has already decided something. \"Not until you tell me where you're going.\" She won't. So he stays, and doesn't go to the girl he loves, because he's watching his mother the way she taught him to watch everyone. He's still watching when she starts up the hill, by the Guard stair Nixon cleared.","loc":"The core","when":"Nathaniel and Josephine alone, the hooks hanging empty.","th":"harding","also":[],"ch":["nathaniel","josephine","jamie","alice","kit"],"turn":"","w":1653,"ed":"Revised Nov 10: Josephine never bought Miriam","fl":[],"html":"<p>Nathaniel and Josephine alone, the hooks hanging empty. \"I'd do it all again.\" \"I know. That's why I can't be you.\" At the foot of the stair she stops. \"I paid for that girl.\" \"You paid for a week, Mother. You couldn't afford the rest.\" Josephine almost smiles. It's the first thing about her son she has ever failed to buy. Boots on the stair: Kit, bleeding from the scalp. \"Gin Lane's holding. Just. She said not to tell you she asked.\" Nathaniel is at the stair before she has finished. And Josephine, who has controlled every door in his life, says: \"Go to her.\" It's so unlike her that he stops with his hand on the rail and looks at her, really looks, and sees a woman who has already decided something. \"Not until you tell me where you're going.\" She won't. So he stays, and doesn't go to the girl he loves, because he's watching his mother the way she taught him to watch everyone. He's still watching when she starts up the hill, by the Guard stair Nixon cleared.<\/p>"},{"oref":"Scene 12","id":205,"seq":12,"title":"Tyburn hill, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Morgana stands over London in the storm, with wolves in a ring around her. Four hundred years of grievance. Josephine climbs, and Nathaniel climbs after her. Up Tyburn Road, past the barricade a seventeen-year-old held to his last cartridge, Alice comes up the hill carrying the Lost One. Across the snow they see each other for the first time since the lock, alive, and there's no time for any of it.","loc":"Tyburn hill","when":"Morgana stands over London in the storm, with wolves in a ring around her.","th":"white","also":["harding"],"ch":["morgana","nathaniel","alice","lostone","josephine"],"turn":"","w":281,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>Morgana stands over London in the storm, with wolves in a ring around her. Four hundred years of grievance. Josephine climbs, and Nathaniel climbs after her. Up Tyburn Road, past the barricade a seventeen-year-old held to his last cartridge, Alice comes up the hill carrying the Lost One. Across the snow they see each other for the first time since the lock, alive, and there's no time for any of it.<\/p>"},{"oref":"Scene 13","id":206,"seq":13,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\"","loc":"Tyburn hill","when":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood.","th":"white","also":["sisters"],"ch":["lostone","alice","morgana"],"turn":"","w":446,"ed":"","fl":[],"html":"<p>The Lost One sets herself down in front of Alice, between her mother and the city, the place Miriam never once stood. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\"<\/p>"},{"oref":"Scene 14","id":243,"seq":14,"title":"The Works vault, intercut with Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The last hour before dawn. Lambrick has been filling satchels with the last gallowglass all night. Cut off from the chain, it dies slowly: every crystal in the vault is a shade dimmer than it was at midnight, and he's packing them as if he can outrun the dawn. Tamara finds him and offers her hand: \"Come out, Father.\" He holds up a satchel to her, almost pleading, and in his hands the glow is going out while they talk: \"This is for you. All of it. It was always for you.\" \"Then leave it.\" He looks at the crystals. He looks at her. He can't put them down; he never could. She walks out. Behind her the wolves come into the vault. Cut back to the hill, where a mother is being asked the same question.","loc":"The Works vault","when":"The last hour before dawn.","th":"lambrick","also":["white"],"ch":["tamara","lambrick"],"turn":"","w":446,"ed":"Revised Oct 14: polish pass","fl":[],"html":"<p>The last hour before dawn. Lambrick has been filling satchels with the last gallowglass all night. Cut off from the chain, it dies slowly: every crystal in the vault is a shade dimmer than it was at midnight, and he's packing them as if he can outrun the dawn. Tamara finds him and offers her hand: \"Com
