he chain of their own free will before midnight, or the chain breaks.<\/li>\n<li><strong>Harding blood is the key.<\/strong> Only Harding blood can hold the chain, mend it or open it, and her cold can't touch it. That's how Eldgard mends the crack Jamie cut, why the Lost One can take Nathaniel's hand without freezing him, and why Nixon, a Hargrave, is Harding blood too.<\/li>\n<li><strong>Breaking it has a price.<\/strong> If the chain breaks, she goes free, the light goes out for good and the walls with it, the White comes through until dawn, and one of the house that chained her goes with her into the White. It has to be given. She won't take it.<\/li>\n<li><strong>The Lost One's cold costs her Miriam.<\/strong> The cold comes out of her when she feels too much or when she chooses to use it, and it kills by touch. Every time it comes out, it burns one of Miriam's memories. While it's in her, it holds Miriam's body exactly as it was on the bridge.<\/li>\n<\/ol>\n<p>Everything else in the season is people, not rules.<\/p>\n<p><strong>The long winter and the walls.<\/strong> This isn't a fifth rule. It's what the first three look like from outside: the chain holds her, but not all of her. It didn't seal the crack between London and the White. It pinned it open a finger's width, and for four hundred years her winter has seeped out through it into the land around London. Past the walls it is always November, and worse: ice on the ponds in July, frosts that kill sheep in the field, a cold that kills a man who sleeps out in it. That cold is weather, and it kills the ordinary way. The White is something else: the wound itself, with wolves in it and time stopped, and it only comes through a damaged lock or a thin place. The walls keep out the first. Nothing keeps out the second.<\/p>\n<ul>\n<li><strong>The heat walls.<\/strong> A ring of green-glass heat walls, fed off the Ring, stands round London in twelve sectors. The first went up round the City in 1502, and by 1800 they enclosed everything from Kensington to the Isle of Dogs. Past them lie the outerlands: farms, villages and the north road, cold and poor. The Hardings sell protection from a winter they made, and nobody knows it.<\/li>\n<li><strong>Snow.<\/strong> It falls on the outerlands all winter. Inside the walls it melts before it touches the ground. <em>First snow over Tyburn<\/em> is the first snow that settles inside them.<\/li>\n<li><strong>The dimming.<\/strong> Toward the end of every fifty-year cycle, as the chain frays, she bleeds less and the walls draw less. The public never notices; the Works' own gauges do. Eldgard's line: \"The output dips at the end of a cycle. My father saw it in 1839. It comes back.\" It comes back when a Harding walks down the stair.<\/li>\n<li><strong>The coal network.<\/strong> Before gallowglass, the walls were coal braziers. When the Hardings fitted the glass burners they left the old coal mains, valves and furnace rooms connected underneath. Lambrick owns them, the furnace plans, and the men who still know how to light them. Coal can carry a few sectors for hours. It can't heat the whole city through a night. That makes coal something people fight over, not a way out.<\/li>\n<li><strong>The founder myth.<\/strong> Alistair Harding, <em>Builder of the Light<\/em>, in bronze at the Works gate and in oils as <em>The Lamp-Maker<\/em> in the Works hall. The Alistair Medal for engineering, which Nathaniel has wanted since he was eight. Schoolchildren learn that genius lit London.<\/li>\n<li><strong>Mother liquor.<\/strong> The best lie is mostly true: gallowglass really does grow from Tyburn iron. Her blood is only the seed. One drop in a vat of molten iron turns it to crystal in a week, and the engineers who grow it call the seed by the chemists' word for the liquid crystals grow out of: <em>mother liquor<\/em>. They say it fifty times a day. It comes up the Keeper's stair in sealed flasks, and nobody asks. Stolen crystal can't grow more without it; cut off from the chain it goes dull, and the trade calls it dead glass.<\/li>\n<li><strong>The beast.<\/strong> Each rank keeps a different secret. London believes in iron. The engineers believe in iron and a catalyst. The Lantern Guard are told there is a <em>beast<\/em> under the Works, the thing that makes the long winter, and that the chain holds the winter back: the truth turned inside out, and they're proud to be its jailers. Only the Keeper knows she is a woman, a mother, and the reason it's cold.<\/li>\n<li><strong>Xyon.<\/strong> Undercity glim cut with a compound from the Vykra stillrooms. A little makes a girl pliable and takes the hour before it; a lot kills slowly. When the green dies, the dust in the blood goes dead with it, and the lost hour comes back. Edmund Lambrick calls the doses he gives girls his \"kindnesses.\"<\/li>\n<li><strong>Class is geography.<\/strong> Mayfair and Westminster sit deep inside, behind two rings of heat. Gin Lane, Shadwell and Whitechapel lie against the east wall, the oldest and worst-kept sector. When the walls dim, Alice's neighbours freeze first.<\/li>\n<\/ul>\n<p><strong>The frost line, episode by episode<\/strong><\/p>\n<table>\n<thead><tr><th>Ep<\/th><th>The walls<\/th><\/tr><\/thead>\n<tbody><tr><td>1<\/td><td>Glowing steady on the horizon. When the city blacks out, they stay lit on their own mains. Nobody looks at them<\/td><\/tr><tr><td>3<\/td><td>Nathaniel's gauges show the east sector drawing less heat every week. Gallowglass isn't supposed to run down<\/td><\/tr><tr><td>4<\/td><td>Lambrick reads the figures into the Crown's record at the hearing<\/td><\/tr><tr><td>5<\/td><td>Every lamp bursts on Lantern Night, and the east and west sectors go grey<\/td><\/tr><tr><td>6<\/td><td>Lambrick relights the west on coal and is cheered in the street. The east, Gin Lane's, stays grey<\/td><\/tr><tr><td>7<\/td><td>Frost on the inside of Gin Lane's windows<\/td><\/tr><tr><td>8<\/td><td>Snow settles inside the walls for the first time in living memory<\/td><\/tr><tr><td>10<\/td><td>Nathaniel can name every district he will expose before he opens the lock. Then every wall goes dark<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>The three layers of the secret<\/strong><\/p>\n<table>\n<thead><tr><th>Layer<\/th><th>Who believes it<\/th><th>What it says<\/th><\/tr><\/thead>\n<tbody><tr><td>Public<\/td><td>London<\/td><td>Gallowglass grows from iron under Tyburn. In 1489 the Hargrave rebels were hanged there for treason. The walls keep out the hard winter of the outerlands, which has always been there.<\/td><\/tr><tr><td>Second<\/td><td>Glim addicts, old Guardsmen, the Vykra<\/td><td>The light hums with a woman crying. People call it the Weeping and say it's the hanged. Old Works hands talk about the dimming: every fifty years the walls go grey, then come back.<\/td><\/tr><tr><td>Truth<\/td><td>Eldgard, later Nathaniel<\/td><td>Morgana, a mother from the White, has been chained under the Works since 1489. The Hargraves were a Harding cadet branch, hanged by their own cousins for trying to free her. Her daughter ran into the snow. The winter is hers too.<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>What gallowglass does<\/strong><\/p>\n<ul>\n<li>Burned in lamps and furnaces, it gives a green-white light and steady heat. The Ring, London's lamp grid, carries it under every street.<\/li>\n<li>Ground to dust it becomes <strong>glim<\/strong>, the undercity's drug. Users hear the Weeping, which is the first clue, given in Episode 1. It is Morgana's lullaby to her daughter, and London has sung it for four hundred years as the Lantern Hymn, with new words nailed over the old tune. Her daughter can hear what nobody else can under it: the names of every life the house fed her.<\/li>\n<\/ul>\n<p><strong>The Royal Lantern Guard.<\/strong> Chartered in 1689 to protect the Ring, they are London's elite, armed by the Harding Works. Oath: <em>Light the dark. Keep the flame.<\/em> Ranks run Wick (recruit), Flame (trooper), Lantern-Captain.<\/p>\n<ul>\n<li><strong>Lantern gauntlet:<\/strong> a forearm rig with a gallowglass core. It fires a <strong>flash-burst<\/strong>, a blinding strobe that drops a man and sends wolves of the White running.<\/li>\n<li><strong>Leap-boosters:<\/strong> steam and crystal thrust packs for rooftop flight, thirty seconds per charge. When the charge runs out, you fall.<\/li>\n<li><strong>Tether-hook:<\/strong> a grapple line for swings and quick climbs.<\/li>\n<li><strong>Quench-blade:<\/strong> a glass sabre that drinks heat, built for fast takedowns. One touch numbs a limb; a long cut freezes the blood.<\/li>\n<li><strong>Lantern rifle:<\/strong> fires crystal rounds that burst into light. Every discharge goes into a log, bound into the rifle's case and audited whenever the rifles go back to the Works. That log matters in Episodes 4 and 10.<\/li>\n<\/ul>\n<p><strong>Undercity tech.<\/strong> <strong>Ghostlights<\/strong> are bootleg gauntlets, unstable and loud. Alice builds hers from parts stolen out of Nathaniel's shop. <strong>Ajax's Black Gauntlet<\/strong> is Nathaniel's own abandoned prototype, stolen two years ago, which hits like a piston.<\/p>\n<p><strong>The Vykra.<\/strong> A guild of undercity women, spies and knives for hire, run by Mother Grise from a Shadwell laundry. Their mark is a knot stitched inside the glove. Their poison, <strong>winter's kiss<\/strong>, is distilled from gallowglass and kills with frost on the lips, so it looks like the Frost Killer's work.<\/p>\n<p><strong>The White.<\/strong> A world of snow, wind and wolves on the far side of the chain. Time stops there. Whatever this side sends into it is kept exactly as it went in, and doesn't come back.<\/p>\n<p><strong>Places.<\/strong> Harding House (Mayfair) and its glasshouse. The Harding Works over Tyburn, with the core deep below. Gin Lane tenements, against the east wall. The heat walls, and the outerlands beyond them; Hester Pell's cottage past Barnet, outside the north wall. Blackwood Bridge. The Shadwell laundry. Lambrick House and the Pimlico gasworks, where the Tyburn conduit (the old Works drain) runs under the city into the Thames. The Lantern Guard tower at Charing Cross. Parliament. Newgate.<\/p>\n<p>The Hardings did not find a monster. They took a mother, and four centuries of light run on that. Alistair's son paid the founding in 1489, a Harding sister paid in 1839, and 1889 is the second cycle.<\/p>\n<table>\n<thead><tr><th>Year<\/th><th>What happened<\/th><th>Where we learn it<\/th><\/tr><\/thead>\n<tbody><tr><td>1488<\/td><td>Alistair Harding, a failed architect (his cathedral roof fell in, his bridge went down on its opening day), married and the father of a boy of eight, is caught by a storm on the gallows field at Tyburn, where the wall between worlds has worn thin. He walks into the white-out and comes out in the White. There he meets Morgana, a spirit of that winter country who speaks every language ever spoken. Time doesn't pass in the White; he stays what feels like a year, and London misses one night. He tells her he loves her in Latin, French and English. She understands every word and never once the meaning. She forges him a path home, takes a human body, and walks into London on his arm, carrying his child.<\/td><td>Ep 7 (the drawing of the iron room), Ep 10 (Tyburn hill, the Record)<\/td><\/tr><tr><td>1489<\/td><td>Under the foundations he has started, there is an iron room he drew before he ever met her. Their daughter is born in it. He takes the baby out and names his terms: <em>make me light.<\/em> She opens her own wrist into his lantern. He keeps one promise: he carries the child to the treeline and steps aside, and she runs into the White. Then Morgana speaks her curse, written to match his crime: <em>\"You took my love with a lie. Your house keeps my light only with love given freely: one of your own, every fifty winters, walking down knowing exactly what it costs.\"<\/em><\/td><td>Ep 1 cold open, Ep 10 cold open and Tyburn hill<\/td><\/tr><tr><td>1488–89<\/td><td>A hard winter. The wall between London and the White thins at Tyburn, and Morgana's daughter wanders through. The Hardings are the Crown's hangmen at Tyburn.<\/td><td>Ep 5 (Morgana), Ep 9<\/td><\/tr><tr><td>1489<\/td><td>Alistair Harding nets the frost child and uses her as bait. Morgana comes for her, and he chains her in cold iron. Her blood burns green on the gallows timber.<\/td><td>Ep 1 cold open (in shadow), Ep 10 cold open<\/td><\/tr><tr><td>1489<\/td><td>The terms, in her words. Morgana: \"Free me, and pay in light. Keep me, and pay in sons.\" The daughter goes free, the mother stays, and the chain is sealed with Alistair's blood, to be fed with a willing Harding life every fifty years. His firstborn, Edric, nine, is the founding payment.<\/td><td>Ep 1 cold open (the boy with the lantern; Alistair steps aside for the child), Ep 10 cold open, Ep 9<\/td><\/tr><tr><td>1489–90<\/td><td>The blood hardens into gallowglass. The Hargraves, a Harding cadet branch, try to free her, led by a cousin of nineteen, Marian, who goes for the chain with a hammer. Alistair cuts her down at the lock, hangs the ringleaders, three thousand on the field, and keeps the rest alive underground, to breed the lives the chain will need. The Hardings call the place the Orchard. \"Hargrave\" becomes the punishment name, and their blood is still Harding blood.<\/td><td>Ep 1 (the cousin at the treeline), Ep 5 cold open (the raid and the full field), Ep 3 blood test, Ep 4 (Marsh's rhyme), Ep 8 (the Orchard)<\/td><\/tr><tr><td>1489 onward<\/td><td>The chain pins the crack open a finger's width, and her winter starts seeping into the land around London. The first heat wall goes up round the City in 1502, burning gallowglass; by 1800 the walls ring all of London.<\/td><td>Ep 1 cold open (the frost spreading from the pit), the world rules<\/td><\/tr><tr><td>1539–1789<\/td><td>Every fifty years a Hargrave from the Orchard, raised from birth to believe it holy, walks down the stair at first snow. The Hardings keep the Crown's gallows at Tyburn so nobody asks where the Hargraves went.<\/td><td>Ep 4 (Marsh's rhyme), Ep 8 (the Orchard)<\/td><\/tr><tr><td>1689<\/td><td>The Crown finds out anyway. It charters the Lantern Guard to protect the Ring and, in a sealed annex to the Harding Charter, is told what the light is. It signs. Every Lord Chancellor since has kept the annex locked in his desk.<\/td><td>Ep 4 (Vane never asks), Ep 9 (Eldgard names it), Ep 10 (Westminster)<\/td><\/tr><tr><td>1839<\/td><td>The Orchard's children stop believing. None of them will walk.<\/td><td>Ep 9<\/td><\/tr><tr><td>1839<\/td><td>The walls dim. Eldgard's aunt Hester, twenty-seven, whom the family stopped counting the day a doctor said she would never carry, watches them go grey, knows what it means, and runs the week before the snow. She marries a stonemason outside the north wall and never comes back.<\/td><td>Ep 6 (Hester), Ep 9<\/td><\/tr><tr><td>1839<\/td><td>So a Harding walks instead. Ottoline \"Otty\" Harding, nineteen, Eldgard's older sister, goes down at first snow of her own will. The family says she died of fever in Switzerland. Eldgard is eight. Byron, fourteen, is her page and keeps her ribbon. First cycle.<\/td><td>Ep 2 plaque, Ep 6 ribbon, Ep 9<\/td><\/tr><tr><td>1859<\/td><td>Hector Lambrick, twenty-five and heir to the coal, buys a Harding from the Vykra: young Eldgard. Grise sends her best knife, Josephine, nineteen. Byron catches her at the core gate because she stopped to listen to the weeping, and lets her go. A year later she marries Eldgard. Lambrick never learns which girl failed him.<\/td><td>Ep 6 (the flash at the gate), Ep 8 (Newgate)<\/td><\/tr><tr><td>1873<\/td><td>Eldgard, experimenting at the lock, widens the crack for one night, and Morgana's daughter comes back through looking for her mother. She goes <em>up<\/em> the stairs instead, toward the warmest room in the house: a nursery, and a boy of five at the foot of whose bed she stands. She touches his hand and he doesn't freeze. Eldgard swings a lantern before the boy's eyes (\"You had a dream\"), catches her, and keeps her small, in a glass case on the drawing-room mantel: the family's little green turtle, admired at every party, and the leash that keeps Morgana on her hooks. That week he drives the boy out through the north gate into a blizzard, to Hester's cottage, out of earshot.<\/td><td>Ep 8 (the swinging watch), Ep 3 (\"the boy in the warm room\"), Ep 6 (Hester), Ep 4 (the blackmail)<\/td><\/tr><tr><td>1860–72<\/td><td>Eldgard marries Josephine, ex-Vykra. Jamie is born in 1864 and raised as the next payment. In 1867 Silas Marsh, an Orchard man, escapes, is caught and is locked in Newgate as a madman, cell 1417; the last thing he saw below was Marian's baby boy. In 1872 Eldgard takes that boy, Nixon, six, out of the Orchard, tells him his mother Marian died of fever, and sends him to the charity school as the spare. The Orchard failed in 1839. Eldgard's wager is a Hargrave raised free, given a name, a rank and a family to love, who will one night walk down the stair for that family without being asked. An order would spoil him. He has to want to. Marian dies in the cells four years later.<\/td><td>Ep 4 (Marsh), Ep 7 (the file), Ep 8 (Marian's name), Ep 9<\/td><\/tr><tr><td>1878<\/td><td>Tobias Bounds, a vat-hand at the Works, has the glass in his blood: tremors, rages, the belt. He sells his daughters' labour to a broker. The Works reassigns him to the Kellow Ridge pits on the eastern marsh, on a page Eldgard signs.<\/td><td>Ep 6 (the roster), Ep 10 (Kellow Ridge)<\/td><\/tr><tr><td>1889<\/td><td>A Tithe year. On 2 November Jamie carries the glass case down to the lock to set the girl free, and his blood cracks it. The case shatters, the daughter goes down the blood channels into the buried Tyburn, and the Tyburn spills into the Thames under Blackwood Bridge, where Miriam is dying.<\/td><td>Ep 1, Ep 9, Ep 10<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>Why now.<\/strong> 1839 plus fifty is 1889: a Tithe year, and the son raised to pay it dies seven weeks before it's due. The walls are already dimming.<\/p>\n<p><strong>Otty, in the season.<\/strong> She is never seen. She appears five times: the brass on the chancel wall in Ep 2, Eldgard's \"She told me my sister was still singing\" in Ep 5, the blue ribbon in Byron's pocket in Ep 6, Hester's \"I know how old she was\" in the same episode, and Eldgard's confession in Ep 9. By then the audience knows what Eldgard's \"I raised Jamie for it\" is a copy of.<\/p>\n<p><strong>Hester Pell.<\/strong> Born Hester Harding in 1812, Eldgard's father's younger sister. At seventeen a doctor said she would never carry a child, and her father stopped seating her near him at dinner. In the autumn of 1839 she watched the walls go grey, knew what it meant before her brother said a word, and ran the week before the snow. Otty went down the stair that winter. Hester married Walter Pell, a stonemason, and has lived fifty years in a cottage past Barnet, outside the north wall, on wood and his trade. She is the one Harding who walked away, and she isn't clean: other people kept paying. She appears in Ep 6, Eldgard names her in Ep 9, and she comes back inside the walls once, at the end, to hold the candle while her husband takes the lie off her niece's brass.<\/p>\n<p><strong>The Orchard.<\/strong> Under the Works, thirteen steps below the coal-hatch stair, is a gallery of bunks and iron rings where Hargraves were kept alive for four hundred years: fed well, kept healthy, and taught from the cradle that walking down the stair was holy. Every fifty years one of them did. They were the cattle in the contract. Hardings are taught never to say the word upstairs. The first name on its wall is Marian, who led the raid in 1489, and the last is Marian too, Nixon's mother: the Orchard named its girls after the first one who tried. The keepers counted the children in chalk tallies headed APPLES. By 1889 the herd is gone. Marsh's rhyme counts the seven who were left when he ran, and Nixon is the only Hargrave anyone ever brought out into the light.<\/p>\n<p><strong>Silas Marsh.<\/strong> An Orchard man who ran in 1867 and was caught. The Crown holds him in Newgate as a madman, cell 1417, and nobody listens to what he sings. Jamie Harding visited him every Sunday for two years and learned the way down. The diagram in Jamie's boot-tree in Ep 2 shows the chain, and beside it the Orchard: a stair of thirteen steps going down from a hatch marked coal. That is why Jamie went to the Works with a plan in Ep 1, and why Nixon, tracing a dead boy's footsteps without knowing it, ends up in the Orchard in Ep 8.<\/p>\n<p><strong>How Nixon learns it.<\/strong><\/p>\n<ol>\n<li>Ep 3: his blood test glows green, and Eldgard pats his head: \"Still good.\" Felix gives him the Newgate slip.<\/li>\n<li>Ep 4: Marsh pinches his cheek, \"Marian's chin!\", and sings the rhyme. Nixon walks away not understanding it.<\/li>\n<li>Ep 7 and 8: Tamara gives him the file, and he carries it a week before he opens it on the morning of the wedding: \"Reserve. Blood suitable.\" He learns he is the spare, not what the spare is for.<\/li>\n<li>Ep 8: he follows the rhyme down thirteen steps, and finds the Orchard and his mother's name. This is the scene that turns him.<\/li>\n<li>Ep 9: he frees Marsh in the Newgate break-out. Hours later Eldgard confirms all of it in the Snow Confession, including what the spare was grown to do.<\/li>\n<li>Ep 10: he offers himself with his eyes open. \"They grew me for this the way they grew my mother.\"<\/li>\n<\/ol>\n<h3>Supporting cast<\/h3>\n<ul>\n<li><strong>Lord Hector Lambrick<\/strong>, 55. A coal baron losing the light war. He wants London back on coal and owned by him. He owns the old coal mains under the walls, the furnace plans and the men who still know the valves. Thirty years ago he paid the Vykra to kill Eldgard and never learned which girl failed him. When he sees Morgana, his reaction is greed, and he wants her bled faster.<\/li>\n<li><strong>Edmund Lambrick<\/strong>, 20. Lambrick's bastard son, raised in the house and preferred as heir over Tamara. Handsome in a way that makes dinner guests laugh; up close, something else. Cleans his nails with a penknife. The money behind a Narrows house that sells girls, and the nobleman from the party who put Xyon in Miriam Bounds's glass.<\/li>\n<li><strong>The street surgeon.<\/strong> Works a cellar clinic under Gin Lane with tables built for factory amputations, not miracles. He sees what nobody wants seen, and says it.<\/li>\n<li><strong>Ajax Fink<\/strong>, 35. Lambrick's enforcer, an ex-Guardsman drummed out of the corps, carrying the Black Gauntlet. He's funny, patient and terrifying, and he survives too long.<\/li>\n<li><strong>Kit Marrow<\/strong>, 21. Grise's best knife, the girl Alice learned the trade beside, and the one who inherits Alice's work when Alice is cut loose. Faster than Alice, always. She hunts the Lost One for Grise, pours tea for her enemies with her eyes down, and leads the taking at the wedding. Beaten on the count of nine, she runs Alice's errand through the wolves.<\/li>\n<li><strong>Mother Grise<\/strong>, 70. Runs the Vykra out of the Shadwell laundry. She trained Josephine, and keeps every contract in one book. She sells to everyone and loves no one, except, briefly, girls who beat her.<\/li>\n<li><strong>Inspector Felix Hawke<\/strong>, 40. Met police. The only man who saw a corpse get up, and the first to die for saying so in public (Episode 4).<\/li>\n<li><strong>Lord Chancellor Vane<\/strong>, 60. The Crown. He doesn't want the truth, only the lights on, and the one thing the Crown must never be seen to have known kept in his desk: the 1689 annex, with the Crown's signature on the chain.<\/li>\n<li><strong>Morgana.<\/strong> Nine feet of ice and green fire in iron hooks. She speaks rarely, and every word costs someone.<\/li>\n<li><strong>Jamie Harding<\/strong>, 25 (Episode 1 and cold opens). The heir raised to die for the chain, who chose love and sabotage instead.<\/li>\n<li><strong>Miriam Bounds<\/strong>, 24 (Episode 1 and cold opens). Alice's older sister, carrying Jamie's child, about to leave Alice for good. Hard, quick and funny, a Vykra runner who never flinches in a fight, and who flinched every single time it mattered.<\/li>\n<li><strong>Hester Pell<\/strong>, 77. Born a Harding, Eldgard's aunt, the one who ran in 1839. She lives outside the north wall with her husband WALTER PELL, 80, a stonemason who cuts true names into headstones. Eldgard's authority can't manage her, and she knows what he's for.<\/li>\n<li><strong>Old Wren<\/strong>, 60s. Gin Lane herb-woman who set Alice's arm when she was nine and never asked how it broke. She's the one who tells Alice her sister will get better.<\/li>\n<\/ul>\n<h3>The wound under the sisters<\/h3>\n<p>When Alice and Miriam were small, their father, TOBIAS BOUNDS, a vat-hand at the Harding Works, came home with the glass in his blood and a belt in his hand. Miriam, four years older, made Alice a promise in the dark under their bed: <em>nothing will ever touch you while I'm here.<\/em> Then the belt came out, and Miriam didn't move. She never once moved. What she did was teach Alice to count: the posts of the fence outside the window, one to eight, over and over, until it was over. \"Eight posts and he's done.\" That's the counting game. The sisters have played it as a joke for fifteen years, and neither of them has ever said where it came from. He sold the girls' labour to a broker when Alice was nine, and at seventeen Miriam signed herself into the Vykra and her sister in as collateral, to get them out. The Works sent Tobias to the Kellow Ridge pits on a page Eldgard Harding signed. Alice has never seen that page. The light made the man who made her.<\/p>\n<p>Alice keeps all of it <strong>behind the eightfold fence<\/strong>, her own phrase, the one she uses when anyone gets close: <em>that's behind the fence.<\/em> It's the root of her lie. She learned that love is holding on, because nobody held the line for her.<\/p>\n<p>Miriam carried it differently: guilt, all of it, never said. When the Lost One comes through on the bridge and puts Miriam on like a coat, it gets the guilt with the memories. A creature that has never felt anything human now has fifteen years of a sister's shame, and no idea what to do with it.<\/p>\n<p><strong>How the show handles it.<\/strong> The abuse is never shown. It lives in sound (a buckle, a floorboard), in Alice's flinch, and in the counting. It's about what it did to two girls, not about the man.<\/p>\n<p><strong>The irony at the heart of the sisters' story.<\/strong> Miriam knew she owed Alice an apology and never gave it. The Lost One isn't Miriam, but she gives it, and that's how Alice knows her sister is dead.<\/p>\n<h3>How the season stays producible<\/h3>\n<p>Morgana is a practical performer in prosthetics from the waist up, with CG for the ice and fire and the full nine feet saved for Eps 5, 8 and 10. The pilot shows only her hand. The wolves are shown the way the flash-bursts show everything: one strobe frame at a time, so we render frames, not sequences, and the audience's imagination does the rest. The walls are a glow on the horizon and a matte painting; their failure is shown through gauges, valves, frost on the inside of a window and a frost line creeping up one particular street, never wide shots of walls coming down. Ep 4 (a hearing room and a dock) and Ep 7's Pavilion (one interior, a hundred extras and a song) are the season's contained episodes, which pays for the Newgate break-out and Tyburn hill.<\/p>\n<h3>The choices that shape the season<\/h3>\n<p>Every episode turns on a decision where both options are right and both cost something. Nathaniel makes the heaviest ones, and nobody makes a choice that can be undone.<\/p>\n<table>\n<thead><tr><th>Ep<\/th><th>Who<\/th><th>The choice<\/th><th>What it costs<\/th><th>What it changes<\/th><\/tr><\/thead>\n<tbody><tr><td>3<\/td><td>Nixon<\/td><td>Capture the Lost One, or save Cole<\/td><td>Duty. He lets her go<\/td><td>Vane has a reason to break him later<\/td><\/tr><tr><td>3<\/td><td>Nathaniel<\/td><td>Take the Frost Killer to his father and finally be the useful son, or hide her<\/td><td>His father's trust, and the law: four people are dead<\/td><td>He becomes her accomplice, and Felix follows them to the glasshouse<\/td><\/tr><tr><td>4<\/td><td>Nathaniel<\/td><td>Pull Ajax up (the only witness against Lambrick) or let him drop (Jamie's grave)<\/td><td>Justice for his brother, and the case against Lambrick<\/td><td>The ledger now has to come from Tamara, and in Ep 9 Ajax comes back to kill his father<\/td><\/tr><tr><td>5<\/td><td>Nathaniel<\/td><td>Leave with Alice and the Lost One, or stay to hear the rest from his father<\/td><td>Alice's trust, and the Lost One's safety<\/td><td>He chooses his father, and Alice leaves without him<\/td><\/tr><tr><td>6<\/td><td>Hester<\/td><td>Go back to the warm city with her nephew, or stay outside the wall on a low woodpile<\/td><td>Her safety, and maybe her husband's chest<\/td><td>Eldgard goes home without the one thing he came for<\/td><\/tr><tr><td>7<\/td><td>Alice<\/td><td>The sister she lost, or the girl standing in front of her<\/td><td>Her grief<\/td><td>She chooses the Lost One anyway<\/td><\/tr><tr><td>7<\/td><td>Nixon<\/td><td>Keep Jamie's death secret, or confess to his best friend<\/td><td>The friendship<\/td><td>Nathaniel stops trusting him<\/td><\/tr><tr><td>8<\/td><td>Alice<\/td><td>Stay with her sister in the glasshouse, or go and watch him marry<\/td><td>Her sister, alone when the Vykra come<\/td><td>The Lost One is taken, and Nathaniel owes Alice a debt he can never repay<\/td><\/tr><tr><td>8<\/td><td>Nixon<\/td><td>Say the word and take Tamara out of the church, or hand her the ring<\/td><td>Her, maybe for good<\/td><td>He hands it to her properly, and walks out of the chapel holding the empty box<\/td><\/tr><tr><td>8<\/td><td>Nixon<\/td><td>Obey Vane and fire, or stand down<\/td><td>His rank and his men<\/td><td>Forty Lanterns follow him<\/td><\/tr><tr><td>8<\/td><td>Nathaniel<\/td><td>Say \"I will\" with Alice watching from the gallery, or leave Tamara to her father<\/td><td>His freedom, and the girl at the rail<\/td><td>Tamara is untouchable, and he's married<\/td><\/tr><tr><td>9<\/td><td>Alice<\/td><td>Chase Ajax toward her sister, or stay with Nathaniel while his father dies<\/td><td>Minutes her sister doesn't have<\/td><td>His hand finds hers behind his back<\/td><\/tr><tr><td>9<\/td><td>Josephine<\/td><td>Believe Eldgard that the mother will never allow the trade, or bet that nobody in hooks refuses an open door<\/td><td>Alice's sister, and any forgiveness from her son<\/td><td>Morgana refuses the door, the Heartglass cracks, and the price falls back on a Harding<\/td><\/tr><tr><td>10<\/td><td>Morgana<\/td><td>Walk out through the door her daughter holds open, or tear her own hooks deeper to shut it<\/td><td>Four hundred years of wanting out<\/td><td>The Heartglass cracks, and Josephine sees exactly what she herself will do on Tyburn hill<\/td><\/tr><tr><td>10<\/td><td>Alice<\/td><td>Let Nathaniel walk into the White, as she just let her sister choose, or stand in front of him<\/td><td>The lesson she has only just learned about letting go<\/td><td>She learns the difference: you let go of someone choosing to live, and you stand in front of someone choosing to die. Josephine goes instead<\/td><\/tr><tr><td>10<\/td><td>Alice<\/td><td>Burn her hand on the lock, knowing it puts out every light in London<\/td><td>Her hand, and her share of a city's hatred<\/td><td>\"Us.\" The light ends because both of them chose it, and she has already counted what Gin Lane can hold<\/td><\/tr><tr><td>10<\/td><td>Nathaniel<\/td><td>Go to Alice on Gin Lane, or stay and watch his mother<\/td><td>The girl he loves, alone in the dark<\/td><td>He stays, and follows his mother up the hill<\/td><\/tr><tr><td>10<\/td><td>Nathaniel<\/td><td>Walk into the White himself, or let his mother go in his place<\/td><td>His life, or his mother's<\/td><td>He says \"Go,\" then refuses the Crown's silence and puts every name on the record<\/td><\/tr><\/tbody>\n<\/table>\n<h3>The themes, argued from every side<\/h3>\n<p>Protection as control is the spine, and five more themes run underneath it. Every storyline argues a position on several of them at once. The season never says which answer is right: the outcomes refuse to line up into a moral, some of the wrong people win, and the viewer decides.<\/p>\n<p><strong>1. Protection as control.<\/strong> Every adult in this show hurts someone to keep them safe.<\/p>\n<table>\n<thead><tr><th>Position<\/th><th>Who takes it<\/th><th>What it costs, or wins<\/th><\/tr><\/thead>\n<tbody><tr><td>Control that spends a child<\/td><td>Alistair (Edric), Eldgard (Jamie)<\/td><td>Four hundred years of light; Eldgard dies telling the truth<\/td><\/tr><tr><td>Control that works<\/td><td>Josephine's contract on Alice<\/td><td>The one thing she ever bought that worked: her son is loved<\/td><\/tr><tr><td>Control that keeps what it owns<\/td><td>Lambrick (\"providing\")<\/td><td>He can't put the crystals down, and dies in the vault<\/td><\/tr><tr><td>Mercy that destroys<\/td><td>Byron lets the assassin go at the gate<\/td><td>Thirty years later she sets the trap he dies in<\/td><\/tr><tr><td>A kind lie<\/td><td>Old Wren<\/td><td>Five weeks of a sister, a child she called gone, then the bill<\/td><\/tr><tr><td>Letting go that saves<\/td><td>Morgana, then Alice, on Tyburn hill<\/td><td>The daughter stays because she was free to leave<\/td><\/tr><tr><td>Standing in front<\/td><td>Miriam never could; the Lost One, then Alice<\/td><td>Miriam's last wish, kept by someone braver<\/td><\/tr><tr><td>Walking away<\/td><td>Hester Pell<\/td><td>Fifty years by a wood fire, and a clean conscience she doesn't claim: other people kept paying<\/td><\/tr><tr><td>Protecting no one<\/td><td>Mother Grise<\/td><td>She survives everything, and pours the tea<\/td><\/tr><tr><td>Protecting an institution<\/td><td>Vane and the 1689 annex<\/td><td>The record stands, and so does the Crown<\/td><\/tr><tr><td>Protecting by telling the truth<\/td><td>Nathaniel's Record, Cole's diary<\/td><td>The city hates him; the dead get their names<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>2. Bought, or given.<\/strong> Almost everything in this London has a price. The season keeps asking what is left that can only be given.<\/p>\n<table>\n<thead><tr><th>Position<\/th><th>Who takes it<\/th><th>What it costs, or wins<\/th><\/tr><\/thead>\n<tbody><tr><td>Love that started as a purchase<\/td><td>Josephine buys Alice's attention for her son<\/td><td>It turns real: \"I'd have done it for nothing\"<\/td><\/tr><tr><td>Everything for sale<\/td><td>Mother Grise sells Alice's contract, then Alice's sister<\/td><td>She ends the season pouring tea for the girl who beat her<\/td><\/tr><tr><td>Paying double for the right thing<\/td><td>Jamie pays double for the grid cut Lambrick already bought, to own the minute it happens<\/td><td>The dark gets him to the lock, and to the chain<\/td><\/tr><tr><td>Silence for sale<\/td><td>Vane offers Nixon a captain's lantern<\/td><td>Nixon leaves it on the desk<\/td><\/tr><tr><td>A gift nobody can price<\/td><td>Tamara opens her father's coal depots for nothing<\/td><td>She ends the season holding the city's heat<\/td><\/tr><tr><td>Given, not taken<\/td><td>The White's price, paid by Josephine walking into it; Nathaniel says \"Alice\" when nobody has paid for it<\/td><td>The only payments the season treats as clean<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>3. Who pays for the light.<\/strong> London is warm because somebody is cold. The question is never whether someone pays, only who, and whether they know.<\/p>\n<table>\n<thead><tr><th>Position<\/th><th>Who takes it<\/th><th>What it costs, or wins<\/th><\/tr><\/thead>\n<tbody><tr><td>Paying without knowing<\/td><td>London, every lamp-lit street<\/td><td>Hears the bill in the Record<\/td><\/tr><tr><td>Knowing, and keeping the lamps lit<\/td><td>Eldgard; the Crown's 1689 annex<\/td><td>Eldgard dies telling it; the Crown locks it back in the drawer<\/td><\/tr><tr><td>Hearing it and calling it the drug<\/td><td>Glim-runners, who hear the Weeping and blame the batch<\/td><td>Alice runs glim for years and never once listens<\/td><\/tr><tr><td>Paying with your body<\/td><td>Morgana in her hooks; the Hargraves of the Orchard<\/td><td>One walks free; the others get their names read off a wall<\/td><\/tr><tr><td>Paying by geography<\/td><td>Gin Lane against the east wall; Mayfair behind two<\/td><td>The cold reaches Alice's neighbours first<\/td><\/tr><tr><td>A new master, the same arithmetic<\/td><td>Lambrick's coal: \"She could be bled faster\"; he relights the walls that vote his way<\/td><td>Dies holding crystals gone dull as river stones<\/td><\/tr><tr><td>Choosing the dark<\/td><td>Nathaniel opens the lock<\/td><td>The most hated man in London, and the first Harding nobody died for<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>4. What gets written down.<\/strong> Every lie in the season is a record: a brass plate, a burned page, a receipt, a sealed annex. The season ends by writing the true one.<\/p>\n<table>\n<thead><tr><th>Position<\/th><th>Who takes it<\/th><th>What it costs, or wins<\/th><\/tr><\/thead>\n<tbody><tr><td>The official lie<\/td><td>Otty's brass, DIED ABROAD; \"fever in Switzerland\"<\/td><td>A chisel takes the words off, one letter at a time<\/td><\/tr><tr><td>Destroying the record<\/td><td>Nixon burns the discharge-log page<\/td><td>Cole copies it from memory, and it puts the shot on the record anyway<\/td><\/tr><tr><td>Keeping the record<\/td><td>Cole's diary; the names on the Orchard wall; Marsh's rhyme<\/td><td>Cole dies, and his diary convicts the living<\/td><\/tr><tr><td>The record as a weapon<\/td><td>Tamara's copy of her father's ledger<\/td><td>She exposes him under her own name<\/td><\/tr><tr><td>A name withheld<\/td><td>\"Bounds\"; Nathaniel never says \"Alice\"<\/td><td>The first time he sees her name it's on a bill; the first time he says it, nobody has paid<\/td><\/tr><tr><td>The record sealed<\/td><td>The Crown's 1689 annex<\/td><td>Read out at Westminster, then locked away again<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>5. The spare and the heir.<\/strong> Nathaniel believes being useful is the same as being loved. Half the cast was raised as somebody's spare part.<\/p>\n<table>\n<thead><tr><th>Position<\/th><th>Who takes it<\/th><th>What it costs, or wins<\/th><\/tr><\/thead>\n<tbody><tr><td>The heir raised to be spent<\/td><td>Jamie<\/td><td>Chooses love and sabotage, and ends up kept in the White: not living, not buried<\/td><\/tr><tr><td>The son who believes he's the spare<\/td><td>Nathaniel<\/td><td>Stops trying to be useful in Ep 3, and becomes the one who ends it<\/td><\/tr><tr><td>The spare on paper<\/td><td>Nixon: \"Reserve. Blood suitable.\"<\/td><td>Offers himself on purpose, is refused, and leads the Guard on his own terms<\/td><\/tr><tr><td>A wedding, not a ledger<\/td><td>Tamara<\/td><td>Becomes the ledger<\/td><\/tr><tr><td>The child as a vessel<\/td><td>The Lost One: <em>Vessel: White-born<\/em><\/td><td>Chooses a sister, and a body that can be warm<\/td><\/tr><tr><td>The boy who holds the lantern<\/td><td>Edric, nine, in 1489<\/td><td>Still holding it in the White, four hundred years later<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>6. Where you belong.<\/strong> Six young leads, each trying to prove they belong somewhere. Every faction offers belonging, and every offer has a price.<\/p>\n<table>\n<thead><tr><th>Position<\/th><th>Who takes it<\/th><th>What it costs, or wins<\/th><\/tr><\/thead>\n<tbody><tr><td>Belonging bought by obedience<\/td><td>Nixon in the officer class<\/td><td>Forty men follow him the day he stops obeying<\/td><\/tr><tr><td>Belonging earned by skill<\/td><td>Tamara in the Vykra, for her mind<\/td><td>She outgrows it<\/td><\/tr><tr><td>Belonging taken back<\/td><td>Alice, cut from the Vykra, then winning it by Vykra law<\/td><td>Stitches her own knot, a pattern nobody taught her<\/td><\/tr><tr><td>Belonging by rivalry<\/td><td>Kit Marrow, Grise's best knife<\/td><td>Beaten on nine, and runs Alice's errand through the wolves<\/td><\/tr><tr><td>Belonging to a uniform<\/td><td>Cole, the Wick who wants to be a real Lantern<\/td><td>Dies as one<\/td><\/tr><tr><td>Leaving the house<\/td><td>Hester, who took a mason's name<\/td><td>A small life nobody bought, and a cough in the next room<\/td><\/tr><tr><td>Belonging to a house<\/td><td>Josephine, who chose the Harding name<\/td><td>Pays the house's last debt with it<\/td><\/tr><tr><td>Belonging to a person<\/td><td>Alice and the Lost One: chosen, not inherited<\/td><td>The only belonging in the season nobody bought<\/td><\/tr><\/tbody>\n<\/table>\n<h3>The motifs, and how each one turns<\/h3>\n<p>The theme map says what the season argues. This is what the audience holds in its hands while it argues. Every recurring object, sound and phrase means one thing when we first see it and something else by the end, and that change is the point. Numbers in the last column refer to the six themes above. The list is short on purpose: a motif earns a place here only if it turns at least twice and carries a theme. Anything else is a callback, and lives in the ledger. When a motif comes back, it should come back changed.<\/p>\n<table>\n<thead><tr><th>Motif<\/th><th>First meaning<\/th><th>How it turns<\/th><th>Themes<\/th><\/tr><\/thead>\n<tbody><tr><td><strong>The lantern<\/strong><\/td><td>A child made useful: Edric holds it up for his father (Ep 1 cold open)<\/td><td>Pinned to Nixon's collar (Ep 1); swung before five-year-old Nathaniel's eyes to make a memory a dream (Ep 8, scene 3, the flash); ripped off and dropped in the gutter by forty men (Ep 8); slid across Vane's desk as a bribe and left there (Ep 10); Cole's Wick lamp lit with a match (the Record); still burning in Edric's hand in the White (final scene)<\/td><td>1, 5, 6<\/td><\/tr><tr><td><strong>The Guard oath<\/strong>: \"Light the dark. Keep the flame.\"<\/td><td>Pride, sworn on the glass (Ep 1, scene 5)<\/td><td>Obedience, mouthed behind the core door as he seals in his best friend (Ep 5); defiance, \"Keep the flame, Captain.\" \"I am.\" (Ep 8); ownership, \"The Guard will keep its own flame\" (Ep 10). Five words, four meanings<\/td><td>1, 6<\/td><\/tr><tr><td><strong>Green light, then tallow<\/strong><\/td><td>Wonder and progress: a thousand green chandeliers (Ep 1), light somebody else pays for<\/td><td>Evidence: it's her blood, and every lamp bursts at once (Ep 5); Byron's tallow candle, no green lamp since the core (Ep 5); Hester lights a candle on her sill as the last heater-post dies (Ep 6); the green dies street by street and nothing comes back, and a mother on Gin Lane lights tallow (Ep 10); candle to candle through broken panes, a surgeon by tallow, a match on the Guard roof (the Record). The season trades a light someone else pays for for one you pay for yourself<\/td><td>2, 3<\/td><\/tr><tr><td><strong>A flame held until it burns<\/strong><\/td><td>The match burns to Alice's fingers and she doesn't flinch (Ep 1)<\/td><td>Nathaniel's candle burns to his fingers while he watches her lamp (Ep 8, scene 16); her palm held on the overloaded gauntlet until the ice lets go (Ep 10, scene 5). How these two say love before they can<\/td><td>2<\/td><\/tr><tr><td><strong>The Lantern Hymn<\/strong><\/td><td>A church tune over London (Ep 2 funeral)<\/td><td>It's Morgana's lullaby with words nailed over it (Ep 5); the Lost One hums it to the orange trees while she waits to be taken (Ep 8); sings it back in the old tongue (Ep 10); plays wordless under the Record<\/td><td>3, 4<\/td><\/tr><tr><td><strong>The skipping rhyme<\/strong>: \"Green light, green light, who's in the cellar tonight?\"<\/td><td>Background noise through a grating (Ep 1, scene 2)<\/td><td>Horror: Nixon is standing in the cellar (Ep 8, scene 18); taken back: <em>nobody's in the cellar tonight<\/em> (the Record)<\/td><td>3, 4<\/td><\/tr><tr><td><strong>Counting<\/strong><\/td><td>\"One post, two post\": a game in a ballroom corridor (Ep 1)<\/td><td>What two girls did under a bed while a man was in the room (Ep 2–3); \"Nine is the one where we get up\" (Ep 7); Alice moves on nine and beats Grise (Ep 9); Nathaniel gets to nine on his own (Ep 10). Also the thirteen steps, and the card: <em>49 DAYS<\/em>, <em>0 DAYS<\/em>, <em>DAY ONE<\/em><\/td><td>1, 6<\/td><\/tr><tr><td><strong>Oranges<\/strong><\/td><td>Stolen and tossed, instead of a birthday (Ep 1)<\/td><td>The Lost One's apology (Ep 3); avoidance, \"Eat that\" (Ep 4); the orange trees where they rehearse \"I will\" (Ep 8); Alice peels one for her sister, badly, in one long ruined spiral (the Record)<\/td><td>2, 6<\/td><\/tr><tr><td><strong>Gloves and the knot<\/strong><\/td><td>The Vykra mark of belonging (Ep 4)<\/td><td>Cut out of Alice's glove (Ep 4); his handkerchief folded where the knot was (Ep 4); the knot inside Josephine's glove at the chapel door (Ep 8); Kit's glove at the tea table, on the girl nobody looks at (Ep 6, 10); Alice stitches a pattern nobody taught her (the Record)<\/td><td>2, 6<\/td><\/tr><tr><td><strong>The handkerchief<\/strong><\/td><td>The one thing he did that day nobody told him to (Ep 2)<\/td><td>Not returned (Ep 3); kept in the glove (Ep 4); it falls into the frost, \"You kept it\" (Ep 6); torn in two on Tyburn hill (Ep 10)<\/td><td>2<\/td><\/tr><tr><td><strong>Rings<\/strong><\/td><td>The wolf-crest ring: the pact, on Alistair's hand (Ep 1)<\/td><td>Jamie's ring on Miriam's cord (Ep 1–2); the ring that makes Tamara a wife before the attendants reach the altar (Ep 8); a wedding ring handed over \"properly\" (Ep 8); the wolf ring opens the lock (Ep 10) and goes into a dead grate, Jamie's beside it on the mantel (the Record)<\/td><td>1, 2<\/td><\/tr><tr><td><strong>Names on hard surfaces<\/strong><\/td><td>Otty's brass, DIED ABROAD (Ep 2)<\/td><td>FROST KILLER bills (Ep 4); Alice's first name, seen first on a bill (Ep 8); DON'T FOLLOW ME in frost (Ep 8); MARIAN, first and last on the Orchard wall, and J.H. in chalk (Ep 8); the chisel, and the Crown's record (Ep 10)<\/td><td>4<\/td><\/tr><tr><td><strong>Marian, and the Orchard<\/strong><\/td><td>A cousin of nineteen at the treeline, never named (Ep 1); a madman's \"count the apples\" (Ep 4)<\/td><td>\"Marian!\" as she falls at the lock (Ep 5); \"Marian's chin!\" (Ep 4); the first and last name on the wall, and the keepers' tallies headed APPLES: the children were the crop (Ep 8); Nixon's thumb stops on her name (the Record)<\/td><td>3, 4, 5<\/td><\/tr><tr><td><strong>The frost line<\/strong><\/td><td>A green glow on the horizon nobody looks at (Ep 1)<\/td><td>A number on a gauge (Ep 3); two sectors going grey on Lantern Night (Ep 5); a wall relit on coal for the districts that vote (Ep 6); frost on the inside of Gin Lane's windows (Ep 7); snow lying in a London street (Ep 8); a map of every district Nathaniel will expose (Ep 10); grey walls on the horizon, and nobody knows yet whether the winter behind them will lift (the Record)<\/td><td>1, 3<\/td><\/tr><tr><td><strong>The stair<\/strong>s<\/td><td>Three stairs in one house (the core stair, the Orchard's thirteen steps, Byron's Guard stair), and for four hundred years all of them went one way. Edric carries the lantern down the first, alone (Ep 10 cold open)<\/td><td>Eldgard carries a frost girl down it from a five-year-old's nursery (Ep 8); thirteen steps to the Orchard (Ep 8); Otty \"walked down the stair singing\" (Ep 9); the Guard stair Nixon clears so others can climb out (Ep 10). The way this house sends its children down, until somebody uses it to go up<\/td><td>1, 5<\/td><\/tr><\/tbody>\n<\/table>\n<p><strong>The moments built to be quoted.<\/strong> Every season has five or six beats fans will use as shorthand for the whole show. These are ours. Each one gets room: no score under it, a held shot after it, and no other line stepping on it.<\/p>\n<ul>\n<li>\"Hear what, sir?\" (Ep 1, the dark ballroom)<\/li>\n<li>\"Nine is the one where we get up.\" (Ep 7)<\/li>\n<li>\"Us.\" (Ep 10, the lock)<\/li>\n<li>\"Not her.\" and then \"Not him.\" (Ep 10, two mothers at two doors)<\/li>\n<li>\"A Harding chained me. A Harding comes with me.\" (Ep 10, Tyburn hill)<\/li>\n<li>The chisel taking DIED ABROAD off the brass, one letter at a time (the Record)<\/li>\n<li>The match on the Guard roof (the Record)<\/li>\n<\/ul>","craft":"<ol>\n<li><strong>Therefore and but, never \"and then.\"<\/strong> Each scene is caused by the last one or cuts across it. Parker and Stone's test: if the honest word between two beats is \"and then,\" one of them goes. (<a href=\"https://perell.com/note/but-therefore-rule/\">Perell<\/a>)<\/li>\n<li><strong>Secrets with long fuses (Brent Weeks).<\/strong> Weeks plots the character arcs and the big external climaxes, then layers in secrets he pays off books later. Here each major secret has three layers: what the public believes, what the audience learns, and what the character learns last, when it stings most. Everything serves his one rule: keep people turning pages. (<a href=\"https://reactormag.com/highlights-from-brent-weeks-r-fantasy-ama/\">Reactor, Weeks AMA<\/a>)<\/li>\n<li><strong>Plans collide.<\/strong> Most set pieces happen because three or four characters have separate plans for the same night. Nobody's plan works as drawn. The explosion, the heist and the wolves in the streets all come out of choices, never coincidence.<\/li>\n<li><strong>Sisters only trauma can split (Arcane).<\/strong> Alex Yee: the sisters had to be \"so emotionally entwined that only an event that traumatic\" could drive a wedge between them. Alice and the Lost One get three episodes of closeness before the first wound and four before the break. (<a href=\"https://www.syfy.com/syfy-wire/arcane-co-creator-alex-yee-unpacks-the-act-i-twists?amp\">SYFY, Alex Yee<\/a>)<\/li>\n<li><strong>Power lives inside intimate relationships (Willimon).<\/strong> \"Politics itself doesn't interest me. It's power that interests me.\" Every marriage, friendship and parent-child pair here is also a power arrangement, shown through behaviour and hands more than speeches. (<a href=\"https://script-consultant.co.uk/bfi-beau-willimon-interview-notes-pt1/\">BFI notes<\/a>)<\/li>\n<li><strong>One vision per episode.<\/strong> Each episode has one focus you could put on its poster (the ball, the morgue, the hunt, the hearing, the heist), 17 to 22 scenes for about 44 minutes, and every scene turns something. The three tent-poles (Ep 5, the midseason heist; Ep 8, the wedding; Ep 10, the finale) run 21 to 22 so their set pieces have room. The rest run 17 to 19, with scenes that only carry information folded into scenes that carry feeling.<\/li>\n<li><strong>The grid.<\/strong> Your colleague's Want / Obstacle / Solution / Twist table runs for the four or five characters who carry each episode. The others rest and come back with their own stories later.<\/li>\n<li><strong>Whimsy earns the grim.<\/strong> Each episode alternates a light beat with a dark one, gives at least one feeling that goes unsaid, and gives one young character a chance to prove they belong. Every episode ends on a tag that changes the board: a reveal, an escalation, or a choice that can't be taken back.<\/li>\n<li><strong>The form keeps a secret too (Jonathan Nolan).<\/strong> Nolan hides his biggest twists in the structure: the timeline (William and the Man in Black in <em>Westworld<\/em>), the narrator, or who caused the catastrophe (<em>Fallout<\/em>'s Vault-Tec, selling shelter from the bombs it dropped). Here the walls are the Vault-Tec move: the Hardings sell warmth against a winter their own chain makes, and print WARM AS A MOTHER'S ARMS on every tram. And the 1489 cold opens are read by a voice we don't place until Westminster: the season is Nathaniel's Record. Every twist is fair, with its clues on screen from the pilot.<\/li>\n<li><strong>Pressure, not rooms.<\/strong> If two people are talking, one of them is trying to get something, hide something or get out. Secrets are caught, not confessed. Information is stolen, not overheard. The past cuts into the present at the moment it matters, as a flash inside a scene, not at the top of the hour. The only cold opens set in the past either frame the season (1489, in Eps 1, 5 and 10) or show a night we've already seen from another angle (2 November, in Eps 4 and 7).<\/li>\n<\/ol>\n<h3>What we take from Weeks, Willimon and Nolan<\/h3>\n<table>\n<thead><tr><th>From<\/th><th>Technique<\/th><th>Where it lives<\/th><\/tr><\/thead>\n<tbody><tr><td>Weeks<\/td><td>The trick that traps the trickster<\/td><td>Eldgard's glass curio is the leash on Morgana for sixteen years, and then the witness against his wife (Ep 4)<\/td><\/tr><tr><td>Weeks<\/td><td>Power with a price you can see<\/td><td>Each memory the Lost One's cold burns frosts and cracks on screen (Eps 6, 7); Alice runs her gauntlet past the red in Ep 6 before she bets everything on it in Ep 10<\/td><\/tr><tr><td>Weeks<\/td><td>The assassin and her mirror<\/td><td>Kit Marrow, Alice's training partner and rival: the knife in the laundry lines (Ep 3), the tea-girl nobody looks at (Ep 6), the taking (Ep 8), beaten on nine (Ep 9), Alice's runner by dawn (Ep 10)<\/td><\/tr><tr><td>Weeks<\/td><td>Old fuses<\/td><td>Lambrick paid for Eldgard's death thirty years ago, and Josephine was the knife (Ep 6 flash, Ep 8)<\/td><\/tr><tr><td>Willimon<\/td><td>Watch the scheme being built<\/td><td>Kit rehearses the taking with a pocket watch while Josephine watches from a window (Ep 8 cold open)<\/td><\/tr><tr><td>Willimon<\/td><td>Villains who do it with their own hands<\/td><td>Josephine's glass of water (Ep 4); Vane feeding Felix's file to his grate (Ep 4); Lambrick padlocking the east valve (Ep 6)<\/td><\/tr><tr><td>Willimon<\/td><td>Power is real estate<\/td><td>Lambrick buys Gin Lane leases at a shilling apiece the morning after he chains its wall shut (Ep 6)<\/td><\/tr><tr><td>Willimon<\/td><td>Leverage lives in the bedroom<\/td><td>Josephine brings Lambrick into her deal with the one secret he doesn't know she has (Ep 8, Newgate)<\/td><\/tr><tr><td>Nolan<\/td><td>The protector made the catastrophe<\/td><td>The walls, and the slogan on every tram (Eps 1, 5, 10)<\/td><\/tr><tr><td>Nolan<\/td><td>The narrator is the twist<\/td><td>The voice over the 1489 cold opens is Nathaniel at Westminster (Eps 1, 5, 10, then the Record)<\/td><\/tr><tr><td>Nolan<\/td><td>The same night from another angle<\/td><td>2 November from the Works gate (Ep 4) and from Miriam's bed (Ep 7)<\/td><\/tr><tr><td>Nolan<\/td><td>Memory as a mystery box<\/td><td>The Lost One's borrowed memories: each one a clue, each one spent<\/td><\/tr><\/tbody>\n<\/table>"},"season":{"html":"<p>London, November 1889, and the whole city glows green. Every lamp, tram and furnace burns gallowglass, a crystal that only House Harding knows how to grow, at the Harding Works on the old gallows field at Tyburn. The Hardings say it grows from iron in the ground. In fact it grows from a woman. Every schoolchild knows the founder, Alistair Harding, the Builder of the Light, from the bronze at the Works gate. Nobody knows that he never invented anything: he was a failed architect who told a woman from the frozen world beyond, the White, that he loved her, brought her home, and chained her under his foundations. For four hundred years his family has bled her for light. The cold outside the city is hers too: her winter seeps out around the chain and has lain over the countryside for four hundred years, and a ring of green heat walls, burning her own blood, keeps it off London. Every fifty years, at the first snow, the chain that holds her is fed with a Harding life. The last was Eldgard's own older sister. The next is due this winter, and the son raised to pay it is about to die.<\/p>\n<p><strong>Series engine.<\/strong> London runs on a secret. Every faction wants to own the secret, the girl at its centre or the boy who will inherit it. Every week, one plan for the light runs into another.<\/p>\n<p><strong>Season question.<\/strong> Can Nathaniel Harding end the bargain that lights London without becoming the father who kept it? Under it runs the sisters' question: will Alice Bounds let the thing wearing her dead sister's face choose its own life?<\/p>\n<p><strong>Theme.<\/strong> Protection as control. Every adult in this show hurts someone to keep them safe. The young ones have to learn whether love can let go. Five more themes run underneath it: bought or given, who pays for the light, what gets written down, the spare and the heir, and where you belong. The season argues every one of them from several sides and never says which side is right.<\/p>\n<p><strong>Tone.<\/strong> The dread of <em>Chernobyl<\/em>, the sisters of <em>Arcane<\/em>, <em>House of Cards<\/em> in the drawing rooms. Whimsy breathes between the violence: a creature learning what an orange is, a recruit tangled in laundry lines, two engaged friends who plan to be very polite to each other for forty years.<\/p>\n<p><strong>The clock.<\/strong> Every episode opens on a card: 49 DAYS TO FIRST SNOW. Snow falls on the outerlands all winter, but inside the walls it melts before it lands, so \"first snow over Tyburn\" means the first snow the walls can't melt. In four hundred years that has always come on the longest night, 21 December, when the dark outlasts the heat, so that's the day everyone counts to. Under the card runs a second clock the audience can see: the frost line, as the walls dim sector by sector and the cold creeps into streets that have never seen ice. At the end of Episode 8 it comes two weeks early, because the prisoner makes it fall, and the last two episodes play out over one night.<\/p>\n<p><strong>Kept from your outline:<\/strong> the Harding legacy and the 1489 massacre at the Gallows; Miriam's death and the Lost One; the sister reveal (\"You're not her\"); Josephine's protection turning into control; Eldgard's Snow Confession; Nixon's Hargrave blood; Tamara the operative; the Vykra; Ajax; Miriam's red mittens.<\/p>\n<p><strong>Cut:<\/strong> Edmund, Virgil, the Chapel, the Duke, the Prime Minister, Trevane. Each one did a job someone else now does, or existed only to deliver information. Morgana moves from a nun's body in the Chapel to the chain under the Works, so the villain's secret and the light's secret become the same secret.<\/p>\n<p><strong>New:<\/strong> Mother Grise, who runs the Vykra; Lord Chancellor Vane, for the Crown; the Royal Lantern Guard as a full corps with its own gear, ranks and oath; Hester Pell, Eldgard's aunt, the one Harding who ran; Kit Marrow, Alice's rival in the Vykra; and the heat walls, which put the cost of the light on everyone's horizon.<\/p>\n<h3>The clock, episode by episode<\/h3>\n<table>\n<thead><tr><th>Ep<\/th><th>Clock<\/th><th>Title<\/th><th>Focus<\/th><th>Set piece<\/th><th>The turn<\/th><th>Tag<\/th><\/tr><\/thead>\n<tbody><tr><td>1<\/td><td>49 days<\/td><td>The Engagement<\/td><td>One night, two parties: the ball above, the glim run below<\/td><td>The Works blackout: Lantern Guard raid the core in strobe light<\/td><td>Nixon shoots a saboteur and finds out it's Jamie. Miriam freezes on a bridge<\/td><td>The frozen girl in the morgue opens her eyes<\/td><\/tr><tr><td>2<\/td><td>47 days<\/td><td>The Wake<\/td><td>What came back?<\/td><td>Morgue escape. The Frost Killer is born<\/td><td>Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core<\/td><td>Morgana lifts her head: \"My daughter is here.\"<\/td><\/tr><tr><td>3<\/td><td>42 days<\/td><td>Lanterns<\/td><td>Nixon's hunt<\/td><td>Leaper chase across the Christmas crystal market<\/td><td>Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One<\/td><td>\"You smell like the man who keeps my mother.\"<\/td><\/tr><tr><td>4<\/td><td>38 days<\/td><td>The Hearing<\/td><td>The Charter hearing and Jamie's killer<\/td><td>Docks fight with Ajax, then a murder on the witness stand<\/td><td>Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh<\/td><td>Josephine washes frost off her fingers<\/td><\/tr><tr><td>5<\/td><td>33 days<\/td><td>Lantern Night<\/td><td>The heist into the core<\/td><td>Four plans on one festival night, then every lamp in London bursts at once, two walls go grey, and the crush<\/td><td>The light is a woman in chains, and his father has always known. Nixon locks the door<\/td><td>The Lost One: \"I'm going to free her. Even if they all freeze.\"<\/td><\/tr><tr><td>6<\/td><td>28 days<\/td><td>Coal<\/td><td>The cold city, Byron, and the aunt who ran<\/td><td>Pimlico gasworks explosion<\/td><td>Lambrick relights the west wall on coal. The Crown seizes the Works. Byron dies with half a sentence and a needle in his fist<\/td><td>\"Then you know I love you.\"<\/td><\/tr><tr><td>7<\/td><td>21 days<\/td><td>The Girl Who Isn't<\/td><td>Three reveals: the sister, the best friend, and his own name<\/td><td>Wolves of the White in Whitechapel; the music-hall siege<\/td><td>\"You're not her.\" Then Alice chooses her anyway. Nixon confesses. Nathaniel finds his own name in his father's ledger<\/td><td>Tamara kisses Nixon and gives him a folder with his name on it. He can't open it<\/td><\/tr><tr><td>8<\/td><td>14 days<\/td><td>The Wedding<\/td><td>Every faction moves on the same morning<\/td><td>The wedding, the taking and the mutiny<\/td><td>Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard<\/td><td>Morgana makes it snow, two weeks early, and it settles inside the walls<\/td><\/tr><tr><td>9<\/td><td>First snow<\/td><td>The Snow Confession<\/td><td>Evening to midnight: the assault<\/td><td>Newgate break-out, then storming the Works<\/td><td>Eldgard dies and tells everything<\/td><td>Josephine pulls the lever<\/td><\/tr><tr><td>10<\/td><td>The last night<\/td><td>The Tithe<\/td><td>Midnight to dawn<\/td><td>Every wall goes dark, and the cold and the wolves come<\/td><td>Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name<\/td><td>The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE<\/td><\/tr><\/tbody>\n<\/table>","map":[{"clock":"Clock","title":"Title","focus":"Focus","piece":"Set piece","turn":"The turn","tag":"Tag"},{"clock":"49 days","title":"The Engagement","focus":"One night, two parties: the ball above, the glim run below","piece":"The Works blackout: Lantern Guard raid the core in strobe light","turn":"Nixon shoots a saboteur and finds out it's Jamie. Miriam freezes on a bridge","tag":"The frozen girl in the morgue opens her eyes"},{"clock":"47 days","title":"The Wake","focus":"What came back?","piece":"Morgue escape. The Frost Killer is born","turn":"Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core","tag":"Morgana lifts her head: \"My daughter is here.\""},{"clock":"42 days","title":"Lanterns","focus":"Nixon's hunt","piece":"Leaper chase across the Christmas crystal market","turn":"Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One","tag":"\"You smell like the man who keeps my mother.\""},{"clock":"38 days","title":"The Hearing","focus":"The Charter hearing and Jamie's killer","piece":"Docks fight with Ajax, then a murder on the witness stand","turn":"Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh","tag":"Josephine washes frost off her fingers"},{"clock":"33 days","title":"Lantern Night","focus":"The heist into the core","piece":"Four plans on one festival night, then every lamp in London bursts at once, two walls go grey, and the crush","turn":"The light is a woman in chains, and his father has always known. Nixon locks the door","tag":"The Lost One: \"I'm going to free her. Even if they all freeze.\""},{"clock":"28 days","title":"Coal","focus":"The cold city, Byron, and the aunt who ran","piece":"Pimlico gasworks explosion","turn":"Lambrick relights the west wall on coal. The Crown seizes the Works. Byron dies with half a sentence and a needle in his fist","tag":"\"Then you know I love you.\""},{"clock":"21 days","title":"The Girl Who Isn't","focus":"Three reveals: the sister, the best friend, and his own name","piece":"Wolves of the White in Whitechapel; the music-hall siege","turn":"\"You're not her.\" Then Alice chooses her anyway. Nixon confesses. Nathaniel finds his own name in his father's ledger","tag":"Tamara kisses Nixon and gives him a folder with his name on it. He can't open it"},{"clock":"14 days","title":"The Wedding","focus":"Every faction moves on the same morning","piece":"The wedding, the taking and the mutiny","turn":"Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard","tag":"Morgana makes it snow, two weeks early, and it settles inside the walls"},{"clock":"First snow","title":"The Snow Confession","focus":"Evening to midnight: the assault","piece":"Newgate break-out, then storming the Works","turn":"Eldgard dies and tells everything","tag":"Josephine pulls the lever"},{"clock":"The last night","title":"The Tithe","focus":"Midnight to dawn","piece":"Every wall goes dark, and the cold and the wolves come","turn":"Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name","tag":"The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE"}]}}</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH=Object.fromEntries(D.threads.map(t=>[t[0],{id:t[0],name:t[1],desc:t[2]}]));
const CH=Object.fromEntries(D.chars);
const short=id=>{const n=CH[id]||id;if(id==='lostone')return 'Lost One';if(id==='duke')return 'Duke';if(id==='pm')return 'Prime Minister';if(id==='vane')return 'Vane';if(id==='lambrick')return 'Lambrick';if(id==='grise')return 'Grise';if(id==='wren')return 'Wren';if(id==='felix')return 'Felix';if(id==='eldgard')return 'Eldgard';if(id==='josephine')return 'Josephine';if(id==='nathaniel')return 'Nathaniel';if(id==='lostone')return 'Lost One';return n.replace(/^(The |Lord |Councilman )/,'').split(' ')[0]};
const tc=id=>`var(--t-${id})`;
const ALL=[];D.eps.forEach(e=>e.scenes.forEach(s=>{s.ep=e.n;ALL.push(s)}));
const byId=new Map(ALL.map(s=>[s.id,s]));
const store={get(k){try{return localStorage.getItem('gg.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('gg.'+k,v)}catch(e){}}};
let focus=new Set(), query='', charFilter='';
const PIN='<svg viewBox="0 0 11 13" aria-hidden="true"><path d="M5.5 12s4.2-4 4.2-7A4.2 4.2 0 0 0 1.3 5c0 3 4.2 7 4.2 7z"/><circle cx="5.5" cy="5" r="1.4"/></svg>';

/* theme */
const root=document.documentElement;
const savedTheme=store.get('theme'); if(savedTheme) root.dataset.theme=savedTheme;
$('#theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dark?'light':'dark';store.set('theme',root.dataset.theme)};

/* legend */
function drawLegend(){
  const L=$('#legend');
  L.innerHTML='<span class="hint">Storylines</span>'+D.threads.map(t=>`<button class="tchip" type="button" data-t="${t[0]}" style="--c:${tc(t[0])}" aria-pressed="${focus.has(t[0])}" title="${esc(t[2])}"><i></i>${esc(t[1])}</button>`).join('')+(focus.size?'<button class="clear" type="button" id="clearf">Show all</button>':'');
  $$('.tchip',L).forEach(b=>b.onclick=()=>toggleFocus(b.dataset.t));
  const c=$('#clearf');if(c)c.onclick=()=>{focus.clear();applyFilters()};
}
function toggleFocus(t){focus.has(t)?focus.delete(t):focus.add(t);applyFilters()}
function matches(s){
  if(focus.size && !(focus.has(s.th)||s.also.some(a=>focus.has(a)))) return false;
  if(charFilter && !s.ch.includes(charFilter)) return false;
  if(query){if(!s._t)s._t=(s.title+' '+s.sum+' '+s.loc+' '+s.when+' '+s.turn+' '+s.ch.map(c=>CH[c]||c).join(' ')+' '+s.html.replace(/<[^>]+>/g,' ')).toLowerCase();const hay=s._t;if(!query.split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function applyFilters(){
  drawLegend();
  $$('[data-sid]').forEach(el=>{const s=byId.get(+el.dataset.sid);el.classList.toggle('dim',!matches(s))});
  $$('.tcount button').forEach(b=>b.setAttribute('aria-pressed',focus.has(b.dataset.t)));
  const n=$('#vis-count');if(n){const ep=D.eps.find(e=>e.n===cur.ep);const sc=ep.scenes.filter(s=>s.kind==='scene');const v=sc.filter(matches).length;n.textContent=v===sc.length?`${sc.length} scenes`:`${v} of ${sc.length} scenes match`}
}

/* braid strip */
function braid(ep,big){
  return `<div class="braid${big?' big':''}" role="list">`+ep.scenes.filter(s=>s.kind==='scene').map(s=>`<button type="button" role="listitem" data-sid="${s.id}" data-go="${s.id}" style="--c:${tc(s.th)};--w:${Math.max(70,Math.min(s.w,900))}" title="${esc(s.seq+'. '+s.title+' ('+TH[s.th].name+')')}">${big?s.seq:''}</button>`).join('')+'</div>';
}

/* season */
function drawSeason(){
  const V=$('#v-season');
  const counts={};ALL.forEach(s=>{if(s.kind==='scene')counts[s.th]=(counts[s.th]||0)+1});
  V.innerHTML=`<div class="season-head"><div><h2>Ten episodes, from the engagement to the last night</h2><p>${esc(D.eps.length)} episodes, ${ALL.filter(s=>s.kind==='scene').length} scenes. Each strip is one episode in scene order. A segment's colour is the storyline that scene moves forward, and its width follows how much happens in it. Select an episode to open its scene board, or a segment to jump straight to that scene.</p></div>
  <div class="clock" aria-label="Season clock"><div class="acts"><span>Act I</span><span>Act II</span><span>Act III</span></div>${D.eps.map(e=>`<div class="cell${e.n>=9?' snow':''}"><b>${e.n}</b><span>${esc(e.time.split(',')[0])}</span></div>`).join('')}</div></div>
  <div class="loom">${D.eps.map(e=>`<a class="lrow" href="#ep${e.n}"><div class="ln">${e.n}</div><div><div class="lt">${esc(e.title)}</div><div class="lg">${esc(e.log)}</div></div><div class="bwrap">${braid(e,false)}<div class="bmeta">${e.scenes.filter(s=>s.kind==='scene').length} scenes, ${esc(e.time)}</div></div><div class="tn">${esc(e.turn)}</div></a>`).join('')}</div>
  <div class="thread-key">${D.threads.map(t=>`<div style="--c:${tc(t[0])}"><i></i><div><b>${esc(t[1])}</b><span>${esc(t[2])}</span> <em>${counts[t[0]]||0} scenes</em></div></div>`).join('')}</div>`;
  wireGo(V);
}

/* episode */
function card(s){
  const fl=s.fl.length?`<span class="badge flag" title="${esc(s.fl.map(f=>f.id).join(', '))}">${s.fl.length===1?s.fl[0].id:s.fl.length+' flags'}</span>`:'';
  const where=(s.loc||s.when)?`<div class="where">${PIN}<span>${esc(s.loc)}${s.loc&&s.when?', ':''}${s.when?`<span class="when">${esc(s.when)}</span>`:''}</span></div>`:'';
  return `<article class="card" id="s${s.id}" data-sid="${s.id}" style="--c:${tc(s.th)}">
   <div class="top"><span class="seq" aria-label="Scene ${s.seq}">${s.seq}</span><div><h4>${esc(s.title)}</h4>${s.oref?`<div class="oref">${esc(s.oref)}</div>`:''}${(s.added||fl||s.ed)?`<div class="badges" style="margin-top:.3rem">${s.added?'<span class="badge add" title="Added in a recent pass">Added</span>':''}${s.ed?`<span class="badge ed" title="${esc(s.ed)}">Edited</span>`:''}${fl}</div>`:''}</div></div>
   ${where}
   <p class="sum">${esc(s.sum)}</p>
   ${s.turn?`<p class="turn"><b>Changes:</b> ${esc(s.turn)}</p>`:''}
   <div class="foot">${s.ch.map(c=>`<button type="button" class="cchip" data-char="${c}" title="Show ${esc(CH[c]||c)}'s scenes">${esc(short(c))}</button>`).join('')}${s.also.length?`<span class="also" title="Also touches: ${esc(s.also.map(a=>TH[a]?TH[a].name:a).join(', '))}">${s.also.map(a=>`<i style="--c:${tc(a)}"></i>`).join('')}</span>`:''}<button type="button" class="readbtn" aria-expanded="false">Read the scene</button></div>
   <div class="full">${s.html}</div></article>`;
}
function drawEpisode(n,scrollTo){
  const e=D.eps.find(x=>x.n===n); const V=$('#v-episode');
  const sc=e.scenes.filter(s=>s.kind==='scene');
  const tcount={};sc.forEach(s=>tcount[s.th]=(tcount[s.th]||0)+1);
  const order=Object.keys(tcount).sort((a,b)=>tcount[b]-tcount[a]);
  const present=[...new Set(e.scenes.flatMap(s=>s.ch))].sort((a,b)=>D.chars.findIndex(c=>c[0]===a)-D.chars.findIndex(c=>c[0]===b));
  let body='',lastAct=null;
  e.scenes.forEach(s=>{
    if(s.kind==='ref')return;
    const act=s.act||'';
    if(act!==lastAct){lastAct=act;if(act)body+=`<div class="actdiv"><h3>${esc(act)}</h3></div>`}
    if(s.kind==='marker'){body+=`<div class="marker" data-sid="${s.id}" style="--c:${tc(s.th)}"><b>${esc(s.title)}</b>. ${esc(s.sum)}</div>`;return}
    body+=card(s);
  });
  const refs=e.scenes.filter(s=>s.kind==='ref');
  V.innerHTML=`<div class="epnav">${D.eps.map(x=>`<a href="#ep${x.n}" ${x.n===n?'aria-current="page"':''} title="${esc(x.title)}">${x.n}</a>`).join('')}<span class="sp"></span>${n>1?`<a class="step" href="#ep${n-1}">Previous</a>`:''}${n<D.eps.length?`<a class="step" href="#ep${n+1}">Next episode</a>`:''}</div>
  <div class="ephead"><div><div class="num">Episode ${n} of 10, Act ${e.act}. ${esc(e.time)}</div><h2>${esc(e.title)}</h2><p class="log">${esc(e.log)}</p><p class="story">${esc(e.sum)}</p></div>
  <aside><h3>By the end</h3><p>${esc(e.turn)}</p><h3>Storylines in this episode</h3><div class="tcount">${order.map(t=>`<button type="button" data-t="${t}" style="--c:${tc(t)}" aria-pressed="false"><i></i><span>${esc(TH[t].name)}</span><span>${tcount[t]}</span></button>`).join('')}</div></aside></div>
  <div class="stripwrap">${braid(e,true)}<div class="cap"><span>Opening</span><span>Scene order, coloured by storyline</span><span>Final image</span></div></div>
  <div class="filters"><label>Character <select id="charsel"><option value="">Everyone</option>${present.map(c=>`<option value="${c}" ${c===charFilter?'selected':''}>${esc(CH[c]||c)}</option>`).join('')}</select></label><button type="button" class="iconbtn" id="openall">Open every scene</button><span class="count" id="vis-count"></span></div>
  <div class="grid">${body}</div>
  ${refs.length||e.frame?`<div class="refs">${e.frame?`<details class="ref"><summary>Episode notes <span>from the top of the outline section</span></summary><div class="full">${e.frame}</div></details>`:''}${refs.map(s=>`<details class="ref"><summary>${esc(s.title)} <span>${esc(s.sum)}</span></summary><div class="full">${s.html}</div></details>`).join('')}</div>`:''}`;
  $$('.tcount button',V).forEach(b=>b.onclick=()=>toggleFocus(b.dataset.t));
  $('#charsel').onchange=ev=>{charFilter=ev.target.value;applyFilters()};
  $('#openall').onclick=ev=>{const open=ev.target.textContent.startsWith('Open');$$('.card',V).forEach(c=>setOpen(c,open));ev.target.textContent=open?'Close every scene':'Open every scene'};
  $$('.readbtn',V).forEach(b=>b.onclick=()=>{const c=b.closest('.card');setOpen(c,!c.classList.contains('open'));if(c.classList.contains('open'))c.scrollIntoView({block:'nearest',behavior:'smooth'})});
  $$('.cchip',V).forEach(b=>b.onclick=()=>{charFilter=charFilter===b.dataset.char?'':b.dataset.char;$('#charsel').value=charFilter;applyFilters()});
  wireGo(V);
  applyFilters();
  if(scrollTo){const el=$('#s'+scrollTo);if(el){setOpen(el,true);requestAnimationFrame(()=>{el.scrollIntoView({block:'start'});el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1800)})}}
  else window.scrollTo(0,0);
}
function setOpen(c,open){c.classList.toggle('open',open);const b=$('.readbtn',c);if(b){b.textContent=open?'Close':'Read the scene';b.setAttribute('aria-expanded',open)}}
function wireGo(V){$$('[data-go]',V).forEach(b=>b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();const s=byId.get(+b.dataset.go);go(`ep${s.ep}/s${s.id}`)})}

/* characters */
function drawCharacters(sel){
  const V=$('#v-characters');
  const list=D.chars.map(c=>c[0]).filter(id=>D.arcs[id]||ALL.some(s=>s.ch.includes(id)));
  const cnt=(id,n)=>D.eps[n-1].scenes.filter(s=>s.kind==='scene'&&s.ch.includes(id)).length;
  const max=Math.max(...list.flatMap(id=>D.eps.map(e=>cnt(id,e.n))));
  sel=sel&&list.includes(sel)?sel:(store.get('char')||'nathaniel');
  store.set('char',sel);
  const rows=list.map(id=>`<tr data-c="${id}" aria-selected="${id===sel}" tabindex="0"><th>${esc(CH[id]||id)}</th>${D.eps.map(e=>{const k=cnt(id,e.n);const a=D.arcs[id]&&D.arcs[id][e.n];return k||a?`<td title="${esc(a?a.line:'')}"><span class="pip" style="--v:${(k/max).toFixed(2)}"></span>${a?`<small>${esc(a.state)}</small>`:''}</td>`:'<td class="none">·</td>'}).join('')}</tr>`).join('');
  const arc=D.arcs[sel]||{};
  const journey=D.eps.map(e=>{const a=arc[e.n];const ss=e.scenes.filter(s=>s.kind==='scene'&&s.ch.includes(sel));
    return `<div class="jcard${!a&&!ss.length?' off':''}"><div class="h"><b>${e.n}. ${esc(e.title)}</b><span>${ss.length} scene${ss.length===1?'':'s'}</span></div>${a?`<div class="st">${esc(a.state)}</div><p>${esc(a.line)}</p>`:`<p style="color:var(--muted)">${ss.length?'In the episode, no arc note.':'Not in this episode.'}</p>`}${ss.length?`<div class="sc">${ss.map(s=>`<a href="#ep${e.n}/s${s.id}" style="--c:${tc(s.th)}" title="${esc(s.seq+'. '+s.title)}">${s.seq}</a>`).join('')}</div>`:''}</div>`}).join('');
  const total=ALL.filter(s=>s.kind==='scene'&&s.ch.includes(sel)).length;
  const eps=D.eps.filter(e=>arc[e.n]||cnt(sel,e.n)).map(e=>e.n);
  V.innerHTML=`<div class="chars-layout"><div class="journey"><h2>${esc(CH[sel]||sel)}</h2><p class="sub">${total} scenes across ${eps.length} episode${eps.length===1?'':'s'}${eps.length?` (${eps[0]} to ${eps[eps.length-1]})`:''}. Each episode shows where they end up, then the scenes they're in, coloured by storyline.</p><div class="jlist">${journey}</div></div>
  <div><h3 style="font-family:var(--display);font-size:1.5rem;margin:0 0 .5rem">Who is in which episode</h3><p class="sub" style="color:var(--muted);margin:0 0 .7rem;font-size:.88rem">Bar length is how many scenes they have. The note under it is where they end that episode. Select a name to open their journey.</p>
  <div class="matrix-wrap"><table class="matrix"><thead><tr><th style="text-align:left;font-family:var(--ui);font-size:.8rem;padding-left:.7rem">Character</th>${D.eps.map(e=>`<th title="${esc(e.title)}">${e.n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
  $$('tbody tr',V).forEach(r=>{const open=()=>go('characters/'+r.dataset.c);r.onclick=open;r.onkeydown=ev=>{if(ev.key==='Enter')open()}});
  window.scrollTo(0,0);
}

/* notes */
function drawNotes(){
  const V=$('#v-notes');
  let out='',total=0;
  D.eps.forEach(e=>{const items=e.scenes.flatMap(s=>s.fl.map(f=>({f,s})));if(!items.length)return;total+=items.length;
    out+=`<h3>Episode ${e.n}: ${esc(e.title)}</h3>`+items.map(({f,s})=>`<div class="note"><div class="id ${f.type}">${esc(f.id)}</div><div><a href="#ep${e.n}/s${s.id}">${s.seq?s.seq+'. ':''}${esc(s.title)}</a><p>${esc(f.text)}</p></div></div>`).join('')});
  V.innerHTML=`<div class="notes"><h2>Flags and open decisions</h2><p class="sub">${total} items pulled from the outline: merge flags (C numbers) mark places where two documents disagree or a call was made that needs your eye. Open decisions (O numbers) are choices nobody has made yet.</p>${out}</div>`;
  window.scrollTo(0,0);
}


/* documents */
function docBlock(h){return '<div class="doc">'+(h||'')+'</div>'}
function drawWorld(){
  const V=$('#v-world');
  V.innerHTML='<div class="doc"><h2>The world, and the one rule under it</h2>'+
    '<p class="lede">'+esc(D.seasonIntro||'')+'</p>'+
    (D.world&&D.world.html||'')+
    '<h2>The craft rules this season obeys</h2><p class="lede">Eight rules, each taken from a writer you named, and each one checked against every episode.</p>'+
    (D.world&&D.world.craft||'')+
    '</div>';
  window.scrollTo(0,0);
}
function drawLedger(){
  const V=$('#v-ledger');
  const rows=(D.ledger&&D.ledger.rows)||[];
  const list=rows.length?('<h3>Every setup, in one place</h3><table><thead><tr><th>Setup</th><th>Planted</th><th>Paid off</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+
    '</tbody></table>'):'';
  V.innerHTML='<div class="doc"><h2>Setup and payoff ledger</h2>'+
    '<p class="lede">'+rows.length+' setups, and where each one closes. Everything planted is paid off inside the season, except the handful left open on purpose for Season 2.</p>'+
    list+
    (D.ledger&&D.ledger.inherit||'')+
    '</div>';
  window.scrollTo(0,0);
}

/* router */
const cur={v:'season',ep:1};
function readHash(){try{return decodeURIComponent((location.hash||'').slice(1))}catch(e){return ''}}
function go(h){
  try{if(readHash()!==h)history.pushState(null,'','#'+h)}catch(e){}
  route(h);
}
function route(forced){
  const h=(typeof forced==='string'&&forced)||readHash()||store.get('hash')||'season';
  let m;
  ['season','episode','characters','notes','world','ledger'].forEach(v=>$('#v-'+v).hidden=true);
  if((m=h.match(/^ep(\d+)(?:\/s(\d+))?$/))){cur.v='episode';const n=Math.min(10,Math.max(1,+m[1]));if(n!==cur.ep)charFilter='';cur.ep=n;$('#v-episode').hidden=false;drawEpisode(n,m[2]?+m[2]:null)}
  else if((m=h.match(/^characters(?:\/(\w+))?$/))){cur.v='characters';$('#v-characters').hidden=false;drawCharacters(m[1])}
  else if(h==='notes'){cur.v='notes';$('#v-notes').hidden=false;drawNotes()}
  else if(h==='world'){cur.v='world';$('#v-world').hidden=false;drawWorld()}
  else if(h==='ledger'){cur.v='ledger';$('#v-ledger').hidden=false;drawLedger()}
  else {cur.v='season';$('#v-season').hidden=false;drawSeason();window.scrollTo(0,0)}
  $('#legend').hidden=!(cur.v==='season'||cur.v==='episode');
  $$('nav.tabs a').forEach(a=>{const on=a.dataset.v===cur.v;on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');if(a.dataset.v==='episode')a.href='#ep'+cur.ep});
  store.set('hash',h);
  applyFilters();
}
window.addEventListener('popstate',()=>route());
window.addEventListener('hashchange',()=>{if(readHash()!==store.get('hash'))route()});
/* every in-page link goes through go(), so navigation works even where the address bar can't change (previews, sandboxed frames) */
document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a||ev.defaultPrevented||ev.metaKey||ev.ctrlKey)return;ev.preventDefault();go(a.getAttribute('href').slice(1))});
$('#q').addEventListener('input',ev=>{query=ev.target.value.trim().toLowerCase();if(query&&cur.v!=='episode'&&cur.v!=='season'){go('ep'+cur.ep)}applyFilters()});
document.addEventListener('keydown',ev=>{if(cur.v!=='episode'||ev.target.closest('input,select,textarea'))return;if(ev.key==='ArrowRight'&&cur.ep<10)go('ep'+(cur.ep+1));if(ev.key==='ArrowLeft'&&cur.ep>1)go('ep'+(cur.ep-1))});
route();
})();
</script>
</body>
</html>
